# OrkStack orkflow DSL
#
# Resolve a branch to ONE commit, read a file of the repository at that commit,
# and render one config file per service, reusing every rendering while that
# commit does not change.
#
# Pattern: docs/ORKFLOW_PATTERNS.md, "Pin moving inputs: resolve, then use the commit"
# Pattern: docs/ORKFLOW_PATTERNS.md, "Batch transforms into one prepare task"
# Pattern: docs/ORKFLOW_PATTERNS.md, "Cache only what you assert is reusable"
# Pattern: docs/ORKFLOW_PATTERNS.md, "jq, a template, or your own image"
#
# It needs internet access to github.com and nothing else. Its default
# repository, octocat/Hello-World, is small and public, and its branch `master`
# holds one file, README, so the template and the service list are inputs here.
# To use a repository of your own, set `repo`, `ref` and `readme_path`.
#
#   resolve   asks the remote what `ref` means now; every later task names the
#             COMMIT it reported, never the branch, so a push mid-run cannot
#             mix two trees.
#   clone     fetches that commit as a tarball, on every run. It could be cached
#             too, because it clones a commit id.
#   readme    one file out of the tarball (file untar), cached. Its key covers
#             the tarball's digest, so it hits on the next run of the same
#             commit while activity-git's tarball of it is byte-identical (one
#             platform image, its default environment —
#             images/activity-git/README.md, "Caching"); if it ever differs, it
#             simply misses.
#   tmpl      writes the `template` input as a file, cached. OrkStack does not
#             render an input's value, so the braces in it reach the template
#             activity as written.
#   prepare   computes every service's values ONCE, formatted as strings,
#             before the fan-out — not once per item.
#   render    one template rendering per service (each:), cached per item. Its
#             template reads README with file.Read, which is safe to cache only
#             because that file is a declared input of the task, by `artifact`,
#             so its digest is in the key.
#   manifest  gathers the items' values into one list.
#
# A private repository needs a token: to both git tasks add `tokenSecret:
# git-token` under `with:`, and a `secrets:` entry whose `name` is git-token and
# whose `source` is env:GIT_TOKEN, with GIT_TOKEN exported where the Orker runs.
# A task that mounts a secret is never cached, and a revoked token must fail the
# very next run. Behind a proxy, give the git tasks an `env:` mapping that sets
# HTTPS_PROXY: it configures git, as it would on any machine.
#
#   orkctl run submit config-from-git --watch
#   orkctl run submit config-from-git --watch   # again: readme..manifest are SUCCEEDED (cached)
apiVersion: orkstack/v1
kind: Orkflow
name: config-from-git
version: "0.2.0"
description: "Resolve a branch to a commit, clone it once, and render one config file per service; cached while the commit holds."

inputs:
  repo:
    type: string
    default: "https://github.com/octocat/Hello-World.git"
  ref:
    type: string
    default: master
  environment:
    type: string
    default: staging
  readme_path:
    type: string
    default: README
  services:
    type: array
    default:
      - name: api
        port: 8080
        replicas: 2
      - name: web
        port: 8081
        replicas: 1
  template:
    type: string
    default: |
      # {{ .name }}, rendered from commit {{ .commit }}
      # {{ index (file.Read .readme | strings.Split "\n") 0 }}
      service {{ .name }} {
        listen   {{ .port }};
        replicas {{ .replicas }};
        env      {{ .environment }};
      }

tasks:
  - id: resolve
    uses: git
    retry:
      maximum_attempts: 3
      initial_interval_seconds: 2
    with:
      op: resolve
      url: '{{ .inputs.repo }}'
      ref: '{{ .inputs.ref }}'

  - id: clone
    uses: git
    needs:
      - resolve
    retry:
      maximum_attempts: 3
      initial_interval_seconds: 2
    with:
      op: clone
      url: '{{ .inputs.repo }}'
      ref: '{{ .tasks.resolve.output.commit }}'

  - id: readme
    uses: file
    needs:
      - clone
    network: none
    cache:
      enabled: true
      ttl_seconds: 86400
    with:
      op: untar
      src: '{{ artifact "clone/src.tar.gz" }}'
      member: '{{ .inputs.readme_path }}'
      as: README

  - id: tmpl
    uses: shell
    network: none
    cache:
      enabled: true
      ttl_seconds: 86400
    with:
      op: script
      interpreter: sh
      command:
        - '{{ .inputs.template }}'
      script: |
        set -eu
        printf '%s' "$1" > /orkstack/output/artifacts/app.conf.tmpl

  - id: prepare
    uses: json
    needs:
      - resolve
    network: none
    cache:
      enabled: true
      ttl_seconds: 86400
    with:
      op: query
      src: run.json
      vars:
        environment: '{{ .inputs.environment }}'
        commit: '{{ .tasks.resolve.output.commit }}'
      filter: |
        [ .services[]
          | {
              name,
              file: "\(.name).conf",
              port: (.port | tostring),
              replicas: ((if $vars.environment == "prod" then .replicas * 2 else .replicas end) | tostring),
              environment: $vars.environment,
              commit: $vars.commit[0:12]
            } ]

  - id: render
    uses: template
    needs:
      - readme
      - tmpl
      - prepare
    network: none
    cache:
      enabled: true
      ttl_seconds: 86400
    each:
      over: '{{ .tasks.prepare.output.result }}'
      as: svc
      max_items: 100
      max_parallel: 4
    with:
      op: render
      src: '{{ artifact "tmpl/app.conf.tmpl" }}'
      values:
        name: '{{ .each.svc.name }}'
        port: '{{ .each.svc.port }}'
        replicas: '{{ .each.svc.replicas }}'
        environment: '{{ .each.svc.environment }}'
        commit: '{{ .each.svc.commit }}'
        readme: '{{ artifact "readme/README" }}'
      as: '{{ .each.svc.file }}'

  - id: manifest
    uses: json
    needs:
      - render
    network: none
    cache:
      enabled: true
      ttl_seconds: 86400
    with:
      op: query
      gather: render
      filter: 'map({file: (.path | split("/") | last), sha256, sizeBytes})'
