# OrkStack orkflow DSL
#
# POST a JSON body, then archive the echoed response. `op` is the portable
# spelling of the HTTP method; the full set is get, post, put, patch, delete
# and head.
#
# Header values are quoted before they reach argv, the same argv discipline
# activity-shell applies to `command`, so a rendered value cannot inject a
# request argument.
name: http-post
version: "0.2.0"
description: "POST a JSON body with `op: post` and archive the echoed response."

inputs:
  url:
    type: string
    default: "https://httpbin.org/post"
  message:
    type: string
    default: "hello from orkstack"

tasks:
  # 1. The request. `captureBodyAs` writes the exact response bytes as an
  #    output artifact; `json` on the values carries the parsed body when it
  #    is valid JSON and at most 1 MiB.
  - id: publish
    uses: http
    with:
      op: post
      url: "{{ .inputs.url }}"
      headers:
        content-type: application/json
      body: |
        {"message": "{{ .inputs.message }}"}
      captureBodyAs: response

  # 2. `copy` re-exports the materialized response under a chosen name. A
  #    relative source resolves under /orkstack/input/, and a `..` component is
  #    REFUSED rather than normalized — a path can never be argued out of the
  #    workspace.
  - id: archive
    uses: file
    needs: [publish]
    with:
      op: copy
      src: '{{ artifact "publish/response" }}'
      as: response.json

  # 3. An HTTP status is data. Branching on it in the document is the whole
  #    point of the image exiting 0 for any response it received.
  - id: summarize
    uses: shell
    needs: [publish, archive]
    condition: '{{ eq .tasks.publish.output.status 200.0 }}'
    with:
      op: exec
      command:
        - sh
        - -c
        - >-
          printf 'status=%s bytes=%s\n'
          "{{ .tasks.publish.output.status }}"
          "$(wc -c < "{{ artifact "archive/response.json" }}" | tr -d ' ')"
