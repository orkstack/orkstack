# OrkStack orkflow DSL
#
# The shell activity's three ops side by side:
#   exec    the command is the work — a non-zero exit fails the task.
#   eval    the command is a question — any exit succeeds, stdout is captured
#           as `value`, and the caller branches on `exitCode`.
#   script  a program is the work — the body is written to /orkstack/tmp and
#           run there, so it can be multi-line and have its own $0.
#
# `eval` not failing on a non-zero exit is one IMAGE's documented contract, not
# a platform rule. It is how the platform avoids inventing a magic exit code:
# the container reports what happened and the Orkflow decides what it means.
name: shell-eval
version: "0.2.0"
description: "Measure with `op: eval`, report with `op: exec`, package with `op: script`."

inputs:
  text:
    type: string
    default: "orkstack"

tasks:
  # 1. eval as measurement: stdout becomes `value`.
  - id: measure
    uses: shell
    with:
      op: eval
      command: ["sh", "-c", "printf '%s' \"{{ .inputs.text }}\" | wc -c | tr -d ' '"]

  # 2. eval as a probe: this command exits 1 on purpose. Under `op: exec` that
  #    would fail the task; under `op: eval` the exit code is just data.
  - id: probe
    uses: shell
    with:
      op: eval
      command: ["test", "-f", "/definitely/not/here"]

  # 3. exec as the actual work: a non-zero exit here fails the run, and
  #    Temporal's retry policy decides what happens next.
  - id: report
    uses: shell
    needs: [measure, probe]
    with:
      op: exec
      command:
        - sh
        - -c
        - >-
          printf 'text=%s bytes=%s probe_exit=%s\n'
          "{{ .inputs.text }}"
          "{{ .tasks.measure.output.value }}"
          "{{ .tasks.probe.output.exitCode }}"
          | tee /orkstack/output/artifacts/report.txt

  # 4. script as a program: multi-line, no `&&` chaining, its own $0. Anything
  #    it leaves in /orkstack/output/artifacts/ becomes an output artifact.
  - id: package
    uses: shell
    needs: [report]
    with:
      op: script
      interpreter: sh
      script: |
        set -eu
        {
          echo "orkflow: shell-eval"
          echo "bytes: {{ .tasks.measure.output.value }}"
          echo "probe_exit: {{ .tasks.probe.output.exitCode }}"
          echo "script: $0"
        } > /orkstack/output/artifacts/manifest.txt
        cat /orkstack/output/artifacts/manifest.txt

  # 5. Archive both artifacts together. `tar` stores each source under its base
  #    name, so the archive carries no workspace path inside it.
  - id: archive
    uses: file
    needs: [report, package]
    with:
      op: tar
      srcs:
        - '{{ artifact "report/report.txt" }}'
        - '{{ artifact "package/manifest.txt" }}'
      as: shell-eval.tar.gz
