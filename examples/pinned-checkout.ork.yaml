# OrkStack orkflow DSL
#
# Check a commit out ONCE into a pin's shared directory, validate and package
# it there, and hand the package on as an ordinary artifact.
#
# Pattern: docs/ORKFLOW_PATTERNS.md, "Share a working tree: pins"
# Pattern: docs/ORKFLOW_PATTERNS.md, "Pin moving inputs: resolve, then use the commit"
#
# It needs internet access to github.com and nothing else: the quickstart's
# Orker, like `make up`'s, is a pin host. Its default repository,
# octocat/Hello-World, is small and public, and its branch `master` holds one
# file, README, so the config it packages is an input here. To use a repository
# of your own, set `repo`, `ref` and `required_file`.
#
#   resolve    unpinned: what does `ref` mean now?
#   checkout   pinned: a working tree with its .git, at that commit, in
#              /orkstack/shared/src. Staged and renamed into place, so a
#              retried attempt finds no half-written tree.
#   validate   pinned: it reads the tree in place, with no archive in between.
#   merge      pinned: the `config` input's `base`, deep-merged with its
#              `environment` entry, as an artifact.
#   package    pinned: it reads the tree in place too. Every member sets
#              run_as_orker_user: true and no pool — a pin is one process out
#              of one pool's set.
#   checksum   unpinned: it sees the pin's work only through the artifact
#              `package` committed. Nothing under /orkstack/shared outlives
#              the pin.
#
# A pin imposes no ordering: the needs: edges do. A pinned task is never
# cached (/orkstack/shared is an input no memo key covers), and the pool must
# have a pin host (an Orker with ORK_ORKER_MAX_PINS above zero) or submit is
# refused.
#
# A private repository needs a token: to both git tasks add `tokenSecret:
# git-token` under `with:`, and a `secrets:` entry whose `name` is git-token and
# whose `source` is env:GIT_TOKEN, with GIT_TOKEN exported where the Orker runs.
#
#   orkctl run submit pinned-checkout -w
#   orkctl run submit pinned-checkout -i environment=prod -w
apiVersion: orkstack/v1
kind: Orkflow
name: pinned-checkout
version: "0.2.0"
description: "Check a commit out once into a pin, validate and package it in place, and checksum the package outside the pin."

inputs:
  repo:
    type: string
    default: "https://github.com/octocat/Hello-World.git"
  ref:
    type: string
    default: master
  environment:
    type: string
    default: staging
  required_file:
    type: string
    default: README
  config:
    type: object
    default:
      base:
        log:
          level: info
          format: json
        replicas: 1
      staging:
        log:
          level: debug
      prod:
        replicas: 3
        log:
          format: text

pins:
  workspace:
    timeout_seconds: 1800

tasks:
  - id: resolve
    uses: git
    retry:
      maximum_attempts: 3
      initial_interval_seconds: 2
    with:
      op: resolve
      url: '{{ .inputs.repo }}'
      ref: '{{ .inputs.ref }}'

  - id: checkout
    uses: git
    needs:
      - resolve
    pin: workspace
    run_as_orker_user: true
    retry:
      maximum_attempts: 3
      initial_interval_seconds: 2
    with:
      op: clone
      url: '{{ .inputs.repo }}'
      ref: '{{ .tasks.resolve.output.commit }}'
      dest: /orkstack/shared/src

  # The file's name arrives as a positional argument: a rendered value is data
  # in argv, never text inside the script.
  - id: validate
    uses: shell
    needs:
      - checkout
    pin: workspace
    run_as_orker_user: true
    network: none
    with:
      op: script
      interpreter: sh
      command:
        - '{{ .inputs.required_file }}'
      script: |
        set -eu
        cd /orkstack/shared/src
        [ -d .git ] || { echo "not a git working tree" >&2; exit 1; }
        [ -s "$1" ] || { echo "missing or empty: $1" >&2; exit 1; }
        echo "$1 is present and not empty"

  - id: merge
    uses: json
    needs:
      - validate
    pin: workspace
    run_as_orker_user: true
    network: none
    with:
      op: query
      src: run.json
      filter: '.config.base * .config[.environment]'
      as: config.json

  # The commit, the merged file and the file's name arrive as positional
  # arguments too.
  - id: package
    uses: shell
    needs:
      - merge
    pin: workspace
    run_as_orker_user: true
    network: none
    with:
      op: script
      interpreter: sh
      command:
        - '{{ .tasks.resolve.output.commit }}'
        - '{{ artifact "merge/config.json" }}'
        - '{{ .inputs.required_file }}'
      script: |
        set -eu
        out=/orkstack/shared/out
        mkdir -p "$out"
        name=$(basename "$3")
        printf '%s\n' "$1" > "$out/COMMIT"
        cp "$2" "$out/config.json"
        cp "/orkstack/shared/src/$3" "$out/$name"
        tar -czf /orkstack/output/artifacts/bundle.tar.gz -C "$out" COMMIT "$name" config.json
        echo "packaged $3 at $1"

  - id: checksum
    uses: file
    needs:
      - package
    network: none
    with:
      op: checksum
      src: '{{ artifact "package/bundle.tar.gz" }}'
