# OrkStack orkflow DSL — v0
# Every op of the file plugin in one pipeline: write → read → copy → delete.
# See docs/PLUGIN_DESIGN.md for the `op` pattern.
name: file-read
version: "0.1.0"
description: Exercise the file plugin's write, read, copy and delete ops.

inputs:
  greeting:
    type: string
    default: "hello from the file plugin"

tasks:
  # 1. `op: write` creates the file and exports it as the artifact `greeting`.
  - id: seed
    uses: file
    with:
      op: write
      path: notes/greeting.txt
      content: "{{ .inputs.greeting }}"
      capture_as: greeting           # artifact name override

  # 2. `op: read` stats a materialized upstream artifact and re-exports it, so
  #    output.size_bytes describes the bytes that actually arrived.
  - id: reread
    uses: file
    needs: [seed]
    with:
      op: read
      path: '{{ artifact "seed/greeting" }}'
      capture_as: greeting-again

  # 3. `op: eval` reads the value back through the shell without failing the
  #    run if the command exits non-zero.
  - id: show
    uses: shell
    needs: [reread]
    with:
      op: eval
      command: 'cat "{{ artifact "reread/greeting-again" }}"'

  # 4. `op: delete` is idempotent: removing a path that was never created
  #    succeeds with size_bytes 0, so a Temporal retry behaves like attempt 1.
  - id: cleanup
    uses: file
    needs: [show]
    with:
      op: delete
      path: scratch.txt
