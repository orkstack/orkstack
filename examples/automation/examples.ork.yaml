# OrkStack automation document (docs/AUTOMATION.md)
#
# Everything around the example Orkflows, declared by name in one reviewable
# file: the namespace's settings, a schedule and a trigger.
#
# Pattern: docs/ORKFLOW_PATTERNS.md, "Declare what surrounds your Orkflows"
# Pattern: docs/ORKFLOW_PATTERNS.md, "Repeat without loops"
#
# A schedule or trigger must name an Orkflow version that is stored or applied
# by the same command, and approval-gate composes notify-block, which must be
# stored before that command, in one of its own:
#   orkctl apply examples/notify-block.ork.yaml
#   orkctl apply examples/poll-until-ready.ork.yaml examples/approval-gate.ork.yaml examples/automation/examples.ork.yaml --dry-run
#   orkctl apply examples/poll-until-ready.ork.yaml examples/approval-gate.ork.yaml examples/automation/examples.ork.yaml
#   orkctl apply examples/automation/examples.ork.yaml --check     # exits 0: nothing drifted
#   orkctl schedule fire poll-exports                              # one fire now, as if its time had come
#
# It declares `default`, the namespace that always exists, and sets only its
# description there: an example should not change the run retention or the
# allowed secrets of a namespace you use. docs/AUTOMATION.md lists those
# settings. The schedule fires once a day and pauses itself after a failure;
# when you are done with it:
#   orkctl schedule delete poll-exports
#
# The trigger's token is printed once, with a runnable curl, and never stored
# in this file.
apiVersion: orkstack/v1
kind: Automation
namespace: default

settings:
  description: "The shipped example Orkflows (examples/README.md)"

schedules:
  poll-exports:
    orkflow: poll-until-ready
    description: "Fetch and summarize the export once a day, once it is ready"
    cron: "0 6 * * *"
    timezone: UTC
    overlap: skip
    pause_on_failure: true

triggers:
  change-from-ci:
    orkflow: approval-gate
    description: "CI submits a change for assessment and, when risky, approval"
