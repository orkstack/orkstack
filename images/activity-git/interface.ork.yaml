# The with: contract of images/activity-git (docs/ACTIVITY_IMAGES.md, "Declaring the
# interface"). `go run ./internal/schemas/cmd/genschemas` packs it into the
# Dockerfile's three activity LABEL lines (interface, icon and docs); edit
# this file, never those lines.
apiVersion: orkstack/v1
kind: ActivityInterface
description: >-
  Reads a git repository over HTTPS: checks one commit out as a source tarball
  or as a working tree in a pin, or resolves a ref to its commit. A token is
  read from a secret file and kept out of every argument, URL and log.
icon: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.5" cy="12.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="5.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 5.2v5.6M11.5 7.2c0 2.6-2.2 3.2-5.4 4.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
fields:
  url:
    type: string
    required: true
    description: >-
      The repository's `https://` URL, with no credentials, query or fragment.
  ref:
    type: string
    description: >-
      A branch, a tag, a full ref name or a full commit id. Without it, the
      remote's `HEAD`.
  tokenSecret:
    type: string
    description: >-
      The name of a `secrets:` entry whose file holds the access token.
  tokenUser:
    type: string
    default: "x-access-token"
    description: >-
      The user name sent with the token, such as `oauth2` for GitLab or
      `x-token-auth` for Bitbucket.
  caFile:
    type: string
    description: >-
      A PEM bundle in the workspace that replaces git's trust store for this
      task.
ops:
  clone:
    description: >-
      Checks one commit out, as a source tarball (`as`) or into a pin's shared
      directory (`dest`).
    fields:
      depth:
        type: number
        default: 1
        description: >-
          How many commits of history to fetch; `0` fetches all of it.
      as:
        type: string
        default: "src.tar.gz"
        description: >-
          The source tarball's artifact name.
      dest:
        type: string
        description: >-
          A directory under `/orkstack/shared` to check out into instead of a
          tarball; only for a pinned task.
  resolve:
    description: >-
      Resolves `ref` to its commit id and fetches nothing else.
values:
  commit:
    type: string
    description: >-
      The full id of the commit checked out or resolved.
  ref:
    type: string
    description: >-
      The remote ref that matched, or the commit id itself when `ref` was one.
  path:
    type: string
    description: >-
      The tarball or the working tree the checkout wrote.
  sizeBytes:
    type: number
    description: >-
      When `as` is used, the tarball's size in bytes.
  sha256:
    type: string
    description: >-
      When `as` is used, the tarball's SHA-256 in hex.
