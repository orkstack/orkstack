# What a setting accepts, where its row of docs/DEPLOY.md says more than its
# shape. scripts/settings.mjs refuses a line naming a code span or a number its
# row does not hold, so a change to the table cannot leave one of these behind.
# A setting not listed here shows its shape from internal/config's Schema.
temporal.address: "a host and port, such as `localhost:7233`"
pool.queue: "the raw name of an execution channel; set with `ORK_ORKER_POOL`, the two must agree"
activities: "a YAML `activities:` map from catalog name to registry reference"
orker.id: "1–200 bytes of UTF-8, no whitespace or control characters"
orker.docker.cli: "`docker` or `podman`"
orker.resources.max_cpu: "cpu and memory quantities, such as `8` and `16Gi`"
orker.resources.default_cpu: "cpu and memory quantities, such as `1` and `1Gi`"
orker.capacity.cpu: "Kubernetes quantities, such as `\"16\"` and `\"64Gi\"`"
orker.secret_schemes: "a comma-separated list of schemes, from `env,file`"
orker.secret_allow: "a comma-separated list of `scheme:pattern` entries; `*` is the one wildcard and does not cross `/`"
orker.env_allowlist: "a comma-separated list of names"
orker.heartbeat_interval: "a duration between `1s` and `10s`"
orker.max_concurrent: "a whole number, 1 or more"
orker.pins.max_concurrent: "a whole number; `0` hosts no pins"
engine.http_addr: "a listen address, such as `:8080`"
engine.ws_allowed_origins: "a comma-separated list of browser origins"
engine.http_idle_timeout: "a duration of at least `1s`"
engine.request_max_bytes: "a whole number of bytes, no less than the derived value and no more than 1 GiB"
engine.allowed_hosts: "a comma-separated list of names, `*.suffix` patterns, or `*`"
engine.ui.dir: "a directory holding a UI build with an `index.html`"
engine.each_max_items: "a whole number, up to the built-in 10,000; above 1,000 it needs `engine.continuation.enabled`"
engine.orkflow_max_tasks: "a whole number, 1 or more"
engine.history.max_events: "a whole number, at least 100"
engine.history.max_bytes: "a whole number of bytes, at least 64 KiB"
engine.continuation.events: "a whole number, at least 50, at most a quarter of `engine.history.max_events`"
engine.continuation.bytes: "a whole number of bytes, at least 16 KiB, at most a fifth of `engine.history.max_bytes`"
engine.continuation.restore_timeout: "a duration, 1m to 8h"
engine.run_max_in_flight: "a whole number, 16 to 1,800"
engine.pin_creation_timeout: "a duration of whole seconds, `1s` to `24h`"
engine.compose_max_depth: "a whole number, up to the built-in 4"
engine.cache_max_ttl: "a duration of at least 1s"
storage.backend: "`local` or `s3`; `s3` for any replicated deployment"
telemetry.admin_addr: "a listen address; empty opens no listener"
"telemetry.otlp.{endpoint,protocol,headers,timeout,certificate}": "the standard OTLP exporter settings; only `http/protobuf` for `_PROTOCOL`"
OTEL_PROPAGATORS: "a comma-separated list of propagators, such as `tracecontext,baggage`"
OTEL_BSP_*: "the OpenTelemetry SDK's own bounds"
telemetry.log_format: "`text` or `json`"
telemetry.log_level: "`debug`, `info`, `warn` or `error`"
telemetry.exporters.metrics: "a comma list of `prometheus`, `otlp`, `none`"
telemetry.exporters.traces: "`otlp` or `none`"
telemetry.exporters.logs: "`otlp` or `none`"
telemetry.sampler.name: "a standard OpenTelemetry sampler selector"
