# The OrkStack quickstart: the whole stack built from this checkout, with
# Docker as the only prerequisite (docs/GETTING_STARTED.md).
#
#   docker compose up --build -d --wait          build and start, or update
#   docker compose run --rm orkctl <command>     orkctl, from the image it built
#   docker compose down                          stop (object store data kept)
#
# ork, orker and orkctl are built from deploy/source/Dockerfile, and the six
# first-party activities from images/. The web UI is built into ork, which
# serves it on its API port beside the API and the WebSockets the UI opens:
# http://localhost:8080 (ORKSTACK_API_PORT). The browser has one origin to
# talk to, so nothing is configured for it.
#
# An Orkflow pins every task's image by its registry digest when the Orkflow is created
# (docs/OCI_ACTIVITY_CONTRACT.md §4.6), so the activities are pushed to a
# registry of the stack's own. The one address both the host's Docker daemon
# (which pulls them for the Orker) and the engine (which pins them) reach is
# loopback: the registry is published on the host's 127.0.0.1, and a
# forwarder in the engine's own network namespace serves the same port on its
# 127.0.0.1. Temporal and the object store are the development stack's own
# (deploy/docker-compose.yml), pinned for the same reasons. Everything is
# published on 127.0.0.1 only.
#
# The Orker runs each task's image on this host's Docker daemon, through the
# socket mounted below; the activities step pushes through it too. Whoever
# controls that socket controls the host, so only those two services see it
# (docs/SECURITY_MODEL.md). The daemon bind-mounts each task's workspace from
# ORKSTACK_WORKDIR, a path it reads on the host, so the Orker sees that
# directory at the same path.
#
# Each setting below can be changed in a .env file beside this one (it is
# gitignored): the ports, the Docker socket, the Orker's work directory.
name: orkstack-quickstart

x-store: &store
  ORK_ARTIFACT_BACKEND: s3
  ORK_S3_ENDPOINT: http://seaweedfs:8333
  ORK_S3_BUCKET: orkstack-artifacts
  ORK_S3_ACCESS_KEY: orkstack
  ORK_S3_SECRET_KEY: orkstack-secret
  ORK_S3_PATH_STYLE: "true"
  ORK_TEMPORAL_ADDRESS: temporal:7233

x-source: &source
  context: .
  dockerfile: deploy/source/Dockerfile

services:
  temporal:
    image: temporalio/temporal:1.10.0@sha256:003508da05989e7cf0d583cfce521c4bb2732e733574e3040db8f1284783baa2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-port
      - "8233"
      - --log-level
      - warn
    ports:
      - "127.0.0.1:${ORKSTACK_TEMPORAL_UI_PORT-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  # It refuses what production refuses: a key but the one the services use, and
  # an upload to a bucket that does not exist. With no keys set this store checks
  # none, and with them auto-create would let an admin's upload make that bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["mini", "-dir=/data", "-bucket=orkstack-artifacts", "-s3.autoCreateBucket=false"]
    environment:
      AWS_ACCESS_KEY_ID: orkstack
      AWS_SECRET_ACCESS_KEY: orkstack-secret
    volumes:
      - seaweedfs-data:/data
    # Healthy means the engine and the Orker can use the store, not that a port
    # answers. On an empty volume `weed mini` serves S3 for seconds before it
    # creates its -bucket; in that gap the Orker's boot probe is refused 403 and
    # the engine's first read finds no bucket, and each exits. So the check asks
    # for that bucket, signed as their own requests are.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--head", "--aws-sigv4", "aws:amz:us-east-1:s3", "--user", "orkstack:orkstack-secret", "http://localhost:8333/orkstack-artifacts"]
      interval: 5s
      timeout: 5s
      retries: 20

  registry:
    image: registry:3@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
    ports:
      - "127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}:5000"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The first-party activities, built from images/ by `up` and never started
  # (scale 0): the activities step below pushes them.
  activity-shell:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-shell:local
    build: images/activity-shell
    scale: 0
  activity-http:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-http:local
    build: images/activity-http
    scale: 0
  activity-file:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-file:local
    build: images/activity-file
    scale: 0
  activity-json:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-json:local
    build: images/activity-json
    scale: 0
  activity-git:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-git:local
    build: images/activity-git
    scale: 0
  activity-template:
    image: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-template:local
    build: images/activity-template
    scale: 0

  # Pushes the six activities to the registry, where they get the digests the
  # engine pins, and exits; the engine starts only once it has.
  activities:
    image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for name in shell http file json git template; do
          docker push --quiet "127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-$$name:local"
        done
    volumes:
      - ${ORKSTACK_DOCKER_SOCKET-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      registry:
        condition: service_healthy

  ork:
    build:
      <<: *source
      target: ork
    environment:
      <<: *store
      ORK_HTTP_ADDR: 0.0.0.0:8080
      # The admin listener answers the health check inside the container and
      # is never published.
      ORK_ADMIN_ADDR: 127.0.0.1:9464
      ORK_ACTIVITY_CATALOG: |
        activities:
          shell: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-shell:local
          http: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-http:local
          file: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-file:local
          json: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-json:local
          git: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-git:local
          template: 127.0.0.1:${ORKSTACK_REGISTRY_PORT-5002}/orkstack/activity-template:local
    # The web UI and the API, on one port.
    ports:
      - "127.0.0.1:${ORKSTACK_API_PORT-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      activities:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/ork", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The registry's port on the engine's own 127.0.0.1, where it resolves the
  # catalog's references to digests. It lives in the engine's network
  # namespace, so it restarts whenever the engine does.
  registry-forward:
    image: alpine/socat:1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    network_mode: service:ork
    command: ["TCP4-LISTEN:${ORKSTACK_REGISTRY_PORT-5002},bind=127.0.0.1,fork,reuseaddr", "TCP:registry:5000"]
    depends_on:
      registry:
        condition: service_healthy
      ork:
        condition: service_started
        restart: true

  orker:
    build:
      <<: *source
      target: orker
    environment:
      <<: *store
      ORK_ADMIN_ADDR: 127.0.0.1:9465
      ORK_ORKER_ID: ${ORKSTACK_ORKER_ID-quickstart}
      ORK_ORKER_WORKDIR: ${ORKSTACK_WORKDIR-${HOME}/.cache/orkstack-quickstart}
      # A pin host, so examples/pinned-checkout.ork.yaml runs here as shipped:
      # one pin at a time (docs/DEPLOY.md, "Pin hosting is a pool-wide setting").
      ORK_ORKER_MAX_PINS: "1"
    # The work directory is under your home, never a shared /tmp: whoever owns
    # it could swap a task's directories for links to the host's, and the
    # daemon would mount them. It is mounted at the same path, because the
    # Orker names it to the daemon by its path on this machine.
    volumes:
      - ${ORKSTACK_DOCKER_SOCKET-/var/run/docker.sock}:/var/run/docker.sock
      - ${ORKSTACK_WORKDIR-${HOME}/.cache/orkstack-quickstart}:${ORKSTACK_WORKDIR-${HOME}/.cache/orkstack-quickstart}
    init: true
    # Longer than a task container's 30 s cancellation grace, so a stop
    # reaches every running container before the Orker itself is killed.
    stop_grace_period: 45s
    depends_on:
      temporal:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/orker", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

  # orkctl without installing it: `docker compose run --rm orkctl orkflow create
  # examples/each-fan-out.ork.yaml`. `up` builds it and starts nothing
  # (scale 0); it sees this checkout, read-only. It depends on nothing, so a
  # `run` starts no other service (and never repeats the activities step):
  # the stack is `up`'s to start.
  orkctl:
    build:
      <<: *source
      target: orkctl
    scale: 0
    environment:
      ORK_SERVER: http://ork:8080
    volumes:
      - ./:/work:ro
    working_dir: /work

volumes:
  seaweedfs-data:
  registry-data:
