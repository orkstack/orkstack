name: proof-host
description: Turn a runner into a proof host — the Linux host.docker.internal setup, the SeaweedFS/registry stack, and the optional CLIs.

inputs:
  cosign:
    description: Install the cosign CLI (the integration gate's image-policy test)
    required: false
    default: "false"
  temporal-cli:
    description: Install the temporal CLI from the compose service's own image (ui/e2e/admin.spec.ts)
    required: false
    default: "false"
  cleanup-disk:
    description: Remove the runner's preinstalled SDKs to free disk
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Disk
      shell: bash
      env:
        CLEANUP_DISK: ${{ inputs.cleanup-disk }}
      run: |
        if [ "$CLEANUP_DISK" = "true" ]; then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
        fi
        df -h / | tee -a "$GITHUB_STEP_SUMMARY"

    # CONTRIBUTING.md's "Linux hosts" setup, variant A, as the spike measured it:
    # the host name resolves inside containers through the daemon's DNS.
    # The Orker never adds --add-host (AGENTS.md §6, §11.1).
    - name: host.docker.internal
      shell: bash
      run: |
        set -euo pipefail
        if getent hosts host.docker.internal >/dev/null; then
          echo "host.docker.internal already resolves"; exit 0
        fi
        echo '172.17.0.1 host.docker.internal' | sudo tee -a /etc/hosts
        sudo mkdir -p /etc/systemd/resolved.conf.d
        printf '[Resolve]\nDNSStubListenerExtra=172.17.0.1\n' | sudo tee /etc/systemd/resolved.conf.d/20-docker-dns.conf
        echo '{"dns":["172.17.0.1"]}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart systemd-resolved
        sudo systemctl restart docker
        # The one container this action runs that is not the stack's: pulled
        # from Docker Hub by tag, so it is bounded like a fetch is.
        timeout -k 10 360 docker run --rm alpine:3.20 getent hosts host.docker.internal

    # About 20 jobs a run each need the stack's images; Docker Hub allows 100
    # anonymous pulls an hour per address. One job saves them, every job loads
    # them (plan §3.3). A miss pulls normally.
    - name: Stack image cache
      uses: actions/cache@v6.1.0
      with:
        path: /tmp/orkstack-stack-images.tar
        key: stack-images-v2-${{ hashFiles('deploy/docker-compose.yml', 'images/*/Dockerfile') }}
        restore-keys: stack-images-v2-
    - name: Load the stack images
      shell: bash
      run: |
        if [ -f /tmp/orkstack-stack-images.tar ]; then
          docker load -i /tmp/orkstack-stack-images.tar
        fi

    # What the cache did not load is pulled here, through proof-fetch: two
    # bounded attempts, each in the setup log, instead of the unbounded pulls
    # `compose up` and `docker save` would make. The compose file pins each
    # image by digest, which proof-fetch requires; the stack then starts with
    # --pull never, so a missing image is an explicit failure and never a
    # stall.
    - name: Missing stack images
      id: missing
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        while read -r image; do
          docker image inspect "$image" >/dev/null 2>&1 || missing+=("$image")
        done < <(docker compose -f deploy/docker-compose.yml config --images temporal seaweedfs registry | sort -u)
        echo "images=${missing[*]}" >>"$GITHUB_OUTPUT"
    - name: fetch stack images
      if: steps.missing.outputs.images != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.missing.outputs.images }}

    - name: SeaweedFS and registry
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f deploy/docker-compose.yml up -d --wait --pull never seaweedfs registry
        # 403 is a healthy answer from the S3 server to an unsigned request.
        code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)"
        [ "$code" = 200 ] || [ "$code" = 403 ]
        curl -sf -o /dev/null "http://${ORK_LOCAL_REGISTRY:-localhost:5001}/v2/"

    - name: Save the stack images
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f /tmp/orkstack-stack-images.tar ]; then
          # Only the services this action starts. The observability profile's
          # images are pulled by the observability job that starts them; a
          # `config --images` list including them made docker save fail on a
          # reference that was never pulled, and `|| true` hid it.
          mapfile -t images < <(docker compose -f deploy/docker-compose.yml config --images temporal seaweedfs registry | sort -u)
          for image in "${images[@]}"; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              # The step that pulls it failed and said so; nothing is pulled here.
              echo "not saving the stack images: $image is not present"
              exit 0
            fi
          done
          docker save -o /tmp/orkstack-stack-images.tar "${images[@]}"
        fi

    # The CLI the image-policy interop test was proven with locally: cosign
    # v2.6.5, the linux/amd64 binary of the release, downloaded through
    # proof-fetch (two bounded attempts, in the setup log) and kept only if it
    # hashes to the SHA-256 the release's cosign_checksums.txt lists for it.
    # The installer action had no way to retry without continue-on-error, which
    # no workflow here allows, and v4 of it defaults to cosign v3, whose new
    # bundle format is not the signature layout OrkStack verifies; moving to it
    # is its own change with its own proof. To move cosign, take the new line
    # from the release's checksums and change the pair here and in
    # test/tools/proofrun/proofhost_test.go.
    - name: fetch cosign
      if: inputs.cosign == 'true'
      uses: ./.github/actions/proof-fetch
      with:
        url: https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
        sha256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
        path: ${{ runner.temp }}/cosign/cosign
    - name: cosign
      if: inputs.cosign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo install -m 0755 "$RUNNER_TEMP/cosign/cosign" /usr/local/bin/cosign
        cosign version

    - name: temporal CLI
      if: inputs.temporal-cli == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(docker compose -f deploy/docker-compose.yml config --images | grep temporalio/temporal | head -n1)"
        id="$(docker create --pull never "$image")"
        sudo docker cp "$id:/usr/local/bin/temporal" /usr/local/bin/temporal
        docker rm "$id" >/dev/null
        temporal --version
