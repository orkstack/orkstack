name: proof-host
description: Turn a runner into a proof host — the Linux host.docker.internal setup, the SeaweedFS/registry stack, and the optional CLIs.

inputs:
  cosign:
    description: Install the cosign CLI (the integration gate's image-policy test)
    required: false
    default: "false"
  dex:
    description: Pull the Dex image deploy/dex-image.txt pins (the sign-in interop test and ui/e2e/signin.spec.ts)
    required: false
    default: "false"
  moto:
    description: Pull the Moto image deploy/moto-image.txt pins (the aws provider's integration tests)
    required: false
    default: "false"
  vault:
    description: Pull the Vault image deploy/vault-image.txt pins (internal/provider/vault's integration tests)
    required: false
    default: "false"
  temporal-cli:
    description: Install the temporal CLI from the compose service's own image (ui/e2e/admin.spec.ts)
    required: false
    default: "false"
  cleanup-disk:
    description: Remove the runner's preinstalled SDKs to free disk
    required: false
    default: "false"
  usb-serial:
    description: Make the usb-serial test devices /dev/ttyUSB199 and /dev/ttyUSB198 (the device-profile integration tests; CONTRIBUTING.md, "The usb-serial test device")
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Disk
      shell: bash
      env:
        CLEANUP_DISK: ${{ inputs.cleanup-disk }}
      run: |
        if [ "$CLEANUP_DISK" = "true" ]; then
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
        fi
        df -h / | tee -a "$GITHUB_STEP_SUMMARY"

    # CONTRIBUTING.md's "Linux hosts" setup, variant A, as the spike measured it:
    # the host name resolves inside containers through the daemon's DNS.
    # The Orker never adds --add-host (AGENTS.md §6, §11.1).
    - name: host.docker.internal
      id: hostname
      shell: bash
      run: |
        set -euo pipefail
        if getent hosts host.docker.internal >/dev/null; then
          echo "host.docker.internal already resolves"; exit 0
        fi
        echo '172.17.0.1 host.docker.internal' | sudo tee -a /etc/hosts
        sudo mkdir -p /etc/systemd/resolved.conf.d
        printf '[Resolve]\nDNSStubListenerExtra=172.17.0.1\n' | sudo tee /etc/systemd/resolved.conf.d/20-docker-dns.conf
        sudo systemctl restart systemd-resolved
        echo "dns=172.17.0.1" >>"$GITHUB_OUTPUT"

    # The daemon's DNS and its Docker Hub mirror, in the one restart of the
    # daemon a job makes, before anything here drives it.
    - name: docker daemon
      uses: ./.github/actions/registry-mirror
      with:
        dns: ${{ steps.hostname.outputs.dns }}

    - name: host.docker.internal in a container
      if: steps.hostname.outputs.dns != ''
      shell: bash
      run: |
        set -euo pipefail
        # The daemon's DNS took effect when a container resolves the name. The
        # one container this action runs that is not the stack's: the
        # first-party images' alpine, pinned by its index digest (which
        # TestBindProbeImage_IsTheFirstPartyImagesBase holds to theirs),
        # pulled from Docker Hub and so bounded like a fetch is.
        timeout -k 10 360 docker run --rm alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf getent hosts host.docker.internal

    # CONTRIBUTING.md's "The usb-serial test device", for this runner's boot
    # only: the usbserial driver, which registers character major 188
    # (ttyUSB), and one node of it with no adapter behind it, which the
    # device-profile tests pass to a container and stat. The module ships in
    # linux-modules-extra on Ubuntu's cloud kernels.
    - name: usb-serial test device
      # A hosted runner only: on a self-hosted one the module, the nodes and
      # their owner would outlive the job.
      if: inputs.usb-serial == 'true' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        if ! sudo modprobe usbserial; then
          timeout -k 10 300 sudo apt-get update -q
          timeout -k 10 300 sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
          sudo modprobe usbserial
        fi
        if ! grep -Eq '^ *188 ttyUSB$' /proc/devices; then
          echo "the usbserial driver is loaded but /proc/devices lists no character major 188 (ttyUSB)" >&2
          exit 1
        fi
        if [ ! -e /dev/ttyUSB199 ]; then
          sudo mknod /dev/ttyUSB199 c 188 199
        fi
        sudo chgrp "$(id -gn)" /dev/ttyUSB199
        sudo chmod 0660 /dev/ttyUSB199
        # The drift test's own node, owned by the runner's user, who moves it
        # to the docker group and back as an unprivileged change of the device.
        if [ ! -e /dev/ttyUSB198 ]; then
          sudo mknod /dev/ttyUSB198 c 188 198
        fi
        sudo chown "$(id -un):$(id -gn)" /dev/ttyUSB198
        sudo chmod 0660 /dev/ttyUSB198
        ls -l /dev/ttyUSB199 /dev/ttyUSB198

    # About 20 jobs a run each need the stack's images; Docker Hub allows 100
    # anonymous pulls an hour per address. One job saves them, every job loads
    # them (plan §3.3). A miss pulls normally.
    - name: Stack image cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/orkstack-stack-images.tar
        key: stack-images-v2-${{ hashFiles('deploy/docker-compose.yml', 'images/*/Dockerfile') }}
        restore-keys: stack-images-v2-
    - name: Load the stack images
      shell: bash
      run: |
        if [ -f /tmp/orkstack-stack-images.tar ]; then
          docker load -i /tmp/orkstack-stack-images.tar
        fi

    # What the cache did not load is pulled here, through proof-fetch: two
    # bounded attempts, each in the setup log, instead of the unbounded pulls
    # `compose up` and `docker save` would make. The compose file pins each
    # image by digest, which proof-fetch requires; the stack then starts with
    # --pull never, so a missing image is an explicit failure and never a
    # stall.
    - name: Missing stack images
      id: missing
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        while read -r image; do
          docker image inspect "$image" >/dev/null 2>&1 || missing+=("$image")
        done < <(docker compose -f deploy/docker-compose.yml config --images temporal seaweedfs registry | sort -u)
        echo "images=${missing[*]}" >>"$GITHUB_OUTPUT"
    - name: fetch stack images
      if: steps.missing.outputs.images != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.missing.outputs.images }}

    - name: SeaweedFS and registry
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f deploy/docker-compose.yml up -d --wait --pull never seaweedfs registry
        # 403 is a healthy answer from the S3 server to an unsigned request.
        code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)"
        [ "$code" = 200 ] || [ "$code" = 403 ]
        curl -sf -o /dev/null "http://${ORK_LOCAL_REGISTRY:-localhost:5001}/v2/"

    - name: Save the stack images
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f /tmp/orkstack-stack-images.tar ]; then
          # Only the services this action starts. The observability profile's
          # images are pulled by the observability job that starts them; a
          # `config --images` list including them made docker save fail on a
          # reference that was never pulled, and `|| true` hid it.
          mapfile -t images < <(docker compose -f deploy/docker-compose.yml config --images temporal seaweedfs registry | sort -u)
          for image in "${images[@]}"; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              # The step that pulls it failed and said so; nothing is pulled here.
              echo "not saving the stack images: $image is not present"
              exit 0
            fi
          done
          docker save -o /tmp/orkstack-stack-images.tar "${images[@]}"
        fi

    # The CLI the image-policy interop test was proven with locally: cosign
    # v2.6.5, the linux/amd64 binary of the release, downloaded through
    # proof-fetch (two bounded attempts, in the setup log) and kept only if it
    # hashes to the SHA-256 the release's cosign_checksums.txt lists for it.
    # The installer action had no way to retry without continue-on-error, which
    # no workflow here allows. This binary proves the legacy `.sig` layout
    # cosign 2 writes; cosign 3's bundle is proven by the image the release
    # signs with (`cosign image`, below). To move cosign, take the new line
    # from the release's checksums and change the pair here.
    - name: fetch cosign
      if: inputs.cosign == 'true'
      uses: ./.github/actions/proof-fetch
      with:
        url: https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
        sha256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
        path: ${{ runner.temp }}/cosign/cosign
    - name: cosign
      if: inputs.cosign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo install -m 0755 "$RUNNER_TEMP/cosign/cosign" /usr/local/bin/cosign
        cosign version
    # The cosign image the release signs with (deploy/cosign-image.txt): the
    # bundle interop test (internal/dsl) runs it with --pull never, so it is
    # pulled here, through proof-fetch, when the daemon lacks it.
    - name: cosign image
      id: cosign-image
      if: inputs.cosign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(grep -v '^#' deploy/cosign-image.txt | head -1)"
        [ -n "$image" ] || { echo "deploy/cosign-image.txt names no image" >&2; exit 1; }
        docker image inspect "$image" >/dev/null 2>&1 || echo "image=$image" >>"$GITHUB_OUTPUT"
    - name: fetch cosign image
      if: inputs.cosign == 'true' && steps.cosign-image.outputs.image != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.cosign-image.outputs.image }}

    # The Dex image the sign-in interop test (internal/api) and
    # ui/e2e/signin.spec.ts run (deploy/dex-image.txt): they run it with
    # --pull never, so it is pulled here, through proof-fetch, when the
    # daemon lacks it.
    - name: dex image
      id: dex-image
      if: inputs.dex == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(grep -v '^#' deploy/dex-image.txt | grep -v '^$' | head -1)"
        [ -n "$image" ] || { echo "deploy/dex-image.txt names no image" >&2; exit 1; }
        docker image inspect "$image" >/dev/null 2>&1 || echo "image=$image" >>"$GITHUB_OUTPUT"
    - name: fetch dex image
      if: inputs.dex == 'true' && steps.dex-image.outputs.image != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.dex-image.outputs.image }}

    # The Moto image the aws provider's integration tests run
    # (deploy/moto-image.txt): pulled here, through proof-fetch, when the
    # daemon lacks it, so a test's own pull is never the first.
    - name: moto image
      id: moto-image
      if: inputs.moto == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(grep -v '^#' deploy/moto-image.txt | grep -v '^$' | head -1)"
        [ -n "$image" ] || { echo "deploy/moto-image.txt names no image" >&2; exit 1; }
        docker image inspect "$image" >/dev/null 2>&1 || echo "image=$image" >>"$GITHUB_OUTPUT"
    - name: fetch moto image
      if: inputs.moto == 'true' && steps.moto-image.outputs.image != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.moto-image.outputs.image }}
    # The Vault image internal/provider/vault's integration tests run
    # (deploy/vault-image.txt), as Dex's is.
    - name: vault image
      id: vault-image
      if: inputs.vault == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(grep -v '^#' deploy/vault-image.txt | grep -v '^$' | head -1)"
        [ -n "$image" ] || { echo "deploy/vault-image.txt names no image" >&2; exit 1; }
        docker image inspect "$image" >/dev/null 2>&1 || echo "image=$image" >>"$GITHUB_OUTPUT"
    - name: fetch vault image
      if: inputs.vault == 'true' && steps.vault-image.outputs.image != ''
      uses: ./.github/actions/proof-fetch
      with:
        image: ${{ steps.vault-image.outputs.image }}

    - name: temporal CLI
      if: inputs.temporal-cli == 'true'
      shell: bash
      run: |
        set -euo pipefail
        image="$(docker compose -f deploy/docker-compose.yml config --images | grep temporalio/temporal | head -n1)"
        id="$(docker create --pull never "$image")"
        sudo docker cp "$id:/usr/local/bin/temporal" /usr/local/bin/temporal
        docker rm "$id" >/dev/null
        temporal --version
