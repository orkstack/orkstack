version: 2

# Every dependency update is a pull request that must pass the proof
# (AGENTS.md §11.1, docs/PROOFS.md), which waits for someone to add the ci:proof
# label, so no entry here may add it. Pin exact versions and image digests;
# never float a tag at runtime. A push to main does not rebase an open pull
# request, because each rebase would run its whole proof again: ask for one
# with an `@dependabot rebase` comment when that pull request is next to merge.
#
# Each entry opens at most one pull request a month, holding all of its updates,
# so each month costs at most one full proof per entry (docs/CI.md, "Dependency
# updates"). A security update does not wait for this schedule, where the
# repository enables them, and the nightly's vulnerability scan runs every day.
# GitHub re-runs every entry when this file changes; other pushes start none.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      go:
        patterns: ["*"]
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  # The first-party activity images: each Dockerfile is in a directory of its
  # own (images/activity-*/), which Dependabot reads only when named, so the
  # entry names them by glob. Their alpine base is pinned again elsewhere,
  # moved by hand in the same pull request, and tests hold every copy to these
  # Dockerfiles: orker.BindProbeImage, the boot probe's image
  # (internal/orker/runtime_docker.go), its PROBE_IMAGE copies in
  # .github/workflows/podman.yml, scripts/k8s-orker-check.sh and
  # scripts/kind-orker.sh, examples/custom-image-shell's base and the
  # proof-host action's container (.github/actions/proof-host)
  # (TestBindProbeImage_IsTheFirstPartyImagesBase); and the proof cleanup's
  # firstPartyBase (test/tools/proofrun/clean.go,
  # TestClean_RemoveTreeArgs_BaseIsTheFirstPartyImagesBase).
  #
  # The release images' Dockerfile and the quickstart's source build, whose
  # runtime stages are the release's own (TestSourceDockerfile_StagesAreTheReleasesOwn),
  # so one update moves both; the source build alone also builds the web UI
  # in oven/bun, held to the workflows' bun-version
  # (TestDockerfiles_ToolchainsMatchTheWorkflowPins). Two pins are held to pins another entry or file
  # moves, and their update needs the other moved by hand in the same pull
  # request: the docker CLI, which the root compose.yaml's push step also
  # runs (TestQuickstartCompose_InfraPinsMatchTheDevStack), and golang, whose
  # version is the workflows' go-version.
  - package-ecosystem: docker
    directories: ["/images/*", "/deploy", "/deploy/source"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  # The development stack's and the quickstart's compose files pin images by
  # digest too. deploy/skopeo-image.txt, deploy/cosign-image.txt,
  # deploy/grype-image.txt, the QEMU and BuildKit images in release.yml's
  # `with:`, proof.yml's BuildKit, and the BuildKit image in nightly.yml's
  # vuln-images job, both held equal to release.yml's
  # (TestWorkflows_TheNightlyScansJavaScriptAndImages for nightly.yml's), are
  # moved by hand.
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-compose:
        patterns: ["*"]
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  # Every action is pinned by the full commit SHA of a release, with the
  # release in a comment on the same line (`@<sha> # vX.Y.Z`); Dependabot
  # moves both together (TestWorkflows_ActionsAndToolchainsArePinnedExactly).
  # "/" reads .github/workflows; each composite action's action.yml is read
  # only from a directory listed here.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"

  # The UI and the site share what must move together: make site-media refuses
  # a @playwright/test the two pin differently.
  - package-ecosystem: bun
    directories: ["/ui", "/site"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      bun:
        patterns: ["*"]
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
