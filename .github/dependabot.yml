version: 2

# Every dependency update is a pull request that must pass the proof
# (AGENTS.md §11.1, docs/PROOFS.md). Pin exact versions and image digests;
# never float a tag at runtime.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-root:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /images
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-deploy:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The development stack's and the quickstart's compose files pin images by
  # digest too. deploy/skopeo-image.txt, and the QEMU and BuildKit images in
  # release.yml's `with:`, are moved by hand.
  - package-ecosystem: docker-compose
    directories: ["/deploy", "/deploy/quickstart"]
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      bun-site:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
