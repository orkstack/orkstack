name: proof

# The full proof, sharded across runners. `proof` is the single required
# check: it passes only when every part of this run merged into one
# merge-eligible proof.json (docs/PROOFS.md).
#
# It runs the real proof on a pull request (the queue-less default, AGENTS.md
# §11.3) and, when an organization-owned repository enables the merge queue,
# on the merge group too. A push to validate/full/** runs it on a candidate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: ["validate/full/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: full or release
        type: choice
        options: [full, release]
        default: full
      base:
        description: the ref the proof diffs against
        default: main
  workflow_call:
    inputs:
      tier:
        type: string
        default: full
      base:
        type: string
        default: main
      int_shards:
        type: number
        default: 10
      ui_shards:
        type: number
        default: 5

concurrency:
  # Only pull requests share a group, so a newer push supersedes an older
  # head; everything else is a group of its own and is never displaced.
  group: proof-${{ inputs.tier || 'full' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TIER: ${{ inputs.tier || 'full' }}
  INT_SHARDS: ${{ inputs.int_shards || 10 }}
  UI_SHARDS: ${{ inputs.ui_shards || 5 }}
  PROOF_ID: pr-ci-${{ github.run_id }}
  PROOF_NAME: pr-ci-${{ github.run_id }}
  ORK_LOCAL_REGISTRY: localhost:5001

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      int_matrix: ${{ steps.plan.outputs.int_matrix }}
      ui_matrix: ${{ steps.plan.outputs.ui_matrix }}
      observability: ${{ steps.plan.outputs.observability }}
      proof_id: ${{ steps.plan.outputs.proof_id }}
      plan_artifact: plan-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: latest
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: base
        id: base
        timeout-minutes: 3
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
            if [ "${MERGE_GATE_MODE:-}" != queue ]; then
              if ! git merge-base --is-ancestor HEAD^1 HEAD^2; then
                echo "update this branch: the merge gate proves only a tree that lands unchanged" >&2
                exit 1
              fi
            fi
            echo "pr_head=$(git rev-parse HEAD^2)" >>"$GITHUB_OUTPUT"
            echo "pr_base=$PR_BASE_SHA" >>"$GITHUB_OUTPUT"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            base="$MG_BASE_SHA"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            base="$(git rev-parse HEAD^1)"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          else
            base="$(git rev-parse "${{ inputs.base || 'main' }}")"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
      - name: plan
        id: plan
        timeout-minutes: 15
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
          BASE: ${{ steps.base.outputs.base }}
          PROOF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PROOF_PR_HEAD: ${{ steps.base.outputs.pr_head }}
          PROOF_PR_BASE: ${{ steps.base.outputs.pr_base }}
          PROOF_PR_CONTAINS_BASE: ${{ steps.base.outputs.contains_base }}
        run: |
          set -euo pipefail
          scripts/proof.sh --part plan --tier "$TIER" --proof-id "$PROOF_ID" \
            --base-commit "$BASE" --shards "$INT_SHARDS" --ui-shards "$UI_SHARDS" "$PROOF_NAME"
          dir="proof/$PROOF_NAME-part-plan-a$GITHUB_RUN_ATTEMPT"
          {
            echo "int_matrix=$(cat "$dir/int-matrix.json")"
            echo "ui_matrix=$(cat "$dir/ui-matrix.json")"
            echo "observability=$(grep -q 'observability' "$dir/observability-paths.txt" 2>/dev/null && echo true || echo false)"
            echo "proof_id=$PROOF_ID"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: plan-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-plan-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      build_artifact: part-build-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 3
      - name: build
        timeout-minutes: 20
        shell: bash
        run: scripts/proof.sh --part build --tier "$TIER" --proof-id "$PROOF_ID" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-build-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-build-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  fast:
    if: ${{ inputs.tier != 'nightly' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: latest
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: fast
        timeout-minutes: 15
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: scripts/proof.sh --part fast --tier "$TIER" --proof-id "$PROOF_ID" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-fast-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-fast-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  integration:
    needs: [plan, build]
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.int_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          cosign: "true"
          cleanup-disk: "true"
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
      - name: integration shard
        timeout-minutes: ${{ env.TIER == 'nightly' && 105 || (env.TIER == 'release' && 105 || 45) }}
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: |
          scripts/proof.sh --part "integration:${{ matrix.shard }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-integration-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-integration-${{ matrix.shard }}-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  ui-e2e:
    needs: [plan, build]
    if: ${{ inputs.tier != 'nightly' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: latest
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          temporal-cli: "true"
      - name: Chromium
        timeout-minutes: 5
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
      - name: UI shard
        timeout-minutes: 35
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: |
          scripts/proof.sh --part "ui-e2e:${{ matrix.shard }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --ui-plan "$RUNNER_TEMP/ci/plan/ui-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-ui-e2e-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-ui-e2e-${{ matrix.shard }}-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  activity-fixture:
    needs: build
    if: ${{ inputs.tier != 'nightly' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        activity: [shell, json, git, template]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          cleanup-disk: "true"
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
      - name: activity fixture
        timeout-minutes: 25
        shell: bash
        run: |
          scripts/proof.sh --part "activity-fixture:${{ matrix.activity }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-activity-fixture-${{ matrix.activity }}-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-activity-fixture-${{ matrix.activity }}-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  observability:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.observability == 'true' || inputs.tier == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - name: observability stack
        timeout-minutes: 10
        run: docker compose -f deploy/docker-compose.yml --profile observability up -d --wait
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
      - name: observability
        timeout-minutes: 25
        shell: bash
        run: |
          scripts/proof.sh --part observability --tier "$TIER" --proof-id "$PROOF_ID" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: part-observability-a${{ github.run_attempt }}
          path: proof/${{ env.PROOF_NAME }}-part-observability-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  proof:
    # A skipped required job reports success: `always()` and nothing else.
    if: always()
    needs: [plan, build, fast, integration, ui-e2e, activity-fixture, observability]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: draft and private-repository guard
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          PRIVATE: ${{ github.event.repository.private }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "a draft runs no full proof; mark it ready for review" >&2
            exit 1
          fi
          if [ "$PRIVATE" = "true" ] && [[ ",$LABELS," != *",ci:proof,"* ]]; then
            echo "private repository: the full proof runs on a pull request only with the ci:proof label; add it, then push or close and reopen" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/parts/${{ needs.plan.outputs.plan_artifact }}
      - uses: actions/download-artifact@v8
        continue-on-error: true
        timeout-minutes: 3
        with:
          pattern: part-*
          path: ${{ runner.temp }}/ci/parts
      - name: job records
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci/jobs"
          for n in $(seq 1 "${{ github.run_attempt }}"); do
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/$n/jobs" \
              | jq --argjson n "$n" '{attempt: $n, jobs: [.jobs[] | {id, name, conclusion, check_run_id, failed_step: ([.steps[]? | select(.conclusion == "failure") | .name][0] // "")}]}' \
              >"$RUNNER_TEMP/ci/jobs/attempt-$n.json" || true
          done
      - name: merge
        timeout-minutes: 10
        shell: bash
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_ATTEMPT: ${{ github.run_attempt }}
          CI_EVENT: ${{ github.event_name }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(-plan "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/integration-plan.json"
                -parts "$RUNNER_TEMP/ci/parts" -jobs "$RUNNER_TEMP/ci/jobs"
                -out "$RUNNER_TEMP/ci/proof" -name "$PROOF_NAME"
                -ci-run-id "$CI_RUN_ID" -ci-attempt "$CI_ATTEMPT" -ci-event "$CI_EVENT" -ci-url "$CI_URL")
          if [ -f "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/ui-plan.json" ]; then
            args+=(-ui-plan "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/ui-plan.json")
          fi
          go run ./test/tools/proofrun merge "${args[@]}"
          mkdir -p "$RUNNER_TEMP/ci/proof/parts"
          cp -r "$RUNNER_TEMP/ci/parts/." "$RUNNER_TEMP/ci/proof/parts/" || true
      - name: summary
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          {
            echo "## Proof"
            echo
            jq -r '"result: **\(.result)**  merge-eligible: **\(.merge_eligible)**\ntree: `\(.tree)`"' \
              "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || echo "no proof.json was written"
            echo
            jq -r '.ineligible_reasons[]? | "- " + .' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            jq -r '.reruns[]? | "- rerun: \(.part) attempt \(.attempt), \(.reason)"' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            echo
            du -sh "$RUNNER_TEMP/ci/proof" 2>/dev/null || true
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 5
        with:
          name: proof-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci/proof
          retention-days: ${{ github.event.repository.private && 30 || 90 }}
      - name: verdict
        timeout-minutes: 2
        shell: bash
        run: |
          # A full proof must be merge-eligible; the nightly and release tiers
          # are never merge evidence and are judged by their result alone.
          jq -e 'if .tier == "full" then .result == "pass" and .merge_eligible == true else .result == "pass" end'             "$RUNNER_TEMP/ci/proof/proof.json"
