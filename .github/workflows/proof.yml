name: proof

# The full proof, sharded across runners. `proof` is the single required
# check: it passes only when every part of this run merged into one
# merge-eligible proof.json (docs/PROOFS.md).
#
# It runs the real proof on a pull request (the queue-less default, AGENTS.md
# §11.3) and, when an organization-owned repository enables the merge queue,
# on the merge group too. A push to validate/full/** runs it on a candidate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: ["validate/full/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: full or release
        type: choice
        options: [full, release]
        default: full
      base:
        description: the ref the proof diffs against
        default: main
  workflow_call:
    inputs:
      tier:
        type: string
        default: full
      base:
        type: string
        default: main
      int_shards:
        type: number
        default: 10
      ui_shards:
        type: number
        default: 5
    outputs:
      # The merged proof's artifact name, so a caller's re-run job finds the
      # attempt that uploaded it (release.yml › tag).
      proof_artifact:
        value: ${{ jobs.proof.outputs.proof_artifact }}

concurrency:
  # Only pull requests share a group, so a newer push supersedes an older
  # head; everything else is a group of its own and is never displaced.
  group: proof-${{ inputs.tier || 'full' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TIER: ${{ inputs.tier || 'full' }}
  INT_SHARDS: ${{ inputs.int_shards || 10 }}
  UI_SHARDS: ${{ inputs.ui_shards || 5 }}
  PROOF_ID: pr-ci-${{ github.run_id }}
  PROOF_NAME: pr-ci-${{ github.run_id }}
  ORK_LOCAL_REGISTRY: localhost:5001

jobs:
  base:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.base.outputs.base }}
      pr_head: ${{ steps.base.outputs.pr_head }}
      pr_base: ${{ steps.base.outputs.pr_base }}
      contains_base: ${{ steps.base.outputs.contains_base }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: base
        id: base
        timeout-minutes: 3
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          # Set by `make github-merge-gate APPLY=1 QUEUE=1` and nothing else;
          # `queue` lifts only the containment check below (docs/PROOFS.md §6).
          MERGE_GATE_MODE: ${{ vars.MERGE_GATE_MODE }}
          BASE_INPUT: ${{ inputs.base || 'main' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
            if [ "${MERGE_GATE_MODE:-}" != queue ]; then
              if ! git merge-base --is-ancestor HEAD^1 HEAD^2; then
                echo "update this branch: the merge gate proves only a tree that lands unchanged" >&2
                exit 1
              fi
            fi
            echo "pr_head=$(git rev-parse HEAD^2)" >>"$GITHUB_OUTPUT"
            echo "pr_base=$PR_BASE_SHA" >>"$GITHUB_OUTPUT"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            base="$MG_BASE_SHA"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            base="$(git rev-parse HEAD^1)"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          else
            base="$(git rev-parse --verify --quiet "origin/$BASE_INPUT^{commit}" || git rev-parse --verify "$BASE_INPUT^{commit}")"
            echo "contains_base=true" >>"$GITHUB_OUTPUT"
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"

  plan:
    needs: base
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      int_matrix: ${{ steps.plan.outputs.int_matrix }}
      ui_matrix: ${{ steps.plan.outputs.ui_matrix }}
      observability: ${{ steps.plan.outputs.observability }}
      proof_id: ${{ steps.plan.outputs.proof_id }}
      plan_artifact: plan-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: oven-sh/setup-bun@v2.2.0
        timeout-minutes: 5
        with:
          bun-version: "1.4.3"
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: plan
        id: plan
        timeout-minutes: 15
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
          BASE: ${{ needs.base.outputs.sha }}
          PROOF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PROOF_PR_HEAD: ${{ needs.base.outputs.pr_head }}
          PROOF_PR_BASE: ${{ needs.base.outputs.pr_base }}
          PROOF_PR_CONTAINS_BASE: ${{ needs.base.outputs.contains_base }}
        run: |
          set -euo pipefail
          scripts/proof.sh --part plan --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --base-commit "$BASE" --shards "$INT_SHARDS" --ui-shards "$UI_SHARDS" "$PROOF_NAME"
          dir="proof/$PROOF_NAME-part-plan-a$GITHUB_RUN_ATTEMPT"
          {
            echo "int_matrix=$(cat "$dir/int-matrix.json")"
            echo "ui_matrix=$(cat "$dir/ui-matrix.json")"
            echo "observability=$(jq -r '.observability_required // false' "$dir/integration-plan.json")"
            echo "proof_id=$PROOF_ID"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: plan-a${{ github.run_attempt }}
          # The one part whose bin/ is uploaded: the compiled integration test
          # binaries every shard adopts (test/tools/proofrun/prebuilt.go).
          path: proof/${{ env.PROOF_NAME }}-part-plan-a${{ github.run_attempt }}/
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  build:
    needs: [base, plan]
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    outputs:
      build_artifact: part-build-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: docker/setup-buildx-action@v4.4.1
        timeout-minutes: 3
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
          token: ${{ github.token }}
      - name: build
        timeout-minutes: 20
        shell: bash
        run: |
          scripts/proof.sh --part build --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --setup-log "$RUNNER_TEMP/ci/setup.log" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-build-a${{ github.run_attempt }}
          # A part's artifact is its records and, here, the image layouts the
          # shards fetch; never its binaries (docs/PROOFS.md §7).
          path: |
            proof/${{ env.PROOF_NAME }}-part-build-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-build-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  fast:
    needs: base
    if: ${{ inputs.tier != 'nightly' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: oven-sh/setup-bun@v2.2.0
        timeout-minutes: 5
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7.1.0
        timeout-minutes: 3
        with:
          node-version: "26.12.0"
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: bun install (site)
        timeout-minutes: 3
        working-directory: site
        run: bun install --frozen-lockfile
      - name: fast
        timeout-minutes: 15
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: |
          scripts/proof.sh --part fast --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-fast-a${{ github.run_attempt }}
          path: |
            proof/${{ env.PROOF_NAME }}-part-fast-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-fast-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  integration:
    needs: [base, plan, build]
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.int_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          cosign: "true"
          cleanup-disk: "true"
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
          token: ${{ github.token }}
      - name: fetch build
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
          token: ${{ github.token }}
      - name: integration shard
        timeout-minutes: ${{ env.TIER == 'nightly' && 105 || (env.TIER == 'release' && 105 || 45) }}
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: |
          scripts/proof.sh --part "integration:${{ matrix.shard }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" \
            --setup-log "$RUNNER_TEMP/ci/setup.log" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-integration-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            proof/${{ env.PROOF_NAME }}-part-integration-${{ matrix.shard }}-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-integration-${{ matrix.shard }}-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  ui-e2e:
    needs: [base, plan, build]
    # Every tier's UI plan names its shards: the nightly tier's hold only the
    # spec files scripts/proof-nightly-specs.txt lists, and none when it lists
    # none.
    if: ${{ needs.plan.outputs.ui_matrix != '[]' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: oven-sh/setup-bun@v2.2.0
        timeout-minutes: 5
        with:
          bun-version: "1.4.3"
      - name: bun install
        timeout-minutes: 5
        working-directory: ui
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          temporal-cli: "true"
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
          token: ${{ github.token }}
      - name: fetch build
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
          token: ${{ github.token }}
      # The browser every spec file's `chromium` project drives: Playwright's
      # own image, pinned by digest in ui/e2e/browser-image.txt, which the
      # suite's global setup runs in a network namespace of its own
      # (ui/e2e/browser-server.ts), as a local proof does. A pull from the
      # image registry, never an apt mirror; the reference is read from the
      # file, so the pin moves in one place.
      - name: browser image
        id: browser-image
        timeout-minutes: 1
        shell: bash
        run: echo "image=$(grep -v '^#' ui/e2e/browser-image.txt | grep -v '^$' | head -n1)" >>"$GITHUB_OUTPUT"
      - name: fetch browser image
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          image: ${{ steps.browser-image.outputs.image }}
      # The host's own Chromium is installed only in the shard whose files
      # drive it: run-page-ceiling.spec.ts, the one spec Playwright runs on the
      # host's Chromium (ui/playwright.config.ts), and network-change.spec.ts,
      # which launches a host-namespace Chromium as its positive control. Every
      # other shard skips the apt install the host browser's system libraries
      # need, which has stalled a part on a slow mirror. scripts/proof-part.sh
      # applies the same rule as a prerequisite of the part.
      - name: host chromium shard
        id: host-chromium
        timeout-minutes: 1
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          needed=false
          if jq -e --argjson k "$SHARD" '[.shards[] | select(.index == $k) | .files[] | select(test("(network-change|run-page-ceiling|run-page-reduced-ceiling)\\.spec\\.ts$"))] | length > 0' \
            "$RUNNER_TEMP/ci/plan/ui-plan.json" >/dev/null; then
            needed=true
          fi
          echo "needed=$needed" | tee -a "$GITHUB_OUTPUT"
      # The browser from Playwright's own store and nothing from an apt
      # mirror: the runner image already carries Chromium's shared libraries
      # (run 40411125174's apt log shows the nine packages --with-deps would
      # add are all fonts, and its eight upgrades libraries already
      # installed), and that apt install from the runner's mirror at 50–100
      # KB/s has cost a run its only host-Chromium shard three times (runs
      # 40346476240, 40411125174 and nightly 40413305751). A launch probe
      # then decides: only a Chromium that does not launch falls back to
      # --with-deps, through the same two bounded attempts as proof-fetch
      # (180 s, then 360 s), and a browser that still does not launch fails
      # the step here, before the part. The install itself has the same two
      # attempts, so a stalled download costs a retry rather than the part.
      - name: Chromium (host)
        if: steps.host-chromium.outputs.needed == 'true'
        timeout-minutes: 10
        working-directory: ui
        shell: bash
        run: |
          set -uo pipefail
          probe() { node -e "require('playwright-core').chromium.launch({ headless: true }).then(b => b.close())"; }
          attempt() { # <what> <command...>
            local what="$1" limit
            shift
            for limit in 180 360; do
              if timeout -k 10 "$limit" "$@"; then return 0; fi
              echo "$what: the attempt under ${limit}s did not finish"
            done
            return 1
          }
          attempt "playwright install chromium" npx playwright install chromium || true
          if probe; then
            echo "host chromium launches; its system libraries were already on the image"
            exit 0
          fi
          echo "host chromium does not launch; falling back to --with-deps"
          attempt "playwright install --with-deps chromium" npx playwright install --with-deps chromium || true
          probe
      - name: UI shard
        timeout-minutes: 35
        shell: bash
        env:
          PROOF_JOBS: ${{ github.event.repository.private && 2 || 3 }}
        run: |
          scripts/proof.sh --part "ui-e2e:${{ matrix.shard }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --ui-plan "$RUNNER_TEMP/ci/plan/ui-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" \
            --setup-log "$RUNNER_TEMP/ci/setup.log" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-ui-e2e-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            proof/${{ env.PROOF_NAME }}-part-ui-e2e-${{ matrix.shard }}-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-ui-e2e-${{ matrix.shard }}-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  activity-fixture:
    needs: [base, plan, build]
    if: ${{ inputs.tier != 'nightly' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        activity: [shell, json, git, template]
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - uses: ./.github/actions/proof-host
        timeout-minutes: 10
        with:
          cleanup-disk: "true"
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
          token: ${{ github.token }}
      - name: fetch build
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
          token: ${{ github.token }}
      - name: activity fixture
        timeout-minutes: 25
        shell: bash
        run: |
          scripts/proof.sh --part "activity-fixture:${{ matrix.activity }}" --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" \
            --setup-log "$RUNNER_TEMP/ci/setup.log" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-activity-fixture-${{ matrix.activity }}-a${{ github.run_attempt }}
          path: |
            proof/${{ env.PROOF_NAME }}-part-activity-fixture-${{ matrix.activity }}-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-activity-fixture-${{ matrix.activity }}-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  observability:
    needs: [base, plan, build]
    if: ${{ (needs.plan.outputs.observability == 'true' || inputs.tier == 'release') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'ci:proof')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: observability stack
        timeout-minutes: 10
        run: docker compose -f deploy/docker-compose.yml --profile observability up -d --wait
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/plan
          token: ${{ github.token }}
      - name: fetch build
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.build.outputs.build_artifact }}
          path: ${{ runner.temp }}/ci/build
          token: ${{ github.token }}
      - name: observability
        timeout-minutes: 25
        shell: bash
        run: |
          scripts/proof.sh --part observability --tier "$TIER" --proof-id "$PROOF_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan "$RUNNER_TEMP/ci/plan/integration-plan.json" \
            --layouts "$RUNNER_TEMP/ci/build/layouts" \
            --setup-log "$RUNNER_TEMP/ci/setup.log" \
            --base-commit "${{ needs.base.outputs.sha }}" "$PROOF_NAME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: part-observability-a${{ github.run_attempt }}
          path: |
            proof/${{ env.PROOF_NAME }}-part-observability-a${{ github.run_attempt }}/
            !proof/${{ env.PROOF_NAME }}-part-observability-a${{ github.run_attempt }}/bin/**
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

  proof:
    # A skipped required job reports success: `always()` and nothing else.
    if: always()
    needs: [base, plan, build, fast, integration, ui-e2e, activity-fixture, observability]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      proof_artifact: proof-${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - name: draft and private-repository guard
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          PRIVATE: ${{ github.event.repository.private }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "a draft runs no full proof; mark it ready for review" >&2
            exit 1
          fi
          if [ "$PRIVATE" = "true" ] && [[ ",$LABELS," != *",ci:proof,"* ]]; then
            echo "private repository: the full proof runs on a pull request only with the ci:proof label; add it, then push or close and reopen" >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: fetch plan
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          artifact: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ runner.temp }}/ci/parts/${{ needs.plan.outputs.plan_artifact }}
          token: ${{ github.token }}
      - name: fetch parts
        uses: ./.github/actions/proof-fetch
        timeout-minutes: 10
        with:
          pattern: part-*
          path: ${{ runner.temp }}/ci/parts
          token: ${{ github.token }}
      - name: job records
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's record of every attempt's jobs, in the shape proofrun
          # merge reads (merge.go, githubAttempt): each job's steps, its
          # check run's annotations (where GitHub says it lost the runner),
          # its log when it did not succeed (best effort), and read_error when
          # the job listing or the annotations could not be fetched, so the
          # merger fails that job closed.
          set -uo pipefail
          dir="$RUNNER_TEMP/ci/jobs"
          work="$RUNNER_TEMP/ci/jobs-work"
          mkdir -p "$dir" "$work"
          repo="repos/$GITHUB_REPOSITORY"
          for n in $(seq 1 "$GITHUB_RUN_ATTEMPT"); do
            if ! gh api --paginate "$repo/actions/runs/$GITHUB_RUN_ID/attempts/$n/jobs?per_page=100" --jq '.jobs[] | tojson' >"$work/raw-$n"; then
              # Not JSON on purpose: the merger lists it as unreadable.
              echo "unreadable: listing attempt $n's jobs failed" >"$dir/attempt-$n.json"
              continue
            fi
            : >"$work/jobs-$n"
            while IFS= read -r job; do
              id="$(jq -r .id <<<"$job")"
              status="$(jq -r '.status // ""' <<<"$job")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$job")"
              check="$(jq -r '(.check_run_url // "") | split("/") | last' <<<"$job")"
              err=""
              echo '[]' >"$work/ann"
              : >"$work/log"
              if [ "$status" = completed ]; then
                if [ -z "$check" ]; then
                  err="no check run"
                elif ! gh api --paginate "$repo/check-runs/$check/annotations" --jq '.[].message | tojson' >"$work/ann-lines" ||
                  ! jq -s . "$work/ann-lines" >"$work/ann"; then
                  # One JSON string per message, so a multi-line message stays whole.
                  err="annotations: the API call failed"
                  echo '[]' >"$work/ann"
                fi
                # Best effort: GitHub keeps no log for a job whose runner it lost,
                # and that job is classified from its annotations, not its log.
                case "$conclusion" in
                success | skipped) ;;
                *) gh api "$repo/actions/jobs/$id/logs" >"$work/log" 2>/dev/null || : >"$work/log" ;;
                esac
              fi
              jq -c --rawfile log "$work/log" --slurpfile ann "$work/ann" --arg err "$err" '
                {name, conclusion: (.conclusion // ""),
                 check_run_id: ((.check_run_url // "") | split("/") | last | tonumber? // 0),
                 annotations: $ann[0], log: $log,
                 steps: [.steps[]? | {name, conclusion: (.conclusion // "")}],
                 failed_step: ([.steps[]? | select(.conclusion == "failure") | .name][0] // "")}
                + (if $err == "" then {} else {read_error: $err} end)' <<<"$job" >>"$work/jobs-$n" ||
                echo "{\"name\":$(jq '.name' <<<"$job"),\"read_error\":\"the record could not be assembled\"}" >>"$work/jobs-$n"
            done <"$work/raw-$n"
            jq -s --argjson n "$n" '{attempt: $n, jobs: .}' "$work/jobs-$n" >"$dir/attempt-$n.json" ||
              echo "unreadable: assembling attempt $n failed" >"$dir/attempt-$n.json"
          done
      - name: merge
        timeout-minutes: 10
        shell: bash
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_ATTEMPT: ${{ github.run_attempt }}
          CI_EVENT: ${{ github.event_name }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(-plan "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/integration-plan.json"
                -parts "$RUNNER_TEMP/ci/parts" -jobs "$RUNNER_TEMP/ci/jobs"
                -out "$RUNNER_TEMP/ci/proof" -name "$PROOF_NAME"
                -ci-run-id "$CI_RUN_ID" -ci-attempt "$CI_ATTEMPT" -ci-event "$CI_EVENT" -ci-url "$CI_URL")
          if [ -f "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/ui-plan.json" ]; then
            args+=(-ui-plan "$RUNNER_TEMP/ci/parts/${{ needs.plan.outputs.plan_artifact }}/ui-plan.json")
          fi
          status=0
          go run ./test/tools/proofrun merge "${args[@]}" || status=$?
          # The merged proof keeps every part's records, the events and logs
          # only of parts that did not pass, and GitHub's job records — never
          # a part's binaries, image layouts or test artifacts
          # (scripts/proof-collect.sh, docs/PROOFS.md §7). Copied in whole,
          # the parts were 4.6 GB and the upload below timed out; with the
          # binaries out, a green run's events and logs were still 900 MB.
          # The copy is not the verdict: proof.json is already written, and
          # the merger read the parts, not this copy. It is made whatever the
          # merge decided — a failing proof is exactly the one whose parts'
          # events and logs a reader needs (docs/PROOFS.md §8); under set -e
          # a failing merge used to end the step before it (run 40411125174
          # uploaded five files) — and the step then ends as the merge did.
          scripts/proof-collect.sh "$RUNNER_TEMP/ci/parts" "$RUNNER_TEMP/ci/jobs" "$RUNNER_TEMP/ci/proof" || true
          exit "$status"
      - name: summary
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          {
            echo "## Proof"
            echo
            jq -r '.lists_changed[]? | "- gate file: `\(.file)`"' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            echo
            jq -r '"result: **\(.result)**  merge-eligible: **\(.merge_eligible)**\ntree: `\(.tree)`"' \
              "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || echo "no proof.json was written"
            echo
            jq -r '.ineligible_reasons[]? | "- " + .' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            jq -r '.quarantine_warnings[]? | "- WARNING: " + .' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            jq -r '.reruns[]? | "- rerun: \(.part) attempt \(.attempt), \(.reason)"' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            jq -r '.degraded_runners[]? | "- degraded runner: \(.part) attempt \(.attempt): \(.metric) \(.value) \(.unit), floor \(.floor) (re-run that job alone)"' "$RUNNER_TEMP/ci/proof/proof.json" 2>/dev/null || true
            echo
            du -sh "$RUNNER_TEMP/ci/proof" 2>/dev/null || true
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: proof-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci/proof
          retention-days: ${{ github.event.repository.private && 30 || 90 }}
      - name: verdict
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/ci/proof"
          tier="$(jq -r .tier "$proof/proof.json")"
          case "$tier" in
          full)
            # The merge gate: a pass is not enough, it must be merge-eligible.
            jq -e '.result == "pass" and .merge_eligible == true' "$proof/proof.json"
            ;;
          release)
            # Never merge evidence, but a tag precondition: judged by the same
            # rule the tag job applies, identity included (docs/PROOFS.md §6),
            # against the commit this job checked out.
            go run ./test/tools/proofrun verify -release -proof "$proof"
            ;;
          nightly)
            # Never merge evidence, but rule A's evidence: a pass with every
            # identity rule held, its tier the only thing it is not.
            jq -e '.result == "pass" and .eligible_but_for_tier == true' "$proof/proof.json"
            ;;
          *)
            echo "proof.json names tier ${tier:-<none>}" >&2
            exit 1
            ;;
          esac
