name: release

# The pre-release gate, and the release itself, in one run that asks for one
# approval. `validate` refuses a version that is not vMAJOR.MINOR.PATCH, or
# that the built-in activity catalog and CHANGELOG.md do not name, before
# anything else runs. `gate` runs the release tier: every gate, the scale and
# soak tests included, observability always. `artifacts`, beside it, builds
# what a release publishes (the archives and the multi-arch images as OCI
# layouts), runs the quickstart's compose file on those images end to end,
# and runs the README's Quickstart as written on a clone of the commit; when
# one of those steps fails it cancels the run, so the gate stops too. `verify`
# runs `proofrun verify -release` on the gate's proof for the exact commit,
# and, on main, `nightly` waits for the nightly of this commit and refuses
# one that did not pass, so a nightly dispatched beside the release has time
# to finish. Only then, and only on main, `publish` asks for the `release`
# environment's approval; once approved it signs SHA256SUMS
# with the release's cosign key, creates the tag, pushes the images to
# ghcr.io byte for byte, signs each by digest, and creates the GitHub
# release, running no repository code (docs/PROOFS.md §10). The private key
# is a secret of that environment, which only `publish` names; its public
# half is deploy/cosign.pub. A dispatch off main is a dry run: everything but
# `publish`, which it never asks to approve. Nothing here dispatches itself;
# the user runs it.
#
# `gate` runs on the hosted ubuntu-24.04 runners (4 vCPUs). A wall-clock
# budget calibrated on the 16-CPU reference host that one of them misses is
# excused exactly as in the merge gate: a recorded known gap under a row of
# scripts/proof-host-speed.tsv the base carries, never a pass and never a
# widened bound (AGENTS.md §11; docs/PROOFS.md §12). Every other failure fails
# the gate's proof. Its proof is the verdict: only a run whose release proof
# passed and verified publishes, even when an excused miss left a part red.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the tag to create, vX.Y.Z (from main it is published once the release environment approves)"
        required: true
        type: string

permissions:
  contents: read

# No workflow-level concurrency: it would be decided from the raw input before
# anything validated it. Each job below takes a group named from the version
# `validate` accepted, so two dispatches of one version run one after the
# other.

jobs:
  # First, and on every dispatch: nothing runs for a version that is not
  # vMAJOR.MINOR.PATCH.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.order.outputs.latest }}
    steps:
      - name: validate the version
        id: version
        timeout-minutes: 1
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version $VERSION is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Every tag, so the order step sees each release there is.
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
          cache: false
      - name: the catalog and the changelog name this version
        timeout-minutes: 5
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go run ./internal/dist/cmd/dist check -version "$VERSION"
          go run ./internal/dist/cmd/dist notes -version "$VERSION" >/dev/null
      # Everything a release publishes is signed, so nothing runs before the
      # key that verifies it is committed (docs/PROOFS.md §10, "Set up release
      # signing").
      - name: the release's public signing key is committed
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [ -s deploy/cosign.pub ] || { echo "deploy/cosign.pub is not committed: a release signs what it publishes; an administrator runs scripts/release-signing-setup.sh once (docs/PROOFS.md §10, \"Set up release signing\")" >&2; exit 1; }
          openssl pkey -pubin -in deploy/cosign.pub -noout -text | grep -q 'ASN1 OID: prime256v1' || { echo "deploy/cosign.pub is not an ECDSA P-256 public key" >&2; exit 1; }
      # The release is the latest unless a higher release exists, so a backport
      # never takes releases/latest/download from the newer series; one below
      # a released tag of its own series is refused here, before it is built.
      - name: the order of this release among the tags
        id: order
        timeout-minutes: 3
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag --list >"$RUNNER_TEMP/tags"
          go run ./internal/dist/cmd/dist order -version "$VERSION" -tags "$RUNNER_TEMP/tags" >>"$GITHUB_OUTPUT"

  gate:
    needs: validate
    concurrency:
      group: release-gate-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/proof.yml
    with:
      tier: release
      base: main
      int_shards: 14
      ui_shards: 5

  # What a release publishes, built and run before anything is: the binaries
  # and their archives, and every image for linux/amd64 and linux/arm64 as an
  # OCI layout. The release smoke pushes the layouts to a registry on this
  # runner and runs compose.yaml on them, by digest, end to end; the
  # quickstart smoke runs the README's Quickstart as written on a clone of
  # this commit, which builds the stack from source. Read-only: nothing leaves
  # this job but its artifact, and nothing it runs comes from a cache or a
  # floating tag.
  artifacts:
    needs: validate
    concurrency:
      group: release-artifacts-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    permissions:
      contents: read
      # Only the last step uses it, to cancel the run.
      actions: write
    # The name publish downloads, so a re-run of publish finds this upload,
    # for as long as it is kept: the approval comes within its 7 days.
    outputs:
      artifact: release-${{ needs.validate.outputs.version }}-${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
          cache: false
      # The activity images run a package manager at build time; arm64 runs it
      # under QEMU. The other images run nothing for the target platform.
      # QEMU's installer runs privileged and BuildKit builds every image, so
      # both are pinned by digest; Dependabot does not see an image named in
      # `with:`, so these are updated by hand.
      - uses: docker/setup-qemu-action@v4.4.0
        timeout-minutes: 5
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@v4.4.1
        timeout-minutes: 5
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: the binaries and their archives
        id: dist
        timeout-minutes: 20
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: make dist VERSION="$VERSION"
      - name: the images, linux/amd64 and linux/arm64
        id: images
        timeout-minutes: 90
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: make release-images VERSION="$VERSION" OUT=dist/layouts PLATFORMS=linux/amd64,linux/arm64
      # The smoke also signs each image with a throwaway key, by the cosign
      # image and flags publish signs with, and runs an Orkflow in a namespace
      # that requires that key: OrkStack's own verifier accepts what the
      # release writes.
      - name: smoke the release before anything is published
        id: smoke
        timeout-minutes: 30
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/quickstart-smoke.sh --release "$VERSION" --layouts dist/layouts
      - name: the README's Quickstart, as written, on a clone of this commit
        id: quickstart
        timeout-minutes: 40
        shell: bash
        run: scripts/quickstart-smoke.sh
      - name: the checksums, the notes and the image list
        id: meta
        timeout-minutes: 5
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/meta
          go run ./internal/dist/cmd/dist digests -layouts dist/layouts >dist/meta/images.tsv
          go run ./internal/dist/cmd/dist sums dist
          go run ./internal/dist/cmd/dist notes -version "$VERSION" >dist/meta/notes.md
          cp deploy/skopeo-image.txt dist/meta/skopeo-image.txt
          cp deploy/cosign-image.txt dist/meta/cosign-image.txt
          cp deploy/cosign.pub dist/meta/cosign.pub
      - uses: actions/upload-artifact@v7.0.2
        timeout-minutes: 30
        with:
          name: release-${{ needs.validate.outputs.version }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/meta/
            dist/layouts/
          if-no-files-found: error
          retention-days: 7
      # GitHub cancels no sibling job: a release that cannot build or smoke
      # would leave the gate running for an hour. A failure of this job's own
      # build, smoke or verification steps cancels the run. A failure in
      # checkout, a toolchain or QEMU/buildx setup, or the upload, which a
      # lost or flaky runner explains, cancels nothing: "Re-run failed jobs",
      # once the run completes, re-runs this job and what needs it, and the
      # gate is never run again for it. The gate itself cancels nothing: an
      # excused runner-size miss leaves it red while its proof passes.
      - name: cancel the run, which cannot be released
        if: ${{ failure() && (steps.dist.outcome == 'failure' || steps.images.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.quickstart.outcome == 'failure' || steps.meta.outcome == 'failure') }}
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "artifacts could not build or smoke the release: cancelling the run, so the gate stops too"
          gh run cancel "$RUN_ID" --repo "$REPO"

  # The release proof, judged by repository code before the approval is
  # asked for: a proof that does not verify never asks.
  verify:
    needs: [validate, gate, artifacts]
    # The gate's merged proof is the verdict, never the colour of the call
    # (above), and the implicit success() would skip this job on an excused
    # miss. So it runs unless cancelled, once validate and artifacts
    # succeeded and the gate named its proof, and `proofrun verify -release`
    # refuses anything but a passing release proof of this exact commit.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.artifacts.result == 'success' && needs.gate.outputs.proof_artifact != '' }}
    concurrency:
      group: release-verify-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        timeout-minutes: 3
        with:
          name: ${{ needs.gate.outputs.proof_artifact }}
          path: ${{ runner.temp }}/ci/proof
      - name: verify the release proof
        timeout-minutes: 5
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          go run ./test/tools/proofrun verify -release -tag "$VERSION" -proof "$RUNNER_TEMP/ci/proof"

  # A release is not tagged while the nightly of its commit is red
  # (AGENTS.md §11). On main only: off main a dispatch is a dry run, and no
  # nightly measures a branch's commit. It needs the gate and the artifacts
  # so that a nightly dispatched beside the release (about two hours, against
  # the gate's and the build's two to three) has finished by now; one still
  # running is waited for, up to 60 minutes. The latest completed nightly.yml
  # run on main whose head is this commit is judged by its proof.json as
  # `make merge-check NIGHTLY=` judges one, never by the proof's colour, and
  # by the jobs outside its proof.
  nightly:
    needs: [validate, gate, artifacts]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.artifacts.result == 'success' && needs.gate.outputs.proof_artifact != '' }}
    concurrency:
      group: release-nightly-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
          cache: false
      - name: fetch the nightly of this commit, waiting for one still running
        timeout-minutes: 70
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The newest nightly.yml run on main of this commit, waited for while
          # it runs: 60 polls a minute apart.
          for poll in $(seq 60) last; do
            gh run list --repo "$REPO" --workflow nightly.yml --branch main --commit "$SHA" --limit 1 --json databaseId,status --jq '.[] | [.databaseId, .status] | @tsv' >"$RUNNER_TEMP/nightly-run.tsv"
            IFS=$'\t' read -r run status <"$RUNNER_TEMP/nightly-run.tsv" || { echo "no nightly.yml run on main measured $SHA: dispatch one (gh workflow run nightly.yml --ref main), and re-run this job once it passes" >&2; exit 1; }
            [ "$status" != completed ] || break
            [ "$poll" != last ] || { echo "the nightly of $SHA ($GITHUB_SERVER_URL/$REPO/actions/runs/$run) is still $status after 60 minutes: re-run this job once it completes" >&2; exit 1; }
            echo "the nightly of $SHA ($GITHUB_SERVER_URL/$REPO/actions/runs/$run) is $status; polling again in a minute ($poll of 60)"
            sleep 60
          done
          echo "the nightly of $SHA: $GITHUB_SERVER_URL/$REPO/actions/runs/$run"
          gh run view "$run" --repo "$REPO" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv' >"$RUNNER_TEMP/nightly-jobs.tsv"
          name="$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" --jq "[.artifacts[] | select(.expired | not) | .name | select(test(\"^proof-$run-a[0-9]+\$\"))] | sort_by(ltrimstr(\"proof-$run-a\") | tonumber) | last // empty")"
          [ -n "$name" ] || { echo "the nightly run $run of $SHA kept no proof: dispatch a new one (gh workflow run nightly.yml --ref main), and re-run this job once it passes" >&2; exit 1; }
          gh run download "$run" --repo "$REPO" -n "$name" -D "$RUNNER_TEMP/nightly"
      - name: the nightly of this commit passed
        timeout-minutes: 5
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          go run ./test/tools/proofrun verify -commit "$SHA" -nightly "$RUNNER_TEMP/nightly" -nightly-jobs "$RUNNER_TEMP/nightly-jobs.tsv"

  # The release: one job, so one approval. The `release` environment asks
  # its required reviewers before the job starts; it holds the signing key
  # and deploys from main only. Then: SHA256SUMS signed, the tag, the images
  # to ghcr.io, each signed by digest, and the GitHub release with its
  # assets. It runs no repository code and checks out nothing: it holds the
  # only package write, the only contents write and the only signing key, so
  # every step is a fixed command over the artifacts job's output and the
  # gate's proof, which it checks first. Nothing leaves it, the tag
  # included, before the key has signed and verified SHA256SUMS.
  publish:
    needs: [validate, gate, artifacts, verify, nightly]
    # Named results, not the implicit success(), which would also read the
    # gate's colour (above).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.artifacts.result == 'success' && needs.verify.result == 'success' && needs.nightly.result == 'success' }}
    # The signing key's secrets live in this environment and reach no other
    # job; it deploys from main only (docs/PROOFS.md §10, "Set up release
    # signing").
    environment: release
    concurrency:
      group: release-publish-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        timeout-minutes: 15
        with:
          name: ${{ needs.artifacts.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v8.0.2
        timeout-minutes: 3
        with:
          name: ${{ needs.gate.outputs.proof_artifact }}
          path: ${{ runner.temp }}/proof
      # Everything is checked before anything is pushed: a version tag, once
      # pushed, never moves.
      - name: check what the artifacts job built
        timeout-minutes: 5
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The proof verify accepted: a passing release proof of this commit.
          proof="$RUNNER_TEMP/proof/proof.json"
          [ "$(jq -r .tier "$proof")" = release ] && [ "$(jq -r .result "$proof")" = pass ] && [ "$(jq -r .commit "$proof")" = "$SHA" ] || { echo "the gate's proof is not a passing release proof of $SHA" >&2; exit 1; }
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          # The assets released are exactly the files SHA256SUMS sums.
          printf '%s\n' *.tar.gz *.zip | sort >"$RUNNER_TEMP/assets"
          awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | sort >"$RUNNER_TEMP/summed"
          cmp -s "$RUNNER_TEMP/assets" "$RUNNER_TEMP/summed" || { echo "the release assets are not exactly the files SHA256SUMS sums" >&2; diff "$RUNNER_TEMP/assets" "$RUNNER_TEMP/summed" >&2 || true; exit 1; }
          skopeo="$(grep -v '^#' meta/skopeo-image.txt | head -1)"
          [[ "$skopeo" =~ ^quay\.io/skopeo/stable:v[0-9]+\.[0-9]+\.[0-9]+-immutable@sha256:[0-9a-f]{64}$ ]] || { echo "skopeo image: $skopeo" >&2; exit 1; }
          cosign="$(grep -v '^#' meta/cosign-image.txt | head -1)"
          [[ "$cosign" =~ ^ghcr\.io/sigstore/cosign/cosign:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]] || { echo "cosign image: $cosign" >&2; exit 1; }
          grep -q '^-----BEGIN PUBLIC KEY-----$' meta/cosign.pub || { echo "meta/cosign.pub is not a public key" >&2; exit 1; }
          dups="$(cut -f1 meta/images.tsv | sort | uniq -d)"
          [ -z "$dups" ] || { echo "listed more than once: $dups" >&2; exit 1; }
          n=0
          while IFS=$'\t' read -r name digest; do
            [[ "$name" =~ ^(ork|orker|orkctl|activity-(shell|http|file|json|git|template))$ ]] || { echo "image name: $name" >&2; exit 1; }
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest: $digest" >&2; exit 1; }
            index="layouts/$name/index.json"
            [ -f "$index" ] || { echo "no layout for $name" >&2; exit 1; }
            # The layout is the image its digest names: its index names that
            # one manifest, whose bytes hash to it and list both platforms.
            [ "$(jq -r '.manifests | length' "$index")" = 1 ] && [ "$(jq -r '.manifests[0].digest' "$index")" = "$digest" ] || { echo "$index does not name exactly $digest" >&2; exit 1; }
            blob="layouts/$name/blobs/sha256/${digest#sha256:}"
            [ "sha256:$(sha256sum <"$blob" | cut -d' ' -f1)" = "$digest" ] || { echo "$blob does not hash to $digest" >&2; exit 1; }
            platforms="$(jq -r '[.manifests[]?.platform | select(. != null) | .os + "/" + .architecture] | unique | join(",")' "$blob")"
            [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "$name is built for '$platforms', want linux/amd64 and linux/arm64" >&2; exit 1; }
            n=$((n + 1))
          done <meta/images.tsv
          [ "$n" -eq 9 ] || { echo "$n images, want 9" >&2; exit 1; }
      # Before anything is pushed: the key is present, opens with its
      # password, and is the private half of the committed deploy/cosign.pub,
      # because what it signs verifies with that file. cosign reads the key
      # from the environment (env://), so it never reaches the disk.
      - name: sign SHA256SUMS with the release key
        timeout-minutes: 5
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ] || { echo "the release environment holds no signing key and password: nothing is published unsigned (docs/PROOFS.md §10, \"Set up release signing\")" >&2; exit 1; }
          cosign="$(grep -v '^#' meta/cosign-image.txt | head -1)"
          cos() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD -v "$PWD:/release" -w /release "$cosign" "$@"; }
          cos sign-blob --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false --yes --output-signature SHA256SUMS.sig SHA256SUMS
          cos verify-blob --key meta/cosign.pub --insecure-ignore-tlog=true --signature SHA256SUMS.sig SHA256SUMS
      # The annotated tag, made through the API: this job checks out nothing.
      # A version tag never moves: creating its ref fails when it exists, and
      # one that exists is accepted only when this run made it, on this
      # commit (a re-run of this job), and refused otherwise.
      - name: tag
        timeout-minutes: 5
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ref="$(gh api "repos/$REPO/git/ref/tags/$VERSION" --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null)"; then
            IFS=$'\t' read -r type object <<<"$ref"
            [ "$type" = tag ] || { echo "$VERSION already names $type $object, not an annotated tag this run made" >&2; exit 1; }
            gh api "repos/$REPO/git/tags/$object" >"$RUNNER_TEMP/tag.json"
            [ "$(jq -r .object.sha "$RUNNER_TEMP/tag.json")" = "$SHA" ] && grep -qxF "proof: $RUN_URL" <<<"$(jq -r .message "$RUNNER_TEMP/tag.json")" || { echo "$VERSION already exists and was not created by this run on $SHA: a version tag never moves" >&2; exit 1; }
            echo "$VERSION: this run's tag on $SHA, kept"
            exit 0
          fi
          proof="$RUNNER_TEMP/proof/proof.json"
          message="$(printf 'OrkStack %s\nproof: %s\ncommit: %s\ntree: %s\nresult: %s\n' "$VERSION" "$RUN_URL" "$(jq -r .commit "$proof")" "$(jq -r .tree "$proof")" "$(jq -r .result "$proof")")"
          object="$(gh api "repos/$REPO/git/tags" -f tag="$VERSION" -f message="$message" -f object="$SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$object" >/dev/null
          echo "$VERSION: tagged $SHA"
      - name: push the images to ghcr.io, byte for byte
        timeout-minutes: 60
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          skopeo="$(grep -v '^#' meta/skopeo-image.txt | head -1)"
          umask 077
          auth="$(printf '%s:%s' "$ACTOR" "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # The credential leaves the disk however this step ends.
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >"$RUNNER_TEMP/auth.json"
          sk() { docker run --rm -v "$RUNNER_TEMP/auth.json:/auth.json:ro" -v "$PWD/layouts:/layouts:ro" "$skopeo" "$@"; }
          full="${VERSION#v}"
          minor="${full%.*}"
          while IFS=$'\t' read -r name digest; do
            ref="ghcr.io/orkstack/$name"
            # A version tag never moves: one that already holds this digest
            # (a re-run of this job) is left alone, and any other is refused.
            # An inspect that fails for any reason is taken for "absent": the
            # tag step made this version's git tag in this run, or found this
            # run's own, and refuses one any other run made, so the only image
            # this tag can hold is this run's own, and the check after the
            # copy proves it.
            if sk inspect --raw --authfile /auth.json "docker://$ref:$full" >"$RUNNER_TEMP/have.json" 2>/dev/null; then
              have="sha256:$(sha256sum <"$RUNNER_TEMP/have.json" | cut -d' ' -f1)"
              [ "$have" = "$digest" ] || { echo "$ref:$full already holds $have, not $digest" >&2; exit 1; }
            else
              sk copy --all --preserve-digests --dest-authfile /auth.json "oci:/layouts/$name" "docker://$ref:$full"
            fi
            sk copy --all --preserve-digests --dest-authfile /auth.json --src-authfile /auth.json "docker://$ref:$full" "docker://$ref:$minor"
            for tag in "$full" "$minor"; do
              sk inspect --raw --authfile /auth.json "docker://$ref:$tag" >"$RUNNER_TEMP/got.json"
              got="sha256:$(sha256sum <"$RUNNER_TEMP/got.json" | cut -d' ' -f1)"
              [ "$got" = "$digest" ] || { echo "$ref:$tag is $got, want $digest" >&2; exit 1; }
            done
            echo "$ref:$full and :$minor = $digest"
          done <meta/images.tsv
      # Each image's index digest, signed in the layout OrkStack's verifier
      # reads: a cosign signature manifest at sha256-<hex>.sig in the same
      # repository (docs/DEPLOY.md, "Image supply-chain policy"). The flags
      # make cosign 3 write that layout and nothing else, exactly as the
      # release smoke signed and ran it, and record nothing in a public
      # transparency log: the committed key is the trust root.
      - name: sign each image by digest and verify the signature
        timeout-minutes: 30
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ] || { echo "the release environment holds no signing key and password" >&2; exit 1; }
          skopeo="$(grep -v '^#' meta/skopeo-image.txt | head -1)"
          cosign="$(grep -v '^#' meta/cosign-image.txt | head -1)"
          umask 077
          auth="$(printf '%s:%s' "$ACTOR" "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # The credential leaves the disk however this step ends.
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >"$RUNNER_TEMP/auth.json"
          sk() { docker run --rm -v "$RUNNER_TEMP/auth.json:/auth.json:ro" "$skopeo" "$@"; }
          cos() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/docker -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD -v "$RUNNER_TEMP/auth.json:/docker/config.json:ro" -v "$PWD/meta:/meta:ro" "$cosign" "$@"; }
          while IFS=$'\t' read -r name digest; do
            ref="ghcr.io/orkstack/$name@$digest"
            # A re-run of this job finds the signature it wrote and adds none.
            if ! cos verify --key /meta/cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null 2>&1; then
              cos sign --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false --yes "$ref"
            fi
            cos verify --key /meta/cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null
            # cosign verify also reads the new bundle format; OrkStack reads
            # only the .sig tag, so that is checked as such.
            sig="ghcr.io/orkstack/$name:sha256-${digest#sha256:}.sig"
            sk inspect --raw --authfile /auth.json "docker://$sig" >"$RUNNER_TEMP/sig.json"
            jq -e '[.layers[]? | select(.mediaType == "application/vnd.dev.cosign.simplesigning.v1+json" and (.annotations["dev.cosignproject.cosign/signature"] // "") != "")] | length > 0' "$RUNNER_TEMP/sig.json" >/dev/null || { echo "$sig holds no cosign simple-signing signature" >&2; exit 1; }
            echo "$ref signed: $sig"
          done <meta/images.tsv
      - name: create the GitHub release
        timeout-minutes: 10
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ github.repository }}
          LATEST: ${{ needs.validate.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          gh release create "$VERSION" --repo "$REPO" --verify-tag --latest="$LATEST" \
            --title "OrkStack $VERSION" --notes-file meta/notes.md \
            ./*.tar.gz ./*.zip SHA256SUMS SHA256SUMS.sig meta/cosign.pub
