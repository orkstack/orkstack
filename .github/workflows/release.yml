name: release

# The pre-release gate. `gate` runs the release tier: every gate, the scale
# and soak tests included, observability always. `tag` creates the release tag
# only after `proofrun verify -release` accepts that proof for the exact
# commit. Nothing here dispatches itself; the user runs it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the tag to create, vX.Y.Z"
        required: true
        type: string
      tag:
        description: "create and push the tag after the gate passes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/proof.yml
    with:
      tier: release
      base: main
      int_shards: 14
      ui_shards: 5

  tag:
    needs: gate
    if: ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - uses: actions/download-artifact@v8
        timeout-minutes: 3
        with:
          name: proof-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci/proof
      - name: validate the version
        timeout-minutes: 1
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version $VERSION is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: verify the release proof
        timeout-minutes: 5
        shell: bash
        run: |
          go run ./test/tools/proofrun verify -release -tag "${{ inputs.version }}" -proof "$RUNNER_TEMP/ci/proof"
      - name: tag
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          commit="$(jq -r .commit "$RUNNER_TEMP/ci/proof/proof.json")"
          tree="$(jq -r .tree "$RUNNER_TEMP/ci/proof/proof.json")"
          result="$(jq -r .result "$RUNNER_TEMP/ci/proof/proof.json")"
          git tag -a "${{ inputs.version }}" -m "OrkStack ${{ inputs.version }}
          proof: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit: $commit
          tree: $tree
          result: $result"
          git push origin "${{ inputs.version }}"
