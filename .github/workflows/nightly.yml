name: nightly

# The nightly tier: the scale and soak tests a merge proof defers, and two
# lanes of its own, the race repeat and the fuzz lane; the vulnerability
# scan, which needs the network and so is in no proof; and the README's
# Quickstart on a clone of main, which no proof runs. A red
# nightly is a regression on main: fixing it, or reverting what broke it, is
# the next work, but it holds no other merge; the pre-release gate, which runs
# every deferred test, holds the release. (docs/PROOFS.md; AGENTS.md §11.)
#
# Scheduled workflows run only from the default branch, and GitHub disables
# them after 60 days without repository activity: `make github-merge-gate`
# reports that, and `gh workflow enable nightly.yml` fixes it.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz_budget:
        description: the fuzz lane's whole time, shared by its Fuzz targets (105m; no more than 120m, because the lane's step is limited to 135m)
        default: 105m

permissions:
  contents: read

jobs:
  nightly:
    # A private repository spends none of its metered minutes on a schedule.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/proof.yml
    with:
      tier: nightly
      base: main
      int_shards: 4
      ui_shards: 1
      fuzz_budget: ${{ inputs.fuzz_budget || '105m' }}

  vuln:
    # govulncheck (`make vuln`), which reports only advisories whose vulnerable
    # symbols the code can reach. A new one makes the nightly red, like any
    # other nightly regression: the fix is to bump the module to the version
    # the report names. It reads the vulnerability database over the network,
    # which is why it is here and in ci.yml and in no proof.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: vuln
        timeout-minutes: 10
        run: make vuln

  quickstart:
    # The getting-started path, end to end: the README's Quickstart as
    # written, on a clone of this commit, where the root compose.yaml builds
    # the stack from source (`make quickstart-smoke`). No proof runs it, and
    # release.yml runs it only before a release, so without this job a gap in
    # deploy/source/Dockerfile.dockerignore, a break in that Dockerfile's
    # build or a compose key this runner's Compose refuses would reach every
    # new user until then. It runs beside the proof, whatever its result, and
    # needs only what the runner image has: Docker with Compose, git, curl
    # and python3.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: the README's Quickstart, as written, on a clone of this commit
        # release.yml's limit for the same step: a cold build of the stack on
        # a 4-vCPU runner, where 5 minutes was measured cold on 16 CPUs.
        timeout-minutes: 40
        shell: bash
        run: scripts/quickstart-smoke.sh

  flakes:
    # The flake budget's evidence (docs/PROOFS.md §6.1): same-tree flips and
    # suspect failures across the last 30 days of proofs. It never edits a
    # list; it reports. It waits for `nightly`, whatever its result, so the
    # window it reads includes tonight's proof; a red nightly is evidence too.
    needs: nightly
    if: ${{ always() && (github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: download the proofs of the last 30 days
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci/flakes" "$RUNNER_TEMP/ci/zips"
          since="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.created_at >= \"$since\") | select(.name | startswith(\"proof-\")) | \"\(.id) \(.name)\"" |
          while read -r id name; do
            [ -n "$id" ] || continue
            mkdir -p "$RUNNER_TEMP/ci/flakes/$name"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$RUNNER_TEMP/ci/zips/$name.zip" || continue
            unzip -qo "$RUNNER_TEMP/ci/zips/$name.zip" -d "$RUNNER_TEMP/ci/flakes/$name" || true
          done
      - name: flakes
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          go run ./test/tools/proofrun flakes -from "$RUNNER_TEMP/ci/flakes/*" -repo . \
            -out "$RUNNER_TEMP/ci/flakes.tsv" -md "$RUNNER_TEMP/ci/flakes.md"
          cat "$RUNNER_TEMP/ci/flakes.md" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        timeout-minutes: 5
        with:
          name: flakes-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci/flakes.tsv
            ${{ runner.temp }}/ci/flakes.md
          retention-days: 30
