name: nightly

# The nightly tier: the scale and soak tests a merge proof defers. A red
# nightly is a failing main — fix or revert before anything else merges.
# (docs/PROOFS.md; AGENTS.md §11.2.)
#
# Scheduled workflows run only from the default branch, and GitHub disables
# them after 60 days without repository activity: `make github-merge-gate`
# reports that, and `gh workflow enable nightly.yml` fixes it.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    # A private repository spends none of its metered minutes on a schedule.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/proof.yml
    with:
      tier: nightly
      base: main
      int_shards: 4
      ui_shards: 1

  flakes:
    # The flake budget's evidence (docs/PROOFS.md §6.1): same-tree flips and
    # suspect failures across the last 30 days of proofs. It never edits a
    # list; it reports.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: "1.27.x"
      - name: download the proofs of the last 30 days
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci/flakes" "$RUNNER_TEMP/ci/zips"
          since="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.created_at >= \"$since\") | select(.name | startswith(\"proof-\")) | \"\(.id) \(.name)\"" |
          while read -r id name; do
            [ -n "$id" ] || continue
            mkdir -p "$RUNNER_TEMP/ci/flakes/$name"
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" >"$RUNNER_TEMP/ci/zips/$name.zip" || continue
            unzip -qo "$RUNNER_TEMP/ci/zips/$name.zip" -d "$RUNNER_TEMP/ci/flakes/$name" || true
          done
      - name: flakes
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          go run ./test/tools/proofrun flakes -from "$RUNNER_TEMP/ci/flakes/*" -repo . \
            -out "$RUNNER_TEMP/ci/flakes.tsv" -md "$RUNNER_TEMP/ci/flakes.md"
          cat "$RUNNER_TEMP/ci/flakes.md" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: flakes-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci/flakes.tsv
            ${{ runner.temp }}/ci/flakes.md
          retention-days: 30
