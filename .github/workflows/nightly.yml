name: nightly

# The nightly tier: the scale and soak tests a merge proof defers, and two
# lanes of its own, the race repeat and the fuzz lane; the vulnerability
# scan of the Go module, the JavaScript dependencies and the release images,
# which needs the network and so is in no proof; every published release's
# notes against its CHANGELOG.md section, which reads GitHub and so is in no
# proof either; the README's Quickstart on a
# clone of main, which no proof runs; and every shipped example on that
# quickstart, which reaches third parties and so holds no release. A red
# nightly is a regression on main: fixing it, or reverting what broke it, is
# the next work, but it holds no other merge; the pre-release gate, which runs
# every deferred test, holds the release. (docs/PROOFS.md; AGENTS.md §11.)
#
# Scheduled workflows run only from the default branch, and GitHub disables
# them after 60 days without repository activity: `make github-merge-gate`
# reports that, and `gh workflow enable nightly.yml` fixes it.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz_budget:
        description: the fuzz lane's whole time, shared by its Fuzz targets (130m; no more than 130m, because the lane's step is limited to 145m)
        default: 130m

permissions:
  contents: read

jobs:
  nightly:
    # A private repository spends none of its metered minutes on a schedule.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    # actions: write because proof.yml's cancel job may cancel the run, and a
    # called workflow's job never gets more than its caller grants: GitHub
    # refuses to start one that asks for more. The nightly tier skips fast.
    permissions:
      contents: read
      actions: write
      checks: read
    uses: ./.github/workflows/proof.yml
    with:
      tier: nightly
      base: main
      int_shards: 4
      ui_shards: 1
      fuzz_budget: ${{ inputs.fuzz_budget || '130m' }}

  vuln:
    # govulncheck (`make vuln`), which reports only advisories whose vulnerable
    # symbols the code can reach. A new one makes the nightly red, like any
    # other nightly regression: the fix is to bump the module to the version
    # the report names. It reads the vulnerability database over the network,
    # which is why it is here and in ci.yml and in no proof.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: vuln
        timeout-minutes: 10
        run: make vuln

  vuln-js:
    # bun audit (`make vuln-js`) over the UI's and the site's lockfiles, which
    # installs nothing: every advisory is listed, and one of high or critical
    # severity makes the nightly red, like `vuln`; the fix is the version
    # `bun audit fix` names. It reads the npm advisory database over the
    # network, which is why it is here and in no proof.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          bun-version: "1.4.4"
      - name: vuln-js
        timeout-minutes: 5
        run: make vuln-js

  vuln-images:
    # The images a release of this commit publishes (ork, orker, orkctl and
    # every activity), built for linux/amd64 as release.yml builds them and
    # scanned by the pinned Grype (`make vuln-images`, deploy/grype.yaml): a
    # vulnerability with a fix, of high or critical severity, in an image's OS
    # packages or a third-party binary it carries makes the nightly red, like
    # `vuln`; OrkStack's own Go code is `vuln`'s. It reads Grype's database
    # over the network, which is why it is here and in no proof.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      # The OCI layouts make release-images writes need a BuildKit builder:
      # release.yml's, pinned by digest (Dependabot does not see an image in
      # `with:`; keep the two equal by hand).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 3
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: vuln-images
        timeout-minutes: 60
        run: make vuln-images

  release-notes:
    # Every published release's notes, above its image footer, against its
    # section of this commit's CHANGELOG.md (`make release-notes-check`): a
    # release body edited by hand, or a released section edited without a
    # republish, makes the nightly red, naming the version and the first line
    # that differs; the fix is `make release-notes-publish VERSION=vX.Y.Z`
    # (docs/PROOFS.md §10). It reads the releases over the network, which is
    # why it is here and in no proof.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.3"
      - name: release-notes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ORK_RELEASE_REPO: ${{ github.repository }}
        run: make release-notes-check

  quickstart:
    # The getting-started path, end to end: the README's Quickstart as
    # written, on a clone of this commit, where the root compose.yaml builds
    # the stack from source (`make quickstart-smoke`). No proof runs it, and
    # release.yml runs it only before a release, so without this job a gap in
    # deploy/source/Dockerfile.dockerignore, a break in that Dockerfile's
    # build or a compose key this runner's Compose refuses would reach every
    # new user until then. It runs beside the proof, whatever its result, and
    # needs only what the runner image has: Docker with Compose, git, curl
    # and python3.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: the README's Quickstart, as written, on a clone of this commit
        # release.yml's limit for the same step: a cold build of the stack on
        # a 4-vCPU runner, where 5 minutes was measured cold on 16 CPUs.
        timeout-minutes: 40
        shell: bash
        run: scripts/quickstart-smoke.sh

  examples:
    # Every shipped example, as a reader runs it on a fresh quickstart: applied,
    # submitted with no inputs, ending where examples/README.md says (`make
    # examples-smoke`). They reach httpbin.org and github.com, so no proof runs
    # this, and release.yml does not require it: a third party's outage must
    # not hold a release. Its log names the example, the run and what ended
    # differently. It runs beside the proof, whatever its result, and needs only
    # what the runner image has: Docker with Compose, git, curl and python3.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: every shipped example with no inputs, on a fresh quickstart
        # The Quickstart's own limit, for its cold build, and a few minutes more.
        timeout-minutes: 45
        shell: bash
        run: scripts/quickstart-smoke.sh --examples
