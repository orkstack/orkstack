name: ci

# The fast contributor path. No required check lives here; the merge gate is `proof.yml`'s `proof` job (docs/PROOFS.md).
#
#   check    build, vet, lint (gofmt and staticcheck included), the unit
#            suites with -short, and the UI's type-check and unit suite: no
#            Docker, under two minutes warm; cold, 377 s was measured at four
#            CPUs before staticcheck joined lint, and about twice that is
#            estimated at two (docs/PROOFS.md §11.5).
#   vuln     govulncheck over the module: the one job that needs the network
#            (vuln.go.dev), so it is a job of its own and in no proof.
#   proto    buf breaking: the proto contract against the first release,
#            v0.1.0 (make proto-breaking), with the buf deploy/buf-image.txt
#            pins.

on:
  # `check` runs on every push and every pull request. A Dependabot branch
  # runs only as its pull request, never again as a push.
  push:
    branches-ignore:
      - dependabot/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 51
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.4"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: "26.12.0"
      - name: check
        # Cold, two vCPUs: estimated at about 750 s before staticcheck, which
        # adds 6.6 CPU-minutes on a build cache that vet has warmed
        # (docs/PROOFS.md §11.5), about four minutes on two vCPUs: 30 minutes
        # is a margin of about 1.6.
        timeout-minutes: 30
        # Pointing DOCKER_HOST at nothing proves the fast path needs no Docker.
        run: DOCKER_HOST=unix:///nonexistent make check

  vuln:
    # govulncheck reads the vulnerability database over the network, so it is
    # never part of `make lint` or a proof: an outage must not fail a merge
    # gate. A reachable advisory fails this job; fix it by bumping the module
    # to the version the report names. The nightly workflow runs it too.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.4"
      - name: vuln
        timeout-minutes: 10
        run: make vuln

  proto:
    # Every tag is fetched, so the tree of the release compared with is
    # there; buf itself runs with no network.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: proto-breaking
        timeout-minutes: 10
        run: make proto-breaking
