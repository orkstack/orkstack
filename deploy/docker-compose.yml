# OrkStack local infrastructure: Temporal dev-server, MinIO (S3) and a
# registry. The application processes (ork, orker, ui) are not containers here;
# `make up` (scripts/stack.sh) starts them on the host against this stack, or
# run them by hand with `make run-ork`, `make run-orker`, `bun dev`.
#
# Usage: docker compose -f deploy/docker-compose.yml up -d  (or `make infra-up`)
#
# EVERY TAG HERE IS PINNED, and that is a correctness requirement rather than
# a style preference (§4.6). The durable commit protocol depends on behaviour
# that changed INSIDE these images:
#
#   minio/minio       conditional PutObject (If-None-Match: *) is the
#                     arbitration point of the whole commit protocol (§5.3).
#                     It has existed since RELEASE.2023-02-17T17-52-43Z, so a
#                     floating tag that rolled BACKWARDS past that point would
#                     turn create-if-absent into a silent overwrite — which is
#                     the one failure §5 exists to prevent.
#   temporalio/temporal
#                     workflow versioning and replay behaviour.
#
# A floating `:latest` makes the infrastructure a variable in every durability
# test, and reliability is the product (AGENTS.md §11).
name: orkstack

services:
  temporal:
    image: temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-port
      - "8233"
      - --log-level
      - warn
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Temporal Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orkstack
      MINIO_ROOT_PASSWORD: orkstack-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the default artifact bucket on startup, then exits.
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 orkstack orkstack-secret) do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/orkstack-artifacts;
      mc anonymous set download local/orkstack-artifacts;
      echo 'bucket ready';
      "

  # The local registry (§4.6). It exists because there is no such thing as an
  # unpushed image in this design: a locally built, never-pushed image has NO
  # registry manifest digest — a local image ID is not a manifest digest and
  # does not transfer to a second Orker — so nothing could pin it.
  #
  # `make -C images push` publishes the three first-party activities here and
  # prints their index digests, which is what makes `make up` produce REAL
  # digests with no network at all.
  #
  # Port 5001, not 5000: macOS binds 5000 to AirPlay Receiver by default.
  registry:
    image: registry:3
    ports:
      - "5001:5000"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
  registry-data:
