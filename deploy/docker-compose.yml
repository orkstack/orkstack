# OrkStack local infrastructure: Temporal dev-server + MinIO (S3).
# Application services (ork, orker, ui) are added in milestone M6; during
# development run them with `make run-ork`, `make run-orker`, `bun dev`.
#
# Usage: docker compose -f deploy/docker-compose.yml up -d
name: orkstack

services:
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-port
      - "8233"
      - --log-level
      - warn
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Temporal Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orkstack
      MINIO_ROOT_PASSWORD: orkstack-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the default artifact bucket on startup, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 orkstack orkstack-secret) do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/orkstack-artifacts;
      mc anonymous set download local/orkstack-artifacts;
      echo 'bucket ready';
      "

volumes:
  minio-data:
