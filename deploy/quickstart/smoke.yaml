# The release smoke's override of compose.yaml (scripts/release-smoke.sh); never
# part of the quickstart bundle.
#
# The smoke cannot pull from ghcr.io, because nothing is published yet, so a
# registry of its own holds every image. The one address the host's Docker
# daemon (which pulls the images, the activities included) and the engine's
# resolver (which pins them at apply time) both reach is loopback: the
# registry is published on the host's 127.0.0.1, and a forwarder inside the
# engine's own network namespace serves the same port on its 127.0.0.1.
services:
  registry:
    image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    ports:
      - "127.0.0.1:${SMOKE_REGISTRY_PORT:?}:5000"

  registry-forward:
    image: alpine/socat:1.8.1.3@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
    network_mode: service:ork
    command: ["TCP4-LISTEN:${SMOKE_REGISTRY_PORT:?},bind=127.0.0.1,fork,reuseaddr", "TCP:registry:5000"]
    depends_on:
      - registry
      - ork
