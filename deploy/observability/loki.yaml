# Minimal single-binary Loki config for the `observability` compose profile.
# Filesystem storage, in-memory ring, no auth — a laptop stack, not a
# production backend. Loki 3.x accepts OTLP logs on /otlp/v1/logs with no
# extra config; that is the endpoint the Collector's otlphttp/loki exporter
# and OTEL_EXPORTER_OTLP_LOGS_ENDPOINT (pointed straight at Loki) both use.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
