# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
evaluation_interval: 5m
tests:
- name: 'ork:runs_failure_ratio:rate15m: a quarter failed'
  interval: 1m
  input_series:
  - series: ork_runs_total{ork_namespace="n",status="failed",ork_deployment="d"}
    values: 0+1x30
  - series: ork_runs_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+3x30
  promql_expr_test:
  - expr: ork:runs_failure_ratio:rate15m
    eval_time: 20m
    exp_samples:
    - labels: ork:runs_failure_ratio:rate15m{ork_deployment="d",ork_namespace="n"}
      value: 0.25
- name: 'ork:runs_failure_ratio:rate15m: none failed'
  interval: 1m
  input_series:
  - series: ork_runs_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+3x30
  promql_expr_test:
  - expr: ork:runs_failure_ratio:rate15m
    eval_time: 20m
    exp_samples:
    - labels: ork:runs_failure_ratio:rate15m{ork_deployment="d",ork_namespace="n"}
      value: 0
