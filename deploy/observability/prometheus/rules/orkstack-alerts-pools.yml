# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-pools
  rules:
  - alert: OrkStackPoolBacklogNoOrkers
    expr: (((max by (ork_deployment, ork_pool) (max_over_time(ork_pool_backlog_tasks[30m])) > 0) and on (ork_deployment, ork_pool) ((max by (ork_deployment, ork_pool) (deriv(ork_pool_backlog_tasks[15m])) > 0) or (max by (ork_deployment, ork_pool) (max_over_time(ork_pool_backlog_age_seconds[30m])) > 600))) unless on (ork_deployment, ork_pool) (max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0)) unless on (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool, ork_orker_id) (ork_orker_present)) > 0)
    for: 10m
    labels:
      component: pools
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" has tasks waiting and growing, and no Orker polls it or exports metrics for it.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbacklognoorkers
      summary: A pool has a backlog and no Orkers.
  - alert: OrkStackPoolNotPolling
    expr: (((max by (ork_deployment, ork_pool) (max_over_time(ork_pool_backlog_tasks[30m])) > 0) and on (ork_deployment, ork_pool) ((max by (ork_deployment, ork_pool) (deriv(ork_pool_backlog_tasks[15m])) > 0) or (max by (ork_deployment, ork_pool) (max_over_time(ork_pool_backlog_age_seconds[30m])) > 600))) unless on (ork_deployment, ork_pool) (max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0)) and on (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool, ork_orker_id) (ork_orker_present)) > 0)
    for: 15m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" has tasks waiting and growing; its Orkers export metrics but none polls the pool.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolnotpolling
      summary: A pool's Orkers are not taking its backlog.
  - alert: OrkStackPoolLostAllOrkers
    expr: (max by (ork_deployment, ork_pool) (max_over_time(ork_pool_pollers[15m] offset 15m)) > 0 or count by (ork_deployment, ork_pool) (max_over_time(ork_orker_present[15m] offset 15m)) > 0) unless on (ork_deployment, ork_pool) (max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0 or count by (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool, ork_orker_id) (ork_orker_present)) > 0)
    for: 5m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" had Orkers polling or exporting 15 minutes ago and has none now.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoollostallorkers
      summary: A pool lost every Orker.
  - alert: OrkStackOrkersNotExporting
    expr: (max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0) unless on (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool, ork_orker_id) (ork_orker_present)) > 0)
    for: 15m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" has pollers, but no Orker of it exports metrics.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkersnotexporting
      summary: A pool's Orkers poll but report no metrics.
  - alert: OrkStackPoolBacklogGrowing
    expr: ((max by (ork_deployment, ork_pool) (deriv(ork_pool_backlog_tasks[30m])) > 0 and on (ork_deployment, ork_pool) max by (ork_deployment, ork_pool) (ork_pool_backlog_age_seconds) > 900) or max by (ork_deployment, ork_pool) (min_over_time(ork_pool_backlog_age_seconds[30m])) > 900) and on (ork_deployment, ork_pool) max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0
    for: 30m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" has pollers, yet its backlog has grown for 30 minutes with its oldest task waiting over 15 minutes, or its oldest task has not cleared for 30 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbackloggrowing
      summary: A pool's backlog keeps growing while it has pollers.
  - alert: OrkStackPoolBacklogUnmeasured
    expr: (max by (ork_deployment, ork_pool) (ork_pool_pollers) > 0 or count by (ork_deployment, ork_pool) (count by (ork_deployment, ork_pool, ork_orker_id) (ork_orker_present)) > 0) unless on (ork_deployment, ork_pool) max by (ork_deployment, ork_pool) (max_over_time(ork_pool_backlog_tasks[15m]))
    for: 15m
    labels:
      component: pools
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Pool "{{ $labels.ork_pool }}" has Orkers, but no engine has reported its backlog for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbacklogunmeasured
      summary: A pool's backlog is not measured.
  - alert: OrkStackOrkerStoreOutage
    expr: max by (ork_deployment, ork_orker_id) (ork_orker_store_outage_active) == 1
    for: 2m
    labels:
      component: pools
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: Orker "{{ $labels.ork_orker_id }}" has failed its object-storage checks and cordoned itself.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkerstoreoutage
      summary: An Orker cannot reach object storage.
  - alert: OrkStackOrkerCordonedLong
    expr: max by (ork_deployment, ork_orker_id, ork_pool) (ork_orker_cordoned{ork_cordon_cause="operator"}) == 1
    for: 6h
    labels:
      component: pools
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Orker "{{ $labels.ork_orker_id }}" of pool "{{ $labels.ork_pool }}" has been cordoned by an operator for 6 hours.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkercordonedlong
      summary: An Orker has been cordoned by an operator for 6 hours.
  - alert: OrkStackOrkerSaturated
    expr: max by (ork_deployment, ork_orker_id, ork_pool) (ork_orker_running_tasks) >= max by (ork_deployment, ork_orker_id, ork_pool) (ork_orker_max_concurrent > 0)
    for: 30m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Orker "{{ $labels.ork_orker_id }}" of pool "{{ $labels.ork_pool }}" has run as many tasks as its max_concurrent for 30 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkersaturated
      summary: An Orker has run at its task limit for 30 minutes.
  - alert: OrkStackTasksWaiting
    expr: histogram_quantile(0.95, sum by (ork_deployment, ork_pool, le) (rate(ork_deployment_orker_task_wait_duration_seconds_bucket[15m]))) > 300
    for: 15m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The 95th percentile of how long a task of pool "{{ $labels.ork_pool }}" waited for an Orker to begin it has been over 5 minutes for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktaskswaiting
      summary: Tasks wait over 5 minutes for an Orker.
  - alert: OrkStackHeartbeatLosses
    expr: sum by (ork_deployment, ork_pool) (((ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST"} - last_over_time(ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST"}[1d] offset 15m)) > 0) or ((ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST"} unless last_over_time(ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST"}[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Attempts of pool "{{ $labels.ork_pool }}" ended because their Orker could not heartbeat Temporal for the heartbeat timeout.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackheartbeatlosses
      summary: An Orker lost its heartbeat to Temporal.
  - alert: OrkStackOOMKills
    expr: sum by (ork_deployment, ork_pool) (((ork_deployment_orker_task_oom_kills_total - last_over_time(ork_deployment_orker_task_oom_kills_total[1d] offset 1h)) > 0) or ((ork_deployment_orker_task_oom_kills_total unless last_over_time(ork_deployment_orker_task_oom_kills_total[1d] offset 1h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 1h)) > 0))) > 0
    labels:
      component: pools
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: A container of pool "{{ $labels.ork_pool }}" was stopped at its memory limit in the last hour.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackoomkills
      summary: A task's container was stopped at its memory limit.
  - alert: OrkStackUsageMostlyUnmeasured
    expr: sum by (ork_deployment) (rate(ork_deployment_orker_task_usage_unmeasured_total{ork_unmeasured_reason!="NOT_RUN"}[6h])) / sum by (ork_deployment) (rate(ork_deployment_orker_tasks_total{outcome!="adopted"}[6h])) > 0.5
    for: 6h
    labels:
      component: pools
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Over half the attempts that ran a container in the last 6 hours have no measured CPU and memory.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackusagemostlyunmeasured
      summary: Most attempts' CPU and memory are not measured.
  - alert: OrkStackAttemptRecordsFailing
    expr: sum by (ork_deployment, ork_pool) (rate(ork_orker_attempt_records_total{outcome="failed"}[15m])) > 0
    for: 15m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Orkers of pool "{{ $labels.ork_pool }}" have failed to write attempt records to object storage for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackattemptrecordsfailing
      summary: Orkers fail to write attempt records.
  - alert: OrkStackMemoWritesFailing
    expr: sum by (ork_deployment, ork_pool) (rate(ork_deployment_orker_memo_writes_total{outcome="failed"}[15m])) > 0
    for: 15m
    labels:
      component: pools
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Orkers of pool "{{ $labels.ork_pool }}" have failed to write cached tasks' memos for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmemowritesfailing
      summary: Cached tasks' memos are not being written.
