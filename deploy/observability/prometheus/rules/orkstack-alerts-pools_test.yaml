# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-pools.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-pools
tests:
- name: 'OrkStackPoolBacklogNoOrkers: pollers absent'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolBacklogNoOrkers
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has tasks waiting and growing, and no Orker polls it or exports metrics for it.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbacklognoorkers
        summary: A pool has a backlog and no Orkers.
- name: 'OrkStackPoolBacklogNoOrkers: pollers 0'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: '0x120'
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolBacklogNoOrkers
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has tasks waiting and growing, and no Orker polls it or exports metrics for it.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbacklognoorkers
        summary: A pool has a backlog and no Orkers.
- name: 'OrkStackPoolBacklogNoOrkers: backlog 0'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: '0x120'
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: '0x120'
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolBacklogNoOrkers
    exp_alerts: []
- name: 'OrkStackPoolBacklogNoOrkers: pollers present'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x120
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolBacklogNoOrkers
    exp_alerts: []
- name: 'OrkStackPoolBacklogNoOrkers: Orkers present but not polling'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x120
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolBacklogNoOrkers
    exp_alerts: []
  - eval_time: 50m
    alertname: OrkStackPoolNotPolling
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has tasks waiting and growing; its Orkers export metrics but none polls the pool.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolnotpolling
        summary: A pool's Orkers are not taking its backlog.
- name: 'OrkStackPoolNotPolling: saturated or cordoned pool'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x120
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolNotPolling
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has tasks waiting and growing; its Orkers export metrics but none polls the pool.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolnotpolling
        summary: A pool's Orkers are not taking its backlog.
- name: 'OrkStackPoolNotPolling: pollers present'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 1x120
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackPoolNotPolling
    exp_alerts: []
- name: 'OrkStackPoolLostAllOrkers: both drop'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x30 0x90
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x30
  alert_rule_test:
  - eval_time: 45m
    alertname: OrkStackPoolLostAllOrkers
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" had Orkers polling or exporting 15 minutes ago and has none now.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoollostallorkers
        summary: A pool lost every Orker.
- name: 'OrkStackPoolLostAllOrkers: still polling'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x120
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x120
  alert_rule_test:
  - eval_time: 45m
    alertname: OrkStackPoolLostAllOrkers
    exp_alerts: []
- name: 'OrkStackOrkersNotExporting: pollers without metrics'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x60
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackOrkersNotExporting
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has pollers, but no Orker of it exports metrics.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkersnotexporting
        summary: A pool's Orkers poll but report no metrics.
- name: 'OrkStackOrkersNotExporting: exporting'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x60
  - series: ork_orker_present{ork_pool="p",ork_orker_id="o1",ork_deployment="d"}
    values: 1x120
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackOrkersNotExporting
    exp_alerts: []
- name: 'OrkStackPoolBacklogGrowing: growing backlog'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 0+1x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 0+60x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x120
  alert_rule_test:
  - eval_time: 100m
    alertname: OrkStackPoolBacklogGrowing
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has pollers, yet its backlog has grown for 30 minutes with its oldest task waiting over 15 minutes, or its oldest task has not cleared for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbackloggrowing
        summary: A pool's backlog keeps growing while it has pollers.
- name: 'OrkStackPoolBacklogGrowing: one stuck task'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 5x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 1000+60x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x120
  alert_rule_test:
  - eval_time: 100m
    alertname: OrkStackPoolBacklogGrowing
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has pollers, yet its backlog has grown for 30 minutes with its oldest task waiting over 15 minutes, or its oldest task has not cleared for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbackloggrowing
        summary: A pool's backlog keeps growing while it has pollers.
- name: 'OrkStackPoolBacklogGrowing: moving backlog'
  interval: 1m
  input_series:
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: 5x120
  - series: ork_pool_backlog_age_seconds{ork_pool="p",ork_deployment="d"}
    values: 100x120
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x120
  alert_rule_test:
  - eval_time: 100m
    alertname: OrkStackPoolBacklogGrowing
    exp_alerts: []
- name: 'OrkStackPoolBacklogUnmeasured: no backlog series'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x60
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackPoolBacklogUnmeasured
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Pool "p" has Orkers, but no engine has reported its backlog for 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackpoolbacklogunmeasured
        summary: A pool's backlog is not measured.
- name: 'OrkStackPoolBacklogUnmeasured: measured'
  interval: 1m
  input_series:
  - series: ork_pool_pollers{ork_pool="p",ork_deployment="d"}
    values: 2x60
  - series: ork_pool_backlog_tasks{ork_pool="p",ork_deployment="d"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackPoolBacklogUnmeasured
    exp_alerts: []
- name: 'OrkStackOrkerStoreOutage: in outage'
  interval: 1m
  input_series:
  - series: ork_orker_store_outage_active{ork_orker_id="o1",ork_deployment="d"}
    values: 1x10
  alert_rule_test:
  - eval_time: 8m
    alertname: OrkStackOrkerStoreOutage
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_orker_id: o1
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: Orker "o1" has failed its object-storage checks and cordoned itself.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkerstoreoutage
        summary: An Orker cannot reach object storage.
- name: 'OrkStackOrkerStoreOutage: healthy'
  interval: 1m
  input_series:
  - series: ork_orker_store_outage_active{ork_orker_id="o1",ork_deployment="d"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 8m
    alertname: OrkStackOrkerStoreOutage
    exp_alerts: []
- name: 'OrkStackOrkerCordonedLong: cordoned 7 hours'
  interval: 5m
  input_series:
  - series: ork_orker_cordoned{ork_orker_id="o1",ork_pool="p",ork_cordon_cause="operator",ork_deployment="d"}
    values: 1x100
  alert_rule_test:
  - eval_time: 7h
    alertname: OrkStackOrkerCordonedLong
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_orker_id: o1
        ork_pool: p
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Orker "o1" of pool "p" has been cordoned by an operator for 6 hours.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkercordonedlong
        summary: An Orker has been cordoned by an operator for 6 hours.
- name: 'OrkStackOrkerCordonedLong: stopping is not an operator''s cordon'
  interval: 5m
  input_series:
  - series: ork_orker_cordoned{ork_orker_id="o1",ork_pool="p",ork_cordon_cause="operator",ork_deployment="d"}
    values: '0x100'
  - series: ork_orker_cordoned{ork_orker_id="o1",ork_pool="p",ork_cordon_cause="stopping",ork_deployment="d"}
    values: 1x100
  alert_rule_test:
  - eval_time: 7h
    alertname: OrkStackOrkerCordonedLong
    exp_alerts: []
- name: 'OrkStackOrkerSaturated: full'
  interval: 1m
  input_series:
  - series: ork_orker_running_tasks{ork_orker_id="o1",ork_pool="p",ork_deployment="d"}
    values: 4x60
  - series: ork_orker_max_concurrent{ork_orker_id="o1",ork_pool="p",ork_deployment="d"}
    values: 4x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackOrkerSaturated
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_orker_id: o1
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Orker "o1" of pool "p" has run as many tasks as its max_concurrent for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackorkersaturated
        summary: An Orker has run at its task limit for 30 minutes.
- name: 'OrkStackOrkerSaturated: room'
  interval: 1m
  input_series:
  - series: ork_orker_running_tasks{ork_orker_id="o1",ork_pool="p",ork_deployment="d"}
    values: 2x60
  - series: ork_orker_max_concurrent{ork_orker_id="o1",ork_pool="p",ork_deployment="d"}
    values: 4x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackOrkerSaturated
    exp_alerts: []
- name: 'OrkStackTasksWaiting: slow'
  interval: 1m
  input_series:
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="60",ork_deployment="d"}
    values: '0x60'
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="600",ork_deployment="d"}
    values: 0+10x60
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="+Inf",ork_deployment="d"}
    values: 0+10x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackTasksWaiting
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The 95th percentile of how long a task of pool "p" waited for an Orker to begin it has been over 5 minutes for 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktaskswaiting
        summary: Tasks wait over 5 minutes for an Orker.
- name: 'OrkStackTasksWaiting: fast'
  interval: 1m
  input_series:
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="60",ork_deployment="d"}
    values: 0+10x60
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="600",ork_deployment="d"}
    values: 0+10x60
  - series: ork_deployment_orker_task_wait_duration_seconds_bucket{ork_pool="p",le="+Inf",ork_deployment="d"}
    values: 0+10x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackTasksWaiting
    exp_alerts: []
- name: 'OrkStackHeartbeatLosses: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackHeartbeatLosses
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Attempts of pool "p" ended because their Orker could not heartbeat Temporal for the heartbeat timeout.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackheartbeatlosses
        summary: An Orker lost its heartbeat to Temporal.
- name: 'OrkStackHeartbeatLosses: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackHeartbeatLosses
    exp_alerts: []
- name: 'OrkStackHeartbeatLosses: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackHeartbeatLosses
    exp_alerts: []
- name: 'OrkStackHeartbeatLosses: growth during a 20m gap'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",ork_deployment="d"}
    values: 1x400 _x4 2x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackHeartbeatLosses
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Attempts of pool "p" ended because their Orker could not heartbeat Temporal for the heartbeat timeout.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackheartbeatlosses
        summary: An Orker lost its heartbeat to Temporal.
- name: 'OrkStackHeartbeatLosses: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackHeartbeatLosses
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Attempts of pool "p" ended because their Orker could not heartbeat Temporal for the heartbeat timeout.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackheartbeatlosses
        summary: An Orker lost its heartbeat to Temporal.
- name: 'OrkStackHeartbeatLosses: a new Prometheus meets a counter already above 0'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="ORKER_HEARTBEAT_LOST",ork_pool="p",ork_deployment="d"}
    values: 7x20
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackHeartbeatLosses
    exp_alerts: []
- name: 'OrkStackOOMKills: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_task_oom_kills_total{ork_pool="p",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackOOMKills
    exp_alerts:
    - exp_labels:
        component: pools
        ork_deployment: d
        ork_pool: p
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: A container of pool "p" was stopped at its memory limit in the last hour.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackoomkills
        summary: A task's container was stopped at its memory limit.
- name: 'OrkStackOOMKills: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_deployment_orker_task_oom_kills_total{ork_pool="p",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackOOMKills
    exp_alerts: []
- name: 'OrkStackOOMKills: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_task_oom_kills_total{ork_pool="p",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackOOMKills
    exp_alerts: []
- name: 'OrkStackOOMKills: growth during a 20m gap'
  interval: 5m
  input_series:
