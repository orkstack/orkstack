        component: archive
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: The archive sweep found a finished run the cluster had already deleted, with no archive.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackrunlost
        summary: A finished run was lost before it was archived.
- name: 'OrkStackRunLost: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_archive_sweep_runs_total{outcome="expired",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_archive_sweep_runs_total{outcome="expired",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackRunLost
    exp_alerts:
    - exp_labels:
        component: archive
