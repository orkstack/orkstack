# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-storage.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-storage
tests:
- name: 'OrkStackArchiveUnconfirmed: unconfirmed'
  interval: 1m
  input_series:
  - series: ork_archive_sweep_unconfirmed{ork_deployment="d"}
    values: 3x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackArchiveUnconfirmed
    exp_alerts:
    - exp_labels:
        component: archive
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: For 30 minutes the archive sweep has found finished runs it could not confirm have an archive.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchiveunconfirmed
        summary: Finished runs are not confirmed archived.
- name: 'OrkStackArchiveUnconfirmed: all confirmed'
  interval: 1m
  input_series:
  - series: ork_archive_sweep_unconfirmed{ork_deployment="d"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackArchiveUnconfirmed
    exp_alerts: []
- name: 'OrkStackArchiveLossImminent: an hour left'
  interval: 1m
  input_series:
  - series: ork_archive_sweep_unconfirmed{ork_deployment="d"}
    values: 3x20
  - series: ork_archive_sweep_earliest_expiry_seconds{ork_deployment="d"}
    values: 3600x20
  alert_rule_test:
  - eval_time: 10m
    alertname: OrkStackArchiveLossImminent
    exp_alerts:
    - exp_labels:
        component: archive
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: A finished run with no confirmed archive is less than a day from the cluster's delete time, or cannot be dated.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchivelossimminent
        summary: An unarchived run expires within a day.
- name: 'OrkStackArchiveLossImminent: ten days left'
  interval: 1m
  input_series:
  - series: ork_archive_sweep_unconfirmed{ork_deployment="d"}
    values: 3x20
  - series: ork_archive_sweep_earliest_expiry_seconds{ork_deployment="d"}
    values: 864000x20
  alert_rule_test:
  - eval_time: 10m
    alertname: OrkStackArchiveLossImminent
    exp_alerts: []
- name: 'OrkStackArchiveSweepBlind: last success stale'
  interval: 1m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x60
  - series: ork_archive_sweep_last_success_seconds{ork_deployment="d"}
    values: '0x60'
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 60x60
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackArchiveSweepBlind
    exp_alerts:
    - exp_labels:
        component: archive
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The archive sweep has not seen everything for three cleanup intervals, could not list the cluster's finished runs to the end, or runs too rarely for the cluster's retention.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchivesweepblind
        summary: The archive sweep cannot see every finished run.
- name: 'OrkStackArchiveSweepBlind: list failed'
  interval: 1m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x60
  - series: ork_archive_sweep_last_success_seconds{ork_deployment="d"}
    values: 0+60x60
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 60x60
  - series: ork_archive_sweep_list_failed{ork_deployment="d"}
    values: 1x60
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackArchiveSweepBlind
    exp_alerts:
    - exp_labels:
        component: archive
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The archive sweep has not seen everything for three cleanup intervals, could not list the cluster's finished runs to the end, or runs too rarely for the cluster's retention.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchivesweepblind
        summary: The archive sweep cannot see every finished run.
- name: 'OrkStackArchiveSweepBlind: recent success'
  interval: 1m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x60
  - series: ork_archive_sweep_last_success_seconds{ork_deployment="d"}
    values: 0+60x60
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 60x60
  - series: ork_archive_sweep_list_failed{ork_deployment="d"}
    values: '0x60'
  - series: ork_archive_sweep_interval_too_long{ork_deployment="d"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackArchiveSweepBlind
    exp_alerts: []
- name: 'OrkStackArchiveSweepBlind: interval 6 h'
  interval: 1m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x90
  - series: ork_archive_sweep_last_success_seconds{ork_deployment="d"}
    values: '0x90'
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 21600x90
  alert_rule_test:
  - eval_time: 60m
    alertname: OrkStackArchiveSweepBlind
    exp_alerts: []
- name: 'OrkStackRunLost: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_archive_sweep_runs_total{outcome="expired",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackRunLost
    exp_alerts:
    - exp_labels:
        component: archive
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: The archive sweep found a finished run the cluster had already deleted, with no archive.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackrunlost
        summary: A finished run was lost before it was archived.
