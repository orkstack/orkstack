# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-pipeline
  rules:
  - alert: OrkStackWatchdog
    expr: vector(1)
    labels:
      component: telemetry
      severity: none
    annotations:
      dashboard: /d/orkstack
      description: 'This alert always fires. Route it to a dead man''s switch: when it stops arriving, Prometheus or its Alertmanager is down.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwatchdog
      summary: Prometheus is evaluating OrkStack's alert rules.
  - alert: OrkStackTelemetryPipelineDown
    expr: absent_over_time(otelcol_process_uptime_seconds_total[5m])
    for: 2m
    labels:
      component: telemetry
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: No Collector has reported its own metrics for 5 minutes, so no OrkStack metric can arrive either, and every alert that reads one is blind.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetrypipelinedown
      summary: The OpenTelemetry Collector reports nothing.
  - alert: OrkStackTelemetryDropping
    expr: (sum(rate(otelcol_exporter_send_failed_metric_points_total[10m])) > 0) or (sum(rate(otelcol_exporter_send_failed_log_records_total[10m])) > 0) or (sum(rate(otelcol_exporter_send_failed_spans_total[10m])) > 0) or (sum(rate(otelcol_exporter_enqueue_failed_metric_points_total[10m])) > 0) or (sum(rate(otelcol_exporter_enqueue_failed_log_records_total[10m])) > 0) or (sum(rate(otelcol_exporter_enqueue_failed_spans_total[10m])) > 0) or (sum(rate(otelcol_receiver_refused_metric_points_total[10m])) > 0) or (sum(rate(otelcol_receiver_refused_log_records_total[10m])) > 0) or (sum(rate(otelcol_receiver_refused_spans_total[10m])) > 0)
    for: 10m
    labels:
      component: telemetry
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The Collector has refused, failed to queue or failed to send metrics, logs or spans for 10 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetrydropping
      summary: The OpenTelemetry Collector is dropping telemetry.
  - alert: OrkStackTelemetryExportErrors
    expr: sum by (ork_deployment, ork_telemetry_signal) (((ork_telemetry_export_errors_total - last_over_time(ork_telemetry_export_errors_total[1d] offset 15m)) > 0) or ((ork_telemetry_export_errors_total unless last_over_time(ork_telemetry_export_errors_total[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0 or sum by (ork_deployment) (((ork_orker_task_log_exports_total{outcome="error"} - last_over_time(ork_orker_task_log_exports_total{outcome="error"}[1d] offset 15m)) > 0) or ((ork_orker_task_log_exports_total{outcome="error"} unless last_over_time(ork_orker_task_log_exports_total{outcome="error"}[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: telemetry
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: An engine or Orker failed to export {{ $labels.ork_telemetry_signal }} to its collector in the last 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryexporterrors
      summary: An OrkStack process failed to export telemetry.
  - alert: OrkStackTelemetryRecordsDropped
    expr: sum by (ork_deployment, ork_telemetry_signal, reason) (((ork_telemetry_records_dropped_total{reason!="pending"} - last_over_time(ork_telemetry_records_dropped_total{reason!="pending"}[1d] offset 15m)) > 0) or ((ork_telemetry_records_dropped_total{reason!="pending"} unless last_over_time(ork_telemetry_records_dropped_total{reason!="pending"}[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: telemetry
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: An engine dropped {{ $labels.ork_telemetry_signal }} records for a namespace, for the reason "{{ $labels.reason }}".
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryrecordsdropped
      summary: An engine dropped telemetry for a namespace.
  - alert: OrkStackEngineAllDown
    expr: (absent_over_time(ork_build_info{ork_orker_id=""}[5m]) or (count by (ork_deployment) (max_over_time(ork_build_info{ork_orker_id=""}[1h])) unless on (ork_deployment) count by (ork_deployment) (max_over_time(ork_build_info{ork_orker_id=""}[5m])))) and on () (count(max_over_time(otelcol_process_uptime_seconds_total[5m])) > 0 and on () ((sum(rate(otelcol_exporter_send_failed_metric_points_total[5m])) or vector(0)) == 0))
    for: 2m
    labels:
      component: telemetry
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: No engine of the deployment has reported metrics for 5 minutes, while the telemetry pipeline itself is up and exporting.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackenginealldown
      summary: No OrkStack engine reports metrics.
  - alert: OrkStackMixedReleases
    expr: count by (ork_deployment) (count by (ork_deployment, ork_build_id) (ork_build_info)) > 1
    for: 2h
    labels:
      component: telemetry
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Engines and Orkers of more than one build have run side by side for 2 hours.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmixedreleases
      summary: Processes of more than one release are running.
  - alert: OrkStackNamespacesNotExported
    expr: max by (ork_deployment) (ork_telemetry_namespaces{routing="named_without_metrics"}) > 0
    for: 1h
    labels:
      component: telemetry
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Some namespaces' telemetry policies name a sink that exports no metrics, so their run and task metrics reach no Prometheus.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacknamespacesnotexported
      summary: Some namespaces export no metrics.
  - alert: OrkStackMetricOverflow
    expr: count by (ork_deployment) ({otel_metric_overflow="true", __name__=~"ork_.*"}) > 0
    for: 1h
    labels:
      component: telemetry
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: At least one OrkStack instrument has more series than the cardinality limit, so its excess series are folded into one overflow series.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmetricoverflow
      summary: An OrkStack metric hit its cardinality limit.
  - alert: OrkStackCensusStale
    expr: time() - max by (ork_deployment, ork_census) (ork_census_last_success_seconds) > 600
    for: 15m
    labels:
      component: telemetry
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: No engine's "{{ $labels.ork_census }}" census has succeeded for over 10 minutes, so the gauges it reports are stale.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcensusstale
      summary: An engine census has not succeeded for 10 minutes.
  - alert: OrkStackCensusSkipped
    expr: sum by (ork_deployment, ork_census) (increase(ork_census_skipped_total[30m])) > 0
    for: 30m
    labels:
      component: telemetry
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The "{{ $labels.ork_census }}" census skipped passes for 30 minutes because its request budget was spent.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcensusskipped
      summary: An engine census is skipping passes.
