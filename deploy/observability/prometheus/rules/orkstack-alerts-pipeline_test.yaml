# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-pipeline.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-pipeline
tests:
- name: 'OrkStackWatchdog: always firing'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  alert_rule_test:
  - eval_time: 1m
    alertname: OrkStackWatchdog
    exp_alerts:
    - exp_labels:
        component: telemetry
        severity: none
      exp_annotations:
        dashboard: /d/orkstack
        description: 'This alert always fires. Route it to a dead man''s switch: when it stops arriving, Prometheus or its Alertmanager is down.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwatchdog
        summary: Prometheus is evaluating OrkStack's alert rules.
- name: 'OrkStackTelemetryPipelineDown: Collector stopped'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x10
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTelemetryPipelineDown
    exp_alerts:
    - exp_labels:
        component: telemetry
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: No Collector has reported its own metrics for 5 minutes, so no OrkStack metric can arrive either, and every alert that reads one is blind.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetrypipelinedown
        summary: The OpenTelemetry Collector reports nothing.
  - eval_time: 20m
    alertname: OrkStackEngineAllDown
    exp_alerts: []
- name: 'OrkStackTelemetryPipelineDown: Collector running'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTelemetryPipelineDown
    exp_alerts: []
- name: 'OrkStackTelemetryDropping: Loki refuses logs'
  interval: 1m
  input_series:
  - series: otelcol_exporter_send_failed_log_records_total{exporter="otlphttp/loki"}
    values: 0+10x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackTelemetryDropping
    exp_alerts:
    - exp_labels:
        component: telemetry
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The Collector has refused, failed to queue or failed to send metrics, logs or spans for 10 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetrydropping
        summary: The OpenTelemetry Collector is dropping telemetry.
- name: 'OrkStackTelemetryDropping: two exporter metrics with identical labels'
  interval: 1m
  input_series:
  - series: otelcol_exporter_send_failed_spans_total
    values: 0+10x40
  - series: otelcol_exporter_send_failed_metric_points_total
    values: 0+10x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackTelemetryDropping
    exp_alerts:
    - exp_labels:
        component: telemetry
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The Collector has refused, failed to queue or failed to send metrics, logs or spans for 10 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetrydropping
        summary: The OpenTelemetry Collector is dropping telemetry.
- name: 'OrkStackTelemetryDropping: nothing dropped'
  interval: 1m
  input_series:
  - series: otelcol_exporter_send_failed_log_records_total
    values: 5x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackTelemetryDropping
    exp_alerts: []
- name: 'OrkStackTelemetryExportErrors: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackTelemetryExportErrors
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: metrics
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine or Orker failed to export metrics to its collector in the last 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryexporterrors
        summary: An OrkStack process failed to export telemetry.
- name: 'OrkStackTelemetryExportErrors: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackTelemetryExportErrors
    exp_alerts: []
- name: 'OrkStackTelemetryExportErrors: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackTelemetryExportErrors
    exp_alerts: []
- name: 'OrkStackTelemetryExportErrors: growth during a 20m gap'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",ork_deployment="d"}
    values: 1x400 _x4 2x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackTelemetryExportErrors
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: metrics
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine or Orker failed to export metrics to its collector in the last 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryexporterrors
        summary: An OrkStack process failed to export telemetry.
- name: 'OrkStackTelemetryExportErrors: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackTelemetryExportErrors
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: metrics
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine or Orker failed to export metrics to its collector in the last 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryexporterrors
        summary: An OrkStack process failed to export telemetry.
- name: 'OrkStackTelemetryExportErrors: a new Prometheus meets a counter already above 0'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_telemetry_export_errors_total{ork_telemetry_signal="metrics",ork_deployment="d"}
    values: 7x20
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackTelemetryExportErrors
    exp_alerts: []
- name: 'OrkStackTelemetryRecordsDropped: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: logs
        reason: sink_unknown
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine dropped logs records for a namespace, for the reason "sink_unknown".
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryrecordsdropped
        summary: An engine dropped telemetry for a namespace.
- name: 'OrkStackTelemetryRecordsDropped: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts: []
- name: 'OrkStackTelemetryRecordsDropped: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts: []
- name: 'OrkStackTelemetryRecordsDropped: growth during a 20m gap'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",ork_deployment="d"}
    values: 1x400 _x4 2x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: logs
        reason: sink_unknown
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine dropped logs records for a namespace, for the reason "sink_unknown".
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryrecordsdropped
        summary: An engine dropped telemetry for a namespace.
- name: 'OrkStackTelemetryRecordsDropped: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        ork_telemetry_signal: logs
        reason: sink_unknown
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine dropped logs records for a namespace, for the reason "sink_unknown".
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktelemetryrecordsdropped
        summary: An engine dropped telemetry for a namespace.
- name: 'OrkStackTelemetryRecordsDropped: a new Prometheus meets a counter already above 0'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="sink_unknown",ork_deployment="d"}
    values: 7x20
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts: []
- name: 'OrkStackTelemetryRecordsDropped: a new namespace: pending'
  interval: 1m
  input_series:
  - series: ork_telemetry_records_dropped_total{ork_telemetry_signal="logs",reason="pending",ork_deployment="d"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackTelemetryRecordsDropped
    exp_alerts: []
- name: 'OrkStackEngineAllDown: every engine stopped'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_build_info{ork_orker_id="o1",ork_deployment="d"}
    values: 1x90
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackEngineAllDown
    exp_alerts:
    - exp_labels:
        component: telemetry
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: No engine of the deployment has reported metrics for 5 minutes, while the telemetry pipeline itself is up and exporting.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackenginealldown
        summary: No OrkStack engine reports metrics.
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: No engine of the deployment has reported metrics for 5 minutes, while the telemetry pipeline itself is up and exporting.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackenginealldown
        summary: No OrkStack engine reports metrics.
- name: 'OrkStackEngineAllDown: pipeline down'
  interval: 1m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackEngineAllDown
    exp_alerts: []
- name: 'OrkStackEngineAllDown: exporter failing'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  - series: otelcol_exporter_send_failed_metric_points_total
    values: 0+10x90
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackEngineAllDown
    exp_alerts: []
- name: 'OrkStackEngineAllDown: one late push'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20 _x2 1x20
  alert_rule_test:
  - eval_time: 23m
    alertname: OrkStackEngineAllDown
    exp_alerts: []
- name: 'OrkStackEngineAllDown: one of two deployments down'
  interval: 1m
  input_series:
  - series: otelcol_process_uptime_seconds_total
    values: 0+60x90
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_build_info{ork_deployment="e"}
    values: 1x90
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackEngineAllDown
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: No engine of the deployment has reported metrics for 5 minutes, while the telemetry pipeline itself is up and exporting.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackenginealldown
        summary: No OrkStack engine reports metrics.
- name: 'OrkStackMixedReleases: two builds for 3 hours'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_build_id="a",ork_deployment="d"}
    values: 1x40
  - series: ork_build_info{ork_build_id="b",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackMixedReleases
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Engines and Orkers of more than one build have run side by side for 2 hours.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmixedreleases
        summary: Processes of more than one release are running.
- name: 'OrkStackMixedReleases: one build'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_build_id="a",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackMixedReleases
    exp_alerts: []
- name: 'OrkStackNamespacesNotExported: two namespaces'
  interval: 1m
  input_series:
  - series: ork_telemetry_namespaces{routing="named_without_metrics",ork_deployment="d"}
    values: 2x100
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackNamespacesNotExported
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Some namespaces' telemetry policies name a sink that exports no metrics, so their run and task metrics reach no Prometheus.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacknamespacesnotexported
        summary: Some namespaces export no metrics.
- name: 'OrkStackNamespacesNotExported: none'
  interval: 1m
  input_series:
  - series: ork_telemetry_namespaces{routing="named_without_metrics",ork_deployment="d"}
    values: '0x100'
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackNamespacesNotExported
    exp_alerts: []
- name: 'OrkStackMetricOverflow: an overflow series'
  interval: 1m
  input_series:
  - series: ork_tasks_total{otel_metric_overflow="true",ork_deployment="d"}
    values: 0+1x100
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackMetricOverflow
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: At least one OrkStack instrument has more series than the cardinality limit, so its excess series are folded into one overflow series.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmetricoverflow
        summary: An OrkStack metric hit its cardinality limit.
- name: 'OrkStackMetricOverflow: a concurrency series'
  interval: 1m
  input_series:
  - series: ork_concurrency_arrivals_total{otel_metric_overflow="true",ork_deployment="d"}
    values: 0+1x100
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackMetricOverflow
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: At least one OrkStack instrument has more series than the cardinality limit, so its excess series are folded into one overflow series.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmetricoverflow
        summary: An OrkStack metric hit its cardinality limit.
- name: 'OrkStackMetricOverflow: a schedule fires series'
  interval: 1m
  input_series:
  - series: ork_schedule_fires_total{otel_metric_overflow="true",ork_deployment="d"}
    values: 0+1x100
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackMetricOverflow
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: At least one OrkStack instrument has more series than the cardinality limit, so its excess series are folded into one overflow series.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackmetricoverflow
        summary: An OrkStack metric hit its cardinality limit.
- name: 'OrkStackMetricOverflow: no overflow'
  interval: 1m
  input_series:
  - series: ork_tasks_total{ork_namespace="n",ork_deployment="d"}
    values: 0+1x100
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackMetricOverflow
    exp_alerts: []
- name: 'OrkStackCensusStale: never succeeded'
  interval: 1m
  input_series:
  - series: ork_census_last_success_seconds{ork_census="runs_open",ork_deployment="d"}
    values: '0x50'
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackCensusStale
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_census: runs_open
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: No engine's "runs_open" census has succeeded for over 10 minutes, so the gauges it reports are stale.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcensusstale
        summary: An engine census has not succeeded for 10 minutes.
- name: 'OrkStackCensusStale: succeeding'
  interval: 1m
  input_series:
  - series: ork_census_last_success_seconds{ork_census="runs_open",ork_deployment="d"}
    values: 0+60x50
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackCensusStale
    exp_alerts: []
- name: 'OrkStackCensusSkipped: skipping'
  interval: 1m
  input_series:
  - series: ork_census_skipped_total{ork_census="schedules",ork_deployment="d"}
    values: 0+1x90
  alert_rule_test:
  - eval_time: 80m
    alertname: OrkStackCensusSkipped
    exp_alerts:
    - exp_labels:
        component: telemetry
        ork_census: schedules
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: The "schedules" census skipped passes for 30 minutes because its request budget was spent.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcensusskipped
        summary: An engine census is skipping passes.
- name: 'OrkStackCensusSkipped: not skipping'
  interval: 1m
  input_series:
  - series: ork_census_skipped_total{ork_census="schedules",ork_deployment="d"}
    values: 5x90
  alert_rule_test:
  - eval_time: 80m
    alertname: OrkStackCensusSkipped
    exp_alerts: []
