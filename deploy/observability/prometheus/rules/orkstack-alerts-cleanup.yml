# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-cleanup
  rules:
  - alert: OrkStackCleanupDisabled
    expr: max by (ork_deployment) (ork_cleanup_enabled_ratio) == 0
    for: 24h
    labels:
      component: cleanup
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Retention cleanup has been off on every engine for a day.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupdisabled
      summary: Retention cleanup is off.
  - alert: OrkStackCleanupNotReporting
    expr: max by (ork_deployment) (ork_cleanup_enabled_ratio) == 1 unless on (ork_deployment) (time() - max by (ork_deployment) (ork_cleanup_last_pass_seconds) < 3 * max by (ork_deployment) (ork_cleanup_interval_seconds))
    for: 10m
    labels:
      component: cleanup
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Retention cleanup is on, and no engine has completed a walk of the run index for three cleanup intervals.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupnotreporting
      summary: Retention cleanup has not completed a walk for three intervals.
  - alert: OrkStackCleanupFailing
    expr: sum by (ork_deployment) (((ork_cleanup_passes_total{outcome="failed"} - last_over_time(ork_cleanup_passes_total{outcome="failed"}[1d] offset 2h)) > 0) or ((ork_cleanup_passes_total{outcome="failed"} unless last_over_time(ork_cleanup_passes_total{outcome="failed"}[1d] offset 2h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 2h)) > 0))) > 0 or sum by (ork_deployment) (((ork_deployment_cleanup_runs_total{outcome="failed"} - last_over_time(ork_deployment_cleanup_runs_total{outcome="failed"}[1d] offset 2h)) > 0) or ((ork_deployment_cleanup_runs_total{outcome="failed"} unless last_over_time(ork_deployment_cleanup_runs_total{outcome="failed"}[1d] offset 2h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 2h)) > 0))) > 0
    labels:
      component: cleanup
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: A retention cleanup pass, or the retirement of a run, failed in the last 2 hours; a later pass tries again.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupfailing
      summary: Retention cleanup fails.
  - alert: OrkStackCleanupBehindRetention
    expr: max by (ork_deployment) (ork_deployment_cleanup_retention_lag_seconds) > 0.5 * max by (ork_deployment) (ork_cleanup_retention_buffer_seconds)
    for: 1h
    labels:
      component: cleanup
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The most overdue run cleanup left unretired is past its due time by over half the retention buffer.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupbehindretention
      summary: Retention cleanup is far behind.
  - alert: OrkStackRetentionBackstopShort
    expr: sum by (ork_deployment) (((ork_retention_backstop_refused_total{outcome="short"} - last_over_time(ork_retention_backstop_refused_total{outcome="short"}[1d] offset 1h)) > 0) or ((ork_retention_backstop_refused_total{outcome="short"} unless last_over_time(ork_retention_backstop_refused_total{outcome="short"}[1d] offset 1h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 1h)) > 0))) > 0
    labels:
      component: cleanup
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: The cluster refused the engine the right to set its namespace's retention, and the retention it keeps is shorter than the backstop.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackretentionbackstopshort
      summary: Temporal keeps closed runs for less than OrkStack's retention needs, and refuses to change it.
  - alert: OrkStackExecutionsMissing
    expr: sum by (ork_deployment) (((ork_deployment_cleanup_runs_total{outcome="not_found_not_due"} - last_over_time(ork_deployment_cleanup_runs_total{outcome="not_found_not_due"}[1d] offset 1h)) > 0) or ((ork_deployment_cleanup_runs_total{outcome="not_found_not_due"} unless last_over_time(ork_deployment_cleanup_runs_total{outcome="not_found_not_due"}[1d] offset 1h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 1h)) > 0))) > 0
    labels:
      component: cleanup
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: Cleanup found runs whose executions are gone from Temporal although their retention has not ended.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackexecutionsmissing
      summary: Runs are missing from Temporal before their retention ended.
  - alert: OrkStackArtifactGCFailing
    expr: sum by (ork_deployment) (increase(ork_gc_passes_total{outcome="failed"}[6h])) >= 3 or sum by (ork_deployment, ork_gc_reason) (((ork_deployment_gc_objects_total{outcome="failed"} - last_over_time(ork_deployment_gc_objects_total{outcome="failed"}[1d] offset 6h)) > 0) or ((ork_deployment_gc_objects_total{outcome="failed"} unless last_over_time(ork_deployment_gc_objects_total{outcome="failed"}[1d] offset 6h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 6h)) > 0))) > 0
    labels:
      component: gc
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The artifact GC failed at least 3 passes in 6 hours, or failed to delete objects.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcfailing
      summary: The artifact GC fails.
  - alert: OrkStackArtifactGCNotReporting
    expr: (max by (ork_deployment) (ork_cleanup_enabled_ratio) == 1 and on (ork_deployment) max by (ork_deployment) (ork_gc_mode{mode=~"dry_run|delete"}) == 1) unless on (ork_deployment) (time() - max by (ork_deployment) (ork_gc_last_pass_seconds) < 3 * max by (ork_deployment) (ork_cleanup_interval_seconds))
    for: 10m
    labels:
      component: gc
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The artifact GC is on, and no engine has made a pass for three cleanup intervals.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcnotreporting
      summary: The artifact GC has not made a pass for three intervals.
  - alert: OrkStackArtifactGCNoProgress
    expr: max by (ork_deployment) (ork_gc_due_runs) > 0 and on (ork_deployment) (time() - max by (ork_deployment) (ork_gc_last_progress_seconds) > 6 * max by (ork_deployment) (ork_cleanup_interval_seconds))
    for: 1h
    labels:
      component: gc
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Runs are due for reclaim, and the artifact GC has finished none and deleted nothing for six cleanup intervals.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcnoprogress
      summary: The artifact GC makes no progress.
  - alert: OrkStackArtifactGCBehind
    expr: max by (ork_deployment) (ork_gc_lag_seconds) > 21600
    for: 2h
    labels:
      component: gc
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The oldest run due for reclaim has waited over 6 hours since it retired.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcbehind
      summary: The artifact GC is over 6 hours behind.
  - alert: OrkStackArtifactGCHeld
    expr: max by (ork_deployment, ork_gc_hold_reason) (ork_gc_held{ork_gc_hold_reason!="local_backend"}) == 1
    for: 2h
    labels:
      component: gc
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: 'The artifact GC has held its passes for 2 hours: {{ $labels.ork_gc_hold_reason }}.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcheld
      summary: The artifact GC is held.
  - alert: OrkStackArtifactGCHeldLong
    expr: max by (ork_deployment, ork_gc_hold_reason) (ork_gc_held{ork_gc_hold_reason!="local_backend"}) == 1
    for: 24h
    labels:
      component: gc
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: 'The artifact GC has held its passes for a day: {{ $labels.ork_gc_hold_reason }}.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcheldlong
      summary: The artifact GC has been held for a day.
  - alert: OrkStackArtifactGCLowWaterLag
    expr: max by (ork_deployment) (ork_gc_lowwater_age_seconds) > 604800 and on (ork_deployment) max by (ork_deployment) (ork_gc_waiting_runs) > 0
    for: 1h
    labels:
      component: gc
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The oldest open or unarchived run is over a week old, and retired runs wait on it before they can be reclaimed.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgclowwaterlag
      summary: A week-old run holds the artifact GC back.
  - alert: OrkStackArtifactGCDryRun
    expr: min_over_time(max by (ork_deployment) (ork_gc_mode{mode="dry_run"})[7d:1h]) == 1 and on (ork_deployment) max by (ork_deployment) (ork_gc_mode{mode="dry_run"} offset 7d) == 1 and on (ork_deployment) max by (ork_deployment) (ork_deployment_gc_would_delete_bytes) > 0
    for: 1h
    labels:
      component: gc
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The artifact GC has been in dry-run for 7 days and would delete objects.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgcdryrun
      summary: The artifact GC has run in dry-run for a week with space to reclaim.
  - alert: OrkStackArtifactGCLateCommit
    expr: sum by (ork_deployment) (((ork_gc_objects_total{outcome="kept",ork_gc_reason="late_commit"} - last_over_time(ork_gc_objects_total{outcome="kept",ork_gc_reason="late_commit"}[1d] offset 15m)) > 0) or ((ork_gc_objects_total{outcome="kept",ork_gc_reason="late_commit"} unless last_over_time(ork_gc_objects_total{outcome="kept",ork_gc_reason="late_commit"}[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: gc
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The artifact GC kept objects because a commit appeared after their run retired.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackartifactgclatecommit
      summary: A commit appeared after a run retired; its objects are kept.
