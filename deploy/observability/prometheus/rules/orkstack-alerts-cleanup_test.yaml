# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-cleanup.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-cleanup
tests:
- name: 'OrkStackCleanupDisabled: off for 2 days'
  interval: 5m
  input_series:
  - series: ork_cleanup_enabled_ratio{ork_deployment="d"}
    values: '0x320'
  alert_rule_test:
  - eval_time: 26h
    alertname: OrkStackCleanupDisabled
    exp_alerts:
    - exp_labels:
        component: cleanup
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Retention cleanup has been off on every engine for a day.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupdisabled
        summary: Retention cleanup is off.
- name: 'OrkStackCleanupDisabled: on'
  interval: 5m
  input_series:
  - series: ork_cleanup_enabled_ratio{ork_deployment="d"}
    values: 1x320
  alert_rule_test:
  - eval_time: 26h
    alertname: OrkStackCleanupDisabled
    exp_alerts: []
- name: 'OrkStackCleanupNotReporting: no walk'
  interval: 1m
  input_series:
  - series: ork_cleanup_enabled_ratio{ork_deployment="d"}
    values: 1x60
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 60x60
  - series: ork_cleanup_last_pass_seconds{ork_deployment="d"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackCleanupNotReporting
    exp_alerts:
    - exp_labels:
        component: cleanup
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Retention cleanup is on, and no engine has completed a walk of the run index for three cleanup intervals.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupnotreporting
        summary: Retention cleanup has not completed a walk for three intervals.
- name: 'OrkStackCleanupNotReporting: walking'
  interval: 1m
  input_series:
  - series: ork_cleanup_enabled_ratio{ork_deployment="d"}
    values: 1x60
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 60x60
  - series: ork_cleanup_last_pass_seconds{ork_deployment="d"}
    values: 0+60x60
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackCleanupNotReporting
    exp_alerts: []
- name: 'OrkStackCleanupNotReporting: interval 6 h'
  interval: 1m
  input_series:
  - series: ork_cleanup_enabled_ratio{ork_deployment="d"}
    values: 1x90
  - series: ork_cleanup_interval_seconds{ork_deployment="d"}
    values: 21600x90
  - series: ork_cleanup_last_pass_seconds{ork_deployment="d"}
    values: '0x90'
  alert_rule_test:
  - eval_time: 60m
    alertname: OrkStackCleanupNotReporting
    exp_alerts: []
- name: 'OrkStackCleanupFailing: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_cleanup_passes_total{outcome="failed",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackCleanupFailing
    exp_alerts:
    - exp_labels:
        component: cleanup
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: A retention cleanup pass, or the retirement of a run, failed in the last 2 hours; a later pass tries again.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackcleanupfailing
        summary: Retention cleanup fails.
- name: 'OrkStackCleanupFailing: steady for 2 days'
