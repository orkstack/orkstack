# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-concurrency.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-concurrency
tests:
- name: 'OrkStackConcurrencyCensusDead: stale'
  interval: 1m
  input_series:
  - series: ork_concurrency_census_local_age_seconds{ork_deployment="d"}
    values: 600+60x30
  - series: ork_concurrency_census_interval_seconds{ork_deployment="d"}
    values: 60x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyCensusDead
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: No engine replica has a concurrency census newer than three intervals plus five minutes, or none reports one.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencycensusdead
        summary: The concurrency census has not run.
- name: 'OrkStackConcurrencyCensusDead: fresh'
  interval: 1m
  input_series:
  - series: ork_concurrency_census_local_age_seconds{ork_deployment="d"}
    values: 30x30
  - series: ork_concurrency_census_interval_seconds{ork_deployment="d"}
    values: 60x30
  - series: ork_build_info{ork_orker_id="",ork_deployment="d"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyCensusDead
    exp_alerts: []
- name: 'OrkStackConcurrencyCensusPartial: partial'
  interval: 1m
  input_series:
  - series: ork_concurrency_census_partial{ork_namespace="n",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyCensusPartial
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: The concurrency census has not read every limit for 15 minutes, or could not run its pass.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencycensuspartial
        summary: The concurrency census reads only some limits.
- name: 'OrkStackConcurrencyCensusPartial: whole'
  interval: 1m
  input_series:
  - series: ork_concurrency_census_partial{ork_namespace="n",ork_deployment="d"}
    values: '0x40'
  - series: ork_concurrency_census_unavailable{ork_deployment="d"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyCensusPartial
    exp_alerts: []
- name: 'OrkStackConcurrencyQueueGrowing: growing'
  interval: 10m
  input_series:
  - series: ork_concurrency_queue_depth{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 1+1x12
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackConcurrencyQueueGrowing
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_concurrency_limit: db#1a2b3c4d
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: The line of limit "db#1a2b3c4d" of namespace "n" is longer than 30 minutes ago and has not emptied since.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuegrowing
        summary: A concurrency limit's line keeps growing.
- name: 'OrkStackConcurrencyQueueGrowing: steady'
  interval: 10m
  input_series:
  - series: ork_concurrency_queue_depth{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 3x12
  alert_rule_test:
  - eval_time: 90m
    alertname: OrkStackConcurrencyQueueGrowing
    exp_alerts: []
- name: 'OrkStackConcurrencyQueuedTooLong: late'
  interval: 1m
  input_series:
  - series: ork_concurrency_queue_oldest_timeout_fraction{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 0.8x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyQueuedTooLong
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_concurrency_limit: db#1a2b3c4d
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The oldest run waiting for limit "db#1a2b3c4d" of namespace "n" has used over half its queue_timeout.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuedtoolong
        summary: A run has waited over half its queue timeout.
- name: 'OrkStackConcurrencyQueuedTooLong: early'
  interval: 1m
  input_series:
  - series: ork_concurrency_queue_oldest_timeout_fraction{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 0.2x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyQueuedTooLong
    exp_alerts: []
- name: 'OrkStackConcurrencyQueueExitsUnstarted: timed out'
  interval: 1m
  input_series:
  - series: ork_concurrency_exits_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_concurrency_strategy="queue",ork_concurrency_outcome="timed_out",ork_deployment="d"}
    values: 0+1x50
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackConcurrencyQueueExitsUnstarted
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_concurrency_limit: db#1a2b3c4d
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Waits in the line of limit "db#1a2b3c4d" of namespace "n" have ended without the run or task starting for 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueueexitsunstarted
        summary: Runs waiting in a concurrency limit's line end without starting.
- name: 'OrkStackConcurrencyQueueExitsUnstarted: one timeout'
  interval: 1m
  input_series:
  - series: ork_concurrency_exits_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_concurrency_strategy="queue",ork_concurrency_outcome="timed_out",ork_deployment="d"}
    values: 0x5 1x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackConcurrencyQueueExitsUnstarted
    exp_alerts: []
- name: 'OrkStackConcurrencyQueueExitsUnstarted: started'
  interval: 1m
  input_series:
  - series: ork_concurrency_exits_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_concurrency_strategy="queue",ork_concurrency_outcome="started",ork_deployment="d"}
    values: 0+1x50
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackConcurrencyQueueExitsUnstarted
    exp_alerts: []
- name: 'OrkStackConcurrencyQueueFillsMaxRunning: filled'
  interval: 1m
  input_series:
  - series: ork_concurrency_queued_runs{ork_namespace="n",ork_deployment="d"}
    values: 5x40
  - series: ork_runs_refused_total{ork_namespace="n",ork_refusal_reason="max_running_reached",ork_deployment="d"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyQueueFillsMaxRunning
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Namespace "n" refuses runs at max_running while runs wait in concurrency limits' lines.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuefillsmaxrunning
        summary: Queued runs use up a namespace's max_running.
- name: 'OrkStackConcurrencyQueueFillsMaxRunning: no queue'
  interval: 1m
  input_series:
  - series: ork_concurrency_queued_runs{ork_namespace="n",ork_deployment="d"}
    values: '0x40'
  - series: ork_runs_refused_total{ork_namespace="n",ork_refusal_reason="max_running_reached",ork_deployment="d"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyQueueFillsMaxRunning
    exp_alerts: []
- name: 'OrkStackConcurrencyHolderStalled: stalled'
  interval: 1m
  input_series:
  - series: ork_concurrency_stalled_holders{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyHolderStalled
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_concurrency_limit: db#1a2b3c4d
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: A holder of limit "db#1a2b3c4d" of namespace "n" has made no progress for over engine.concurrency.stalled_after.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyholderstalled
        summary: A run holding a concurrency slot makes no progress.
- name: 'OrkStackConcurrencyHolderStalled: moving'
  interval: 1m
  input_series:
  - series: ork_concurrency_stalled_holders{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyHolderStalled
    exp_alerts: []
- name: 'OrkStackConcurrencySlotsNotReclaimed: full and unchecked'
  interval: 1m
  input_series:
  - series: ork_concurrency_verify_errors_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: 0+1x70
  - series: ork_concurrency_keys_full{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: 1x70
  alert_rule_test:
  - eval_time: 60m
    alertname: OrkStackConcurrencySlotsNotReclaimed
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_concurrency_limit: db#1a2b3c4d
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Limit "db#1a2b3c4d" of namespace "n" has a full key, and its checks of the runs holding or waiting for it have failed for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyslotsnotreclaimed
        summary: A full concurrency limit cannot check who holds it.
- name: 'OrkStackConcurrencySlotsNotReclaimed: not full'
  interval: 1m
  input_series:
  - series: ork_concurrency_verify_errors_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: 0+1x70
  - series: ork_concurrency_keys_full{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: '0x70'
  alert_rule_test:
  - eval_time: 60m
    alertname: OrkStackConcurrencySlotsNotReclaimed
    exp_alerts: []
- name: 'OrkStackConcurrencySlotsNotReclaimed: checked'
  interval: 1m
  input_series:
  - series: ork_concurrency_verify_errors_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: '0x70'
  - series: ork_concurrency_keys_full{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_deployment="d"}
    values: 1x70
  alert_rule_test:
  - eval_time: 60m
    alertname: OrkStackConcurrencySlotsNotReclaimed
    exp_alerts: []
- name: 'OrkStackConcurrencyRebuildFailing: failing'
  interval: 1m
  input_series:
  - series: ork_concurrency_rebuilding{ork_namespace="n",ork_concurrency_state="failing",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyRebuildFailing
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: A limit of namespace "n" has failed to rebuild its record of running runs for longer than engine.concurrency.rebuild_timeout.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyrebuildfailing
        summary: A concurrency limit cannot read which runs hold it.
- name: 'OrkStackConcurrencyRebuildFailing: rebuilding'
  interval: 1m
  input_series:
  - series: ork_concurrency_rebuilding{ork_namespace="n",ork_concurrency_state="running",ork_deployment="d"}
    values: 1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackConcurrencyRebuildFailing
    exp_alerts: []
- name: 'OrkStackConcurrencyQueueMismatch: off by two'
  interval: 1m
  input_series:
  - series: ork_concurrency_queued_runs{ork_namespace="n",ork_deployment="d"}
    values: 5x60
  - series: ork_concurrency_queue_depth{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 3x60
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackConcurrencyQueueMismatch
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: In namespace "n", the runs the index marks queued and the runs the limits' lines hold have differed for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuemismatch
        summary: The runs marked queued and the limits' lines disagree.
- name: 'OrkStackConcurrencyQueueMismatch: agree'
  interval: 1m
  input_series:
  - series: ork_concurrency_queued_runs{ork_namespace="n",ork_deployment="d"}
    values: 3x60
  - series: ork_concurrency_queue_depth{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_deployment="d"}
    values: 3x60
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackConcurrencyQueueMismatch
    exp_alerts: []
- name: 'OrkStackConcurrencyUnavailable: unavailable'
  interval: 1m
  input_series:
  - series: ork_concurrency_arrivals_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_concurrency_strategy="queue",ork_concurrency_outcome="unavailable",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyUnavailable
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Requests for a concurrency slot in namespace "n" have found the limit unavailable for 5 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyunavailable
        summary: Concurrency limits do not answer.
- name: 'OrkStackConcurrencyUnavailable: granted'
  interval: 1m
  input_series:
  - series: ork_concurrency_arrivals_total{ork_namespace="n",ork_concurrency_limit="db#1a2b3c4d",ork_concurrency_level="run",ork_concurrency_strategy="queue",ork_concurrency_outcome="granted",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyUnavailable
    exp_alerts: []
- name: 'OrkStackConcurrencyFireNotStarted: not started'
  interval: 1m
  input_series:
  - series: ork_schedule_fires_total{ork_namespace="n",outcome="not_started",ork_deployment="d"}
    values: 0+1x60
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackConcurrencyFireNotStarted
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Fires of namespace "n" have completed without a run, or found the engine unavailable, for 30 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyfirenotstarted
        summary: Schedules' fires start no run.
- name: 'OrkStackConcurrencyFireNotStarted: started'
  interval: 1m
  input_series:
  - series: ork_schedule_fires_total{ork_namespace="n",outcome="started",ork_deployment="d"}
    values: 0+1x60
  alert_rule_test:
  - eval_time: 50m
    alertname: OrkStackConcurrencyFireNotStarted
    exp_alerts: []
- name: 'OrkStackConcurrencyIndexMissing: missing'
  interval: 1m
  input_series:
  - series: ork_concurrency_index_unavailable{ork_deployment="d"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyIndexMissing
    exp_alerts:
    - exp_labels:
        component: concurrency
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: An engine booted with the concurrency search attributes missing.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyindexmissing
        summary: The cluster does not index concurrency limits.
- name: 'OrkStackConcurrencyIndexMissing: indexed'
  interval: 1m
  input_series:
  - series: ork_concurrency_index_unavailable{ork_deployment="d"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackConcurrencyIndexMissing
    exp_alerts: []
