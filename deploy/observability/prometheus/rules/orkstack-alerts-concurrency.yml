# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-concurrency
  rules:
  - alert: OrkStackConcurrencyCensusDead
    expr: (min by (ork_deployment) (ork_concurrency_census_local_age_seconds) > 3 * max by (ork_deployment) (ork_concurrency_census_interval_seconds) + 300) or (max by (ork_deployment) (ork_build_info{ork_orker_id=""}) unless on (ork_deployment) max by (ork_deployment) (ork_concurrency_census_local_age_seconds))
    for: 5m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: No engine replica has a concurrency census newer than three intervals plus five minutes, or none reports one.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencycensusdead
      summary: The concurrency census has not run.
  - alert: OrkStackConcurrencyCensusPartial
    expr: (max by (ork_deployment, ork_namespace) (last_over_time(ork_concurrency_census_partial[10m])) == 1) or (max by (ork_deployment) (ork_concurrency_census_unavailable) == 1)
    for: 15m
    labels:
      component: concurrency
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The concurrency census has not read every limit for 15 minutes, or could not run its pass.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencycensuspartial
      summary: The concurrency census reads only some limits.
  - alert: OrkStackConcurrencyQueueGrowing
    expr: max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_queue_depth[10m])) > max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_queue_depth[10m] offset 30m)) and min by (ork_deployment, ork_namespace, ork_concurrency_limit) (min_over_time(ork_concurrency_queue_depth[30m])) > 0
    for: 30m
    labels:
      component: concurrency
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The line of limit "{{ $labels.ork_concurrency_limit }}" of namespace "{{ $labels.ork_namespace }}" is longer than 30 minutes ago and has not emptied since.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuegrowing
      summary: A concurrency limit's line keeps growing.
  - alert: OrkStackConcurrencyQueuedTooLong
    expr: max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_queue_oldest_timeout_fraction[10m])) > 0.5
    for: 5m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The oldest run waiting for limit "{{ $labels.ork_concurrency_limit }}" of namespace "{{ $labels.ork_namespace }}" has used over half its queue_timeout.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuedtoolong
      summary: A run has waited over half its queue timeout.
  - alert: OrkStackConcurrencyQueueExitsUnstarted
    expr: sum by (ork_deployment, ork_namespace, ork_concurrency_limit) (rate(ork_concurrency_exits_total{ork_concurrency_outcome=~"timed_out|full|unavailable|unsupported|fenced"}[15m])) > 0
    for: 15m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Waits in the line of limit "{{ $labels.ork_concurrency_limit }}" of namespace "{{ $labels.ork_namespace }}" have ended without the run or task starting for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueueexitsunstarted
      summary: Runs waiting in a concurrency limit's line end without starting.
  - alert: OrkStackConcurrencyQueueFillsMaxRunning
    expr: max by (ork_deployment, ork_namespace) (last_over_time(ork_concurrency_queued_runs[10m])) > 0 and on (ork_deployment, ork_namespace) sum by (ork_deployment, ork_namespace) (rate(ork_runs_refused_total{ork_refusal_reason="max_running_reached"}[15m])) > 0
    for: 15m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Namespace "{{ $labels.ork_namespace }}" refuses runs at max_running while runs wait in concurrency limits' lines.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuefillsmaxrunning
      summary: Queued runs use up a namespace's max_running.
  - alert: OrkStackConcurrencyHolderStalled
    expr: max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_stalled_holders[10m])) > 0
    for: 15m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: A holder of limit "{{ $labels.ork_concurrency_limit }}" of namespace "{{ $labels.ork_namespace }}" has made no progress for over engine.concurrency.stalled_after.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyholderstalled
      summary: A run holding a concurrency slot makes no progress.
  - alert: OrkStackConcurrencySlotsNotReclaimed
    expr: sum by (ork_deployment, ork_namespace, ork_concurrency_limit) (rate(ork_concurrency_verify_errors_total[15m])) > 0 and on (ork_deployment, ork_namespace, ork_concurrency_limit) max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_keys_full[10m])) > 0
    for: 30m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Limit "{{ $labels.ork_concurrency_limit }}" of namespace "{{ $labels.ork_namespace }}" has a full key, and its checks of the runs holding or waiting for it have failed for 30 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyslotsnotreclaimed
      summary: A full concurrency limit cannot check who holds it.
  - alert: OrkStackConcurrencyRebuildFailing
    expr: max by (ork_deployment, ork_namespace) (last_over_time(ork_concurrency_rebuilding{ork_concurrency_state="failing"}[10m])) > 0
    for: 10m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: A limit of namespace "{{ $labels.ork_namespace }}" has failed to rebuild its record of running runs for longer than engine.concurrency.rebuild_timeout.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyrebuildfailing
      summary: A concurrency limit cannot read which runs hold it.
  - alert: OrkStackConcurrencyQueueMismatch
    expr: (abs(max by (ork_deployment, ork_namespace) (last_over_time(ork_concurrency_queued_runs[10m])) - sum by (ork_deployment, ork_namespace) (max by (ork_deployment, ork_namespace, ork_concurrency_limit) (last_over_time(ork_concurrency_queue_depth{ork_concurrency_level="run"}[10m])))) > 0) unless on (ork_deployment, ork_namespace) (max by (ork_deployment, ork_namespace) (last_over_time(ork_concurrency_census_partial[10m])) == 1)
    for: 30m
    labels:
      component: concurrency
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: In namespace "{{ $labels.ork_namespace }}", the runs the index marks queued and the runs the limits' lines hold have differed for 30 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyqueuemismatch
      summary: The runs marked queued and the limits' lines disagree.
  - alert: OrkStackConcurrencyUnavailable
    expr: sum by (ork_deployment, ork_namespace) (rate(ork_concurrency_arrivals_total{ork_concurrency_outcome="unavailable"}[5m])) > 0
    for: 5m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Requests for a concurrency slot in namespace "{{ $labels.ork_namespace }}" have found the limit unavailable for 5 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyunavailable
      summary: Concurrency limits do not answer.
  - alert: OrkStackConcurrencyFireNotStarted
    expr: sum by (ork_deployment, ork_namespace) (rate(ork_schedule_fires_total{outcome=~"unavailable|not_started"}[30m])) > 0
    for: 30m
    labels:
      component: concurrency
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Fires of namespace "{{ $labels.ork_namespace }}" have completed without a run, or found the engine unavailable, for 30 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyfirenotstarted
      summary: Schedules' fires start no run.
  - alert: OrkStackConcurrencyIndexMissing
    expr: max by (ork_deployment) (ork_concurrency_index_unavailable) == 1
    for: 5m
    labels:
      component: concurrency
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: An engine booted with the concurrency search attributes missing.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackconcurrencyindexmissing
      summary: The cluster does not index concurrency limits.
