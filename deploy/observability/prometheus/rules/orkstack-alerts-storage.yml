# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-storage
  rules:
  - alert: OrkStackArchiveUnconfirmed
    expr: max by (ork_deployment) (ork_archive_sweep_unconfirmed) > 0
    for: 30m
    labels:
      component: archive
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: For 30 minutes the archive sweep has found finished runs it could not confirm have an archive.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchiveunconfirmed
      summary: Finished runs are not confirmed archived.
  - alert: OrkStackArchiveLossImminent
    expr: max by (ork_deployment) (ork_archive_sweep_unconfirmed) > 0 and on (ork_deployment) min by (ork_deployment) (ork_archive_sweep_earliest_expiry_seconds) < 86400
    labels:
      component: archive
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: A finished run with no confirmed archive is less than a day from the cluster's delete time, or cannot be dated.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchivelossimminent
      summary: An unarchived run expires within a day.
  - alert: OrkStackArchiveSweepBlind
    expr: (count by (ork_deployment) (ork_build_info{ork_orker_id=""}) > 0 unless on (ork_deployment) (time() - max by (ork_deployment) (ork_archive_sweep_last_success_seconds) < 3 * max by (ork_deployment) (ork_cleanup_interval_seconds))) or max by (ork_deployment) (ork_archive_sweep_list_failed) == 1 or max by (ork_deployment) (ork_archive_sweep_interval_too_long) == 1
    for: 10m
    labels:
      component: archive
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The archive sweep has not seen everything for three cleanup intervals, could not list the cluster's finished runs to the end, or runs too rarely for the cluster's retention.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackarchivesweepblind
      summary: The archive sweep cannot see every finished run.
  - alert: OrkStackRunLost
    expr: sum by (ork_deployment) (((ork_archive_sweep_runs_total{outcome="expired"} - last_over_time(ork_archive_sweep_runs_total{outcome="expired"}[1d] offset 1h)) > 0) or ((ork_archive_sweep_runs_total{outcome="expired"} unless last_over_time(ork_archive_sweep_runs_total{outcome="expired"}[1d] offset 1h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 1h)) > 0))) > 0
    labels:
      component: archive
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: The archive sweep found a finished run the cluster had already deleted, with no archive.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackrunlost
      summary: A finished run was lost before it was archived.
  - alert: OrkStackAuditRecordsDropped
    expr: sum by (ork_deployment, action) (((ork_audit_records_total{outcome="dropped"} - last_over_time(ork_audit_records_total{outcome="dropped"}[1d] offset 15m)) > 0) or ((ork_audit_records_total{outcome="dropped"} unless last_over_time(ork_audit_records_total{outcome="dropped"}[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: api
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: 'The audit store refused records of "{{ $labels.action }}": those writes happened and are not audited.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackauditrecordsdropped
      summary: Control-plane audit records were dropped.
  - alert: OrkStackObjectStoreErrors
    expr: sum by (ork_deployment, ork_component) (rate(ork_store_requests_total{outcome="error"}[10m])) / sum by (ork_deployment, ork_component) (rate(ork_store_requests_total[10m])) > 0.05
    for: 10m
    labels:
      component: storage
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Over 5% of the {{ $labels.ork_component }}'s object-store requests have failed for 10 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackobjectstoreerrors
      summary: Object-store requests fail.
  - alert: OrkStackObjectStoreSlow
    expr: histogram_quantile(0.99, sum by (ork_deployment, ork_component, le) (rate(ork_store_request_duration_seconds_bucket[15m]))) > 2
    for: 15m
    labels:
      component: storage
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The 99th percentile of the {{ $labels.ork_component }}'s object-store requests has taken over 2 seconds for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackobjectstoreslow
      summary: Object-store requests are slow.
  - alert: OrkStackStoreClockSkew
    expr: max by (ork_deployment) (abs(ork_store_clock_skew_seconds)) > 0.25 * max by (ork_deployment) (ork_gc_grace_seconds)
    for: 15m
    labels:
      component: storage
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: An engine's clock and the object store's differ by over a quarter of the artifact GC's grace.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackstoreclockskew
      summary: An engine's clock differs from the object store's.
  - alert: OrkStackApiErrors
    expr: sum by (ork_deployment) (rate(rpc_server_call_duration_seconds_count{rpc_code=~"internal|unknown"}[10m])) / sum by (ork_deployment) (rate(rpc_server_call_duration_seconds_count[10m])) > 0.05
    for: 10m
    labels:
      component: api
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Over 5% of API calls have answered `internal` or `unknown` for 10 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackapierrors
      summary: The API answers internal errors.
  - alert: OrkStackApiUnavailable
    expr: sum by (ork_deployment, rpc_method) (rate(rpc_server_call_duration_seconds_count{rpc_code=~"unavailable|resource_exhausted"}[5m])) > 0
    for: 5m
    labels:
      component: api
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: '{{ $labels.rpc_method }} has answered unavailable or resource exhausted for 5 minutes.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackapiunavailable
      summary: An API method answers unavailable.
  - alert: OrkStackIdentityKeysStale
    expr: sum by (ork_deployment) (((ork_identity_keys_copy_stale_total - last_over_time(ork_identity_keys_copy_stale_total[1d] offset 15m)) > 0) or ((ork_identity_keys_copy_stale_total unless last_over_time(ork_identity_keys_copy_stale_total[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: api
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: An engine's copy of the published signing keys is older than its maximum age, so it signs and verifies nothing until the store answers.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackidentitykeysstale
      summary: An engine's copy of the signing keys is stale.
