# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-temporal
  rules:
  - alert: OrkStackTemporalUnreachable
    expr: ((sum by (ork_deployment, ork_component) (rate(temporal_request_failure_total[5m])) or (sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) * 0)) + (sum by (ork_deployment, ork_component) (rate(temporal_long_request_failure_total[5m])) or (sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) * 0))) / clamp_min((sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) or (sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) * 0)) + (sum by (ork_deployment, ork_component) (rate(temporal_long_request_total[5m])) or (sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) * 0)), 1e-9) > 0.5
    for: 2m
    labels:
      component: temporal
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: Over half of the {{ $labels.ork_component }}'s requests to Temporal have failed for 2 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalunreachable
      summary: Most requests to Temporal fail.
  - alert: OrkStackTemporalPollFailures
    expr: (sum by (ork_deployment, ork_component) (rate(temporal_long_request_failure_total[5m])) or (sum by (ork_deployment, ork_component) (rate(temporal_request_total[5m])) * 0)) > 0
    for: 5m
    labels:
      component: temporal
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The {{ $labels.ork_component }}'s long polls of Temporal have failed for 5 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalpollfailures
      summary: Polls of Temporal fail.
  - alert: OrkStackTemporalRateLimited
    expr: sum by (ork_deployment, ork_component) (rate(temporal_request_failure_total{status_code="RESOURCE_EXHAUSTED"}[5m])) > 0
    for: 5m
    labels:
      component: temporal
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Temporal has answered the {{ $labels.ork_component }}'s requests "resource exhausted" for 5 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalratelimited
      summary: Temporal rate-limits OrkStack.
