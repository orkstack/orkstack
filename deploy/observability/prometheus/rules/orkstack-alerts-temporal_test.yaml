# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-temporal.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-temporal
tests:
- name: 'OrkStackTemporalUnreachable: all fail'
  interval: 1m
  input_series:
  - series: temporal_request_total{ork_component="engine",ork_deployment="d"}
    values: 0+10x20
  - series: temporal_request_failure_total{ork_component="engine",status_code="UNAVAILABLE",ork_deployment="d"}
    values: 0+10x20
  - series: temporal_long_request_total{ork_component="engine",ork_deployment="d"}
    values: 0+1x20
  - series: temporal_long_request_failure_total{ork_component="engine",status_code="UNAVAILABLE",ork_deployment="d"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 10m
    alertname: OrkStackTemporalUnreachable
    exp_alerts:
    - exp_labels:
        component: temporal
        ork_component: engine
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: Over half of the engine's requests to Temporal have failed for 2 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalunreachable
        summary: Most requests to Temporal fail.
- name: 'OrkStackTemporalUnreachable: healthy'
  interval: 1m
  input_series:
  - series: temporal_request_total{ork_component="engine",ork_deployment="d"}
    values: 0+10x20
  - series: temporal_long_request_total{ork_component="engine",ork_deployment="d"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 10m
    alertname: OrkStackTemporalUnreachable
    exp_alerts: []
- name: 'OrkStackTemporalPollFailures: failing'
  interval: 1m
  input_series:
  - series: temporal_request_total{ork_component="orker",ork_deployment="d"}
    values: 0+10x30
  - series: temporal_long_request_failure_total{ork_component="orker",status_code="UNAVAILABLE",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTemporalPollFailures
    exp_alerts:
    - exp_labels:
        component: temporal
        ork_component: orker
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The orker's long polls of Temporal have failed for 5 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalpollfailures
        summary: Polls of Temporal fail.
- name: 'OrkStackTemporalPollFailures: healthy'
  interval: 1m
  input_series:
  - series: temporal_request_total{ork_component="orker",ork_deployment="d"}
    values: 0+10x30
  - series: temporal_long_request_failure_total{ork_component="orker",status_code="UNAVAILABLE",ork_deployment="d"}
    values: 4x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTemporalPollFailures
    exp_alerts: []
- name: 'OrkStackTemporalRateLimited: limited'
  interval: 1m
  input_series:
  - series: temporal_request_failure_total{ork_component="engine",status_code="RESOURCE_EXHAUSTED",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTemporalRateLimited
    exp_alerts:
    - exp_labels:
        component: temporal
        ork_component: engine
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Temporal has answered the engine's requests "resource exhausted" for 5 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktemporalratelimited
        summary: Temporal rate-limits OrkStack.
- name: 'OrkStackTemporalRateLimited: other failures'
  interval: 1m
  input_series:
  - series: temporal_request_failure_total{ork_component="engine",status_code="NOT_FOUND",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTemporalRateLimited
    exp_alerts: []
