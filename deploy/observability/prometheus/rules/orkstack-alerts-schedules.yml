# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
groups:
- name: orkstack-schedules
  rules:
  - alert: OrkStackScheduleFiresFailing
    expr: (sum by (ork_deployment, ork_namespace, ork_schedule) (increase(ork_schedule_fires_total{outcome=~"refused|unavailable"}[3h])) >= 3) unless on (ork_deployment, ork_namespace, ork_schedule) (sum by (ork_deployment, ork_namespace, ork_schedule) (increase(ork_schedule_fires_total{outcome="started"}[3h])) > 0)
    labels:
      component: schedules
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Schedule "{{ $labels.ork_schedule }}" of namespace "{{ $labels.ork_namespace }}" fired at least 3 times in 3 hours and started no run. Namespaces exported to this sink only; with object labels off, the schedule is not named.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresfailing
      summary: A schedule's fires start no runs.
  - alert: OrkStackScheduleFiresSkipped
    expr: sum by (ork_deployment, ork_namespace, ork_schedule) (increase(ork_schedule_actions_skipped_total{ork_schedule_skip_reason="overlap"}[3h])) >= 3
    labels:
      component: schedules
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: Schedule "{{ $labels.ork_schedule }}" of namespace "{{ $labels.ork_namespace }}" skipped at least 3 fires in 3 hours because of its overlap policy.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresskipped
      summary: A schedule skips fires while its last run is still running.
  - alert: OrkStackScheduleFiresMissed
    expr: sum by (ork_deployment, ork_namespace, ork_schedule) (increase(ork_schedule_actions_skipped_total{ork_schedule_skip_reason="catchup_window"}[1h])) > 0
    labels:
      component: schedules
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Schedule "{{ $labels.ork_schedule }}" of namespace "{{ $labels.ork_namespace }}" missed fires that fell outside its catch-up window.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresmissed
      summary: A schedule missed fires past its catch-up window.
  - alert: OrkStackScheduleFireLate
    expr: histogram_quantile(0.95, sum by (ork_deployment, ork_namespace, le) (rate(ork_schedule_fire_lag_seconds_bucket[15m]))) > 300 unless on (ork_deployment, ork_namespace) sum by (ork_deployment, ork_namespace) (increase(ork_schedule_requests_total{action="backfill"}[1h])) > 0
    for: 15m
    labels:
      component: schedules
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: The 95th percentile of how late namespace "{{ $labels.ork_namespace }}"'s schedules fired has been over 5 minutes for 15 minutes, with no backfill running.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefirelate
      summary: Schedules fire late.
  - alert: OrkStackScheduleOverdue
    expr: min by (ork_deployment, ork_namespace) (ork_schedule_next_fire_seconds) < time() - 600
    for: 10m
    labels:
      component: schedules
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: A schedule of namespace "{{ $labels.ork_namespace }}" should have fired over 10 minutes ago and has not.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackscheduleoverdue
      summary: A schedule's next fire is overdue.
  - alert: OrkStackScheduleCensusPartial
    expr: min by (ork_deployment) (ork_schedule_census_coverage_ratio) < 1 or max by (ork_deployment) (ork_schedule_census_unavailable_ratio) == 1
    for: 15m
    labels:
      component: schedules
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: The engines' census of schedules has covered only some of them, or none, for 15 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulecensuspartial
      summary: The schedule census reads only some schedules.
  - alert: OrkStackWebhookFailing
    expr: (sum by (ork_deployment, ork_namespace, ork_webhook_id) (increase(ork_webhook_deliveries_total{outcome="final_failure"}[1h])) >= 3) unless on (ork_deployment, ork_namespace, ork_webhook_id) (sum by (ork_deployment, ork_namespace, ork_webhook_id) (increase(ork_webhook_deliveries_total{outcome="delivered"}[1h])) > 0)
    for: 30m
    labels:
      component: webhooks
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Webhook "{{ $labels.ork_webhook_id }}" of namespace "{{ $labels.ork_namespace }}" has failed at least 3 deliveries for good in an hour and delivered none. Namespaces exported to this sink only; with object labels off, the webhook is not named.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookfailing
      summary: A webhook's deliveries all fail.
  - alert: OrkStackWebhookDeliveriesPending
    expr: max by (ork_deployment) (ork_webhook_deliveries_pending{ork_age_over="5m"}) > 0
    for: 10m
    labels:
      component: webhooks
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Some webhook deliveries have waited over 5 minutes, for 10 minutes.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdeliveriespending
      summary: Webhook deliveries have been pending over 5 minutes.
  - alert: OrkStackWebhookDeliveriesStuck
    expr: max by (ork_deployment) (ork_webhook_deliveries_pending{ork_age_over="1h"}) > 0
    labels:
      component: webhooks
      severity: critical
    annotations:
      dashboard: /d/orkstack
      description: Some webhook deliveries have waited over an hour.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdeliveriesstuck
      summary: Webhook deliveries have been pending over an hour.
  - alert: OrkStackWebhookDestinationBlocked
    expr: sum by (ork_deployment, ork_namespace) (((ork_webhook_attempts_total{ork_webhook_class="blocked"} - last_over_time(ork_webhook_attempts_total{ork_webhook_class="blocked"}[1d] offset 1h)) > 0) or ((ork_webhook_attempts_total{ork_webhook_class="blocked"} unless last_over_time(ork_webhook_attempts_total{ork_webhook_class="blocked"}[1d] offset 1h)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 1h)) > 0))) > 0
    labels:
      component: webhooks
      severity: info
    annotations:
      dashboard: /d/orkstack
      description: 'A webhook delivery of namespace "{{ $labels.ork_namespace }}" was not sent: its destination resolves to a network the deployment does not allow.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdestinationblocked
      summary: A webhook's destination is blocked by the network policy.
  - alert: OrkStackWebhookNotQueued
    expr: sum by (ork_deployment, ork_namespace, reason) (((ork_webhook_not_queued_total - last_over_time(ork_webhook_not_queued_total[1d] offset 15m)) > 0) or ((ork_webhook_not_queued_total unless last_over_time(ork_webhook_not_queued_total[1d] offset 15m)) and on (ork_deployment) (count by (ork_deployment) (last_over_time(ork_build_info[1d] offset 15m)) > 0))) > 0
    labels:
      component: webhooks
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: 'Events of namespace "{{ $labels.ork_namespace }}" were not queued for delivery: {{ $labels.reason }}.'
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhooknotqueued
      summary: Run events were not queued for webhook delivery.
  - alert: OrkStackTriggerUnavailable
    expr: sum by (ork_deployment, ork_namespace) (rate(ork_trigger_invocations_total{outcome="unavailable"}[5m])) > 0
    for: 5m
    labels:
      component: triggers
      severity: warning
    annotations:
      dashboard: /d/orkstack
      description: Triggers of namespace "{{ $labels.ork_namespace }}" have answered unavailable for 5 minutes. Namespaces exported to this sink only.
      runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktriggerunavailable
      summary: HTTP triggers answer unavailable.
