# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-runs.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-runs
tests:
- name: 'OrkStackRunFailureRatioHigh: half fail'
  interval: 1m
  input_series:
  - series: ork_runs_total{ork_namespace="n",status="failed",ork_deployment="d"}
    values: 0+1x60
  - series: ork_runs_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+1x60
  alert_rule_test:
  - eval_time: 45m
    alertname: OrkStackRunFailureRatioHigh
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Over 20% of namespace "n"'s finished runs failed in the last 15 minutes, out of at least 10. Namespaces exported to this sink only.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackrunfailureratiohigh
        summary: Over a fifth of a namespace's runs fail.
- name: 'OrkStackRunFailureRatioHigh: few runs'
  interval: 1m
  input_series:
  - series: ork_runs_total{ork_namespace="n",status="failed",ork_deployment="d"}
    values: 0+0.1x60
  alert_rule_test:
  - eval_time: 45m
    alertname: OrkStackRunFailureRatioHigh
    exp_alerts: []
- name: 'OrkStackRunFailureRatioHigh: few failures'
  interval: 1m
  input_series:
  - series: ork_runs_total{ork_namespace="n",status="failed",ork_deployment="d"}
    values: 0+0.1x60
  - series: ork_runs_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+2x60
  alert_rule_test:
  - eval_time: 45m
    alertname: OrkStackRunFailureRatioHigh
    exp_alerts: []
- name: 'OrkStackInfrastructureErrors: a tenth'
  interval: 1m
  input_series:
  - series: ork_tasks_total{ork_namespace="n",status="failed",failure_category="infrastructure_error",ork_deployment="d"}
    values: 0+1x40
  - series: ork_tasks_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+9x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackInfrastructureErrors
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Over 5% of namespace "n"'s finished tasks failed with an infrastructure error in the last 15 minutes. Namespaces exported to this sink only.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackinfrastructureerrors
        summary: Tasks fail for infrastructure reasons.
- name: 'OrkStackInfrastructureErrors: workload failures only'
  interval: 1m
  input_series:
  - series: ork_tasks_total{ork_namespace="n",status="failed",failure_category="activity_failed",ork_deployment="d"}
    values: 0+5x40
  - series: ork_tasks_total{ork_namespace="n",status="succeeded",ork_deployment="d"}
    values: 0+9x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackInfrastructureErrors
    exp_alerts: []
- name: 'OrkStackIntegrityFailure: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackIntegrityFailure
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_failure_reason: COMMIT_UNDECODABLE
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: 'An attempt failed "COMMIT_UNDECODABLE": a stored object, commit or value did not match what was written, or the Orker panicked.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackintegrityfailure
        summary: Stored data is not what was written.
- name: 'OrkStackIntegrityFailure: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackIntegrityFailure
    exp_alerts: []
- name: 'OrkStackIntegrityFailure: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackIntegrityFailure
    exp_alerts: []
- name: 'OrkStackIntegrityFailure: growth during a 20m gap'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",ork_deployment="d"}
    values: 1x400 _x4 2x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackIntegrityFailure
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_failure_reason: COMMIT_UNDECODABLE
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: 'An attempt failed "COMMIT_UNDECODABLE": a stored object, commit or value did not match what was written, or the Orker panicked.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackintegrityfailure
        summary: Stored data is not what was written.
- name: 'OrkStackIntegrityFailure: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackIntegrityFailure
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_failure_reason: COMMIT_UNDECODABLE
