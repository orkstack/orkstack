- name: 'OrkStackAdmissionRefusing: held'
  interval: 1m
  input_series:
  - series: ork_runs_refused_total{ork_namespace="n",ork_refusal_reason="namespace_held",ork_deployment="d"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackAdmissionRefusing
    exp_alerts:
    - exp_labels:
        component: runs
        ork_deployment: d
        ork_namespace: 'n'
        ork_refusal_reason: namespace_held
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: 'Namespace "n" has refused submissions for 15 minutes: namespace_held. Namespaces exported to this sink only.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackadmissionrefusing
        summary: A namespace refuses submissions.
