    values: 1x300
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackIntegrityFailure
    exp_alerts: []
