    values: 1x400
  - series: ork_deployment_orker_tasks_total{ork_failure_reason="COMMIT_UNDECODABLE",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
