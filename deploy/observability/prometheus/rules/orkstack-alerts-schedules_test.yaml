  - series: ork_webhook_not_queued_total{ork_namespace="n",reason="body_unstored",ork_deployment="d"}
    values: 7x20
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackWebhookNotQueued
    exp_alerts: []
- name: 'OrkStackTriggerUnavailable: unavailable'
  interval: 1m
  input_series:
  - series: ork_trigger_invocations_total{ork_namespace="n",outcome="unavailable",ork_deployment="d"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackTriggerUnavailable
    exp_alerts:
    - exp_labels:
        component: triggers
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Triggers of namespace "n" have answered unavailable for 5 minutes. Namespaces exported to this sink only.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstacktriggerunavailable
        summary: HTTP triggers answer unavailable.
- name: 'OrkStackTriggerUnavailable: started'
