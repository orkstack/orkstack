# Generated by `go run ./internal/alerts/cmd/genalerts` from internal/alerts.
# Do not edit: TestAlerts_AreGenerated refuses a stale file.
rule_files:
- orkstack-records.yml
- orkstack-alerts-schedules.yml
evaluation_interval: 5m
group_eval_order:
- orkstack-records
- orkstack-schedules
tests:
- name: 'OrkStackScheduleFiresFailing: refused'
  interval: 10m
  input_series:
  - series: ork_schedule_fires_total{ork_namespace="n",ork_schedule="nightly",outcome="refused",ork_deployment="d"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackScheduleFiresFailing
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        ork_namespace: 'n'
        ork_schedule: nightly
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Schedule "nightly" of namespace "n" fired at least 3 times in 3 hours and started no run. Namespaces exported to this sink only; with object labels off, the schedule is not named.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresfailing
        summary: A schedule's fires start no runs.
- name: 'OrkStackScheduleFiresFailing: some started'
  interval: 10m
  input_series:
  - series: ork_schedule_fires_total{ork_namespace="n",ork_schedule="nightly",outcome="refused",ork_deployment="d"}
    values: 0+1x20
  - series: ork_schedule_fires_total{ork_namespace="n",ork_schedule="nightly",outcome="started",ork_deployment="d"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackScheduleFiresFailing
    exp_alerts: []
- name: 'OrkStackScheduleFiresSkipped: overlapping'
  interval: 10m
  input_series:
  - series: ork_schedule_actions_skipped_total{ork_namespace="n",ork_schedule="nightly",ork_schedule_skip_reason="overlap",ork_deployment="d"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackScheduleFiresSkipped
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        ork_namespace: 'n'
        ork_schedule: nightly
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: Schedule "nightly" of namespace "n" skipped at least 3 fires in 3 hours because of its overlap policy.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresskipped
        summary: A schedule skips fires while its last run is still running.
- name: 'OrkStackScheduleFiresSkipped: rarely'
  interval: 10m
  input_series:
  - series: ork_schedule_actions_skipped_total{ork_namespace="n",ork_schedule="nightly",ork_schedule_skip_reason="overlap",ork_deployment="d"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 3h
    alertname: OrkStackScheduleFiresSkipped
    exp_alerts: []
- name: 'OrkStackScheduleFiresMissed: missed'
  interval: 1m
  input_series:
  - series: ork_schedule_actions_skipped_total{ork_namespace="n",ork_schedule="nightly",ork_schedule_skip_reason="catchup_window",ork_deployment="d"}
    values: 0x10 1x30
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleFiresMissed
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        ork_namespace: 'n'
        ork_schedule: nightly
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Schedule "nightly" of namespace "n" missed fires that fell outside its catch-up window.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefiresmissed
        summary: A schedule missed fires past its catch-up window.
- name: 'OrkStackScheduleFiresMissed: on time'
  interval: 1m
  input_series:
  - series: ork_schedule_actions_skipped_total{ork_namespace="n",ork_schedule="nightly",ork_schedule_skip_reason="catchup_window",ork_deployment="d"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleFiresMissed
    exp_alerts: []
- name: 'OrkStackScheduleFireLate: late'
  interval: 1m
  input_series:
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="60",ork_deployment="d"}
    values: '0x60'
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="900",ork_deployment="d"}
    values: 0+1x60
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="+Inf",ork_deployment="d"}
    values: 0+1x60
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackScheduleFireLate
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: The 95th percentile of how late namespace "n"'s schedules fired has been over 5 minutes for 15 minutes, with no backfill running.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulefirelate
        summary: Schedules fire late.
- name: 'OrkStackScheduleFireLate: a backfill'
  interval: 1m
  input_series:
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="60",ork_deployment="d"}
    values: '0x60'
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="900",ork_deployment="d"}
    values: 0+1x60
  - series: ork_schedule_fire_lag_seconds_bucket{ork_namespace="n",ork_schedule="nightly",le="+Inf",ork_deployment="d"}
    values: 0+1x60
  - series: ork_schedule_requests_total{ork_namespace="n",action="backfill",ork_deployment="d"}
    values: 0x10 1x50
  alert_rule_test:
  - eval_time: 40m
    alertname: OrkStackScheduleFireLate
    exp_alerts: []
- name: 'OrkStackScheduleOverdue: overdue'
  interval: 1m
  input_series:
  - series: ork_schedule_next_fire_seconds{ork_namespace="n",ork_schedule="nightly",ork_deployment="d"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleOverdue
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        ork_namespace: 'n'
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: A schedule of namespace "n" should have fired over 10 minutes ago and has not.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackscheduleoverdue
        summary: A schedule's next fire is overdue.
- name: 'OrkStackScheduleOverdue: in the future'
  interval: 1m
  input_series:
  - series: ork_schedule_next_fire_seconds{ork_namespace="n",ork_schedule="nightly",ork_deployment="d"}
    values: 3600x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleOverdue
    exp_alerts: []
- name: 'OrkStackScheduleCensusPartial: half covered'
  interval: 1m
  input_series:
  - series: ork_schedule_census_coverage_ratio{ork_deployment="d"}
    values: 0.5x40
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleCensusPartial
    exp_alerts:
    - exp_labels:
        component: schedules
        ork_deployment: d
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: The engines' census of schedules has covered only some of them, or none, for 15 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackschedulecensuspartial
        summary: The schedule census reads only some schedules.
- name: 'OrkStackScheduleCensusPartial: all covered'
  interval: 1m
  input_series:
  - series: ork_schedule_census_coverage_ratio{ork_deployment="d"}
    values: 1x40
  - series: ork_schedule_census_unavailable_ratio{ork_deployment="d"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: OrkStackScheduleCensusPartial
    exp_alerts: []
- name: 'OrkStackWebhookFailing: failing'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_total{ork_namespace="n",ork_webhook_id="w1",outcome="final_failure",ork_deployment="d"}
    values: 0+1x90
  alert_rule_test:
  - eval_time: 80m
    alertname: OrkStackWebhookFailing
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        ork_namespace: 'n'
        ork_webhook_id: w1
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Webhook "w1" of namespace "n" has failed at least 3 deliveries for good in an hour and delivered none. Namespaces exported to this sink only; with object labels off, the webhook is not named.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookfailing
        summary: A webhook's deliveries all fail.
- name: 'OrkStackWebhookFailing: some delivered'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_total{ork_namespace="n",ork_webhook_id="w1",outcome="final_failure",ork_deployment="d"}
    values: 0+1x90
  - series: ork_webhook_deliveries_total{ork_namespace="n",ork_webhook_id="w1",outcome="delivered",ork_deployment="d"}
    values: 0+1x90
  alert_rule_test:
  - eval_time: 80m
    alertname: OrkStackWebhookFailing
    exp_alerts: []
- name: 'OrkStackWebhookDeliveriesPending: pending'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_pending{ork_age_over="5m",ork_deployment="d"}
    values: 2x30
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackWebhookDeliveriesPending
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: Some webhook deliveries have waited over 5 minutes, for 10 minutes.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdeliveriespending
        summary: Webhook deliveries have been pending over 5 minutes.
- name: 'OrkStackWebhookDeliveriesPending: none'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_pending{ork_age_over="5m",ork_deployment="d"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: OrkStackWebhookDeliveriesPending
    exp_alerts: []
- name: 'OrkStackWebhookDeliveriesStuck: stuck'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_pending{ork_age_over="1h",ork_deployment="d"}
    values: 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackWebhookDeliveriesStuck
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        severity: critical
      exp_annotations:
        dashboard: /d/orkstack
        description: Some webhook deliveries have waited over an hour.
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdeliveriesstuck
        summary: Webhook deliveries have been pending over an hour.
- name: 'OrkStackWebhookDeliveriesStuck: none'
  interval: 1m
  input_series:
  - series: ork_webhook_deliveries_pending{ork_age_over="1h",ork_deployment="d"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackWebhookDeliveriesStuck
    exp_alerts: []
- name: 'OrkStackWebhookDestinationBlocked: appears'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",ork_deployment="d"}
    values: _x390 1x20
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: 'A webhook delivery of namespace "n" was not sent: its destination resolves to a network the deployment does not allow.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdestinationblocked
        summary: A webhook's destination is blocked by the network policy.
- name: 'OrkStackWebhookDestinationBlocked: steady for 2 days'
  interval: 10m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x300
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",ork_deployment="d"}
    values: 5x300
  alert_rule_test:
  - eval_time: 48h
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts: []
- name: 'OrkStackWebhookDestinationBlocked: 10m gap, same value'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",ork_deployment="d"}
    values: 1x400 _x2 1x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts: []
- name: 'OrkStackWebhookDestinationBlocked: growth during a 20m gap'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",ork_deployment="d"}
    values: 1x400 _x4 2x20
  alert_rule_test:
  - eval_time: 2030m
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: 'A webhook delivery of namespace "n" was not sent: its destination resolves to a network the deployment does not allow.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdestinationblocked
        summary: A webhook's destination is blocked by the network policy.
- name: 'OrkStackWebhookDestinationBlocked: same Orker under a new instance'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        ork_namespace: 'n'
        severity: info
      exp_annotations:
        dashboard: /d/orkstack
        description: 'A webhook delivery of namespace "n" was not sent: its destination resolves to a network the deployment does not allow.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhookdestinationblocked
        summary: A webhook's destination is blocked by the network policy.
- name: 'OrkStackWebhookDestinationBlocked: a new Prometheus meets a counter already above 0'
  interval: 5m
  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x20
  - series: ork_webhook_attempts_total{ork_namespace="n",ork_webhook_class="blocked",ork_deployment="d"}
    values: 7x20
  alert_rule_test:
  - eval_time: 5m
    alertname: OrkStackWebhookDestinationBlocked
    exp_alerts: []
- name: 'OrkStackWebhookNotQueued: appears'
  interval: 5m
