  input_series:
  - series: ork_build_info{ork_deployment="d"}
    values: 1x420
  - series: ork_webhook_not_queued_total{ork_namespace="n",reason="body_unstored",instance="a",ork_deployment="d"}
    values: 1x400
  - series: ork_webhook_not_queued_total{ork_namespace="n",reason="body_unstored",instance="b",ork_deployment="d"}
    values: _x390 1x10
  alert_rule_test:
  - eval_time: 1955m
    alertname: OrkStackWebhookNotQueued
    exp_alerts:
    - exp_labels:
        component: webhooks
        ork_deployment: d
        ork_namespace: 'n'
        reason: body_unstored
        severity: warning
      exp_annotations:
        dashboard: /d/orkstack
        description: 'Events of namespace "n" were not queued for delivery: body_unstored.'
        runbook_url: https://github.com/orkstack/orkstack/blob/main/docs/RUNBOOKS.md#orkstackwebhooknotqueued
