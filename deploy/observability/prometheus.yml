# Prometheus for the `observability` compose profile.
#
# Every signal is pushed: ork and orker send OTLP to the Collector, which
# writes metrics here through Prometheus's OTLP receiver
# (`--web.enable-otlp-receiver`, set on the service's command). Nothing is
# scraped, so no route from this container to the host is needed
# (TestKit_NoScrapeConfigs).
global:
  evaluation_interval: 15s

# The kit's alert and recording rules, generated by internal/alerts
# (docs/RUNBOOKS.md). Their promtool tests, *_test.yaml beside them, are not
# rule files and are not loaded.
rule_files:
  - /etc/prometheus/rules/orkstack-*.yml

otlp:
  # The resource attributes a panel or rule reads as labels. job and
  # instance come from service.name and service.instance.id.
  promote_resource_attributes:
    - ork.component
    - ork.deployment
    - ork.build_id

storage:
  tsdb:
    # A pushed point can arrive late (a retried export); accept up to 30 m.
    out_of_order_time_window: 30m
