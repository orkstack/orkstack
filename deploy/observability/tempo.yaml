# Minimal single-binary Tempo config for the `observability` compose profile.
# Local disk storage only — this is a laptop stack, not a production backend.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # Tempo 2.x+ binds receivers to localhost by default; the Collector dials by service name
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
