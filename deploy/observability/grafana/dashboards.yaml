# The kit's two dashboards, OrkStack and OrkStack / Run, provisioned from
# ./dashboards: generated by internal/dashboards
# (go run ./internal/dashboards/cmd/gendashboards), never edited by hand and
# never saved from the UI.
apiVersion: 1

providers:
  - name: orkstack
    folder: OrkStack
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
