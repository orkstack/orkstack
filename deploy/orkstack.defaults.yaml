# OrkStack configuration file — generated defaults.
#
# Every key config.Schema knows about, written at its own built-in
# default, nested by section in Schema's declaration order. docs/DEPLOY.md
# §1 documents each key. This file changes nothing when used as-is: loading it
# with --config and applying it sets every value to what the binary
# already falls back to with no file at all.
#
# GENERATED — do not hand-edit. Regenerate with "make config-defaults" (or
# "ork --defaults" / "orker --defaults") whenever internal/config/config.go
# gains, loses, or changes a Schema entry; internal/config/defaults_file_test.go
# fails the build until this file matches again.
#
# A key written active below (uncommented) carries a real literal default —
# uncomment and edit only what you mean to change. A key left commented
# has no single fixed default to write: either its value is computed at
# runtime (see the note on that line), or it belongs to an SDK/library this
# package does not second-guess. See deploy/orkstack.example.yaml for a
# worked, hand-annotated example, and docs/DEPLOY.md §1 for the full
# mechanism (--config, ORK_CONFIG_FILE, {ork:,orker:}, {file:}, --check).

temporal:
  address: localhost:7233
  namespace: ork-main
  tls:
    enabled: ""  # empty is off unless a file or server_name below is set; false beside one is refused
    ca_file: ""  # empty verifies against the system roots
    cert_file: ""  # set with key_file, for mutual TLS
    key_file: ""  # set with cert_file
    server_name: ""  # empty is the address's host
  api_key_file: ""  # a file holding the key, never the key

deployment:
  name: orkstack
  build_id: ""  # empty means versioning is off

process:
  allow_debug: false

pool:
  name: main
  # queue: ""  # derived from the pool

storage:
  backend: local
  dir: ./.data/artifacts
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: orkstack-artifacts
    access_key: ""  # set with secret_key; empty uses the default credential chain, such as an instance or pod role
    secret_key: ""  # set with access_key; empty uses the default credential chain, such as an instance or pod role
    session_token: ""  # for temporary credentials
    path_style: true

engine:
  http_addr: :8080  # ork
  ws_allowed_origins: []  # ork
  http_idle_timeout: 15m  # ork
  # request_max_bytes: ""  # ork; 1 MiB + 4 KiB × engine.orkflow_max_tasks, 17432576 at the default ceiling; never set under that
  allowed_hosts: []  # ork; an IP address, localhost and *.localhost, a name without a dot, and the host ORK_HTTP_ADDR names are always admitted
  ui:
    enabled: true  # ork
    dir: ""  # ork; the build compiled into ork
  idempotency_ttl: 24h  # ork
  registry_auth_file: ""  # ork
  stats_cache_ttl: 5s  # ork
  each_max_items: 1000  # ork
  orkflow_max_tasks: 4000  # ork
  history:
    max_events: 51200  # ork
    max_bytes: 52428800  # 50 MiB; ork
  continuation:
    enabled: true  # ork
    events: 8192  # ork
    bytes: 8388608  # 8 MiB; ork
    restore_timeout: 1h  # ork
  definition_by_reference: true  # ork
  snapshot_overlays: true  # ork
  run_max_in_flight: 500  # ork
  pin_creation_timeout: 5m  # ork
  interruptions:
    lost: 3  # ork
    lost_run_cap: 20  # ork
    handed_back: 10  # ork
    never_started: 20  # ork
    never_started_faults: 5  # ork
    never_started_backoff: 2s  # ork
  pool_metrics:
    pools: []  # ork
    interval: 15s  # ork
  run_timeout_handler_grace: 10m  # ork
  run_pause_timeout: 168h  # ork
  run_pause_timeout_max: 744h  # ork
  concurrency:
    max_entries: 500  # ork
    max_tombstones: 1000  # ork
    max_labels: 32  # ork
    acquire_timeout: 2m  # ork
    clock_grace: 1m  # ork
    tombstone_margin: 1m  # ork
    verify_min_age: 10s  # ork
    verify_debounce: 5s  # ork
    verify_await: 10s  # ork
    verify_parallel: 16  # ork
    verify_batch: 64  # ork
    verify_timeout: 30s  # ork
    task_ack_grace: 2m  # ork
    task_confirm_batch: 8  # ork
    stalled_after: 10m  # ork
    holder_sweep_interval: 10m  # ork
    grant_backoff_min: 1s  # ork
    grant_backoff_max: 30s  # ork
    rebuild_page_timeout: 30s  # ork
    rebuild_settle: 30s  # ork
    rebuild_backoff_min: 1s  # ork
    rebuild_backoff_max: 5m  # ork
    rebuild_timeout: 10m  # ork
    freeze_timeout: 1m  # ork
    drain_margin: 5s  # ork
    gate_continue_events: 2000  # ork
    gate_continue_updates: 500  # ork
    gate_linger: 5m  # ork
    census_interval: 1m  # ork
    census_timeout: 5m  # ork
    census_max_gates: 2000  # ork
    census_parallel: 8  # ork
    max_active_keys_per_namespace: 1000  # ork
    max_queued_runs_per_namespace: 1000  # ork
    max_limits_per_orkflow: 32  # ork
    max_run_slot_entries: 64  # ork
    per_slot_bytes: 2048  # 2 KiB; ork
    default_queue_timeout: 2h  # ork
    min_queue_timeout: 10s  # ork
    max_queue_timeout: 168h  # ork
    acquire_backoff_min: 200ms  # ork
    acquire_backoff_max: 10s  # ork
    requeue_interval: 1m  # ork
    requeue_backoff_factor: 2  # ork
    requeue_interval_max: 15m  # ork
    retry_after: 1m  # ork
    event_holders_shown: 5  # ork
    api_holders_shown: 10  # ork
  compose_max_depth: 4  # ork
  cache_max_ttl: 168h  # ork
  usage_cache_ttl: 5m  # ork
  limits:
    values_max_bytes: 262144  # 256 KiB; ork
    artifact_max_count: 256  # ork
    artifact_max_bytes: 5368709120  # 5 GiB; ork
    log_max_bytes: 16777216  # 16 MiB; ork
    commit_max_bytes: 4194304  # 4 MiB; ork
    # transfer_budget_seconds: ""  # ork; max(300, artifact_max_count × artifact_max_bytes ÷ floor throughput)
    floor_throughput_bytes_per_sec: 10485760  # 10 MiB/s; ork
  cleanup:
    enabled: false  # ork
    interval: 1h  # ork
    retention_buffer: 24h  # ork
    batch_size: 100  # ork
    artifact_gc: dry_run  # ork
    artifact_gc_grace: 1h  # ork
    artifact_gc_batch: 1000  # ork

event_sources:
  enabled: false  # ork
  allow_asserted: false  # ork
  max_message_bytes: 1048576  # ork
  max_input_bytes: 16384  # ork
  max_rate: 100  # ork
  namespace_rate: 200  # ork
  max_sources: 200  # ork
  max_per_namespace: 20  # ork
  max_instances: 4  # ork
  namespace_instances: 20  # ork

webhooks:
  allowed_networks: []  # ork; empty admits public addresses only

# activities: {}  # ork; built-in shell/http/file/json/git/template → ghcr.io/orkstack/activity-*:0.3

orker:
  # id: ""  # orker; hostname-<hash of the work dir>
  # workdir: ""  # orker; temp dir
  image_layout: /var/lib/orkstack/images  # orker
  env_allowlist: []  # orker
  secret_schemes:  # orker
    - env
    - file
  secret_allow: []  # orker
  namespaces: []  # orker
  registry_auth_file: ""  # orker
  task_log_export: false  # orker
  heartbeat_interval: 5s  # orker
  usage_sample_interval: 5s  # orker
  usage_log_interval: 30s  # orker
  stop:
    grace: 24h  # orker
  max_concurrent: 16  # orker
  store_check:
    enabled: true  # orker
    interval: 15s  # orker
    timeout: 5s  # orker
    failures: 3  # orker
    recoveries: 2  # orker
  store_scope_recheck: 1h  # orker
  capacity:
    cpu: ""  # orker
    memory: ""  # orker
  pins:
    max_concurrent: 0  # orker
  log:
    flush_bytes: 65536  # 64 KiB; orker
    flush_interval: 500ms  # orker
    max_bytes: 16777216  # 16 MiB; orker
    mask_secrets: true  # orker
  resources:
    default_cpu: 1  # orker
    default_memory: 1Gi  # orker
    max_cpu: 8  # orker
    max_memory: 16Gi  # orker
    max_gpu: 1  # orker
    pids_limit: 512  # orker
    tmpfs_bytes: 67108864  # 64 MiB; orker
    force_user: false  # orker
  cdi:
    spec_dirs:  # orker
      - /etc/cdi
      - /var/run/cdi
  docker:
    # bin: ""  # orker; docker on PATH
    cli: docker  # orker
    pull_timeout: 5m  # orker
    bind_probe_timeout: 2m  # orker
  metadata_probe: off  # orker
  # profiles: {}  # orker; no profiles; probe_image, when profiles are set: this release's ghcr.io/orkstack/orker:<version>, resolved at boot
  values:
    refuse_secrets: true  # orker
  refuse_readable_engine_keys: false  # orker
  engine:
    url: ""  # orker; no engine: no identities
    ca_file: ""  # orker; the system's roots
    auth:
      method: ""  # orker; token_file, service_account or mtls
      service_account: ""  # orker
      token_file: ""  # orker
      cert_file: ""  # orker
      key_file: ""  # orker

telemetry:
  log_format: text
  log_level: info
  admin_addr: ""  # no listener when unset
  admin_allowed_hosts: []  # an IP address, localhost and *.localhost, a name without a dot, and the host ORK_ADMIN_ADDR names are always admitted
  pprof_enabled: false
  high_cardinality: false
  orkflow_label: true  # ork
  object_labels: false  # ork
  metric_cardinality_limit: 2000
  census_requests_per_minute: 60  # ork
  service_name:
    ork: ork
    orker: orker
  resource_attributes: {}
  exporters:
    traces: none
    metrics:
      - none
    logs: none
  sampler: {}
    # sampler.name: ""  # SDK default: parentbased_always_on
    # sampler.arg: ""  # SDK default
  otlp: {}
    # otlp.endpoint: ""  # SDK defaults
    # otlp.protocol: ""  # SDK defaults
    # otlp.headers: {}  # SDK defaults
    # otlp.timeout: ""  # SDK defaults
    # otlp.certificate: ""  # SDK defaults
    # otlp.traces.endpoint: ""  # SDK defaults
    # otlp.traces.headers: {}  # SDK defaults
    # otlp.metrics.endpoint: ""  # SDK defaults
    # otlp.metrics.headers: {}  # SDK defaults
    # otlp.logs.endpoint: ""  # SDK defaults
    # otlp.logs.headers: {}  # SDK defaults
  batch: {}
    # batch.metric_export_interval: ""  # SDK default
  # sinks: {}  # no named sinks

auth:
  mode: asserted  # ork
  public_url: ""  # ork; no break-glass audience
  # issuers: {}  # ork; no trusted issuer
  admins: []  # ork
  # orkers: {}  # ork; no Orker bound by configuration
  break_glass_key_file: ""  # ork; break-glass off
  signin:
    key_files: []  # ork; no sign-in
    max_age: 12h  # ork
    idle_timeout: 1h  # ork
    revalidate_interval: 10m  # ork
  clock_skew: 1m  # ork
  policy_refresh: 10s  # ork
  policy_stale_limit: 5m  # ork

identity:
  issuer: ""  # ork; task identity off
  serve_discovery: true  # ork
  signing:
    key_files: []  # ork
    algorithm: RS256  # ork
    activation_delay: 24h  # ork
    verify_published: true  # ork
  keys_copy_file: ""  # ork; no copy on disk
  keys_copy_max_age: 1h  # ork
  subject_format: ork  # ork
  spiffe:
    trust_domain: ""  # ork; no SPIFFE ID on any token
