# Grype's configuration for `make vuln-images` (nightly.yml › vuln-images):
# what the image scan reports and what fails it. The scanner's own image is
# deploy/grype-image.txt.
#
# A finding fails the scan when a fixed version exists and its severity is
# high or critical: that is the one a pull request can act on, by moving a
# base image's digest or a package's pin. Every fixed finding of a lower
# severity is listed and fails nothing; one with no fix is not listed.
only-fixed: true
fail-on-severity: high
check-for-app-update: false
# A database Grype could not check for an update fails the scan, rather than
# judging the images by an older one.
db:
  require-update-check: true

# OrkStack's own binaries are govulncheck's (`make vuln`), which reports only
# the vulnerabilities whose vulnerable code the module reaches, so their Go
# modules and standard library are not judged here a second time. Every other
# binary an image carries (the orker image's docker CLI, the template
# activity's gomplate) is judged here, with the image's OS packages.
ignore:
  - package:
      type: go-module
      location: /usr/local/bin/ork
  - package:
      type: go-module
      location: /usr/local/bin/orker
  - package:
      type: go-module
      location: /usr/local/bin/orkctl

  # Waivers: one fixed vulnerability set aside in one package of one binary,
  # with the user's approval. Each names the vulnerability, the package's
  # exact name, version, type and location, and a reason that opens with the
  # date it is reviewed by, at most 30 days ahead; past that date the waiver
  # is renewed or removed (no test enforces the date or the shape). Remove a
  # waiver once the fix ships.
  - vulnerability: GHSA-mgcc-cww5-fp2q
    reason: >-
      review-by 2026-11-30: go-jose/v4 v4.1.4 is built into gomplate v5.3.1,
      its latest release, and is fixed in v4.1.6, which gomplate's main
      already requires; remove this waiver when gomplate releases with
      go-jose v4.1.6 or later.
    package:
      name: github.com/go-jose/go-jose/v4
      version: v4.1.4
      type: go-module
      location: /usr/local/bin/gomplate
  - vulnerability: GO-2026-6865
    reason: >-
      review-by 2026-11-30: klauspost/compress v1.19.2 is built into gomplate
      v5.3.1, its latest release, and is fixed in v1.20.2, which gomplate's
      main already requires; remove this waiver when gomplate releases with
      compress v1.20.2 or later.
    package:
      name: github.com/klauspost/compress
      version: v1.19.2
      type: go-module
      location: /usr/local/bin/gomplate
