# Grype's configuration for `make vuln-images` (nightly.yml › vuln-images):
# what the image scan reports and what fails it. The scanner's own image is
# deploy/grype-image.txt.
#
# A finding fails the scan when a fixed version exists and its severity is
# high or critical: that is the one a pull request can act on, by moving a
# base image's digest or a package's pin. Every fixed finding of a lower
# severity is listed and fails nothing; one with no fix is not listed.
only-fixed: true
fail-on-severity: high
check-for-app-update: false
# A database Grype could not check for an update fails the scan, rather than
# judging the images by an older one.
db:
  require-update-check: true

# OrkStack's own binaries are govulncheck's (`make vuln`), which reports only
# the vulnerabilities whose vulnerable code the module reaches, so their Go
# modules and standard library are not judged here a second time. Every other
# binary an image carries (the orker image's docker CLI, the template
# activity's gomplate) is judged here, with the image's OS packages.
ignore:
  - package:
      type: go-module
      location: /usr/local/bin/ork
  - package:
      type: go-module
      location: /usr/local/bin/orker
  - package:
      type: go-module
      location: /usr/local/bin/orkctl
