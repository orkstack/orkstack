# The user-namespaced Orker with the engine's work root mounted at another
# path than the Orker's: the engine would look for each workspace where it
# does not exist, and the Orker's boot check must refuse to start
# (WORKDIR_NOT_BINDABLE) rather than fail every task later. ../common's
# patch puts its own mount first, so the work mount is the second; the test
# refuses to build if that ever changes, rather than move another mount.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orkstack
resources:
  - ../../orker-userns
components:
  - ../common
patches:
  - target:
      kind: Deployment
      name: orker
    patch: |-
      - op: test
        path: /spec/template/spec/initContainers/0/volumeMounts/1/name
        value: work
      - op: replace
        path: /spec/template/spec/initContainers/0/volumeMounts/1/mountPath
        value: /srv/work
