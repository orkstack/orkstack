# The proof's infrastructure (deploy/kubernetes/proof/README.md): Temporal's
# development server, SeaweedFS, a registry served over TLS with a
# certificate the script makes, and one ork engine. Every image is the one
# the development stack pins (deploy/docker-compose.yml), except ork, which
# the script builds from this tree.
apiVersion: v1
kind: Namespace
metadata:
  name: orkstack-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: orkstack-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:1.8.2@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --log-level
            - warn
          ports:
            - containerPort: 7233
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: orkstack-infra
spec:
  selector:
    app: temporal
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: orkstack-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          args:
            - mini
            - -dir=/data
            - -bucket=orkstack-artifacts
          ports:
            - containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: orkstack-infra
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: orkstack-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: tls
          secret:
            secretName: registry-tls
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: orkstack-infra
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: v1
kind: Namespace
metadata:
  name: orkstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ork
  namespace: orkstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ork
  template:
    metadata:
      labels:
        app: ork
    spec:
      containers:
        - name: ork
          image: localhost/orkstack-k8s/ork:proof
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: orkstack
            - secretRef:
                name: orkstack-s3
          env:
            - name: ORK_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: ORK_ADMIN_ADDR
              value: 127.0.0.1:9464
            - name: SSL_CERT_FILE
              value: /etc/proof-ca/ca.crt
            - name: ORK_ACTIVITY_CATALOG
              value: |
                activities:
                  shell: registry.orkstack-infra.svc.cluster.local:5000/orkstack/activity-shell:proof
                  file: registry.orkstack-infra.svc.cluster.local:5000/orkstack/activity-file:proof
          ports:
            - containerPort: 8080
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/ork
                - --healthcheck
            periodSeconds: 5
          volumeMounts:
            - name: proof-ca
              mountPath: /etc/proof-ca
              readOnly: true
      volumes:
        - name: proof-ca
          configMap:
            name: proof-ca
---
apiVersion: v1
kind: Service
metadata:
  name: ork
  namespace: orkstack
spec:
  type: NodePort
  selector:
    app: ork
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
