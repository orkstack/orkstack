# A task's secrets through an Orker on Kubernetes (scripts/k8s-orker-check.sh).
# The bases' floor, file:/etc/orkstack/task-secrets/*, admits a key of the
# orkstack-task-secrets Secret, and refuses what it does not list: the
# Orker's own setting ORK_S3_SECRET_KEY, and POD_NAME, a variable of the
# Orker's environment the floor does not name. The run ends FAILED by design.
# The tasks run one after another, so each refusal is its own task's, and
# fail-fast stops nothing still running: unlisted runs after own, whatever
# own did.
apiVersion: orkstack/v1
kind: Orkflow
name: k8s-orker-secrets
version: "1"
description: A secret the Kubernetes bases' floor lists, and two sources it does not.
tasks:
  # The check's own key of orkstack-task-secrets: staged, and only its hash
  # printed, which the check compares with the value it put there.
  - id: listed
    uses: shell
    pool: k8s-check
    network: none
    secrets:
      - name: value
        source: file:/etc/orkstack/task-secrets/k8s-check-value
    with:
      op: script
      interpreter: sh
      script: |
        echo "secret sha256: $(sha256sum /orkstack/input/secrets/value | cut -d ' ' -f 1)"
  - id: own
    uses: shell
    pool: k8s-check
    network: none
    needs:
      - listed
    secrets:
      - name: s3
        source: env:ORK_S3_SECRET_KEY
    with:
      op: script
      interpreter: sh
      script: |
        echo "staged a secret the floor does not list"
  - id: unlisted
    uses: shell
    pool: k8s-check
    network: none
    needs:
      - own
    join: all_done
    secrets:
      - name: pod
        source: env:POD_NAME
    with:
      op: script
      interpreter: sh
      script: |
        echo "staged a secret the floor does not list"
