# An Orker pool on Kubernetes, each Orker with a Docker engine of its own in
# a pod with its own user namespace (docs/DEPLOY.md, "Orkers on Kubernetes").
#
# Use this directory as the base of an overlay that names the release's orker
# image by digest, and create the settings it reads in the same namespace:
#
#   resources:
#     - <path>/deploy/kubernetes/orker-userns
#   images:
#     - name: orker
#       newName: ghcr.io/orkstack/orker
#       digest: sha256:<the release's orker digest>
#
#   kubectl create configmap orkstack --from-env-file=orkstack.env
#   kubectl create secret generic orkstack-s3 --from-env-file=s3.env
#
# The values tasks may read as secrets go in a Secret of their own, one key
# each; a task names one as file:/etc/orkstack/task-secrets/<key>, and the
# Orker resolves no other source:
#
#   kubectl create secret generic orkstack-task-secrets \
#     --from-literal=db-password=...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtimeclass.yaml
  - orker.yaml
