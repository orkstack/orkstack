# The RuntimeClass orker.yaml runs in. Its handler is a containerd runtime
# that every node running these Orkers declares with cgroup_writable = true
# (docs/DEPLOY.md, "Orkers on Kubernetes"): it gives a pod with its own user
# namespace a cgroup its root may write, which is how the engine sets each
# task's cpu, memory and pids limits. Without it the engine cannot start.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: orkstack-engine
handler: orkstack-engine
