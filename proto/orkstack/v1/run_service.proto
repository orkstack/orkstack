syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/filter.proto";
import "orkstack/v1/run.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// RunService submits and observes orkflow executions.
service RunService {
  rpc SubmitRun(SubmitRunRequest) returns (SubmitRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // ForceCancelRun ends an open run an ordinary cancel does not end. The run
  // is asked to cancel as CancelRun asks it, and is ended only once it has
  // made no progress for the grace, or still has not ended at the
  // deployment's ceiling. Nothing of a run ended that way runs afterwards: no
  // failure handler, no output; its tasks read as of its last event, and it
  // ends CANCELED with RUN_FORCE_CANCELED (docs/REASONS.md). Its child runs
  // are only asked to cancel, unless the request cascades.
  //
  // It answers once the force cancel has been started, or one of the run in
  // flight joined, not once the run has ended: read the run for that. A
  // request made again joins, or finishes, what an earlier one left, and two
  // force cancels that were given their whole time and left the run open are
  // followed by its direct end.
  rpc ForceCancelRun(ForceCancelRunRequest) returns (ForceCancelRunResponse);
  // GetForceCancel reads one force cancel of a run: where it stands while it
  // runs, and what it did once it is over. The run's own status and error say
  // how the run ended; this says what the force cancel reports of itself.
  rpc GetForceCancel(GetForceCancelRequest) returns (GetForceCancelResponse);
  // PauseRun stops a running run starting anything new, failure handlers
  // included, and pauses its running child runs too; the one exception is
  // what an already-open pin needs to finish. Work it already started
  // finishes under its own rules, and every clock keeps running: a task's or
  // the run's timeout, an await's deadline and a sleep's wake-up are not
  // stretched. The run's status is PAUSED from its RUN_PAUSED event until
  // RUN_UNPAUSED or its end. A pause lasts at most its timeout (the
  // deployment's default when the request names none): a run that is not
  // failing then ends FAILED with RUN_PAUSE_TIMEOUT, and a failing run ends
  // with its own reason, its held failure handlers never started.
  //
  // It answers once the run has recorded the request, not once it has
  // applied it: the RUN_PAUSED event carrying the response's request_id says
  // it did, read from after_sequence. The checks before sending read the run
  // as the read model has it and refuse FAILED_PRECONDITION with a reason
  // (docs/REASONS.md, "Pausing a run"); in a race the run's own decision is
  // final. A request that recording would take past the run's history limit
  // is not applied: the run stops RUN_HISTORY_LIMIT naming the request, or, a
  // run already failing, drops the request, records no event for it and ends
  // with its own reason. A pause cannot be changed: unpause and pause again.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse);
  // UnpauseRun lifts a run's own pause, and the pauses of its child runs
  // that it caused; a child paused on its own stays paused. The run then
  // starts what it held, in the order it would have with no pause. The
  // RUN_UNPAUSED event carrying the response's request_id says it applied
  // (pause_transition NOT_PAUSED when the run was not paused). A run paused
  // because its parent run is paused is refused RUN_PAUSE_INHERITED: unpause
  // the parent.
  rpc UnpauseRun(UnpauseRunRequest) returns (UnpauseRunResponse);
  // StreamEvents server-streams realtime events for a run. from_sequence
  // allows resuming after a disconnect (0 = from start): the stream
  // continues after that event, so a client that passes the last sequence it
  // received sees nothing repeated and nothing skipped, from any replica. A
  // stream that ends Unavailable is resumed that way; `orkctl run watch` and
  // the UI's run page do it, a bounded number of times in a row. Numbers the
  // run never published (an event whose record object storage refused) read
  // two ways. Read live, the stream serves a STREAM_GAP event naming them and
  // goes on to the run's terminal event. Read from the archive, they are a gap
  // in the run's events, as are events lost from object storage before the run
  // was archived: the stream ends DataLoss, after the events before the gap,
  // naming the range and its cause. A live read that meets lost events ends
  // Unavailable. Resuming past a DataLoss gap's last number serves what
  // follows it.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // StreamTaskLogs server-streams one task attempt's output: every chunk
  // already written, in order, then each new one as it lands.
  //
  // Logs are a SEPARATE stream from Event on purpose. Task output is bytes,
  // and bytes never enter a Temporal payload or the event stream (a run's
  // history is replayed forever, and a chatty task would bloat it forever
  // too). The Orker writes numbered chunks to the artifact store while the
  // task runs; this RPC reads them back from there. EventType gains nothing:
  // EVENT_TYPE_TASK_LOG stays what it always was, a human notice with no
  // task output in it.
  //
  // Any replica answers for any run, on the same terms as StreamEvents: the
  // chunks are in the shared store and the task's state comes from the shared
  // cluster, so a replica that started nothing serves a run to completion.
  rpc StreamTaskLogs(StreamTaskLogsRequest) returns (stream TaskLogChunk);
  rpc ListRunArtifacts(ListRunArtifactsRequest) returns (ListRunArtifactsResponse);
  rpc ReadArtifact(ReadArtifactRequest) returns (stream ArtifactChunk);
  // ListTaskAttempts reads back what every attempt of a task did, including
  // the attempts that lost.
  //
  // Temporal owns retries, so a run's snapshot only ever carries a task's
  // FINAL outcome: the error of each earlier attempt is discarded when the
  // next one is scheduled. The Orker writes one immutable TaskAttempt record
  // per attempt (metadata/attempts/…), and this RPC serves them — from the
  // shared store, so any replica answers for any run, on exactly the terms
  // StreamTaskLogs and ListRunArtifacts are on.
  //
  // A missing record is REPORTED, never hidden: an attempt number the store
  // has nothing for comes back as ATTEMPT_OUTCOME_UNREPORTED, so a timeline
  // never has a silent hole where an Orker died. There is no stream: a client
  // refetches on the events it already follows.
  rpc ListTaskAttempts(ListTaskAttemptsRequest) returns (ListTaskAttemptsResponse);
  // ResolveAwait completes or rejects an awaited task of a running run. It
  // is a WRITE, addressed inside a namespace exactly as CancelRun is: another
  // namespace's run is NotFound. The values are stored and the resolution is
  // delivered to the run before this returns; the run applies it — a caller
  // that must see the outcome reads the run or follows its events. A repeat
  // of the resolution that already won answers success and delivers nothing.
  rpc ResolveAwait(ResolveAwaitRequest) returns (ResolveAwaitResponse);
  // GetArtifactProvenance answers, for ONE recorded artifact, whether its
  // bytes are still in the object store and which archived runs of the
  // calling namespace recorded the same physical object.
  //
  // It is a READ of the reverse index the archive already maintains for
  // cleanup refcounting (metadata/index/objects/…, docs/STORAGE.md): a
  // keys-only prefix scan whose keys are the answer, then one body read per
  // referencing run to check its namespace. It writes nothing and creates
  // no key family.
  //
  // The artifact is addressed exactly as ReadArtifact addresses it — by the
  // run, task, kind and recorded name — and resolved against the
  // authoritative run. A caller never names an object key or a URI. On the
  // S3 backend an object key embeds its run id, so `references` is the
  // producing run alone; on the local backend identical bytes under one
  // name are one object, so every run that produced them is listed.
  rpc GetArtifactProvenance(GetArtifactProvenanceRequest) returns (GetArtifactProvenanceResponse);
  // InspectRun answers "what is this task doing right now" for every
  // in-flight task of ONE live run, from the heartbeat detail the Orker
  // already sends and the cluster already holds for the pending activity.
  //
  // It is a READ of Temporal's own describe of the execution — nothing is
  // stored, nothing is projected onto the snapshot, and no event is added.
  // A run that is terminal, or whose execution has left the cluster, answers
  // with run_status and no attempts. There is no stream: a client polls.
  //
  // A heartbeat is reported ONLY when it belongs to the attempt that is
  // pending now. Temporal keeps a failed attempt's last detail through the
  // retry backoff and until the next attempt's first beat; that detail is
  // never rendered as the new attempt's progress.
  rpc InspectRun(InspectRunRequest) returns (InspectRunResponse);
  // DiffRuns compares two runs of ONE namespace field by field: the pinned
  // definition, the input (as a canonical-JSON unified diff), and per task
  // its status, attempt, pool, pin, orker, exit code, error, duration, and
  // the image it was dispatched with and the platform manifest it ran.
  //
  // It is a READ over what GetRun, GetOrkflow and ListTaskAttempts already
  // serve, computed on every call and stored nowhere, so there is no
  // comparison record that can disagree with the runs it compares. Both ids
  // resolve inside the request's namespace exactly as GetRun resolves one: a
  // run of another namespace is NotFound. Two runs of different orkflows are
  // compared and flagged (same_orkflow=false), never refused.
  //
  // The diff is SERVER-side for the reason DiffOrkflowVersions records: two
  // clients render it, and the rendering of "unavailable", "does not apply"
  // and an empty value must be decided once. Every from_value/to_value is a
  // rendered string a client prints verbatim.
  rpc DiffRuns(DiffRunsRequest) returns (DiffRunsResponse);

  // ExportRunEvidence streams ONE finished run's evidence bundle: a tar.gz
  // whose first member, MANIFEST.json, names every other member's path,
  // origin, size, sha256 and state, followed by the archived run and events,
  // the pinned definition's source YAML, and per task the verbatim
  // commit.json, values.json, every output artifact, every attempt record,
  // and every attempt's stdout.log and stderr.log.
  //
  // It is a READ, assembled per request from objects that already exist and
  // kept nowhere: there is no export record, so nothing can disagree with the
  // archive. Every member digest is of the bytes as they were read; a member
  // with a recorded reference is verified as it streams and a mismatch ends
  // the stream with DataLoss and no `last`. Bytes the cleanup worker or a
  // lifecycle rule removed are listed with state "reclaimed" and their
  // recorded sha256 preserved, never omitted.
  //
  // The run is addressed inside its namespace exactly as GetRun addresses it
  // and must be finished and archived; a live run is FailedPrecondition. The
  // stream is complete only when a chunk with `last` arrives, on the same
  // terms as ReadArtifact. The bundle layout and manifest schema are
  // docs/RUN_EVIDENCE.md.
  rpc ExportRunEvidence(ExportRunEvidenceRequest) returns (stream EvidenceChunk);

  // ResumeRun resumes a failed run from its failed tasks, or retries it from
  // a chosen task, keeping the results of the tasks that need not run again.
  // The run keeps its id, and its event stream continues after RUN_RESUMED.
  //
  // dry_run previews the plan and changes nothing (run.read). A confirm
  // (run.resume and run.submit) must send the preview's terminal_sequence
  // and plan_digest; if the run or the plan changed since, it is refused and
  // nothing is done. A refusal is FailedPrecondition with a ResumeRefusal
  // detail naming its RUN_NOT_RESUMABLE sub-reason and its class: permanent,
  // wait (try again after retry_after_seconds) or replan (preview again).
  // docs/RESUME.md is the guide; docs/REASONS.md lists every sub-reason.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
  // ListRecordedResults lists what the engine recorded for ONE run whose
  // results it records (docs/TASK_IDENTITY.md), and each task the run's state
  // calls succeeded that has no record. A run whose results the engine does
  // not record has no rows. A run whose state cannot be read answers
  // Unavailable, never a list without those rows.
  rpc ListRecordedResults(ListRecordedResultsRequest) returns (ListRecordedResultsResponse);
}

message ResumeRunRequest {
  string namespace = 1;
  string run_id = 2;
  // reason is recorded with the resume; at most 1 KiB.
  string reason = 3;
  // from_task_id empty is Resume; set, Retry from here.
  string from_task_id = 4;
  bool dry_run = 5;
  // expected_terminal_sequence is the preview's terminal_sequence; required
  // unless dry_run.
  int64 expected_terminal_sequence = 6;
  // expected_plan_digest is the preview's plan_digest.
  string expected_plan_digest = 7;
  // acknowledged_unknown_attempts lists the acknowledge_key of every
  // ATTEMPT_OUTCOME_UNKNOWN warning the caller accepts; it needs
  // expected_plan_digest.
  repeated string acknowledged_unknown_attempts = 8;
  // accept_sequence_gap and accepted_highest_seq accept a gap in the run's
  // stored events (run.resume.accept_gap); accepted_highest_seq is the
  // preview's highest_sequence.
  bool accept_sequence_gap = 9;
  int64 accepted_highest_seq = 10;
  // accept_unverified_stop accepts a force cancel whose stop could not be
  // confirmed (run.resume.accept_gap).
  bool accept_unverified_stop = 11;
}

message ResumeRunResponse {
  string run_id = 1;
  // resume is the resume made, or the one a repeated confirm found.
  RunResume resume = 2;
  bool already_resumed = 3;
  // plan_digest names the plan: what reruns, what is kept and how.
  string plan_digest = 4;
  // seq_base is RUN_RESUMED's sequence.
  int64 seq_base = 5;
  // kept_count is the units listed KEPT or SETTLED: the results the resume
  // reads back. It is not every unit that does not run again: one kept from an
  // earlier part of the run (RESUME_CATEGORY_EARLIER), skipped, waiting, on
  // record or a sleep that woke is counted only in counts. A unit runs again
  // only when it is listed under a RESUME_CATEGORY_RERUN_* category.
  int32 kept_count = 6;
  repeated ResumeTask tasks = 7;
  repeated ResumeCount counts = 8;
  // diff is what changed since the plan the caller previewed.
  ResumeDiff diff = 9;
  ResumeAction action = 10;
  // concurrency_effect says whether the run waits for a concurrency slot.
  string concurrency_effect = 11;
  int64 estimated_readback_seconds = 12;
  int32 readback_calls = 13;
  // resumes_used counts this run's resumes toward the cap of 20.
  int32 resumes_used = 14;
  repeated ResumeWarning warnings = 15;
  // terminal_sequence is the sequence of the ending a confirm sets aside.
  int64 terminal_sequence = 16;
  // highest_sequence is the highest event sequence stored for the run.
  int64 highest_sequence = 17;
  // rerun_count is the units the resume runs again: those listed under a
  // RESUME_CATEGORY_RERUN_* category. Every other unit of tasks, one kept
  // from an earlier part of the run included, does not run again.
  int32 rerun_count = 18;
}

// ResumeTask is one task, or one fan-out item, of a resume's plan.
message ResumeTask {
  string task_id = 1;
  // item is set for one item of a fan-out.
  optional int32 item = 2;
  ResumeCategory category = 3;
  // why is the sentence the plan lists the task with.
  string why = 4;
  // previous_outcome is how it ended before: SUCCEEDED for a result an
  // earlier resume kept and did not read back.
  Status previous_outcome = 5;
  ResumeMemoState memo = 6;
  // callback_works: an awaited task's callback token accepts one more
  // resolution once the run waits for it again.
  bool callback_works = 7;
  string detail = 8;
  // answer_not_used_reason: why an answer on record was not used.
  string answer_not_used_reason = 9;
  // child_waiting_on: what a composed task's open child run waits on.
  string child_waiting_on = 10;
}

// ResumeCount is how many units of a plan fall in one category.
message ResumeCount {
  ResumeCategory category = 1;
  int32 count = 2;
}

// ResumeDiff is what changed in a plan since the caller's preview.
message ResumeDiff {
  repeated ResumeUnitRef added = 1;
  repeated ResumeUnitRef dropped = 2;
}

// ResumeUnitRef names a task, or one item of a fan-out.
message ResumeUnitRef {
  string task_id = 1;
  optional int32 item = 2;
}

// ResumeCategory is the section of the plan a task is listed in.
enum ResumeCategory {
  RESUME_CATEGORY_UNSPECIFIED = 0;
  // Reruns: it failed.
  RESUME_CATEGORY_RERUN_FAILED = 1;
  // Reruns: it is the task retried from.
  RESUME_CATEGORY_RERUN_SELECTED = 2;
  // Reruns: it is downstream of a task that reruns.
  RESUME_CATEGORY_RERUN_DOWNSTREAM = 3;
  // Reruns: its saved result is gone.
  RESUME_CATEGORY_RERUN_RESULT_GONE = 4;
  // Reruns: it never finished.
  RESUME_CATEGORY_RERUN_UNFINISHED = 5;
  // Reruns: another member of its pin reruns.
  RESUME_CATEGORY_RERUN_PIN_MEMBER = 6;
  // Reruns: the task its fan-out is over reruns.
  RESUME_CATEGORY_RERUN_EACH_SOURCE = 7;
  // Kept: its saved result is read back.
  RESUME_CATEGORY_KEPT = 8;
  // Already done: an awaited or composed task's result is kept.
  RESUME_CATEGORY_SETTLED = 9;
  // Stays skipped.
  RESUME_CATEGORY_SKIPPED = 10;
  // Waits again, in full, once what it needs is done.
  RESUME_CATEGORY_WAITS_AGAIN = 11;
  // A sleep that already started: it wakes when it would have.
  RESUME_CATEGORY_SLEEP_KEPT = 12;
  // Kept, not run again: it finished in an earlier part of the run, before
  // it carried on. Its result is not read back, so kept_count does not count
  // it.
  RESUME_CATEGORY_EARLIER = 13;
  // Answered and on record: the answer given is used.
  RESUME_CATEGORY_RESOLVED_ON_RECORD = 14;
  // A composed task whose child run's outputs are on record.
  RESUME_CATEGORY_CHILD_OUTPUTS_ON_RECORD = 15;
}

// ResumeMemoState is what a cached task that reruns does with its memo.
enum ResumeMemoState {
  // Not a cached task.
  RESUME_MEMO_STATE_UNSPECIFIED = 0;
  // It succeeded before, or an earlier resume was to run it again: it runs
  // again, and its memo points at the new result.
  RESUME_MEMO_STATE_BYPASSED = 1;
  // Neither: its memo is looked up as on any run.
  RESUME_MEMO_STATE_LOOKED_UP = 2;
}

// ResumeWarning is something a resume's caller should know before
// confirming. Only ATTEMPT_OUTCOME_UNKNOWN needs acknowledging.
message ResumeWarning {
  ResumeWarningKind kind = 1;
  string message = 2;
  // build_id: FORCE_CANCELED_SAME_BUILD's release build.
  string build_id = 3;
  // orker_id, task_id, item, ordinal and last_seen_at name an attempt whose
  // outcome is unknown; acknowledge_key is what a confirm lists in
  // acknowledged_unknown_attempts.
  string orker_id = 4;
  string task_id = 5;
  optional int32 item = 6;
  int32 ordinal = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  string acknowledge_key = 9;
  // pin and until: PIN_LEASE_HELD's pin and when its host's old slot frees.
  string pin = 10;
  google.protobuf.Timestamp until = 11;
}

// ResumeWarningKind is a ResumeWarning's kind.
enum ResumeWarningKind {
  RESUME_WARNING_KIND_UNSPECIFIED = 0;
  // The run was force-cancelled on the build it resumes on, and may stall
  // the same way.
  RESUME_WARNING_KIND_FORCE_CANCELED_SAME_BUILD = 1;
  // The run was paused; it resumes unpaused.
  RESUME_WARNING_KIND_WAS_PAUSED = 2;
  // A pin's host may still hold its old slot until the lease expires.
  RESUME_WARNING_KIND_PIN_LEASE_HELD = 3;
  // An earlier attempt may still be running on an Orker that is gone.
  RESUME_WARNING_KIND_ATTEMPT_OUTCOME_UNKNOWN = 4;
  // The force cancel of the run is still finishing.
  RESUME_WARNING_KIND_FORCE_CANCEL_FINISHING = 5;
  // The run has a timeout, and gets a fresh one.
  RESUME_WARNING_KIND_FRESH_TIMEOUT = 6;
}

// ResumeRefusal is the error detail of a refused ResumeRun.
message ResumeRefusal {
  // reason is the RUN_NOT_RESUMABLE sub-reason (docs/REASONS.md).
  string reason = 1;
  ResumeRefusalClass class = 2;
  // retry_after_seconds: when to try again, for the wait class.
  int64 retry_after_seconds = 3;
  // cause refines reason, as docs/REASONS.md lists.
  string cause = 4;
  repeated string tasks = 5;
  string message = 6;
  // diff: for PLAN_CHANGED, what changed since the preview.
  ResumeDiff diff = 7;
  // highest_sequence: the run's highest stored event, which accepting a gap
  // in its events names (accepted_highest_seq); set with cause
  // events_above_terminal, and when that event moved on since.
  int64 highest_sequence = 8;
}

// ResumeRefusalClass is what a refused caller can do.
enum ResumeRefusalClass {
  RESUME_REFUSAL_CLASS_UNSPECIFIED = 0;
  // Resuming cannot fix it; run it again instead.
  RESUME_REFUSAL_CLASS_PERMANENT = 1;
  // Try again after retry_after_seconds.
  RESUME_REFUSAL_CLASS_WAIT = 2;
  // Preview again and decide.
  RESUME_REFUSAL_CLASS_REPLAN = 3;
}

// RecordedResultKind is what a record is of.
enum RecordedResultKind {
  RECORDED_RESULT_KIND_UNSPECIFIED = 0;
  // COMMIT: a container task's result, or one item's of a fan-out.
  RECORDED_RESULT_KIND_COMMIT = 1;
  RECORDED_RESULT_KIND_RESOLUTION = 2;
  RECORDED_RESULT_KIND_COMPOSED = 3;
  // OUTPUTS: a child run's outputs, of no task.
  RECORDED_RESULT_KIND_OUTPUTS = 4;
}

// RecordedResultState is what became of a record, or of a result that should
// have one. A client that does not know a state shows it as unknown, never as
// on record.
enum RecordedResultState {
  RECORDED_RESULT_STATE_UNSPECIFIED = 0;
  // ON_RECORD: the record is there, and the run applied it.
  RECORDED_RESULT_STATE_ON_RECORD = 1;
  // NOT_APPLIED: recorded in time, and the run has not applied it; the row's
  // task_status says whether it still may.
  RECORDED_RESULT_STATE_NOT_APPLIED = 2;
  // NOT_TAKEN: a record the run will not apply: stored after the task's
  // deadline or its run's end, or under a scope a later resume replaced.
  RECORDED_RESULT_STATE_NOT_TAKEN = 3;
  // NOT_ON_RECORD: the store said, twice, that there is none, of a result the
  // run's state calls succeeded.
  RECORDED_RESULT_STATE_NOT_ON_RECORD = 4;
  // RECLAIMED: the run has left the cluster, and its records with its commits.
  RECORDED_RESULT_STATE_RECLAIMED = 5;
  // UNREAD: the store did not answer for this record, or what it answered
  // cannot be used. It says nothing about the result.
  RECORDED_RESULT_STATE_UNREAD = 6;
  // RECORDED_NEWER_FORMAT: a record in a later format than this engine reads;
  // a newer replica answers it.
  RECORDED_RESULT_STATE_RECORDED_NEWER_FORMAT = 7;
}

// RecordedReadStop is why a page is not complete.
enum RecordedReadStop {
  RECORDED_READ_STOP_UNSPECIFIED = 0;
  // ROWS_UNREAD: a row of the page could not be read.
  RECORDED_READ_STOP_ROWS_UNREAD = 1;
  // READ_BUDGET: the run's reads of this minute are spent; the token goes on.
  RECORDED_READ_STOP_READ_BUDGET = 2;
}

// RecordedResult is one record, or one result that has none.
message RecordedResult {
  // task_id is unset for OUTPUTS.
  string task_id = 1;
  optional int32 item = 2;
  // resume_scope is the resume the record was made under; 0 for none.
  uint64 resume_scope = 3;
  RecordedResultKind kind = 4;
  RecordedResultState state = 5;
  // asked_at is the instant the record itself holds, and stored_at the
  // store's own time of it, which every "in time" is judged by.
  google.protobuf.Timestamp asked_at = 6;
  google.protobuf.Timestamp stored_at = 7;
  string values_sha256 = 8;
  // rejected, via, principal and principal_verified are a resolution's.
  bool rejected = 9;
  AwaitResolvedVia via = 10;
  string principal = 11;
  bool principal_verified = 12;
  // pool, orker_id and uri are shown only to a caller who also holds
  // run.artifacts.read on the Orkflow, or orker.read.
  string pool = 13;
  string orker_id = 14;
  string uri = 15;
  // child_run_id is the child a composed task's values are of.
  string child_run_id = 16;
  // task_status is the task's, or for OUTPUTS the run's, as the run's state
  // has it.
  Status task_status = 17;
  // in_child_run says a parent started the run: what it did not apply is not
  // carried over, and the parent is run again.
  bool in_child_run = 18;
  // deadline is when an awaited task's await ends.
  google.protobuf.Timestamp deadline = 19;
}

message ListRecordedResultsRequest {
  string namespace = 1;                  // empty = the default namespace
  string run_id = 2;
  string task_id = 3;                    // empty = every task
  // page_size is at most 50; 25 when unset.
  int32 page_size = 4;
  string page_token = 5;
  // unapplied_only lists only resolutions not applied: of tasks that await,
  // and of awaited tasks that ended without theirs.
  bool unapplied_only = 6;
}

message ListRecordedResultsResponse {
  repeated RecordedResult results = 1;
  string next_page_token = 2;
  // read_complete is said of this page; a listing is complete only when every
  // page is.
  bool read_complete = 3;
  RecordedReadStop incomplete_reason = 4;
}

message SubmitRunRequest {
  string orkflow_name = 1;               // orkflow name
  string orkflow_version = 2;            // orkflow version; empty = latest
  Payload input = 3;
  // idempotency_key, optional, makes a retry safe: a repeat under the same
  // key, in the same namespace and, with auth.mode enforce, by the same
  // caller, is answered with the run the key names instead of starting a
  // second one, even when the first answer was lost.
  // A key belongs to one submission: the same key with another
  // orkflow_name, orkflow_version as written, source_run_id or input is
  // refused ALREADY_EXISTS. allow_empty_pool, no_cache and origin_reference
  // are not part of that comparison. A key stays bound for
  // engine.idempotency_ttl (24h by default).
  string idempotency_key = 4;
  // namespace selects which namespace's orkflow_name is submitted. Empty is
  // the default namespace. A name is unique WITHIN a namespace, so this is
  // half of the orkflow's address, not a filter.
  string namespace = 5;
  //
  // allow_empty_pool submits even when a task's resolved pool has no live
  // Orkers. Default false: an empty pool is an error at submit, not a run
  // that reaches RUNNING and stays there because nothing will ever pick its
  // tasks up. Setting it is logged with the pool it overrode.
  bool allow_empty_pool = 6;

  // origin_reference is caller-supplied correlation text recorded as
  // RunOrigin.reference: a CI job URL, a ticket key, an event id. Optional.
  // At most 256 bytes and no control characters (INVALID_ARGUMENT
  // otherwise, before a run id is minted). Opaque to OrkStack. On the
  // trigger door the same value arrives as the Ork-Origin-Reference header,
  // so a CI job sets one header and the body stays exactly the run's input.
  string origin_reference = 7;

  // source_run_id marks this submission as a re-run of an existing run:
  // origin.kind becomes RUN_AGAIN and origin.id this value. Set by `orkctl
  // run again` and the run page's Run again. The server confirms the run
  // exists IN THIS NAMESPACE before minting anything; an unknown id, or a
  // run of another namespace, is NOT_FOUND naming it, on the rule every run
  // read follows. It is never an idempotency key and never reuses one: a
  // re-run is a new execution with a new id (docs/UI_CLI_PARITY.md).
  string source_run_id = 8;
  // no_cache runs this submission without reading any memo: every cached
  // task runs its container and refreshes its memo. It applies to every run
  // the submission starts, child runs included. It does nothing for an
  // Orkflow that declares no cache:.
  bool no_cache = 9;
}

// AwaitCallback is one callback await's one-time credential, handed back by
// the submission that started the run and by nothing else.
message AwaitCallback {
  string task_id = 1;
  // path is the callback door's path for this await,
  // "/v1/runs/{run_id}/awaits/{task_id}"; a client prefixes the engine
  // address it used. Reject is path + "/reject".
  string path = 2;
  // token is the bearer credential, 32 random bytes hex-encoded, shown
  // exactly once, like CreateTriggerResponse.secret. Only its salted digest
  // is kept.
  string token = 3;
}

message SubmitRunResponse {
  Run run = 1;
  // await_callbacks holds one entry per await of the definition that declares
  // `callback: true`, in declaration order. It is populated ONLY by the call
  // that started the run: a keyed repeat that returned an existing run, and
  // every read, carry none — the plaintext no longer exists anywhere.
  repeated AwaitCallback await_callbacks = 2;
}

message ResolveAwaitRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;
  // values_json is the completion's values.json, as exact JSON text: it is
  // stored byte for byte, never re-encoded. Empty means {}. Must be empty
  // when reject is set.
  string values_json = 4;
  bool reject = 5;
  // reason is required with reject and refused without it; at most 1024
  // bytes, no control character other than tab and newline.
  string reason = 6;

  // redeliver tells the run again of the resolution on record for this task,
  // for a run that holds a task identity. It carries no decision: values_json,
  // reject and reason must be unset. The run is told the task alone. Inside
  // ten seconds of a telling it repeats that telling's answer. Refused when
  // nothing is on record, and AWAIT_DEADLINE_PASSED, telling nothing, when the
  // record was stored after the deadline.
  bool redeliver = 7;
}

message ResolveAwaitResponse {
  string run_id = 1;
  string namespace = 2;                  // resolved
  string task_id = 3;
  bool reject = 4;
  // values_sha256 is the hex sha256 of the stored values.json; empty for a
  // rejection.
  string values_sha256 = 5;
  // repeat is true when this request repeated the resolution that had
  // already been applied — same values, or same rejection reason — so
  // nothing was stored or delivered.
  bool repeat = 6;

  // delivery_pending: the resolution is on record and the run could not be
  // told of it. Repeating the request, or redeliver, delivers it. Set only for
  // a run that holds a task identity, as are told_at and deadline_passed.
  bool delivery_pending = 7;

  // told_at is when this replica last had the run told of the resolution on
  // record: by this request, or by the one it stands on. It never says that
  // the run applied it.
  google.protobuf.Timestamp told_at = 9;

  // deadline_passed: the resolution is on record and the await's deadline has
  // passed by the store's clock. The run decides whether it takes it, and
  // repeating the request changes nothing.
  bool deadline_passed = 10;
}

// A run id addresses a run INSIDE a namespace, exactly as an orkflow name
// does. It is unguessable, but unguessable is not a tenancy boundary: an id
// travels into logs, tickets and CI transcripts, and CancelRun is a write. So
// every request that carries one carries the namespace it is addressed in, on
// the same rule as every other namespace field — empty is the default
// namespace, never "any of them". A run of another namespace is NotFound, not
// PermissionDenied: telling the two apart would confirm to a caller who may
// not name the namespace that the id exists.
message GetRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
}

message GetRunResponse { Run run = 1; }

// ListRunsRequest lists one namespace's runs, live and finished, newest
// first. filters narrow it (docs/UI_CLI_PARITY.md "Filtering lists"); every
// field below is answered for live and finished runs alike without reading a
// run body. created_at is the instant a run is ordered and paged by: its
// created_at, else its started_at, else its finished_at. origin.kind takes
// only equals, and a run recorded before origins existed matches no
// origin.kind filter; origin.id is meaningful only within a kind, so it
// needs an equals filter on origin.kind. An id is matched whole, never by
// part. origin.root_run_id takes only equals and keeps every run below that
// root in its composed chain, however deep: the root run itself holds no root
// and is not one of them. queued, queued_on and holding are a concurrency
// limit's: queued=true keeps the runs waiting for a slot, queued_on=KEY those
// waiting for KEY's slot, holding=KEY those holding one of KEY's slots. Only
// a run still going matches them, and a deployment that cannot index
// concurrency limits refuses them. results_recorded=true keeps the runs whose
// results are recorded by the engine, going or ended, as long as the cluster
// still holds them: a run read from the archive is not listed by it, and a
// deployment whose cluster cannot index it refuses it by name.
message ListRunsRequest {
  option (orkstack.v1.filterable) = {
    resource: "orkstack.v1.Run"
    fields: [
      {
        path: "orkflow_name"
        label: "Orkflow"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
        value_rule: FILTER_VALUE_RULE_NAME
      },
      {
        path: "status"
        label: "Status"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN]
        allowed_values: ["PENDING", "RUNNING", "PAUSED", "SUCCEEDED", "FAILED", "CANCELED", "SKIPPED"]
      },
      {
        path: "created_at"
        label: "Created"
        operators: [FILTER_OPERATOR_AT_OR_AFTER, FILTER_OPERATOR_BEFORE]
      },
      {
        path: "origin.kind"
        label: "Started by"
        operators: [FILTER_OPERATOR_EQUALS]
        allowed_values: ["SUBMIT", "TRIGGER", "SCHEDULE", "PARENT_RUN", "RUN_AGAIN", "EVENT_SOURCE"]
      },
      {
        path: "origin.id"
        label: "Origin id"
        operators: [FILTER_OPERATOR_EQUALS]
        requires: "origin.kind"
      },
      {
        path: "origin.root_run_id"
        label: "Root run"
        operators: [FILTER_OPERATOR_EQUALS]
      },
      {
        path: "queued"
        label: "Queued for a concurrency slot"
        operators: [FILTER_OPERATOR_EQUALS]
        indexed: true
        flag: true
      },
      {
        path: "queued_on"
        label: "Queued for key"
        operators: [FILTER_OPERATOR_EQUALS]
        indexed: true
      },
      {
        path: "holding"
        label: "Holding key"
        operators: [FILTER_OPERATOR_EQUALS]
        indexed: true
      },
      {
        path: "results_recorded"
        label: "Results recorded by the engine"
        operators: [FILTER_OPERATOR_EQUALS]
        indexed: true
        flag: true
        ended_matches: true
      }
    ]
  };
  reserved 1, 2, 6 to 9;
  reserved "orkflow_name", "status", "created_after", "created_before", "origin_kind", "origin_id";
  // page_size caps the runs returned; 0 means the default (200); above the
  // maximum (200) is INVALID_ARGUMENT, not clamped.
  int32 page_size = 3;
  // page_token continues a listing; it binds the namespace and the canonical
  // filter set, and a token minted under other filters is INVALID_ARGUMENT.
  string page_token = 4;
  string namespace = 5;                  // the tenant; empty = the default namespace
  repeated FieldFilter filters = 10;
}

message ListRunsResponse {
  // A fan-out task's row carries its `each` and status but never its
  // `items`; GetRun is the read that carries them.
  repeated Run runs = 1;
  string next_page_token = 2;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_OUTPUT = 1;
  ARTIFACT_KIND_VALUES = 2;
  ARTIFACT_KIND_STDOUT = 3;
  ARTIFACT_KIND_STDERR = 4;
}

message RunArtifact {
  string task_id = 1;
  ArtifactKind kind = 2;
  ArtifactRef artifact = 3;
  int32 attempt = 4;
  // item is set when the artifact was recorded by one item of a fan-out task.
  optional int32 item = 5;
}

message ListRunArtifactsRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
  // item narrows task_id to one item of a fan-out. Requires task_id and a
  // fan-out task. Unset lists every item of a fan-out task_id (and of every
  // fan-out when task_id is empty), each RunArtifact carrying its item.
  optional int32 item = 4;
}

message ListRunArtifactsResponse { repeated RunArtifact artifacts = 1; }

message ReadArtifactRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
  ArtifactKind kind = 4;
  string name = 5;
  // item names the item of a fan-out task_id whose artifact is read; required
  // for a fan-out task (two items may record the same name), refused for any
  // other task.
  optional int32 item = 6;
}

message ArtifactChunk {
  bytes data = 1;
  ArtifactRef artifact = 2;
  bool last = 3;
}

message ListTaskAttemptsRequest {
  string run_id = 1;
  string namespace = 2; // empty = the default namespace
  string task_id = 3;   // empty selects every task of the run
  // item narrows task_id to one item of a fan-out. Unset returns every item's
  // timeline for a fan-out task (items ascending, attempts ascending within
  // an item), each TaskAttempt carrying its item.
  optional int32 item = 4;
}

message ListTaskAttemptsResponse {
  // attempts is every attempt of every selected task: tasks in the order
  // Run.task_runs lists them, and within a task ascending by attempt with no
  // gaps — an attempt number the store has no record for is present as
  // ATTEMPT_OUTCOME_UNREPORTED rather than absent.
  repeated TaskAttempt attempts = 1;
  // timings is one entry per task or fan-out item whose wait for an Orker
  // applies — a container task that was scheduled, or an item of one — in
  // the order attempts lists them. Derived on read and never stored.
  repeated TaskAttemptsTiming timings = 2;
}

// TaskAttemptsTiming is the derivation over one task's (or one item's) whole
// timeline (docs/UI_CLI_PARITY.md "Task timing").
message TaskAttemptsTiming {
  string task_id = 1;
  optional int32 item = 2;
  // queue_wait is how long the task waited for an Orker of its pool:
  // attempt 1's started_at − TaskRun.scheduled_at. Unavailable with
  // PRE_CONTRACT, RECLAIMED, NO_RECORD (attempt 1 has no record) or
  // CLOCK_SKEW.
  TimingQuantity queue_wait = 3;
  // reclaimed is true when every record of this timeline was reclaimed: the
  // task ended with no row at all, or an Orker reported its start and every
  // row is UNREPORTED.
  bool reclaimed = 4;
}

// ReferenceState is the addressed run's OWN standing in the object index.
// It exists so an empty `references` list can be read: "released" and
// "never recorded" are different facts that would otherwise render alike.
enum ReferenceState {
  REFERENCE_STATE_UNSPECIFIED = 0;
  // HELD: the run is archived and its marker on this object is present.
  REFERENCE_STATE_HELD = 1;
  // RELEASED: no marker, and the run's cleanup record exists — the cleanup
  // worker released its object claims (docs/STORAGE.md, "Reclaiming space").
  // released_at carries the record's timestamp.
  REFERENCE_STATE_RELEASED = 2;
  // ABSENT: no marker and no cleanup record. The run has not reached its
  // terminal event, its archive write has not completed, it was archived
  // before the object index existed, or cleanup released its markers and had
  // not yet written its record. The server does not guess which; a client
  // renders "no reference recorded", never "released" and never "held".
  REFERENCE_STATE_ABSENT = 3;
}

message GetArtifactProvenanceRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;
  ArtifactKind kind = 4;
  // name is the exact recorded artifact name, as ReadArtifactRequest.name.
  string name = 5;
  // expect_sha256 is optional: the lowercase hex digest a caller obtained
  // elsewhere (a downstream system, an evidence bundle). When set and
  // different from the recorded ArtifactRef.sha256, the call fails
  // FailedPrecondition naming both, so a chain-of-custody check is one
  // command rather than a copy-and-compare.
  string expect_sha256 = 6;
  // item names the item of a fan-out task_id, as ReadArtifactRequest.item.
  optional int32 item = 7;
}

// ArtifactReference is one recording of the object by one archived run: the
// run, and the task and kind under which that run recorded it. A run that
// recorded the same object under two tasks yields two references.
message ArtifactReference {
  string run_id = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  string task_id = 4;
  ArtifactKind kind = 5;
  Status run_status = 6;
  google.protobuf.Timestamp run_created_at = 7;
  // item is set when the referencing run recorded the object under one item.
  optional int32 item = 8;
  // orkflow_namespace is the namespace that owns orkflow_name when that is
  // not the run's own: a shared Orkflow's child run. Empty otherwise.
  string orkflow_namespace = 9;
}

message GetArtifactProvenanceResponse {
  // artifact is the reference as recorded on the addressed run — never a
  // value re-read from the store.
  ArtifactRef artifact = 1;
  // bytes_present is whether the object itself is in the store (Stat, no
  // bytes transferred). false means the object is gone — a lifecycle rule,
  // an operator, or DeleteUnreferencedObjects — while its references may
  // still stand. A store that cannot answer fails the call; it never sets
  // this false.
  bool bytes_present = 2;
  ReferenceState own_reference = 3;
  // released_at is set only with REFERENCE_STATE_RELEASED.
  google.protobuf.Timestamp released_at = 4;
  // references is every marker on this object whose run is in the calling
  // namespace, newest run_created_at first. It includes the addressed run
  // when own_reference is HELD. Runs of other namespaces are omitted and
  // not counted.
  repeated ArtifactReference references = 5;
  // references_unreadable counts markers whose run body is not in the
  // archive (an archive write that stopped short of its body, which a later
  // write finishes, docs/STORAGE.md). Such a marker's namespace cannot be known, so
  // it is counted here and listed nowhere. A body that fails to read for
  // any other reason fails the call.
  int64 references_unreadable = 6;
  google.protobuf.Timestamp computed_at = 7;
}

message InspectRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;                    // empty = every in-flight task of the run
  // item narrows task_id to one item of a fan-out; requires task_id.
  optional int32 item = 4;
}

// LiveAttemptState is where the pending attempt is in Temporal's view. It
// mirrors temporal.api.enums.v1.PendingActivityState with its own numbering,
// on the rule RetryState (run.proto) follows: a value of another package's
// enum is never carried by number, and the mapping is an explicit switch in
// internal/engine/live.go. PAUSED and PAUSE_REQUESTED have no member: nothing
// in OrkStack pauses an activity, and a reader of an older build must not be
// handed a state it cannot name — they map to UNSPECIFIED.
enum LiveAttemptState {
  LIVE_ATTEMPT_STATE_UNSPECIFIED = 0;
  // SCHEDULED: Temporal holds the activity and no Orker has it — the pool
  // has no free Orker, or a retry is waiting out its backoff (next_attempt_at
  // is then set).
  LIVE_ATTEMPT_STATE_SCHEDULED = 1;
  // STARTED: an Orker picked the attempt up. Only STARTED and
  // CANCEL_REQUESTED can carry a heartbeat.
  LIVE_ATTEMPT_STATE_STARTED = 2;
  // CANCEL_REQUESTED: the run was cancelled and the Orker has been (or is
  // about to be) told through a heartbeat response; the §3.3 SIGTERM → grace
  // → SIGKILL sequence runs on the Orker while this state holds.
  LIVE_ATTEMPT_STATE_CANCEL_REQUESTED = 3;
}

// HeartbeatUnavailableReason says why LiveAttempt.heartbeat_available is
// false. It is an enum rather than free text so a client renders a fixed
// sentence per value and a new value is a proto change, not a string drift.
enum HeartbeatUnavailableReason {
  HEARTBEAT_UNAVAILABLE_REASON_UNSPECIFIED = 0;    // heartbeat_available is true
  // NOT_STARTED: state is SCHEDULED (or UNSPECIFIED); no Orker has the
  // attempt, so there is nothing to beat.
  HEARTBEAT_UNAVAILABLE_REASON_NOT_STARTED = 1;
  // NO_HEARTBEAT_YET: an Orker has the attempt and no beat from THIS attempt
  // has arrived — including the case where the cluster still holds a
  // previous attempt's detail. On a healthy Orker this lasts one tick at
  // most, because the loop beats immediately on start.
  HEARTBEAT_UNAVAILABLE_REASON_NO_HEARTBEAT_YET = 2;
  // UNDECODABLE: a beat from this attempt arrived whose detail is not the
  // Orker's shape (no "phase"). Reported, never guessed at.
  HEARTBEAT_UNAVAILABLE_REASON_UNDECODABLE = 3;
}

// LiveAttempt is ONE pending ExecuteTask attempt as the cluster sees it now.
// It is not durable and is not a record: when the attempt ends the durable
// answer is the TaskAttempt record the Orker writes.
message LiveAttempt {
  string task_id = 1;
  // attempt is the ordinal the running attempt's Orker claimed, once its
  // heartbeat names it: the number the attempt's record and log carry
  // (docs/STORAGE.md, "Attempt ordinals"). Before that, and while SCHEDULED
  // between retries, it is Temporal's attempt number for the pending activity
  // (PendingActivityInfo.attempt), which may differ from the ordinal.
  int32 attempt = 2;
  LiveAttemptState state = 3;
  // attempt_scheduled_at is Temporal's scheduled_time for the pending
  // attempt: for a retry, the instant the backoff ends. attempt_started_at
  // is Temporal's last_started_time and is set only while STARTED or
  // CANCEL_REQUESTED. Neither is an Orker clock.
  google.protobuf.Timestamp attempt_scheduled_at = 4;
  google.protobuf.Timestamp attempt_started_at = 5;
  // next_attempt_at is set only while SCHEDULED between attempts: the
  // previous attempt failed and Temporal will start the next one at this
  // time (next_attempt_schedule_time). The previous attempt's error is in
  // ListTaskAttempts, not here.
  google.protobuf.Timestamp next_attempt_at = 6;
  // timeout_seconds and cancellation_grace_period_seconds are the task's own
  // bounds as dispatched (ExecuteTaskInput 15 and 16, read from the
  // scheduling event). The Orker arms timeout_seconds when the container is
  // started, AFTER staging and the image pull, so attempt_started_at +
  // timeout_seconds is the EARLIEST the container can be killed, not the
  // moment it will be. A client that prints a remaining time prints a lower
  // bound and says so.
  int32 timeout_seconds = 7;
  int32 cancellation_grace_period_seconds = 8;
  // expires_at is Temporal's backstop for this attempt (expiration_time: the
  // StartToClose deadline the engine computed at schedule, OCI contract
  // §6.3). It is deliberately generous and is not the task's timeout.
  google.protobuf.Timestamp expires_at = 9;

  // heartbeat_available is true ONLY when state is STARTED or
  // CANCEL_REQUESTED, a heartbeat has arrived since attempt_started_at, and
  // its detail decodes as the Orker's shape. Every field from
  // last_heartbeat_at down is meaningless when it is false and MUST render
  // as unavailable, never as zero or empty.
  bool heartbeat_available = 10;
  // heartbeat_unavailable_reason is set exactly when heartbeat_available is
  // false, and UNSPECIFIED when it is true.
  HeartbeatUnavailableReason heartbeat_unavailable_reason = 11;
  // last_heartbeat_at is the cluster's time of the last beat from this
  // attempt (last_heartbeat_time).
  google.protobuf.Timestamp last_heartbeat_at = 12;
  // heartbeat_stale is computed_at - last_heartbeat_at > task.HeartbeatStaleAfter
  // (two ceiling ticks, 20 s): a healthy Orker beats at least every
  // task.MaxHeartbeatInterval, so an older beat means the Orker is gone,
  // partitioned, or cannot reach the frontend. Temporal has not yet acted:
  // it times the attempt out at heartbeat_deadline_at, after which the
  // attempt is retried or the task fails, and this attempt becomes an
  // UNREPORTED row in ListTaskAttempts if the Orker never files a record.
  bool heartbeat_stale = 13;
  // heartbeat_deadline_at is last_heartbeat_at + the heartbeat timeout
  // (task.HeartbeatTimeout, 30 s): the instant Temporal times this attempt
  // out unless another beat arrives first. Computed here so no client needs
  // to know the constant.
  google.protobuf.Timestamp heartbeat_deadline_at = 14;
  // phase is the phase the attempt is in, in the Orker's own vocabulary:
  // "start", "commit-check", "workspace", "stage-inputs", "image", "render",
  // "create", "run", "exit", "validate", "commit", "timeout", "cancel";
  // "image-policy" is entered only when the task carries an image policy
  // (ExecuteTaskInput.image_policy), between "commit-check" and "workspace";
  // "identity" only by a task that declares an identity, and "credentials"
  // after it only by one that logs in through a grant, both between "image"
  // and "render". Not an enum, for the reason TaskAttempt.phase is a string.
  string phase = 15;
  // container_id is the runtime's id for the container, once one exists.
  string container_id = 16;
  // bytes_logged is every byte the workload has written to stdout AND
  // stderr, counted before the per-stream retention cap drops any — so it
  // keeps growing after retention stops. Zero with heartbeat_available true
  // means the workload has written nothing.
  int64 bytes_logged = 17;
  // orker_id is the Orker that sent the heartbeat, as it names itself
  // (ORK_ORKER_ID) — the same value TaskRun.orker_id and TaskAttempt.orker_id
  // carry. Empty when the beat came from an Orker built before the detail
  // carried it.
  string orker_id = 18;
  // item is set when the pending activity is one item of a fan-out (read off
  // the scheduled ExecuteTaskInput.each.index).
  optional int32 item = 19;
  // capacity_wait is set when this attempt is waiting for capacity: it has
  // been SCHEDULED, with no next_attempt_at, for at least two seconds, its
  // task is not pinned, and every Orker of its pool that takes new tasks
  // declares a capacity, runs a task, and has no room for another task within
  // it. Derived on read from the Orker inventory ListOrkers reports, in a
  // reading at most five seconds old that one engine replica shares among
  // every caller. Unset otherwise — including when the inventory could
  // not be read in time, when any live Orker did not answer (it could serve
  // this pool, with room), when one of the pool's Orkers declares no
  // capacity, runs nothing (what it reserves is then its own polls, which
  // take the next task), or has room but every task slot (max_concurrent)
  // taken. The attempt is then waiting for an Orker, as it always was.
  CapacityWait capacity_wait = 20;
  // store_outage_wait is set when this attempt is waiting out an object
  // storage outage: it has been SCHEDULED, with no next_attempt_at, for at
  // least two seconds, its task is not pinned, at least one Orker of its pool
  // is cordoned only because the store does not answer it, and no Orker of the
  // pool takes new tasks. Derived on read like capacity_wait, and unset for the
  // same reasons. The attempt has used nothing while it waits, and starts once
  // the store answers.
  StoreOutageWait store_outage_wait = 21;

  // usage is the attempt's latest CPU and memory, from its Orker's last
  // heartbeat, or why there is none.
  LiveUsage usage = 22;

  // reserved is set from E94; unset until it lands (v0.4.0 proto batch).
  ReservedResources reserved = 23;

  // identity is each identity the attempt holds now, by name, with its
  // state; never a token.
  repeated LiveIdentity identity = 24;
}

// StoreOutageWait says why a SCHEDULED attempt has not started: no Orker of its
// pool takes new tasks, and at least one has cordoned itself because object
// storage does not answer it and for no other reason (Orker.store_outage;
// docs/DEPLOY.md, "When object storage goes away"). A
// reading of the inventory at most five seconds old, never a record.
message StoreOutageWait {
  // pool is the pool the attempt waits on, as TaskRun.pool spells it.
  string pool = 1;
  // orkers is how many Orkers of the pool are cordoned for that reason alone.
  int32 orkers = 2;
  // since is when the earliest of those Orkers cordoned itself.
  google.protobuf.Timestamp since = 3;
}

// CapacityWait says why a SCHEDULED attempt has not started: every Orker of
// its pool is at its declared capacity. An Orker has room for another task
// only while its per-task cap (DescribeOrkerResult.max_request) still fits
// beside what stands reserved, because it reserves that cap before it asks
// for a task (docs/DEPLOY.md, "Declaring an Orker's capacity"). It is a
// reading of the inventory at most five seconds old, never a record.
message CapacityWait {
  // pool is the pool the attempt waits on, as TaskRun.pool spells it.
  string pool = 1;
  // orkers is how many Orkers of the pool were counted: each answered when
  // asked, is not cordoned, and is full. A cordoned Orker takes nothing new
  // and is not counted.
  int32 orkers = 2;
  // reserved sums what stands reserved on those Orkers
  // (DescribeOrkerResult.reserved): each outstanding poll at the per-task cap,
  // each task's request and each container not yet removed.
  ResourceQuantity reserved = 3;
  // capacity sums what those Orkers admit tasks within
  // (DescribeOrkerResult.capacity). A dimension is 0 when any of them leaves
  // it unbounded; a client then reports that dimension of neither capacity
  // nor reserved.
  ResourceQuantity capacity = 4;
}

message InspectRunResponse {
  // run_status is the run's status as the read model reports it. A terminal
  // status comes with no attempts.
  Status run_status = 1;
  // attempts lists every pending ExecuteTask attempt of the run, in
  // Run.task_runs order, one per task. Empty for a run with nothing pending:
  // between two tasks, waiting on nothing, or finished.
  repeated LiveAttempt attempts = 2;
  // computed_at is the engine's clock at the time of the answer; every age a
  // client prints is measured against it, never against the browser's clock.
  google.protobuf.Timestamp computed_at = 3;
}

message DiffRunsRequest {
  string from_run_id = 1;
  string to_run_id = 2;
  string namespace = 3;                  // empty = the default namespace; BOTH runs resolve in it
  // only restricts the comparison to the named fields, in the vocabulary
  // RunFieldDiff.field uses plus the two run-level names "definition" and
  // "input". Empty means every field. An unknown name is InvalidArgument
  // naming the valid ones. Narrowing also narrows the READS: a request that
  // names neither "image" nor "platform_digest" never opens the attempt
  // store or the orkflow store.
  //
  // "presence" is ALWAYS compared, whatever only names: a task that exists in
  // one run and not the other always yields its presence row, so narrowing
  // can never make an added or removed task count as identical. Naming
  // "presence" is accepted and redundant. It costs no read beyond the two
  // runs themselves.
  repeated string only = 4;
}

// RunFieldDiff is one field of one task (or of the run, when task_id is
// empty) whose two values differ, or whose evidence is missing on at least
// one side. A field that is equal and available on both sides has no row.
message RunFieldDiff {
  string task_id = 1;                    // empty for a run-level field
  // field is one of: "definition" (run-level); "presence", "status",
  // "attempt", "pool", "pin", "orker", "exit_code", "error", "duration",
  // "image", "platform_digest" (task-level). It is a string, not an enum,
  // so a later contract can add a field a client of this build has never
  // heard of and the client still prints the row.
  string field = 2;
  // from_value / to_value are RENDERED strings. Empty with the side available
  // means "does not apply" or "no value" (an unpinned task's pin, a skipped
  // task's exit code); a client prints "-". Empty with the side unavailable
  // means the evidence is gone; a client prints "unavailable" and the reason.
  string from_value = 3;
  string to_value = 4;
  bool from_available = 5;
  bool to_available = 6;
  // from_reason / to_reason are set only when the side is unavailable: a
  // stable machine token from the list in docs/UI_CLI_PARITY.md ("Run diff"),
  // e.g. "attempt_record_missing", "definition_unavailable",
  // "no_attempt_store". A client renders the token's documented sentence.
  string from_reason = 7;
  string to_reason = 8;
  // item is set on a row that compares one item of a fan-out task in both runs.
  optional int32 item = 9;
}

message DiffRunsResponse {
  // from / to are the two runs, SHALLOW: task_runs, input and output are
  // cleared, because the differences below and input_unified_diff already
  // carry what a client needs of them, and a run's input may be large.
  // Every other Run field (id, orkflow, version, status, error, times,
  // namespace, definition digest, telemetry, and any field a later contract
  // adds) is carried as GetRun would carry it.
  Run from = 1;
  Run to = 2;
  bool same_orkflow = 3;                 // orkflow_name equal, and the namespace that owns it (a shared Orkflow's child run)
  bool same_definition_digest = 4;       // orkflow_definition_digest equal
  // input_unified_diff is dsl.Unified over the canonical, indented JSON of the
  // two inputs (keys sorted, integers without fraction), labelled
  // "<run id>/input.json" on each side. Empty when the inputs are identical
  // under that canonical form, or when "input" was excluded by `only`.
  string input_unified_diff = 5;
  // differences is ordered: run-level rows first, then the from-run's tasks
  // in its task_runs order, then tasks present only in the to-run in that
  // run's order; within a task, fields in the order the field comment on
  // RunFieldDiff lists them. The order is the contract; clients render it
  // as given.
  repeated RunFieldDiff differences = 6;
  // tasks_compared is the number of distinct task ids across both runs.
  int32 tasks_compared = 7;
  // tasks_identical is the number of tasks with NO row: every compared field
  // equal and available on both sides. A task whose evidence is missing on
  // either side is not identical, whatever its other fields say; nor is a
  // task present in only one run, which always has its presence row.
  int32 tasks_identical = 8;
  // evidence_unavailable counts rows with at least one unavailable side.
  int32 evidence_unavailable = 9;
  // fields_compared is the resolved field list — every field when `only` is
  // empty, else `only` plus "presence" — in canonical order, so a client can
  // say what was and was not compared. It is exhaustive: every
  // RunFieldDiff.field in differences is one of its entries.
  repeated string fields_compared = 10;
}

message ExportRunEvidenceRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // task_id narrows the per-task members to one task. Empty = every task.
  // The run's own members (MANIFEST.json, run.jsonl, orkflow/source.yaml)
  // are always included. An unknown task is NotFound.
  string task_id = 3;
  // exclude_logs and exclude_artifacts drop the attempts' stdout.log and
  // stderr.log, and the tasks' output artifacts, from the bundle. They are
  // spelled as exclusions so that the proto3 zero value — an empty request —
  // is the COMPLETE bundle: a caller that asks for nothing in particular gets
  // everything. values.json, commit.json and attempt records are never
  // excluded; they are what makes the bundle evidence.
  bool exclude_logs = 4;
  bool exclude_artifacts = 5;
  // manifest_only streams the bytes of MANIFEST.json alone — the same
  // document the full bundle would carry as its first member, for the same
  // request — as an uncompressed JSON document, so a client can show what
  // a bundle would contain, and how large it is, before fetching it. The
  // small members (the archive body, the definition, commits, attempt
  // records) are still read and hashed; artifact and log objects are
  // stat'ed, never read.
  bool manifest_only = 6;
  // item narrows task_id to one item of a fan-out; requires task_id.
  optional int32 item = 7;
}

// EvidenceChunk is one slice of the export, at most 64 KiB, as ArtifactChunk
// is. `last` is set only on the final, empty chunk of a COMPLETE, successful
// export: a stream that ends without it — an error, a disconnect — is not a
// bundle, and a client must discard what it received.
message EvidenceChunk {
  bytes data = 1;
  bool last = 2;
}

message CancelRunRequest {
  string run_id = 1;
  string reason = 2;
  string namespace = 3;                  // empty = the default namespace
}

message CancelRunResponse { Run run = 1; }

message ForceCancelRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // reason is required: at most 512 bytes, with no control or invisible
  // characters. It is recorded with the run's end.
  string reason = 3;
  // grace is how long the run may show no progress after its cancel before it
  // is ended. Unset is the least that may be asked: the deployment's
  // engine.runs.force_cancel_grace, or 30 s more than the longest cancellation
  // grace of the run's own tasks when that is longer. The most is
  // engine.runs.max_force_cancel_grace, or that least when it is more. Where
  // the run's definition cannot be read, the least is the most.
  google.protobuf.Duration grace = 4;
  // client_request_id names this request to whoever repeats it: the same
  // caller's same id is the same request. At most 128 bytes of printable
  // ASCII; optional. Where the deployment signs nothing it is ignored.
  string client_request_id = 5;
  // cascade also force-cancels every open run below this one: each is asked to
  // cancel, given its own grace and ended only if it stalls. It needs the
  // permissions at the run's namespace, as preview and stop do, because the
  // runs below may be of any of its Orkflows. A run that has ended still
  // cascades to what it left open.
  bool cascade = 6;
  // preview answers the open runs below and does nothing. The reason is not
  // required.
  bool preview = 7;
  // stop stops the newest cascade of this run: it starts no further force
  // cancel, its run's own stops too unless it has ended it, and those already
  // started go on. The reason is not required.
  bool stop = 8;
}

// ForceCancelState is what became of a request for a force cancel.
enum ForceCancelState {
  FORCE_CANCEL_STATE_UNSPECIFIED = 0;
  // REQUESTED: a force cancel of the run was started. Of a run already
  // force-canceled, it finishes what an earlier one may have left undone.
  FORCE_CANCEL_STATE_REQUESTED = 1;
  // WAITING: one of the run was in flight, and the request joined it.
  FORCE_CANCEL_STATE_WAITING = 2;
  // ALREADY_ENDED: the run had ended, and nothing was started.
  FORCE_CANCEL_STATE_ALREADY_ENDED = 3;
  // The states below are a finished force cancel's alone.
  //
  // FORCE_CANCELED: it ended the run.
  FORCE_CANCEL_STATE_FORCE_CANCELED = 4;
  // CANCELED: the run ended on its cancel, by its own path.
  FORCE_CANCEL_STATE_CANCELED = 5;
  // ENDED: the run ended on its own.
  FORCE_CANCEL_STATE_ENDED = 6;
  // FAILED: it stopped, and cause says why; the run may still be open.
  FORCE_CANCEL_STATE_FAILED = 7;
  // PENDING: a run below whose force cancel had not ended when its cascade
  // stopped waiting. It goes on.
  FORCE_CANCEL_STATE_PENDING = 8;
}

// ForceCancelRunBelow is a run below one that is force-canceled.
message ForceCancelRunBelow {
  // redacted: a run of an Orkflow the caller may not read; only its state is
  // told.
  bool redacted = 1;
  string run_id = 2;
  string parent_run_id = 3;
  // orkflow is its Orkflow's name, "<owner>/<name>" for a shared one.
  string orkflow = 4;
  // depth is how far below; 0 where only the tree's root names it.
  int32 depth = 5;
  // state, request_id, attached and cause are of its force cancel in a
  // cascade, unset in a preview. Attached: another caller's was in flight, and
  // the run's end is that one's.
  ForceCancelState state = 6;
  string request_id = 7;
  bool attached = 8;
  string cause = 9;
}

// ForceCancelSubtree is the open runs below one, as the cluster's index has
// them now: a run started a moment ago may not be there yet.
message ForceCancelSubtree {
  repeated ForceCancelRunBelow runs = 1;
  // truncated_by is the bound that cut the search short: "scan" or "timeout";
  // "could_not_read" when it could not be made.
  string truncated_by = 2;
  repeated ForceCancelExclusion exclusions = 3;
}

// ForceCancelExclusion is a run that names a run of the tree as what started
// it, and may not be acted on.
message ForceCancelExclusion {
  string run_id = 1;
  // cause is "other_namespace" or "unreadable".
  string cause = 2;
}

// ForceCancelCascadeState is where a cascade stands.
enum ForceCancelCascadeState {
  FORCE_CANCEL_CASCADE_STATE_UNSPECIFIED = 0;
  FORCE_CANCEL_CASCADE_STATE_RUNNING = 1;
  // COMPLETE: every run below it found has ended, and a last search confirmed
  // nothing open.
  FORCE_CANCEL_CASCADE_STATE_COMPLETE = 2;
  // PARTIAL: it reached its end, and something is open, failed, was not
  // started or could not be told.
  FORCE_CANCEL_CASCADE_STATE_PARTIAL = 3;
  // STOPPED: it was stopped, or ended from outside, before its end.
  FORCE_CANCEL_CASCADE_STATE_STOPPED = 4;
}

// ForceCancelCascade is what a cascade reports of itself.
message ForceCancelCascade {
  ForceCancelCascadeState state = 1;
  google.protobuf.Timestamp as_of = 2;
  repeated ForceCancelRunBelow runs = 3;
  // left_to_parents is how many deeper runs past the most a cascade covers
  // (engine.runs.force_cancel_cascade_max) are left to their parents' cancel;
  // not_started, how many that reaches none of.
  int32 left_to_parents = 4;
  int32 not_started = 5;
  // found_by_root_index is how many only the tree's root names.
  int32 found_by_root_index = 6;
  string truncated_by = 7;
  repeated ForceCancelExclusion exclusions = 8;
  // rerun_suggested: more were found late, or a search was cut short; the same
  // request made again covers what is left.
  bool rerun_suggested = 9;
  // open_after is what was open below when it ended; unset until it looked.
  ForceCancelOpenAfter open_after = 10;
  // cause is why a search below could not be made; empty when none failed.
  string cause = 11;
  // unread: where it stands could not be asked, so the rest is not known.
  bool unread = 12;
}

// ForceCancelOpenAfter is what is open below a run after its cascade.
message ForceCancelOpenAfter {
  int32 count = 1;
  // run_ids are the first of them the caller may read.
  repeated string run_ids = 2;
  // unconfirmed_cause is why there may be more: "too_many_runs",
  // "took_too_long" or "could_not_read"; empty when there are no more.
  string unconfirmed_cause = 3;
}

message ForceCancelRunResponse {
  ForceCancelState state = 1;
  // request_id is the force cancel's, which the run's records carry: the one
  // started, or the one joined. Empty when there is none.
  string request_id = 2;
  // attached: the request joined a force cancel already made, so its own
  // reason and grace are not used; those in force are below.
  bool attached = 3;
  // attach_unverified is how many executions claimed to be force cancels of
  // this run, were nobody's, and were ended.
  int32 attach_unverified = 4;
  // attach_unknown: whether one is in flight could not be told, so this one
  // may run beside it.
  bool attach_unknown = 5;
  // direct: the run was ended by this request, because two force cancels
  // given their whole time had left it open.
  bool direct = 6;
  // The decision in force: who asked, whether this deployment verified them,
  // why, and the grace. Empty when it could not be read.
  string principal = 7;
  bool principal_verified = 8;
  string reason = 9;
  google.protobuf.Duration grace = 10;
  // cascades: the force cancel started or joined cascades.
  bool cascades = 11;
  // open_descendants answers a preview.
  ForceCancelSubtree open_descendants = 12;
}

message GetForceCancelRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // request_id is the force cancel's; empty is the run's newest.
  string request_id = 3;
}

message GetForceCancelResponse {
  string request_id = 1;
  // state is REQUESTED while it runs.
  ForceCancelState state = 2;
  // cause is what it lacks or why it stopped (docs/REASONS.md, "Force
  // cancel"); empty when it has nothing to say.
  string cause = 3;
  google.protobuf.Timestamp started_at = 4;
  // Who asked, whether this deployment verified them, why, and the grace.
  string principal = 5;
  bool principal_verified = 6;
  string reason = 7;
  google.protobuf.Duration grace = 8;
  // incomplete: the run was ended and something of its end is missing. The
  // same request made again finishes it.
  bool incomplete = 9;
  // cascade is set on one that cascades.
  ForceCancelCascade cascade = 10;
  // open_descendants are the open runs below now, of one that ended its run
  // and does not cascade.
  ForceCancelSubtree open_descendants = 11;
  // newer_unknown: without a request_id, a newer one of the run could not be
  // judged, and this may not be the newest.
  bool newer_unknown = 12;
  // unaudited: a record of it, or of its cascade, could not be written to the
  // audit trail. Nothing of the run's end is missing for it.
  bool unaudited = 13;
}

message PauseRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // reason is recorded on the pause, its audit record and its event; at
  // most 1024 bytes.
  string reason = 3;
  // timeout is how long the pause lasts unless it is unpaused: whole
  // seconds, at least 1 s and at most the deployment's
  // engine.run_pause_timeout_max (31 days at most). Unset is the
  // deployment's engine.run_pause_timeout (7 days by default).
  google.protobuf.Duration timeout = 4;
  // dry_run makes every check and returns the warnings, and sends nothing:
  // no request id, no audit record. What a client shows before asking for
  // the pause.
  bool dry_run = 5;
}

message PauseRunResponse {
  // request_id names the request: the RUN_PAUSED event that applied it
  // carries it, and so does its audit record. Empty for a dry run.
  string request_id = 1;
  // after_sequence is the run's last event sequence read before the request
  // was sent; stream from it to see what the run did with it.
  int64 after_sequence = 2;
  // warnings are what the pause will not hold back: a failing run kept open,
  // a deadline that ends before the pause does, the child runs paused with
  // it, a schedule whose next fire cancels it.
  repeated string warnings = 3;
}

message UnpauseRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // reason is recorded on the audit record; at most 1024 bytes.
  string reason = 3;
}

message UnpauseRunResponse {
  // request_id names the request: the RUN_UNPAUSED event that applied it
  // carries it, and so does its audit record.
  string request_id = 1;
  // after_sequence is the run's last event sequence read before the request
  // was sent.
  int64 after_sequence = 2;
}

message StreamEventsRequest {
  string run_id = 1;
  int64 from_sequence = 2;
  string namespace = 3;                  // empty = the default namespace
}

message StreamTaskLogsRequest {
  string run_id = 1;
  string task_id = 2;
  // attempt selects one try of the task. 0 means the latest attempt that has
  // written anything, so a caller that never saw a retry does not have to
  // know retries exist.
  //
  // With `follow`, 0 keeps meaning THE LATEST for as long as the stream is
  // open, not merely when it opened. A retry is invisible in a task's
  // status — the task stays RUNNING while try 2 starts under a new
  // key prefix — so a stream that resolved the attempt once would sit on a
  // dead attempt, delivering nothing, for the rest of the task's life, and say
  // it was live. When a later attempt appears the stream moves to it and
  // delivers that attempt from its FIRST chunk; every chunk names the attempt
  // it belongs to, and its seq restarts at 1, so a client can tell a new
  // attempt from more of the old one. A non-zero attempt is pinned and never
  // moves.
  int32 attempt = 3;
  // from_seq resumes AFTER this sequence: it is the LAST chunk sequence the
  // client already received, and the stream continues with the next one. 0
  // starts at the beginning. It is the same contract
  // StreamEvents.from_sequence has, over the log's own numbering — dense and
  // 1-based per (run, task, attempt) — so a client that hands back the seq of
  // the last chunk it saw replays nothing twice and misses nothing, even when
  // it reconnects to a DIFFERENT replica.
  int64 from_seq = 4;
  // from_attempt says which attempt from_seq counts chunks of. It is what
  // makes a resume safe across a retry: seq is dense per ATTEMPT, so a cursor
  // of 500 handed back after try 1 would silently skip try 2's first 500
  // chunks — or, since try 2 is usually shorter, would deliver nothing at all
  // while the pane read LIVE.
  //
  // 0 means "the attempt this request resolves to", which is what a first
  // connection means and what a client pinning `attempt` means. When it names
  // a DIFFERENT attempt from the one resolved, from_seq is dropped and the
  // resolved attempt is delivered from its first chunk: a new attempt is a new
  // read, not a continuation of the old one.
  int32 from_attempt = 7;
  // follow keeps the stream open for chunks that do not exist yet, ending
  // when the task reaches a terminal state. False makes it a replay: the
  // chunks the store holds when the request is served, then the end — whether
  // or not the task is still writing, so a replay never turns into a follow.
  bool follow = 5;
  string namespace = 6;                  // empty = the default namespace
  // item names the item of a fan-out task_id whose output is streamed;
  // required for a fan-out task, refused for any other. attempt, from_seq and
  // from_attempt then count that item's own attempts and chunks.
  optional int32 item = 8;
}

// TaskLogChunk is one slice of a task attempt's output, exactly as the Orker
// flushed it.
message TaskLogChunk {
  string run_id = 1;
  string task_id = 2;
  int32 attempt = 3;
  // seq orders the chunk within (run_id, task_id, attempt): dense, starting
  // at 1. It is assigned by the single Orker executing the attempt, so it is
  // total and gap-free without any coordination, and it is what a client
  // hands back as from_seq.
  int64 seq = 4;
  // data is UTF-8 log bytes ending on a line boundary, except where one line
  // exceeded the chunk limit and was split.
  bytes data = 5;
  // truncated marks the notice chunk the Orker writes when a task's output
  // passed its cap. Its data says so in words; no further output was stored.
  // Truncation is visible in the stream, never silent.
  bool truncated = 6;
  // last marks the end of the stream: everything this stream will deliver has
  // been delivered, and its seq is the last sequence sent, so a client resumes
  // from it. With follow that means the task reached a terminal state; without
  // follow it means the replay is complete. It carries no data.
  bool last = 7;
  // item echoes the request's item.
  optional int32 item = 8;
}

// LiveIdentity is one identity or credential a running attempt holds, as
// its Orker last reported it: never a value, a token id or a path.
message LiveIdentity {
  // name is the identity's or credential's name in its task.
  string name = 1;
  // kind is `identity` or `credential`.
  string kind = 2;
  // last_refresh is when it was last minted or refreshed.
  google.protobuf.Timestamp last_refresh = 3;
  // expires_at is when what it holds expires.
  google.protobuf.Timestamp expires_at = 4;
  // state is whether its last refresh succeeded.
  LiveIdentityState state = 5;
}

// LiveIdentityState is whether an attempt's identity is current.
enum LiveIdentityState {
  LIVE_IDENTITY_STATE_UNSPECIFIED = 0;
  // LIVE_IDENTITY_STATE_FRESH: its last refresh succeeded.
  LIVE_IDENTITY_STATE_FRESH = 1;
  // LIVE_IDENTITY_STATE_RETRYING: a refresh failed and is being asked
  // again; what it holds has not expired.
  LIVE_IDENTITY_STATE_RETRYING = 2;
  // LIVE_IDENTITY_STATE_EXPIRED: what it holds expired unrefreshed.
  LIVE_IDENTITY_STATE_EXPIRED = 3;
}

// LiveUsageUnavailableReason is why a running attempt shows no live CPU and
// memory.
enum LiveUsageUnavailableReason {
  LIVE_USAGE_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // NOT_STARTED: the attempt has not been picked up.
  LIVE_USAGE_UNAVAILABLE_REASON_NOT_STARTED = 1;
  // PREPARING: the attempt's container has not started yet. An Orker older
  // than v0.4.0 never says its container started, so its running attempts
  // read PREPARING too.
  LIVE_USAGE_UNAVAILABLE_REASON_PREPARING = 2;
  // CGROUP_NOT_VISIBLE, NO_CGROUP and DISABLED are UnmeasuredReason's.
  LIVE_USAGE_UNAVAILABLE_REASON_CGROUP_NOT_VISIBLE = 3;
  LIVE_USAGE_UNAVAILABLE_REASON_NO_CGROUP = 4;
  LIVE_USAGE_UNAVAILABLE_REASON_DISABLED = 5;
  // NO_SAMPLE_YET: the container started and has not been read yet, or it
  // ended before its first periodic read; its final read may still measure
  // it, on the attempt's record.
  LIVE_USAGE_UNAVAILABLE_REASON_NO_SAMPLE_YET = 6;
  // ORKER_TOO_OLD: the Orker running the attempt does not report usage.
  LIVE_USAGE_UNAVAILABLE_REASON_ORKER_TOO_OLD = 7;
  // UNDECODABLE: the Orker's report could not be read, carried no reading,
  // or named a reason this engine does not know.
  LIVE_USAGE_UNAVAILABLE_REASON_UNDECODABLE = 8;
  // READ_FAILED: the container's cgroup could not be read.
  LIVE_USAGE_UNAVAILABLE_REASON_READ_FAILED = 9;
  // START_FAILED: the container's start failed or was cut off.
  LIVE_USAGE_UNAVAILABLE_REASON_START_FAILED = 10;
  // CGROUP_UNVERIFIED is UnmeasuredReason's.
  LIVE_USAGE_UNAVAILABLE_REASON_CGROUP_UNVERIFIED = 11;
}

// LiveUsage is a running attempt's latest CPU and memory, from the Orker's
// last heartbeat.
message LiveUsage {
  bool available = 1;
  // unavailable_reason is set when available is false.
  LiveUsageUnavailableReason unavailable_reason = 2;
  // cpu_cores is the CPU rate between the last two readings, in cores.
  // Unset until there are two: not yet known, which is not 0 cores.
  optional double cpu_cores = 3;
  // cpu_seconds is the container's CPU time at the last reading.
  double cpu_seconds = 4;
  int64 memory_bytes = 5;
  int64 memory_peak_bytes = 6;
  bool memory_peak_exact = 7;
  // memory_limit_bytes is the container's memory limit; 0 is none.
  int64 memory_limit_bytes = 8;
  // sampled_at is when the reading was taken: the heartbeat's time on the
  // cluster's clock, less the reading's age as the Orker reported it.
  google.protobuf.Timestamp sampled_at = 9;
  // stale: the reading is older than twice the Orker's sampling interval
  // plus one heartbeat tick.
  bool stale = 10;
}
