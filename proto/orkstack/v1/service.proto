syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/image_policy.proto";
import "orkstack/v1/run.proto";
import "orkstack/v1/orkflow.proto";
import "orkstack/v1/namespace.proto";
import "orkstack/v1/retention.proto";
option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// OrkflowService manages orkflow definitions (the compiled DSL).
//
// A version is immutable and a name is unique within a namespace, so the three
// coordinates (namespace, name, version) address one document for all time.
// What moves is a per-orkflow POINTER: `current` decides which version an
// empty version resolves to, and moving it is the only mutation this service
// performs on an existing orkflow.
service OrkflowService {
  // ValidateOrkflow performs the same non-mutating preparation as apply.
  rpc ValidateOrkflow(ValidateOrkflowRequest) returns (ValidateOrkflowResponse);
  // ApplyOrkflow validates and stores an orkflow from raw DSL YAML.
  //
  // It never rewrites a stored version: identical YAML under an existing
  // version is a no-op that writes nothing, and DIFFERENT YAML under an
  // existing version is refused (AlreadyExists). An edit therefore always
  // arrives as a new version — which is what lets a run pinned to a version
  // keep reading the bytes it pinned.
  rpc ApplyOrkflow(ApplyOrkflowRequest) returns (ApplyOrkflowResponse);
  rpc GetOrkflow(GetOrkflowRequest) returns (GetOrkflowResponse);
  rpc ListOrkflows(ListOrkflowsRequest) returns (ListOrkflowsResponse);
  // ListOrkflowVersions lists every stored version of one orkflow, newest
  // applied first, marking the one an empty version resolves to.
  rpc ListOrkflowVersions(ListOrkflowVersionsRequest) returns (ListOrkflowVersionsResponse);
  // SetCurrentOrkflowVersion moves the orkflow's current pointer.
  //
  // The target must already exist: promoting to an unknown version is
  // NotFound, so a reader can never observe a pointer to a version that is not
  // there. Two replicas promoting at once are arbitrated by the store's
  // compare-and-swap — one value wins, and it is one of the two asked for.
  rpc SetCurrentOrkflowVersion(SetCurrentOrkflowVersionRequest) returns (SetCurrentOrkflowVersionResponse);
  // DiffOrkflowVersions renders the unified diff between two versions'
  // source_yaml.
  //
  // The diff is computed SERVER-side, deliberately. Two clients read it (the
  // CLI and the UI) and a third will follow; a client-side diff would put a
  // diff dependency in each of them and let their renderings drift, so that
  // `orkctl orkflow diff` and the version page could disagree about what
  // changed. One implementation, golden-tested once, rendered verbatim by
  // every client.
  rpc DiffOrkflowVersions(DiffOrkflowVersionsRequest) returns (DiffOrkflowVersionsResponse);
  // DeleteOrkflow removes all versions of an orkflow from the registry.
  //
  // It refuses (FailedPrecondition) if any runs are currently executing or
  // queued for this orkflow, or if runs have completed recently (within the
  // past 24 hours). The check is conservative: an orkflow with any recent
  // activity cannot be deleted. This protects against accidental deletion of
  // an orkflow in active use.
  //
  // The operation is NOT reversible: all versions and their metadata are
  // permanently deleted. Runs that pinned the orkflow keep executing — they
  // have the version they started with — but any new run will fail with
  // NotFound.
  rpc DeleteOrkflow(DeleteOrkflowRequest) returns (DeleteOrkflowResponse);
}

message ApplyOrkflowRequest {
  string yaml = 1;                       // raw DSL document
  // namespace selects where the document is applied. Empty honours the
  // document's own `namespace:` (itself empty = "default"); a non-empty value
  // must EQUAL the document's namespace, or the document names none and is
  // applied INTO this one. The two are never allowed to disagree silently: a
  // file that says `namespace: payments` applied with -n staging is a mistake
  // one of the two made, and guessing which would store the definition
  // somewhere its author cannot find it.
  string namespace = 2;
  // base_version is the stored version this edit was derived from — its
  // PROVENANCE and the anchor a diff is taken against, not the concurrency
  // token. ANY stored version is a valid base: editing an old one is how a
  // user forks forward from it, and the apply lands as the new head with the
  // `current` pointer untouched. A non-empty value that names no stored
  // version is NotFound, naming it.
  //
  // It is a VERSION token rather than a content hash. Both name where an edit
  // came from; only the token names something the user can act on —
  // `orkctl orkflow diff <name> <base_version> <head>` shows exactly what
  // arrived underneath the edit. A hash names nothing.
  string base_version = 3;
  // expected_head_version is the optimistic-concurrency token: the head
  // version the editor observed when it fetched. Non-empty and different from
  // the stored head is refused (FailedPrecondition) naming both, WHATEVER
  // base was chosen — so an edit made while somebody else applied is reported
  // instead of landing beside a newer version nobody looked at.
  //
  // Empty with an empty base_version is unchecked, which is what a plain
  // `orkctl apply file.yaml` sends. Empty with a non-empty base_version is
  // InvalidArgument naming both fields: a base is provenance, not a head
  // claim, and an editor that read a base also read the head it was under.
  //
  // Two fields because there are two facts. With one, the server cannot tell
  // "derived from an old version on purpose" from "derived from a head that
  // has since moved", and the first is the whole point of this contract.
  string expected_head_version = 4;
}
enum ValidationSeverity {
  VALIDATION_SEVERITY_UNSPECIFIED = 0;
  VALIDATION_SEVERITY_ERROR = 1;
  VALIDATION_SEVERITY_WARNING = 2;
}
message ValidationIssue {
  string field = 1;
  string message = 2;
  ValidationSeverity severity = 3;
}
message ValidateOrkflowRequest {
  string yaml = 1;
  string namespace = 2;
}
message ValidateOrkflowResponse {
  Orkflow orkflow = 1;
  repeated ValidationIssue issues = 2;
}
message ApplyOrkflowResponse {
  Orkflow orkflow = 1;
  repeated string warnings = 2;
  // created is false when this apply stored nothing because the version was
  // already there with byte-identical source YAML. The orkflow above is then
  // the STORED document, created_at and all, not the one this request would
  // have written.
  bool created = 3;
}
message GetOrkflowRequest {
  string name = 1;
  // version selects one stored version, and ANY stored version answers with
  // its own source_yaml — that is the read an editor starts from, whether it
  // is editing the head, the current version, or one older than both. Empty
  // resolves through the current pointer when one has been set, and to the
  // most recently applied version when none ever was.
  string version = 2;
  string namespace = 3;                  // empty = the default namespace
}
message GetOrkflowResponse { Orkflow orkflow = 1; }
message ListOrkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string namespace = 3;                  // empty = the default namespace
}
message ListOrkflowsResponse {
  repeated Orkflow orkflows = 1;
  string next_page_token = 2;
}

// OrkflowVersion is one stored version in a version listing: the document's
// coordinates, not the document.
message OrkflowVersion {
  string version = 1;
  google.protobuf.Timestamp applied_at = 2;
  // is_current marks the version an empty version resolves to — the pointer's
  // target when one is set, otherwise the most recently applied version.
  bool is_current = 3;
  string description = 4;
}
message ListOrkflowVersionsRequest {
  string name = 1;
  string namespace = 2;                  // empty = the default namespace
}
message ListOrkflowVersionsResponse {
  repeated OrkflowVersion versions = 1;  // newest applied first
  // current_version is the pointer's target, empty when nobody ever promoted
  // this orkflow. Empty does NOT mean "nothing runs": resolution then falls
  // back to head_version.
  string current_version = 2;
  // head_version is the most recently applied version — the edit lineage's
  // tip, and the expected_head_version an editor sends back with its apply.
  // The base an editor sends is whichever version it actually READ, which
  // need not be this one.
  //
  // A client renders "is head" as `version == head_version`, exactly as it
  // renders "is current" from is_current: head is a property of the listing,
  // not of a version, so a per-row flag would be a second place to keep the
  // same fact.
  string head_version = 3;
}
message SetCurrentOrkflowVersionRequest {
  string name = 1;
  string version = 2;                    // must already exist
  string namespace = 3;                  // empty = the default namespace
}
message SetCurrentOrkflowVersionResponse {
  string name = 1;
  string namespace = 2;
  string current_version = 3;
  // previous_version is what the pointer named before, empty when it was
  // never set. It is what a rollback promotes back to.
  string previous_version = 4;
  google.protobuf.Timestamp updated_at = 5;
}
message DiffOrkflowVersionsRequest {
  string name = 1;
  string from_version = 2;               // empty = the resolved current version
  string to_version = 3;                 // empty = the resolved current version
  string namespace = 4;                  // empty = the default namespace
}
message DiffOrkflowVersionsResponse {
  // unified_diff is standard unified-diff text, empty when the two versions'
  // source YAML is identical.
  string unified_diff = 1;
  string from_version = 2;               // resolved
  string to_version = 3;                 // resolved
}
message DeleteOrkflowRequest {
  string name = 1;
  string namespace = 2;                  // empty = the default namespace
}
message DeleteOrkflowResponse {
  string name = 1;
  string namespace = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

// RunService submits and observes orkflow executions.
service RunService {
  rpc SubmitRun(SubmitRunRequest) returns (SubmitRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // StreamEvents server-streams realtime events for a run. from_sequence
  // allows resuming after a disconnect (0 = from start).
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // StreamTaskLogs server-streams one task attempt's output: every chunk
  // already written, in order, then each new one as it lands.
  //
  // Logs are a SEPARATE stream from Event on purpose. Task output is bytes,
  // and bytes never enter a Temporal payload or the event stream (a run's
  // history is replayed forever, and a chatty task would bloat it forever
  // too). The Orker writes numbered chunks to the artifact store while the
  // task runs; this RPC reads them back from there. EventType gains nothing:
  // EVENT_TYPE_TASK_LOG stays what it always was, a human notice with no
  // task output in it.
  //
  // Any replica answers for any run, on the same terms as StreamEvents: the
  // chunks are in the shared store and the task's state comes from the shared
  // cluster, so a replica that started nothing serves a run to completion.
  rpc StreamTaskLogs(StreamTaskLogsRequest) returns (stream TaskLogChunk);
  rpc ListRunArtifacts(ListRunArtifactsRequest) returns (ListRunArtifactsResponse);
  rpc ReadArtifact(ReadArtifactRequest) returns (stream ArtifactChunk);
  // ListTaskAttempts reads back what every attempt of a task did, including
  // the attempts that lost.
  //
  // Temporal owns retries, so a run's snapshot only ever carries a task's
  // FINAL outcome: the error of each earlier attempt is discarded when the
  // next one is scheduled. The Orker writes one immutable TaskAttempt record
  // per attempt (metadata/attempts/…), and this RPC serves them — from the
  // shared store, so any replica answers for any run, on exactly the terms
  // StreamTaskLogs and ListRunArtifacts are on.
  //
  // A missing record is REPORTED, never hidden: an attempt number the store
  // has nothing for comes back as ATTEMPT_OUTCOME_UNREPORTED, so a timeline
  // never has a silent hole where an Orker died. There is no stream: a client
  // refetches on the events it already follows.
  rpc ListTaskAttempts(ListTaskAttemptsRequest) returns (ListTaskAttemptsResponse);
  // GetArtifactProvenance answers, for ONE recorded artifact, whether its
  // bytes are still in the object store and which archived runs of the
  // calling namespace recorded the same physical object.
  //
  // It is a READ of the reverse index the archive already maintains for
  // cleanup refcounting (metadata/index/objects/…, docs/STORAGE.md): a
  // keys-only prefix scan whose keys are the answer, then one body read per
  // referencing run to check its namespace. It writes nothing and creates
  // no key family.
  //
  // The artifact is addressed exactly as ReadArtifact addresses it — by the
  // run, task, kind and recorded name — and resolved against the
  // authoritative run. A caller never names an object key or a URI. On the
  // S3 backend an object key embeds its run id, so `references` is the
  // producing run alone; on the local backend identical bytes under one
  // name are one object, so every run that produced them is listed.
  rpc GetArtifactProvenance(GetArtifactProvenanceRequest) returns (GetArtifactProvenanceResponse);
  // DiffRuns compares two runs of ONE namespace field by field: the pinned
  // definition, the input (as a canonical-JSON unified diff), and per task
  // its status, attempt, pool, pin, orker, exit code, error, duration, and
  // the image it was dispatched with and the platform manifest it ran.
  //
  // It is a READ over what GetRun, GetOrkflow and ListTaskAttempts already
  // serve, computed on every call and stored nowhere, so there is no
  // comparison record that can disagree with the runs it compares. Both ids
  // resolve inside the request's namespace exactly as GetRun resolves one: a
  // run of another namespace is NotFound. Two runs of different orkflows are
  // compared and flagged (same_orkflow=false), never refused.
  //
  // The diff is SERVER-side for the reason DiffOrkflowVersions records: two
  // clients render it, and the rendering of "unavailable", "does not apply"
  // and an empty value must be decided once. Every from_value/to_value is a
  // rendered string a client prints verbatim.
  rpc DiffRuns(DiffRunsRequest) returns (DiffRunsResponse);
}

// WebhookService manages run-event subscriptions. A subscription is
// deployment-wide unless it names a scope: a namespace, an orkflow, a task,
// each an exact match and each empty meaning "every". Delivery is
// deliberately outside this management contract; callers never receive the
// stored signing secret after registration.
//
// What a delivery DID is a record, not a queue: one immutable object per
// settled delivery (metadata/deliveries/…), written after the dispatcher
// returned and read by nothing that decides what to send. ListDeliveries and
// GetDelivery read it; RedeliverWebhook is one operator-initiated synchronous
// POST, recorded as a new delivery. Nothing here retries on its own.
service WebhookService {
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // ListDeliveries lists delivery records newest first, bounded and
  // paginated. A scan that would examine more keys than the engine's budget
  // allows before filling a page is REFUSED (RESOURCE_EXHAUSTED) naming the
  // budget, never answered from the subset it managed to read.
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  // GetDelivery returns one record by id.
  rpc GetDelivery(GetDeliveryRequest) returns (GetDeliveryResponse);
  // RedeliverWebhook POSTs one delivery again — once, now, synchronously,
  // signed with the subscription's current secret, embedding the run as it
  // reads today — and returns the NEW record. The operator is the retry
  // policy: this RPC never queues, never retries, and never runs unattended.
  rpc RedeliverWebhook(RedeliverWebhookRequest) returns (RedeliverWebhookResponse);
}

message Webhook {
  string id = 1;
  string url = 2;
  // events selects the transitions this subscription wants. Empty means
  // every RUN transition — and only those: a task outcome event
  // (TASK_SCHEDULED, TASK_STARTED, TASK_SUCCEEDED, TASK_FAILED) is delivered
  // only to a subscription that names it. TASK_LOG is never accepted.
  repeated EventType events = 3;
  google.protobuf.Timestamp created_at = 4;
  // namespace narrows this subscription to runs of one namespace. Empty
  // means every namespace, which is what every subscription registered
  // before this field existed is. A run that names no namespace is in
  // "default", so a subscription written as "default" matches it.
  string namespace = 5;
  // orkflow_name narrows to runs of one orkflow, by the name the author
  // wrote. Empty means every orkflow. It composes with namespace by
  // conjunction and does not require it: a name alone matches that name in
  // every namespace.
  string orkflow_name = 6;
  // task_id narrows the task outcome events to one task. Empty means every
  // task. It is consulted only for TASK_* events: a RUN_* event has no task
  // and passes this filter unconditionally, so one subscription can want
  // TASK_SUCCEEDED of `extract` and RUN_FAILED of the whole run. Registration
  // refuses a task_id when events names no TASK_* event, because the filter
  // could then never be consulted.
  string task_id = 7;
}
message RegisterWebhookRequest {
  string url = 1;
  repeated EventType events = 2;
  string secret = 3;
  // The scope, on exactly the terms Webhook states them.
  string namespace = 4;
  string orkflow_name = 5;
  string task_id = 6;
}
message RegisterWebhookResponse {
  Webhook webhook = 1;
  string secret = 2;
}
message ListWebhooksRequest {}
message ListWebhooksResponse { repeated Webhook webhooks = 1; }
message DeleteWebhookRequest { string id = 1; }
message DeleteWebhookResponse {}

// DeliveryOutcome selects delivery records by whether they landed.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0;   // every record
  DELIVERY_OUTCOME_DELIVERED = 1;     // the receiver answered 2xx
  DELIVERY_OUTCOME_FAILED = 2;        // the ladder ended without a 2xx
}

// DeliveryAttempt is one POST of one delivery, as pkg/webhooks.Attempt
// recorded it.
message DeliveryAttempt {
  int32 number = 1;                        // counts from 1
  int32 status_code = 2;                   // 0 when the request never completed
  string error = 3;                        // transport failure or "receiver answered N"; bounded
  google.protobuf.Duration backoff = 4;    // pause taken before this attempt
  google.protobuf.Duration duration = 5;   // how long the request itself took
  google.protobuf.Timestamp at = 6;        // when the request was started
}

// Delivery is one settled webhook delivery: what OrkStack sent, what the
// receiver answered, and nothing about what the receiver did with it.
message Delivery {
  // schema_version is 1. A reader skips a record whose version it does not
  // know rather than guessing at its fields.
  int32 schema_version = 1;
  // id is the value the receiver saw in X-Ork-Delivery, shaped
  // "dlv-{stamp}-{16 hex}" where stamp is the store's sortable UTC layout at
  // the instant the delivery was queued (created_at) and the hex is 8 bytes
  // from crypto/rand. The stamp is the store's coordinate for the record's
  // key; no client parses it — created_at is the time.
  string id = 2;
  string webhook_id = 3;
  EventType event = 4;
  string run_id = 5;
  // namespace is the run's resolved namespace ("default" spelled out).
  string namespace = 6;
  string orkflow_name = 7;
  // task_id and attempt are set for a task outcome delivery
  // (scoped-subscriptions) and empty/zero for a run transition.
  string task_id = 8;
  int32 attempt = 9;
  // status is the transition's status as the body's "status" carried it.
  Status status = 10;
  // url is the subscription's URL as it was POSTed to.
  string url = 11;
  bool delivered = 12;
  // signature is the X-Ork-Signature value sent ("sha256=…"), or empty when
  // the delivery was unsigned. It is what the record proves was sent; the
  // secret itself is never here.
  string signature = 13;
  // body_sha256 is the lowercase hex SHA-256 of the exact bytes POSTed, and
  // body_bytes their length. The body is not stored: the run is readable at
  // GetRun, and a second copy would be a second version of the truth.
  string body_sha256 = 14;
  int64 body_bytes = 15;
  repeated DeliveryAttempt attempts = 16;
  // event_at is the transition's own timestamp (X-Ork-Timestamp, the body's
  // "timestamp"); created_at is when the notifier queued the delivery;
  // settled_at is when the dispatcher returned.
  google.protobuf.Timestamp event_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp settled_at = 19;
  // redelivery_of names the delivery this one repeats, when an operator
  // asked for it through RedeliverWebhook. Empty for a delivery the engine
  // made on its own.
  string redelivery_of = 20;
}

message ListDeliveriesRequest {
  // Each filter is an exact match; empty (or UNSPECIFIED) means every.
  string webhook_id = 1;
  string run_id = 2;
  // event is only a subscribable event (webhooks.KnownEvents); TASK_LOG and
  // RUN_CREATED are INVALID_ARGUMENT, never delivered.
  EventType event = 3;
  DeliveryOutcome outcome = 4;
  // namespace filters by the run's namespace. As on ListAuditRecordsRequest,
  // empty here means EVERY namespace, not the default one: the natural scope
  // of the webhook surface is the deployment. "default" selects the default
  // namespace's runs.
  string namespace = 5;
  // since is the inclusive start of the window and until the exclusive end,
  // both against created_at. until empty means the moment the answer is
  // computed. since empty means: the run's created_at when run_id names a
  // run the engine can read, otherwise seven days before until. A window
  // whose end is not after its start is INVALID_ARGUMENT.
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
  // page_size caps the records returned; 0 means the default (50); above
  // the maximum (200) is INVALID_ARGUMENT, not clamped.
  int32 page_size = 8;
  // page_token continues a listing. It is opaque and versioned and binds
  // every filter above; a token presented with different filters is
  // INVALID_ARGUMENT, exactly as ListRunsRequest.page_token behaves.
  string page_token = 9;
}
message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;        // newest first
  string next_page_token = 2;              // empty when the window is exhausted
  // since and until are the window the answer covers, resolved, so a client
  // prints what "the last week" or "since the run started" meant.
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
}

message GetDeliveryRequest { string id = 1; }
message GetDeliveryResponse { Delivery delivery = 1; }

message RedeliverWebhookRequest { string id = 1; }   // the delivery to repeat
message RedeliverWebhookResponse {
  // delivery is the NEW record: its own id, its one attempt, its own
  // signature and body digest, and redelivery_of naming the request's id.
  Delivery delivery = 1;
}

// TriggerService manages inbound run starters. A trigger is bound to ONE
// orkflow in one namespace, and an external caller presents that trigger's
// bearer token over plain HTTP to start a run of it.
//
// It is the mirror image of WebhookService, not a variant of it. A webhook is
// OUTBOUND and deployment-wide unless it names a scope: OrkStack calls the
// subscriber when a run it covers changes state. A trigger is INBOUND and orkflow-scoped: the caller calls
// OrkStack, authenticating as the trigger. The orkflow coordinates come from
// the stored record and never from the request, so whoever holds a token can
// only start the orkflow the trigger was created for.
//
// The secret is handed back exactly once, at creation, on the same terms as
// RegisterWebhookResponse.secret: a listing never carries it again.
service TriggerService {
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
}

message Trigger {
  string id = 1;
  string namespace = 2;
  string orkflow_name = 3;
  string orkflow_version = 4;              // empty = current pointer, resolved at invoke time
  string description = 5;                  // optional operator label
  google.protobuf.Timestamp created_at = 6;
}
message CreateTriggerRequest {
  string namespace = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  string description = 4;
}
message CreateTriggerResponse {
  Trigger trigger = 1;
  string secret = 2;                       // shown exactly once, like RegisterWebhookResponse.secret
}
message ListTriggersRequest {
  string namespace = 1;
  string orkflow_name = 2;                 // empty = every trigger in the namespace
}
message ListTriggersResponse { repeated Trigger triggers = 1; }
message DeleteTriggerRequest { string id = 1; string namespace = 2; }
message DeleteTriggerResponse {}

message SubmitRunRequest {
  string orkflow_name = 1;               // orkflow name
  string orkflow_version = 2;            // orkflow version; empty = latest
  Payload input = 3;
  string idempotency_key = 4;            // optional dedupe
  // namespace selects which namespace's orkflow_name is submitted. Empty is
  // the default namespace. A name is unique WITHIN a namespace, so this is
  // half of the orkflow's address, not a filter.
  string namespace = 5;
  //
  // allow_empty_pool submits even when a task's resolved pool has no live
  // Orkers. Default false: an empty pool is an error at submit, not a run
  // that reaches RUNNING and stays there because nothing will ever pick its
  // tasks up. Setting it is logged with the pool it overrode.
  bool allow_empty_pool = 6;
}
message SubmitRunResponse { Run run = 1; }
// A run id addresses a run INSIDE a namespace, exactly as an orkflow name
// does. It is unguessable, but unguessable is not a tenancy boundary: an id
// travels into logs, tickets and CI transcripts, and CancelRun is a write. So
// every request that carries one carries the namespace it is addressed in, on
// the same rule as every other namespace field — empty is the default
// namespace, never "any of them". A run of another namespace is NotFound, not
// PermissionDenied: telling the two apart would confirm to a caller who may
// not name the namespace that the id exists.
message GetRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
}
message GetRunResponse { Run run = 1; }
message ListRunsRequest {
  string orkflow_name = 1;               // optional orkflow name filter
  Status status = 2;                     // optional filter
  int32 page_size = 3;
  string page_token = 4;
  string namespace = 5;                  // empty = the default namespace
  google.protobuf.Timestamp created_after = 6;  // inclusive
  google.protobuf.Timestamp created_before = 7; // exclusive
}
message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_OUTPUT = 1;
  ARTIFACT_KIND_VALUES = 2;
  ARTIFACT_KIND_STDOUT = 3;
  ARTIFACT_KIND_STDERR = 4;
}
message RunArtifact {
  string task_id = 1;
  ArtifactKind kind = 2;
  ArtifactRef artifact = 3;
  int32 attempt = 4;
}
message ListRunArtifactsRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
}
message ListRunArtifactsResponse { repeated RunArtifact artifacts = 1; }
message ReadArtifactRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
  ArtifactKind kind = 4;
  string name = 5;
}
message ArtifactChunk {
  bytes data = 1;
  ArtifactRef artifact = 2;
  bool last = 3;
}
message ListTaskAttemptsRequest {
  string run_id = 1;
  string namespace = 2; // empty = the default namespace
  string task_id = 3;   // empty selects every task of the run
}
message ListTaskAttemptsResponse {
  // attempts is every attempt of every selected task: tasks in the order
  // Run.task_runs lists them, and within a task ascending by attempt with no
  // gaps — an attempt number the store has no record for is present as
  // ATTEMPT_OUTCOME_UNREPORTED rather than absent.
  repeated TaskAttempt attempts = 1;
}

// ReferenceState is the addressed run's OWN standing in the object index.
// It exists so an empty `references` list can be read: "released" and
// "never recorded" are different facts that would otherwise render alike.
enum ReferenceState {
  REFERENCE_STATE_UNSPECIFIED = 0;
  // HELD: the run is archived and its marker on this object is present.
  REFERENCE_STATE_HELD = 1;
  // RELEASED: no marker, and the run's cleanup record exists — the cleanup
  // worker released its object claims (docs/STORAGE.md, "Reclaiming space").
  // released_at carries the record's timestamp.
  REFERENCE_STATE_RELEASED = 2;
  // ABSENT: no marker and no cleanup record. The run has not reached its
  // terminal event, its archive write has not completed, it was archived
  // before the object index existed, or cleanup released its markers and had
  // not yet written its record. The server does not guess which; a client
  // renders "no reference recorded", never "released" and never "held".
  REFERENCE_STATE_ABSENT = 3;
}

message GetArtifactProvenanceRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;
  ArtifactKind kind = 4;
  // name is the exact recorded artifact name, as ReadArtifactRequest.name.
  string name = 5;
  // expect_sha256 is optional: the lowercase hex digest a caller obtained
  // elsewhere (a downstream system, an evidence bundle). When set and
  // different from the recorded ArtifactRef.sha256, the call fails
  // FailedPrecondition naming both, so a chain-of-custody check is one
  // command rather than a copy-and-compare.
  string expect_sha256 = 6;
}

// ArtifactReference is one recording of the object by one archived run: the
// run, and the task and kind under which that run recorded it. A run that
// recorded the same object under two tasks yields two references.
message ArtifactReference {
  string run_id = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  string task_id = 4;
  ArtifactKind kind = 5;
  Status run_status = 6;
  google.protobuf.Timestamp run_created_at = 7;
}

message GetArtifactProvenanceResponse {
  // artifact is the reference as recorded on the addressed run — never a
  // value re-read from the store.
  ArtifactRef artifact = 1;
  // bytes_present is whether the object itself is in the store (Stat, no
  // bytes transferred). false means the object is gone — a lifecycle rule,
  // an operator, or DeleteUnreferencedObjects — while its references may
  // still stand. A store that cannot answer fails the call; it never sets
  // this false.
  bool bytes_present = 2;
  ReferenceState own_reference = 3;
  // released_at is set only with REFERENCE_STATE_RELEASED.
  google.protobuf.Timestamp released_at = 4;
  // references is every marker on this object whose run is in the calling
  // namespace, newest run_created_at first. It includes the addressed run
  // when own_reference is HELD. Runs of other namespaces are omitted and
  // not counted.
  repeated ArtifactReference references = 5;
  // references_unreadable counts markers whose run body is not in the
  // archive (the crash window between the marker writes and the index
  // publish, docs/STORAGE.md). Such a marker's namespace cannot be known, so
  // it is counted here and listed nowhere. A body that fails to read for
  // any other reason fails the call.
  int64 references_unreadable = 6;
  google.protobuf.Timestamp computed_at = 7;
}

message DiffRunsRequest {
  string from_run_id = 1;
  string to_run_id = 2;
  string namespace = 3;                  // empty = the default namespace; BOTH runs resolve in it
  // only restricts the comparison to the named fields, in the vocabulary
  // RunFieldDiff.field uses plus the two run-level names "definition" and
  // "input". Empty means every field. An unknown name is InvalidArgument
  // naming the valid ones. Narrowing also narrows the READS: a request that
  // names neither "image" nor "platform_digest" never opens the attempt
  // store or the orkflow store.
  //
  // "presence" is ALWAYS compared, whatever only names: a task that exists in
  // one run and not the other always yields its presence row, so narrowing
  // can never make an added or removed task count as identical. Naming
  // "presence" is accepted and redundant. It costs no read beyond the two
  // runs themselves.
  repeated string only = 4;
}

// RunFieldDiff is one field of one task (or of the run, when task_id is
// empty) whose two values differ, or whose evidence is missing on at least
// one side. A field that is equal and available on both sides has no row.
message RunFieldDiff {
  string task_id = 1;                    // empty for a run-level field
  // field is one of: "definition" (run-level); "presence", "status",
  // "attempt", "pool", "pin", "orker", "exit_code", "error", "duration",
  // "image", "platform_digest" (task-level). It is a string, not an enum,
  // so a later contract can add a field a client of this build has never
  // heard of and the client still prints the row.
  string field = 2;
  // from_value / to_value are RENDERED strings. Empty with the side available
  // means "does not apply" or "no value" (an unpinned task's pin, a skipped
  // task's exit code); a client prints "-". Empty with the side unavailable
  // means the evidence is gone; a client prints "unavailable" and the reason.
  string from_value = 3;
  string to_value = 4;
  bool from_available = 5;
  bool to_available = 6;
  // from_reason / to_reason are set only when the side is unavailable: a
  // stable machine token from the list in docs/UI_CLI_PARITY.md ("Run diff"),
  // e.g. "attempt_record_missing", "definition_unavailable",
  // "no_attempt_store". A client renders the token's documented sentence.
  string from_reason = 7;
  string to_reason = 8;
}

message DiffRunsResponse {
  // from / to are the two runs, SHALLOW: task_runs, input and output are
  // cleared, because the differences below and input_unified_diff already
  // carry what a client needs of them, and a run's input may be large.
  // Every other Run field (id, orkflow, version, status, error, times,
  // namespace, definition digest, telemetry, and any field a later contract
  // adds) is carried as GetRun would carry it.
  Run from = 1;
  Run to = 2;
  bool same_orkflow = 3;                 // orkflow_name equal (namespace is equal by construction)
  bool same_definition_digest = 4;       // orkflow_definition_digest equal
  // input_unified_diff is dsl.Unified over the canonical, indented JSON of the
  // two inputs (keys sorted, integers without fraction), labelled
  // "<run id>/input.json" on each side. Empty when the inputs are identical
  // under that canonical form, or when "input" was excluded by `only`.
  string input_unified_diff = 5;
  // differences is ordered: run-level rows first, then the from-run's tasks
  // in its task_runs order, then tasks present only in the to-run in that
  // run's order; within a task, fields in the order the field comment on
  // RunFieldDiff lists them. The order is the contract; clients render it
  // as given.
  repeated RunFieldDiff differences = 6;
  // tasks_compared is the number of distinct task ids across both runs.
  int32 tasks_compared = 7;
  // tasks_identical is the number of tasks with NO row: every compared field
  // equal and available on both sides. A task whose evidence is missing on
  // either side is not identical, whatever its other fields say; nor is a
  // task present in only one run, which always has its presence row.
  int32 tasks_identical = 8;
  // evidence_unavailable counts rows with at least one unavailable side.
  int32 evidence_unavailable = 9;
  // fields_compared is the resolved field list — every field when `only` is
  // empty, else `only` plus "presence" — in canonical order, so a client can
  // say what was and was not compared. It is exhaustive: every
  // RunFieldDiff.field in differences is one of its entries.
  repeated string fields_compared = 10;
}
message CancelRunRequest {
  string run_id = 1;
  string reason = 2;
  string namespace = 3;                  // empty = the default namespace
}
message CancelRunResponse { Run run = 1; }
message StreamEventsRequest {
  string run_id = 1;
  int64 from_sequence = 2;
  string namespace = 3;                  // empty = the default namespace
}
message StreamTaskLogsRequest {
  string run_id = 1;
  string task_id = 2;
  // attempt selects one try of the task. 0 means the latest attempt that has
  // written anything, so a caller that never saw a retry does not have to
  // know retries exist.
  //
  // With `follow`, 0 keeps meaning THE LATEST for as long as the stream is
  // open, not merely when it opened. A Temporal activity retry is invisible in
  // a task's status — the task stays RUNNING while try 2 starts under a new
  // key prefix — so a stream that resolved the attempt once would sit on a
  // dead attempt, delivering nothing, for the rest of the task's life, and say
  // it was live. When a later attempt appears the stream moves to it and
  // delivers that attempt from its FIRST chunk; every chunk names the attempt
  // it belongs to, and its seq restarts at 1, so a client can tell a new
  // attempt from more of the old one. A non-zero attempt is pinned and never
  // moves.
  int32 attempt = 3;
  // from_seq resumes AFTER this sequence: it is the LAST chunk sequence the
  // client already received, and the stream continues with the next one. 0
  // starts at the beginning. It is the same contract
  // StreamEvents.from_sequence has, over the log's own numbering — dense and
  // 1-based per (run, task, attempt) — so a client that hands back the seq of
  // the last chunk it saw replays nothing twice and misses nothing, even when
  // it reconnects to a DIFFERENT replica.
  int64 from_seq = 4;
  // from_attempt says which attempt from_seq counts chunks of. It is what
  // makes a resume safe across a retry: seq is dense per ATTEMPT, so a cursor
  // of 500 handed back after try 1 would silently skip try 2's first 500
  // chunks — or, since try 2 is usually shorter, would deliver nothing at all
  // while the pane read LIVE.
  //
  // 0 means "the attempt this request resolves to", which is what a first
  // connection means and what a client pinning `attempt` means. When it names
  // a DIFFERENT attempt from the one resolved, from_seq is dropped and the
  // resolved attempt is delivered from its first chunk: a new attempt is a new
  // read, not a continuation of the old one.
  int32 from_attempt = 7;
  // follow keeps the stream open for chunks that do not exist yet, ending
  // when the task reaches a terminal state. False makes it a replay: the
  // chunks the store holds when the request is served, then the end — whether
  // or not the task is still writing, so a replay never turns into a follow.
  bool follow = 5;
  string namespace = 6;                  // empty = the default namespace
}
// TaskLogChunk is one slice of a task attempt's output, exactly as the Orker
// flushed it.
message TaskLogChunk {
  string run_id = 1;
  string task_id = 2;
  int32 attempt = 3;
  // seq orders the chunk within (run_id, task_id, attempt): dense, starting
  // at 1. It is assigned by the single Orker executing the attempt, so it is
  // total and gap-free without any coordination, and it is what a client
  // hands back as from_seq.
  int64 seq = 4;
  // data is UTF-8 log bytes ending on a line boundary, except where one line
  // exceeded the chunk limit and was split.
  bytes data = 5;
  // truncated marks the notice chunk the Orker writes when a task's output
  // passed its cap. Its data says so in words; no further output was stored.
  // Truncation is visible in the stream, never silent.
  bool truncated = 6;
  // last marks the end of the stream: everything this stream will deliver has
  // been delivered, and its seq is the last sequence sent, so a client resumes
  // from it. With follow that means the task reached a terminal state; without
  // follow it means the replay is complete. It carries no data.
  bool last = 7;
}

// NamespaceService manages namespaces and reports the pools they may dispatch
// onto.
//
// A namespace is a scope that owns orkflow names, runs and pool defaults. The
// registry is durable (the artifact store), so any replica answers for any
// namespace, including one it never created.
service NamespaceService {
  // CreateNamespace registers a namespace.
  //
  // It is idempotent for an identical spec: creating the same namespace twice
  // with the same description, labels, default pool and allowed pools returns
  // the existing document rather than an error, so a provisioning script is
  // safe to re-run. A second create that differs is AlreadyExists, naming what
  // differs — that one is a collision, not a repeat.
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  // GetNamespace reads one namespace. The default namespace always resolves,
  // whether or not anyone created it.
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  // ListNamespaces returns every registered namespace, ordered by name.
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  // UpdateNamespace replaces a namespace's mutable fields.
  //
  // It is a compare-and-swap on Namespace.etag: the token a read handed back.
  // A stale token is FailedPrecondition, so two operators editing at once
  // cannot silently clobber each other — the loser re-reads and re-applies.
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
  // DeleteNamespace removes a namespace that holds no orkflows.
  //
  // It refuses while any orkflow is still stored in it, and says how many:
  // deleting the registry entry would not delete the definitions, so they
  // would survive under a namespace nothing lists. The default namespace is
  // refused unconditionally — every orkflow that names none is in it.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  // ListPools reports every pool a namespace may dispatch onto, each with the
  // number of Orkers serving it right now.
  //
  // The answer is read from the cluster, never from process memory, so any
  // replica answers — including one that started nothing.
  //
  // It NARROWS rather than refusing. A source that cannot be reached costs
  // this read what that source knew and nothing else: a pool the cluster did
  // not answer for is still listed, carrying Pool.unavailable_reason instead
  // of a count; an orkflow store that cannot be read narrows the answer to
  // the pools the namespace document itself names. An admin read is opened
  // when something is already wrong, and a refusal hides the healthy pools
  // beside the broken one.
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
}
message CreateNamespaceRequest {
  Namespace namespace = 1;               // name is required; times are the registry's
}
message CreateNamespaceResponse {
  Namespace namespace = 1;
  // created is false when an identical namespace already existed, so an
  // idempotent repeat is distinguishable from the write that did it.
  bool created = 2;
}
message GetNamespaceRequest { string name = 1; }
message GetNamespaceResponse { Namespace namespace = 1; }
message ListNamespacesRequest {}
message ListNamespacesResponse { repeated Namespace namespaces = 1; }
message UpdateNamespaceRequest {
  // namespace carries the new spec and the etag it was read at. Every update
  // is conditional: the etag names the stored version this edit replaces, and
  // an empty etag says the version it edited had no stored bytes at all —
  // which is what a read of the synthesized `default` namespace hands back.
  // Both are compare-and-swaps, and a write whose condition no longer holds
  // is FAILED_PRECONDITION: re-read and re-apply. There is no unconditional
  // mode; see Namespace.etag for why an empty token cannot be one.
  Namespace namespace = 1;
}
message UpdateNamespaceResponse { Namespace namespace = 1; }
message DeleteNamespaceRequest { string name = 1; }
message DeleteNamespaceResponse {}
message ListPoolsRequest {
  string namespace = 1;                  // empty = the default namespace
}
message ListPoolsResponse {
  repeated Pool pools = 1;               // ordered by name
  string default_pool = 2;               // where a task naming no pool runs
}

// ActivityService reports what this deployment can run: an activity is an
// image, and which images exist is engine configuration (§4.2), not something
// to ask an Orker.
service ActivityService {
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  // DescribeOrker is the pool-liveness probe (§6.5). It is dispatched as a
  // Temporal activity on a pool's own channel, so it answers only when an
  // Orker is actually polling that pool.
  rpc DescribeOrker(DescribeOrkerRequest) returns (DescribeOrkerResponse);
  // ListOrkers is the fleet: one row per live Orker of the deployment,
  // derived on read. Like Pool, nothing WRITES an Orker — the list comes
  // from the cluster's own poller records and each Orker's own answer, so
  // any replica answers and none holds state of its own (AGENTS.md §7). It
  // NARROWS rather than refusing: an Orker that did not answer keeps its
  // row and carries unavailable_reason. Two conditions are distinct: a
  // known poller whose describe failed is a row with unavailable_reason;
  // an orker_id that NO live poller answers to is an EMPTY list, never
  // NOT_FOUND — a read for an id nothing polls is an empty answer, and the
  // drain loop relies on it (CordonOrker, a write, is the one that answers
  // NOT_FOUND for that id).
  rpc ListOrkers(ListOrkersRequest) returns (ListOrkersResponse);
  // CordonOrker sets or clears ONE Orker's cordon: a process-local flag
  // delivered over that Orker's own channel, lost when the process exits.
  // A cordoned Orker takes no new task and opens no new pin; everything
  // already in flight on it is untouched. The response is the Orker's
  // state AFTER the change, as the Orker itself reported it.
  rpc CordonOrker(CordonOrkerRequest) returns (CordonOrkerResponse);
}

message ListActivitiesRequest {}

// ActivityInfo is one catalog entry, resolved.
//
// resolved_at is a READ-MODEL field on a live catalog read, and is unrelated
// to the ImageRef.resolved_at that activity.proto reserves: nothing hashes it,
// and it is never stored in a version document.
message ActivityInfo {
  string name = 1;          // catalog key, e.g. "shell"
  string reference = 2;     // as configured, e.g. ghcr.io/orkstack/activity-shell:0.1
  string index_digest = 3;  // resolved, "sha256:<64 hex>"
  string media_type = 4;
  repeated string platforms = 5;
  google.protobuf.Timestamp resolved_at = 6;
}

message ListActivitiesResponse {
  // activities is ordered by name, matching ListPoolsResponse.pools
  // ("ordered by name", above). A stable order is part of the contract, not an
  // implementation detail: the Admin page renders it.
  repeated ActivityInfo activities = 1;
}

message DescribeOrkerRequest {}
message DescribeOrkerResponse { DescribeOrkerResult orker = 1; }

// Orker is one execution process, observed live.
message Orker {
  string orker_id = 1;
  // pool is the pool the Orker reports serving (DescribeOrkerResult.pool).
  string pool = 2;
  string build_id = 3;               // empty when versioning is off
  int32 running_tasks = 4;
  int32 open_pins = 5;
  int32 max_concurrent_pins = 6;     // ORK_ORKER_MAX_PINS; 0 means not a pin host
  bool cordoned = 7;
  string cordon_reason = 8;          // empty when not cordoned
  google.protobuf.Timestamp cordoned_at = 9;
  // last_seen is the most recent moment this Orker was observed polling.
  // It answers "how fresh is this row", never "when did this Orker die".
  google.protobuf.Timestamp last_seen = 10;
  // unavailable_reason says this Orker COULD NOT BE ASKED, and why — the
  // same three-state distinction Pool.unavailable_reason makes, for the same
  // reason: "not measured" rendered as "measured zero" sends an operator to
  // stop a host that may be mid-task. When set, fields 2–9 and 12 are
  // unset: nothing was measured, so there is no number to report.
  string unavailable_reason = 11;
  repeated OpenPin pins = 12;
}

message ListOrkersRequest {
  // pool keeps only Orkers that report serving this pool. Empty keeps every
  // Orker. It is matched against what each Orker answers, not against a
  // channel name.
  string pool = 1;
  // orker_id asks exactly one Orker, on its own channel, and returns at
  // most one row; pool is then ignored. It is what `orkctl orker get` and
  // the drain loop use, so a drain costs one activity per poll and not one
  // per Orker of the fleet.
  string orker_id = 2;
}

message ListOrkersResponse {
  // orkers is ordered by pool, then orker_id. A stable order is part of the
  // contract: the Admin page renders it.
  repeated Orker orkers = 1;
}

message CordonOrkerRequest {
  string orker_id = 1;
  bool cordoned = 2;
  // reason is required when cordoned is true (INVALID_ARGUMENT otherwise);
  // ignored when false.
  string reason = 3;
}

message CordonOrkerResponse { Orker orker = 1; }

// SystemService reports what this deployment is made of.
service SystemService {
  // GetSystemInfo describes THE REPLICA THAT ANSWERED. Every field is
  // configuration- or build-derived — read from the process's own
  // configuration, not observed from the cluster — except server_time.
  // Replicas of one release answer identically by construction; mid-rollout,
  // build_id is exactly the field that differs, which is the point of it.
  //
  // It is the one admin read that does not leave the process, and it is the
  // one question only the process can answer: everything else an operator
  // asks — which namespaces exist, which pools have Orkers, what those
  // Orkers run — comes from the store or the cluster, so any replica gives
  // the same reply. This one describes the replica in front of you, on
  // purpose, because that is what an operator behind a load balancer needs
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // GetRetentionPolicy reads the deployment's maximum run retention: the
  // ceiling on every namespace's run_retention, and what a namespace that
  // sets none inherits. Read from the store, so any replica answers it.
  //
  // It is deployment-wide on purpose. Per-namespace retention is a field of
  // orkstack.v1.Namespace (NamespaceService); this is the bound on all of
  // them.
  rpc GetRetentionPolicy(GetRetentionPolicyRequest) returns (GetRetentionPolicyResponse);

  // UpdateRetentionPolicy changes the maximum. A non-positive or malformed
  // duration is INVALID_ARGUMENT before anything is written. Lowering it
  // below a namespace's explicit run_retention is FAILED_PRECONDITION naming
  // that namespace — lower the namespace first. Namespaces that set nothing
  // follow the new maximum immediately: finished runs already older than it
  // are retired on the next cleanup pass.
  rpc UpdateRetentionPolicy(UpdateRetentionPolicyRequest) returns (UpdateRetentionPolicyResponse);

  // ListTelemetrySinks names the telemetry sinks this deployment declared
  // (ORK_TELEMETRY_SINKS), so a namespace admin can choose one by name. Names
  // only: endpoints and headers are the operator's and never leave the
  // process. CONFIGURATION-DERIVED; "default" is always present.
  rpc ListTelemetrySinks(ListTelemetrySinksRequest) returns (ListTelemetrySinksResponse);

  // GetImagePolicy reads the deployment's image supply-chain floor: whether
  // a `uses:` may be a mutable tag, which registries images may come from,
  // and which signing keys a namespace may require by name. Read from the
  // store, so any replica answers it. A deployment that never wrote one
  // answers the EMPTY policy with updated_at unset — that is a real answer
  // (everything is permitted), not a missing document.
  //
  // Deployment-wide on purpose. The per-namespace tightening is a field of
  // orkstack.v1.Namespace (require_signed_by); this is the floor under all
  // of them.
  rpc GetImagePolicy(GetImagePolicyRequest) returns (GetImagePolicyResponse);

  // UpdateImagePolicy replaces the floor. Every entry and key is validated
  // before anything is written (INVALID_ARGUMENT naming the entry). An
  // allowed_registries list that excludes an activity of this engine's
  // catalog is FAILED_PRECONDITION naming the activities — widen the list
  // or change ORK_ACTIVITY_CATALOG first, because a floor that silently
  // refuses every `uses: shell` is not a floor an operator meant. Removing
  // a signing key a namespace still names is FAILED_PRECONDITION naming the
  // namespace — clear the namespace first. Definitions already stored are
  // untouched; they are re-checked at their next submit.
  rpc UpdateImagePolicy(UpdateImagePolicyRequest) returns (UpdateImagePolicyResponse);
}
message GetSystemInfoRequest {}
message GetSystemInfoResponse {
  // engine_version is the release this binary was built as: the value
  // -ldflags stamped in, falling back to the module's own build version and
  // then to the source revision the build was stamped with, and finally to
  // "dev" for a plain `go build`. BUILD-DERIVED.
  string engine_version = 1;
  // go_version is the toolchain the binary was compiled with. BUILD-DERIVED.
  string go_version = 2;
  // deployment_name is the Worker Deployment both binaries of a release join.
  // CONFIGURATION-DERIVED.
  string deployment_name = 3;
  // build_id names this release inside that deployment; empty means the
  // deployment is unversioned. CONFIGURATION-DERIVED, and the field that
  // differs between two replicas mid-rollout.
  string build_id = 4;
  // versioning_active reports whether Worker Deployment Versioning is on for
  // this process, which is exactly "both of the two fields above are set".
  // DERIVED from configuration, not asked of the cluster: it says what this
  // replica registered as, not what the cluster currently routes.
  bool versioning_active = 5;
  // artifact_backend is where artifacts, run archives and task logs live:
  // "local" or "s3". CONFIGURATION-DERIVED.
  string artifact_backend = 6;
  // artifact_location is the bucket or directory that backend addresses,
  // never a credential. CONFIGURATION-DERIVED.
  string artifact_location = 7;
  // temporal_address is the cluster endpoint this replica dials.
  // CONFIGURATION-DERIVED — that the address is configured is not a claim
  // that it answers; pool health is the read that proves the cluster is
  // reachable, and a connectivity flag here would be stale the moment it was
  // sent.
  string temporal_address = 8;
  // server_time is the answering replica's own clock, and is the ONLY
  // observed field in this message. A client comparing it with its own clock
  // is comparing two clocks, which is what makes a skewed replica visible.
  google.protobuf.Timestamp server_time = 9;
}

message GetRetentionPolicyRequest {}
message GetRetentionPolicyResponse {
  RetentionPolicy policy = 1;
  // namespace_retention_enforced reports whether this deployment runs the
  // worker that retires runs at their namespace's retention
  // (ORK_CLEANUP_ENABLED). When false, every run is kept for the maximum
  // plus the operator's enforcement margin and a tighter namespace value has
  // no effect yet. CONFIGURATION-DERIVED, like GetSystemInfo's fields.
  bool namespace_retention_enforced = 2;
}
message UpdateRetentionPolicyRequest {
  // max_run_retention is the new deployment maximum. A non-positive or
  // malformed value is rejected with INVALID_ARGUMENT before any call leaves
  // this process.
  google.protobuf.Duration max_run_retention = 1;
}
message UpdateRetentionPolicyResponse {
  RetentionPolicy policy = 1;
  bool namespace_retention_enforced = 2;
}

message ListTelemetrySinksRequest {}
message ListTelemetrySinksResponse {
  // names is every sink this deployment declared, sorted
  // (telemetry.SinkTable.Names). "default" is always present, whether or not
  // ORK_TELEMETRY_SINKS names one explicitly, because it is what an unset
  // TelemetryPolicy.sink resolves to.
  repeated string names = 1;
}

message GetImagePolicyRequest {}
message GetImagePolicyResponse {
  // policy is the stored document, or the empty policy with updated_at
  // unset when none was ever written. signing_keys carries PEM; clients
  // render the fingerprint (task.SigningKeyFingerprint) and never the block.
  ImagePolicy policy = 1;
}
message UpdateImagePolicyRequest {
  // policy is the new floor, whole: require_digest, allowed_registries and
  // signing_keys. updated_at is ignored; the store stamps it. There is no
  // etag, on the same terms as UpdateRetentionPolicy: the audit trail
  // records every write, and an operator who read a stale policy sees their
  // own write in `admin image-policy get`.
  ImagePolicy policy = 1;
}
message UpdateImagePolicyResponse { ImagePolicy policy = 1; }
