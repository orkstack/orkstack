syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/image_policy.proto";
import "orkstack/v1/run.proto";
import "orkstack/v1/orkflow.proto";
import "orkstack/v1/namespace.proto";
import "orkstack/v1/retention.proto";
option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// OrkflowService manages orkflow definitions (the compiled DSL).
//
// A version is immutable and a name is unique within a namespace, so the three
// coordinates (namespace, name, version) address one document for all time.
// What moves is a per-orkflow POINTER: `current` decides which version an
// empty version resolves to, and moving it is the only mutation this service
// performs on an existing orkflow.
service OrkflowService {
  // ValidateOrkflow performs the same non-mutating preparation as apply.
  rpc ValidateOrkflow(ValidateOrkflowRequest) returns (ValidateOrkflowResponse);
  // ApplyOrkflow validates and stores an orkflow from raw DSL YAML.
  //
  // It never rewrites a stored version: identical YAML under an existing
  // version is a no-op that writes nothing, and DIFFERENT YAML under an
  // existing version is refused (AlreadyExists). An edit therefore always
  // arrives as a new version — which is what lets a run pinned to a version
  // keep reading the bytes it pinned.
  rpc ApplyOrkflow(ApplyOrkflowRequest) returns (ApplyOrkflowResponse);
  rpc GetOrkflow(GetOrkflowRequest) returns (GetOrkflowResponse);
  rpc ListOrkflows(ListOrkflowsRequest) returns (ListOrkflowsResponse);
  // ListOrkflowVersions lists every stored version of one orkflow, newest
  // applied first, marking the one an empty version resolves to.
  rpc ListOrkflowVersions(ListOrkflowVersionsRequest) returns (ListOrkflowVersionsResponse);
  // SetCurrentOrkflowVersion moves the orkflow's current pointer.
  //
  // The target must already exist: promoting to an unknown version is
  // NotFound, so a reader can never observe a pointer to a version that is not
  // there. Two replicas promoting at once are arbitrated by the store's
  // compare-and-swap — one value wins, and it is one of the two asked for.
  //
  // It compares the target's declared interface with the version a run that
  // names no version executes now, and REFUSES (FailedPrecondition, naming
  // each breaking finding) a BREAKING change unless acknowledge_breaking is
  // set. COMPATIBLE and UNKNOWN changes are never refused. The swap is made
  // only while the pointer still names what the comparison was made
  // against: a promotion that loses that race is FailedPrecondition, never
  // an unchecked move.
  rpc SetCurrentOrkflowVersion(SetCurrentOrkflowVersionRequest) returns (SetCurrentOrkflowVersionResponse);
  // DiffOrkflowVersions renders the unified diff between two versions'
  // source_yaml.
  //
  // The diff is computed SERVER-side, deliberately. Two clients read it (the
  // CLI and the UI) and a third will follow; a client-side diff would put a
  // diff dependency in each of them and let their renderings drift, so that
  // `orkctl orkflow diff` and the version page could disagree about what
  // changed. One implementation, golden-tested once, rendered verbatim by
  // every client.
  rpc DiffOrkflowVersions(DiffOrkflowVersionsRequest) returns (DiffOrkflowVersionsResponse);
  // DeleteOrkflow removes all versions of an orkflow from the registry.
  //
  // It refuses (FailedPrecondition) if any runs are currently executing or
  // queued for this orkflow, or if runs have completed recently (within the
  // past 24 hours). The check is conservative: an orkflow with any recent
  // activity cannot be deleted. This protects against accidental deletion of
  // an orkflow in active use.
  //
  // The operation is NOT reversible: all versions and their metadata are
  // permanently deleted. Runs that pinned the orkflow keep executing — they
  // have the version they started with — but any new run will fail with
  // NotFound.
  rpc DeleteOrkflow(DeleteOrkflowRequest) returns (DeleteOrkflowResponse);
  // PlanRun answers "for this input, which tasks of this definition would
  // run, which would be skipped and why, and in what order" WITHOUT
  // starting anything.
  //
  // It is a read in the shape of ValidateOrkflow: it resolves the same
  // definition SubmitRun would (or prepares an unapplied document exactly
  // as ValidateOrkflow does), applies the same declared input defaults, and
  // walks the DAG with the interpreter's own condition evaluator — the
  // same function RunWorkflow calls, not a copy of it. It writes no
  // definition, no pointer, no execution, no idempotency claim, and no
  // event; no run id is minted. There is no flag that makes it submit.
  //
  // A plan proves WIRING, never behaviour: a task reported RUNS is a task
  // the interpreter would dispatch, not a task that would succeed. It is
  // also not an admission check — pools, holds, and limits are SubmitRun's
  // questions and are not asked here.
  rpc PlanRun(PlanRunRequest) returns (PlanRunResponse);
  // CompareInterfaces classifies how the DECLARED interface of one stored
  // version — its inputs: and its outputs: — changes in another
  // (docs/DSL.md "Which version runs"). It speaks about declarations only:
  // tasks, images, with:, pools and output templates are implementation,
  // and DiffOrkflowVersions reports them. Computed on every call from the
  // two immutable documents, stored nowhere; any replica answers.
  rpc CompareInterfaces(CompareInterfacesRequest) returns (CompareInterfacesResponse);
  // ListOrkflowCallers lists what, in this namespace, references one
  // orkflow and which version it pins: every composing task of every other
  // orkflow's scanned version, every trigger, and every schedule. It is a
  // scan of the namespace's stored definitions and a read of its triggers
  // and schedules, made per request — there is no caller index — so its
  // cost grows with the namespace, and the response says how much it read.
  rpc ListOrkflowCallers(ListOrkflowCallersRequest) returns (ListOrkflowCallersResponse);
}

message ApplyOrkflowRequest {
  string yaml = 1;                       // raw DSL document
  // namespace selects where the document is applied. Empty honours the
  // document's own `namespace:` (itself empty = "default"); a non-empty value
  // must EQUAL the document's namespace, or the document names none and is
  // applied INTO this one. The two are never allowed to disagree silently: a
  // file that says `namespace: payments` applied with -n staging is a mistake
  // one of the two made, and guessing which would store the definition
  // somewhere its author cannot find it.
  string namespace = 2;
  // base_version is the stored version this edit was derived from — its
  // PROVENANCE and the anchor a diff is taken against, not the concurrency
  // token. ANY stored version is a valid base: editing an old one is how a
  // user forks forward from it, and the apply lands as the new head with the
  // `current` pointer untouched. A non-empty value that names no stored
  // version is NotFound, naming it.
  //
  // It is a VERSION token rather than a content hash. Both name where an edit
  // came from; only the token names something the user can act on —
  // `orkctl orkflow diff <name> <base_version> <head>` shows exactly what
  // arrived underneath the edit. A hash names nothing.
  string base_version = 3;
  // expected_head_version is the optimistic-concurrency token: the head
  // version the editor observed when it fetched. Non-empty and different from
  // the stored head is refused (FailedPrecondition) naming both, WHATEVER
  // base was chosen — so an edit made while somebody else applied is reported
  // instead of landing beside a newer version nobody looked at.
  //
  // Empty with an empty base_version is unchecked, which is what a plain
  // `orkctl apply file.yaml` sends. Empty with a non-empty base_version is
  // InvalidArgument naming both fields: a base is provenance, not a head
  // claim, and an editor that read a base also read the head it was under.
  //
  // Two fields because there are two facts. With one, the server cannot tell
  // "derived from an old version on purpose" from "derived from a head that
  // has since moved", and the first is the whole point of this contract.
  string expected_head_version = 4;
}
enum ValidationSeverity {
  VALIDATION_SEVERITY_UNSPECIFIED = 0;
  VALIDATION_SEVERITY_ERROR = 1;
  VALIDATION_SEVERITY_WARNING = 2;
}
message ValidationIssue {
  string field = 1;
  string message = 2;
  ValidationSeverity severity = 3;
}
message ValidateOrkflowRequest {
  string yaml = 1;
  string namespace = 2;
}
message ValidateOrkflowResponse {
  Orkflow orkflow = 1;
  repeated ValidationIssue issues = 2;
}
message ApplyOrkflowResponse {
  Orkflow orkflow = 1;
  repeated string warnings = 2;
  // created is false when this apply stored nothing because the version was
  // already there with byte-identical source YAML. The orkflow above is then
  // the STORED document, created_at and all, not the one this request would
  // have written.
  bool created = 3;
}
message GetOrkflowRequest {
  string name = 1;
  // version selects one stored version, and ANY stored version answers with
  // its own source_yaml — that is the read an editor starts from, whether it
  // is editing the head, the current version, or one older than both. Empty
  // resolves through the current pointer when one has been set, and to the
  // most recently applied version when none ever was.
  string version = 2;
  string namespace = 3;                  // empty = the default namespace
}
message GetOrkflowResponse { Orkflow orkflow = 1; }
message ListOrkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string namespace = 3;                  // empty = the default namespace
}
message ListOrkflowsResponse {
  repeated Orkflow orkflows = 1;
  string next_page_token = 2;
}

// OrkflowVersion is one stored version in a version listing: the document's
// coordinates, not the document.
message OrkflowVersion {
  string version = 1;
  google.protobuf.Timestamp applied_at = 2;
  // is_current marks the version an empty version resolves to — the pointer's
  // target when one is set, otherwise the most recently applied version.
  bool is_current = 3;
  string description = 4;
  // interface_verdict is this version's declared interface compared with
  // the version marked is_current — "what would promoting this version
  // break" (CompareInterfaces with from = current, to = this). UNSPECIFIED
  // on the is_current row itself. Computed on read from documents the
  // listing already reads; stored nowhere.
  InterfaceVerdict interface_verdict = 5;
}
message ListOrkflowVersionsRequest {
  string name = 1;
  string namespace = 2;                  // empty = the default namespace
}
message ListOrkflowVersionsResponse {
  repeated OrkflowVersion versions = 1;  // newest applied first
  // current_version is the pointer's target, empty when nobody ever promoted
  // this orkflow. Empty does NOT mean "nothing runs": resolution then falls
  // back to head_version.
  string current_version = 2;
  // head_version is the most recently applied version — the edit lineage's
  // tip, and the expected_head_version an editor sends back with its apply.
  // The base an editor sends is whichever version it actually READ, which
  // need not be this one.
  //
  // A client renders "is head" as `version == head_version`, exactly as it
  // renders "is current" from is_current: head is a property of the listing,
  // not of a version, so a per-row flag would be a second place to keep the
  // same fact.
  string head_version = 3;
}
message SetCurrentOrkflowVersionRequest {
  string name = 1;
  string version = 2;                    // must already exist
  string namespace = 3;                  // empty = the default namespace
  // acknowledge_breaking permits a promotion whose target BREAKS the
  // declared interface of the version runs execute now. Without it such a
  // promotion is FailedPrecondition and nothing moves. It permits; it never
  // requires: set on a compatible promotion it changes nothing. It accepts
  // the break against whichever version the pointer names when the request
  // is served.
  bool acknowledge_breaking = 4;
}
message SetCurrentOrkflowVersionResponse {
  string name = 1;
  string namespace = 2;
  string current_version = 3;
  // previous_version is what the pointer named before, empty when it was
  // never set. It is what a rollback promotes back to.
  string previous_version = 4;
  google.protobuf.Timestamp updated_at = 5;
  // interface_verdict is the promoted version's declared interface compared
  // with compared_version — what ran when no version was named, until now.
  // UNSPECIFIED, with compared_version empty, when the promotion did not
  // change what runs. BREAKING here means the request acknowledged it.
  InterfaceVerdict interface_verdict = 6;
  string compared_version = 7;
}
message DiffOrkflowVersionsRequest {
  string name = 1;
  string from_version = 2;               // empty = the resolved current version
  string to_version = 3;                 // empty = the resolved current version
  string namespace = 4;                  // empty = the default namespace
}
message DiffOrkflowVersionsResponse {
  // unified_diff is standard unified-diff text, empty when the two versions'
  // source YAML is identical.
  string unified_diff = 1;
  string from_version = 2;               // resolved
  string to_version = 3;                 // resolved
}
// PlanRunRequest names ONE definition, one input, and optional stub outputs.
//
// Exactly one of orkflow_name and yaml is set. With orkflow_name, the
// definition is the stored version the three coordinates address, resolved
// exactly as GetOrkflow and SubmitRun resolve it (empty version = the
// current pointer). With yaml, the definition is prepared from the document
// exactly as ValidateOrkflow prepares it — compiled against the deployment's
// activity catalog, namespace-checked, images resolved, digest computed —
// and stored nowhere.
message PlanRunRequest {
  string orkflow_name = 1;
  string orkflow_version = 2;            // empty = the current pointer
  string namespace = 3;                  // empty = the default namespace
  // input is the run input exactly as SubmitRunRequest.input would carry
  // it; the definition's declared defaults fill omitted keys, caller keys
  // always win. The effective, defaulted input is echoed on the response.
  Payload input = 4;
  // assumed_outputs stubs the values.json of a task that would run, keyed
  // by task id, so a downstream condition that reads
  // .tasks.<id>.output.<field> can be planned both ways. A key that is not
  // a task id of the definition is InvalidArgument naming it. A task that
  // runs with no entry here is planned with an EMPTY output map — which is
  // exactly what the interpreter gives a condition when the upstream wrote
  // no such field — and every task whose condition read such an output is
  // listed in PlanTask.assumed_absent. An entry for a task that does not
  // run is reported in unused_assumed_outputs, never silently dropped.
  map<string, Payload> assumed_outputs = 5;
  // yaml is an unapplied document to plan instead of a stored version. It
  // is prepared, not stored: the same function ValidateOrkflow uses, with
  // the same errors. namespace, when set, must agree with the document's
  // own `namespace:` on the same rule ApplyOrkflow applies.
  string yaml = 6;
  // assume_failed plans the run as if each named task, when it would run,
  // FAILED after its retries: its failure handlers are planned, every task
  // that is not a failure handler and transitively needs it is UNREACHED, and
  // work that does not depend on it is planned as if nothing had failed (in a
  // run it may be canceled in flight). Each entry is a task id of the
  // definition, at most once; an unknown or repeated id is InvalidArgument
  // naming it. An entry whose task does not run is reported in
  // unused_assume_failed.
  repeated string assume_failed = 7;
}

// PlanOutcome is what the interpreter would do with one task, given the
// planned input and the request's assumed failures. It is deliberately not
// orkstack.v1.Status: a plan executes nothing, and the enum must not be
// mistaken for an execution record. FAILS is a decision the interpreter would
// itself take (a condition it cannot evaluate); ASSUMED_FAILED is the
// request's assumption, never a prediction that the task fails.
enum PlanOutcome {
  PLAN_OUTCOME_UNSPECIFIED = 0;
  // RUNS: the interpreter would schedule this task's activity.
  PLAN_OUTCOME_RUNS = 1;
  // SKIPPED: the interpreter would mark it STATUS_SKIPPED, for the reason
  // in PlanTask.skip_reason, without reaching an Orker.
  PLAN_OUTCOME_SKIPPED = 2;
  // FAILS: evaluating this task's condition returns an error. Unless an
  // earlier task already did, the run starts failing at that point
  // (RUN_FAILED with the error's text); in a definition with a failure
  // handler the interpreter also records the task FAILED (CONDITION_FAILED).
  // A FAILS of a failure handler decided after fails_at is recorded on that
  // handler and cuts nothing, so a plan of a definition with failure handlers
  // may hold more than one FAILS; without a failure handler it holds at most
  // one. PlanTask.error carries it.
  PLAN_OUTCOME_FAILS = 3;
  // UNREACHED: a task that is not a failure handler and is certainly never
  // started: it transitively needs an ASSUMED_FAILED task, or a FAILS of a
  // task that is not a failure handler was decided before it (unreached_by
  // names which); only present when fails_at is set.
  PLAN_OUTCOME_UNREACHED = 4;
  // AWAITS: the task is an awaited task the interpreter would open: it takes
  // a wave as RUNS does and starts no activity.
  PLAN_OUTCOME_AWAITS = 5;
  // ASSUMED_FAILED: the request's assume_failed names this task and it would
  // run; it is planned as having run and FAILED. It takes a wave as RUNS
  // does, contributes no output, and is where the planned run starts failing
  // unless an earlier task already did.
  PLAN_OUTCOME_ASSUMED_FAILED = 6;
}

// PlanTask is one task's planned outcome. Tasks are listed in declaration
// order, the order readyTasks scans them in.
message PlanTask {
  string task_id = 1;
  PlanOutcome outcome = 2;
  // wave is the dispatch depth: 1 for a task with no needs, otherwise one
  // more than the highest wave among its needs. A SKIPPED task carries the
  // wave it WOULD have been dispatched in, so a reader sees where in the
  // graph the branch closed; it is not counted in PlanRunResponse.wave_count
  // because a skip costs the interpreter no activity and no wait. 0 for
  // FAILS and UNREACHED.
  //
  // A wave is a depth, not a clock: the interpreter re-scans after EVERY
  // completion, so with real durations a wave-3 task may start before a
  // slower wave-2 task on another branch finishes. wave_count is the
  // minimum number of sequential dispatch rounds, which is what an author
  // asking "how parallel is this" wants to know.
  int32 wave = 3;
  // skip_reason is, for SKIPPED, the exact sentence the interpreter logs
  // after "task skipped: " — `upstream task "<id>" was skipped` or
  // `condition "<expression>" evaluated false`. Empty otherwise.
  string skip_reason = 4;
  // skipped_by is, for an upstream skip, the id of the need that caused it
  // (the first skipped entry of `needs:`, as classify finds it). Empty for
  // a condition skip and for every other outcome.
  string skipped_by = 5;
  // condition is the task's `condition:` as written, empty when it has none.
  string condition = 6;
  // pin is the task's `pin:` as written, empty when unpinned. Rendered so a
  // reader sees which RUNS tasks would open and share a pin; a pin whose
  // every member is SKIPPED is never opened by the interpreter and is
  // rendered as such.
  string pin = 7;
  // assumed_absent lists the upstream task ids this task's condition reads
  // through .tasks.<id> for which the request supplied no assumed output,
  // in sorted order. Those outputs were planned as {}. Set only when the
  // condition was actually evaluated (RUNS, or SKIPPED by its condition);
  // empty for an upstream skip, FAILS, and UNREACHED.
  repeated string assumed_absent = 8;
  // error is set for FAILS and ASSUMED_FAILED: for the task at fails_at, the
  // error the interpreter records on the RUN (code RUN_FAILED for a condition
  // error, ASSUMED_FAILED for an assumption); for any later FAILS, the error
  // recorded on that task (code CONDITION_FAILED).
  Error error = 9;
  // await is the task's AwaitSpec, set for an awaited task whatever its
  // outcome, so a reader sees the deadline and whether it takes a callback.
  AwaitSpec await = 10;
  // each is the task's EachSpec, set for a fan-out whatever its outcome.
  EachSpec each = 11;
  // each_count is the number of items the plan can already count: set when
  // the source is an input, or a task whose values assumed_outputs stubs;
  // unset when the count is a run-time fact.
  optional int32 each_count = 12;
  // orkflow is the task's Task.orkflow, set for a composed task whatever its
  // outcome. A plan never recurses into the child: its input is rendered at
  // run time and its own plan is one more PlanRun call.
  OrkflowRef orkflow = 13;
  // cache is the task's CacheSpec, set for a cached task whatever its
  // outcome. A plan never predicts a hit: that is decided on the Orker, from
  // the rendered config and the input digests, when the run reaches it.
  CacheSpec cache = 14;
  // join is the task's join policy, set whatever its outcome when the
  // definition declares one other than all_succeeded.
  JoinPolicy join = 15;
  // unreached_by is, for UNREACHED, the task whose failure leaves this one
  // unreached: the first decision-time failure (a FAILS) decided before it,
  // or else the first ASSUMED_FAILED task of its needs closure in declaration
  // order. Empty for every other outcome.
  string unreached_by = 16;
}

// PlanWave lists the RUNS, AWAITS and ASSUMED_FAILED tasks of one wave, in
// declaration order. There is one entry per wave from 1 to wave_count;
// SKIPPED tasks are not members.
message PlanWave {
  int32 wave = 1;
  repeated string task_ids = 2;
}

message PlanRunResponse {
  // The definition that was planned: the coordinates and the digest of the
  // exact document, so a plan of a pinned version and a plan of `current`
  // can be told apart after the pointer moves.
  string orkflow_name = 1;
  string orkflow_version = 2;
  string namespace = 3;
  string definition_digest = 4;
  // from_yaml is true when the request planned an unapplied document; the
  // version is then whatever the document pins or the derived source hash,
  // and nothing under these coordinates is stored.
  bool from_yaml = 5;
  // input is the EFFECTIVE input: the request's, with declared defaults
  // applied, exactly what RunWorkflow would see as .inputs.
  Payload input = 6;
  repeated PlanTask tasks = 7;           // declaration order
  repeated PlanWave waves = 8;           // 1..wave_count, RUNS tasks only
  int32 runs = 9;                        // count of RUNS
  int32 skipped = 10;                    // count of SKIPPED
  // wave_count is the highest wave of any RUNS task; 0 when nothing runs.
  int32 wave_count = 11;
  // unused_assumed_outputs lists request keys whose task did not RUN, in
  // sorted order: the stub was accepted and had no effect.
  repeated string unused_assumed_outputs = 12;
  int32 awaits = 13;                     // count of AWAITS
  int32 assumed_failed = 14;             // count of ASSUMED_FAILED
  // unused_assume_failed lists request entries whose task is not
  // ASSUMED_FAILED (it was SKIPPED or UNREACHED), in request order.
  repeated string unused_assume_failed = 15;
  // fails_at is the task at which the planned run starts failing — the first
  // FAILS or ASSUMED_FAILED in decision order — or empty when nothing fails.
  // The run is planned FAILED exactly when it is set; each UNREACHED task
  // names its own cause in PlanTask.unreached_by.
  string fails_at = 16;
}
// InterfaceVerdict is how one version's DECLARED interface — its inputs:
// and its outputs: — compares with another's.
enum InterfaceVerdict {
  // UNSPECIFIED means nothing was compared: a version listed beside itself,
  // or a promotion that did not change what runs.
  INTERFACE_VERDICT_UNSPECIFIED = 0;
  // COMPATIBLE: every finding is compatible.
  INTERFACE_VERDICT_COMPATIBLE = 1;
  // BREAKING: at least one finding breaks. Promoting such a version is
  // refused until acknowledged.
  INTERFACE_VERDICT_BREAKING = 2;
  // UNKNOWN: nothing breaks, but part of the interface is not declared — an
  // orkflow with no outputs: declares no return contract, so whether its
  // output changed cannot be stated. Never reported as COMPATIBLE, never
  // refused.
  INTERFACE_VERDICT_UNKNOWN = 3;
}

// InterfaceChange is what one finding says happened.
enum InterfaceChange {
  INTERFACE_CHANGE_UNSPECIFIED = 0;
  INTERFACE_CHANGE_UNCHANGED = 1;
  INTERFACE_CHANGE_ADDED = 2;
  INTERFACE_CHANGE_REMOVED = 3;
  // RETYPED: an input's type differs, or it is typed where it was not.
  INTERFACE_CHANGE_RETYPED = 4;
  // UNTYPED: an input's type was dropped.
  INTERFACE_CHANGE_UNTYPED = 5;
  INTERFACE_CHANGE_NOW_REQUIRED = 6;
  INTERFACE_CHANGE_NO_LONGER_REQUIRED = 7;
  INTERFACE_CHANGE_DEFAULT_ADDED = 8;
  INTERFACE_CHANGE_DEFAULT_REMOVED = 9;
  INTERFACE_CHANGE_DEFAULT_CHANGED = 10;
  // OUTPUTS_UNDECLARED: neither version declares outputs:.
  INTERFACE_CHANGE_OUTPUTS_UNDECLARED = 11;
  // OUTPUTS_DECLARED: the later version declares outputs: and the earlier
  // one did not.
  INTERFACE_CHANGE_OUTPUTS_DECLARED = 12;
}

// InterfaceFinding is one statement about one declared input, one declared
// output, or the outputs: block as a whole.
message InterfaceFinding {
  // field is "inputs.<name>", "outputs.<name>", or "outputs".
  string field = 1;
  InterfaceChange change = 2;
  // verdict is this finding's own: COMPATIBLE, BREAKING or UNKNOWN, never
  // UNSPECIFIED.
  InterfaceVerdict verdict = 3;
  // from and to render the declaration on each side for a reader — an input
  // as "string, required" or "number, optional, default 300", an output as
  // "declared", the outputs: block as "none" or "3 outputs" — and are empty
  // on the side where it does not exist.
  string from = 4;
  string to = 5;
  // message is the one sentence every client prints for this finding,
  // verbatim.
  string message = 6;
}

// CompareInterfacesRequest's fields mirror DiffOrkflowVersionsRequest, the
// sibling read, field for field.
message CompareInterfacesRequest {
  string name = 1;
  string from_version = 2;               // empty = the resolved current version
  string to_version = 3;                 // empty = the resolved current version
  string namespace = 4;                  // empty = the default namespace
}
message CompareInterfacesResponse {
  // findings: every input of either version, sorted by name, then the
  // output side (docs/DSL.md "Which version runs" gives the table).
  repeated InterfaceFinding findings = 1;
  // verdict is BREAKING when any finding is, else UNKNOWN when any finding
  // is, else COMPATIBLE.
  InterfaceVerdict verdict = 2;
  string from_version = 3;               // resolved
  string to_version = 4;                 // resolved
}

// OrkflowCallerKind is what references an orkflow.
enum OrkflowCallerKind {
  ORKFLOW_CALLER_KIND_UNSPECIFIED = 0;
  // ORKFLOW: a composed task (uses: orkflow:<name>@<version>) of a stored
  // version of another orkflow. It always pins a version and is never moved
  // by a promotion.
  ORKFLOW_CALLER_KIND_ORKFLOW = 1;
  ORKFLOW_CALLER_KIND_TRIGGER = 2;
  ORKFLOW_CALLER_KIND_SCHEDULE = 3;
}

// OrkflowCaller is one reference to an orkflow. Fields marked with a kind
// are set only for that kind.
message OrkflowCaller {
  OrkflowCallerKind kind = 1;
  // name is the composing orkflow's name (ORKFLOW), the schedule's name
  // (SCHEDULE), or the trigger's optional name (TRIGGER; may be empty).
  string name = 2;
  // id is the trigger's or the schedule's opaque id; empty for ORKFLOW.
  string id = 3;
  // ORKFLOW: the composing version, whether it is that orkflow's resolved
  // current version, and the composed task.
  string caller_version = 4;
  bool caller_version_is_current = 5;
  string task_id = 6;
  // pinned_version is the version of THIS orkflow the caller starts. Always
  // set for ORKFLOW. Empty for a trigger or schedule that follows the
  // current pointer — or, for a SCHEDULE, when unavailable_reason is set,
  // in which case it is UNKNOWN, not "follows current".
  string pinned_version = 7;
  // ORKFLOW: the definition digest the composing version pinned.
  string pinned_definition_digest = 8;
  // ORKFLOW: the output names of this orkflow the composing version's
  // templates read through the composed task (with:, condition:, outputs:),
  // sorted and distinct.
  repeated string outputs_read = 9;
  // ORKFLOW: the top-level keys of the composed task's with: — the inputs
  // it supplies — sorted.
  repeated string inputs_supplied = 10;
  // TRIGGER, SCHEDULE: the operator's description, verbatim.
  string description = 11;
  // SCHEDULE: set when the cluster did not describe the schedule for this
  // read, so the version it pins is not known. Never a guess.
  string unavailable_reason = 12;
}

message ListOrkflowCallersRequest {
  string name = 1;
  string namespace = 2;                  // empty = the default namespace
  // all_versions scans every stored version of every orkflow in the
  // namespace. False scans each orkflow's resolved current version only —
  // the version its own starters run.
  bool all_versions = 3;
}
message ListOrkflowCallersResponse {
  // callers: ORKFLOW rows by orkflow name, then version (newest applied
  // first), then task declaration order; then TRIGGER rows oldest first;
  // then SCHEDULE rows by name.
  repeated OrkflowCaller callers = 1;
  // current_version is what a run of this orkflow that names no version
  // executes; empty when no version is stored.
  string current_version = 2;
  // stored_versions counts this orkflow's stored versions. 0 with callers
  // present is an orkflow that was deleted while something still names it.
  int32 stored_versions = 3;
  // scanned_versions counts the other orkflows' definitions read.
  int32 scanned_versions = 4;
  bool all_versions = 5;                 // echoed
}

message DeleteOrkflowRequest {
  string name = 1;
  string namespace = 2;                  // empty = the default namespace
}
message DeleteOrkflowResponse {
  string name = 1;
  string namespace = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

// RunService submits and observes orkflow executions.
service RunService {
  rpc SubmitRun(SubmitRunRequest) returns (SubmitRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // StreamEvents server-streams realtime events for a run. from_sequence
  // allows resuming after a disconnect (0 = from start).
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  // StreamTaskLogs server-streams one task attempt's output: every chunk
  // already written, in order, then each new one as it lands.
  //
  // Logs are a SEPARATE stream from Event on purpose. Task output is bytes,
  // and bytes never enter a Temporal payload or the event stream (a run's
  // history is replayed forever, and a chatty task would bloat it forever
  // too). The Orker writes numbered chunks to the artifact store while the
  // task runs; this RPC reads them back from there. EventType gains nothing:
  // EVENT_TYPE_TASK_LOG stays what it always was, a human notice with no
  // task output in it.
  //
  // Any replica answers for any run, on the same terms as StreamEvents: the
  // chunks are in the shared store and the task's state comes from the shared
  // cluster, so a replica that started nothing serves a run to completion.
  rpc StreamTaskLogs(StreamTaskLogsRequest) returns (stream TaskLogChunk);
  rpc ListRunArtifacts(ListRunArtifactsRequest) returns (ListRunArtifactsResponse);
  rpc ReadArtifact(ReadArtifactRequest) returns (stream ArtifactChunk);
  // ListTaskAttempts reads back what every attempt of a task did, including
  // the attempts that lost.
  //
  // Temporal owns retries, so a run's snapshot only ever carries a task's
  // FINAL outcome: the error of each earlier attempt is discarded when the
  // next one is scheduled. The Orker writes one immutable TaskAttempt record
  // per attempt (metadata/attempts/…), and this RPC serves them — from the
  // shared store, so any replica answers for any run, on exactly the terms
  // StreamTaskLogs and ListRunArtifacts are on.
  //
  // A missing record is REPORTED, never hidden: an attempt number the store
  // has nothing for comes back as ATTEMPT_OUTCOME_UNREPORTED, so a timeline
  // never has a silent hole where an Orker died. There is no stream: a client
  // refetches on the events it already follows.
  rpc ListTaskAttempts(ListTaskAttemptsRequest) returns (ListTaskAttemptsResponse);
  // ResolveAwait completes or rejects an awaited task of a running run. It
  // is a WRITE, addressed inside a namespace exactly as CancelRun is: another
  // namespace's run is NotFound. The values are stored and the resolution is
  // delivered to the run before this returns; the run applies it — a caller
  // that must see the outcome reads the run or follows its events. A repeat
  // of the resolution that already won answers success and delivers nothing.
  rpc ResolveAwait(ResolveAwaitRequest) returns (ResolveAwaitResponse);
  // GetArtifactProvenance answers, for ONE recorded artifact, whether its
  // bytes are still in the object store and which archived runs of the
  // calling namespace recorded the same physical object.
  //
  // It is a READ of the reverse index the archive already maintains for
  // cleanup refcounting (metadata/index/objects/…, docs/STORAGE.md): a
  // keys-only prefix scan whose keys are the answer, then one body read per
  // referencing run to check its namespace. It writes nothing and creates
  // no key family.
  //
  // The artifact is addressed exactly as ReadArtifact addresses it — by the
  // run, task, kind and recorded name — and resolved against the
  // authoritative run. A caller never names an object key or a URI. On the
  // S3 backend an object key embeds its run id, so `references` is the
  // producing run alone; on the local backend identical bytes under one
  // name are one object, so every run that produced them is listed.
  rpc GetArtifactProvenance(GetArtifactProvenanceRequest) returns (GetArtifactProvenanceResponse);
  // InspectRun answers "what is this task doing right now" for every
  // in-flight task of ONE live run, from the heartbeat detail the Orker
  // already sends and the cluster already holds for the pending activity.
  //
  // It is a READ of Temporal's own describe of the execution — nothing is
  // stored, nothing is projected onto the snapshot, and no event is added.
  // A run that is terminal, or whose execution has left the cluster, answers
  // with run_status and no attempts. There is no stream: a client polls.
  //
  // A heartbeat is reported ONLY when it belongs to the attempt that is
  // pending now. Temporal keeps a failed attempt's last detail through the
  // retry backoff and until the next attempt's first beat; that detail is
  // never rendered as the new attempt's progress.
  rpc InspectRun(InspectRunRequest) returns (InspectRunResponse);
  // DiffRuns compares two runs of ONE namespace field by field: the pinned
  // definition, the input (as a canonical-JSON unified diff), and per task
  // its status, attempt, pool, pin, orker, exit code, error, duration, and
  // the image it was dispatched with and the platform manifest it ran.
  //
  // It is a READ over what GetRun, GetOrkflow and ListTaskAttempts already
  // serve, computed on every call and stored nowhere, so there is no
  // comparison record that can disagree with the runs it compares. Both ids
  // resolve inside the request's namespace exactly as GetRun resolves one: a
  // run of another namespace is NotFound. Two runs of different orkflows are
  // compared and flagged (same_orkflow=false), never refused.
  //
  // The diff is SERVER-side for the reason DiffOrkflowVersions records: two
  // clients render it, and the rendering of "unavailable", "does not apply"
  // and an empty value must be decided once. Every from_value/to_value is a
  // rendered string a client prints verbatim.
  rpc DiffRuns(DiffRunsRequest) returns (DiffRunsResponse);

  // ExportRunEvidence streams ONE finished run's evidence bundle: a tar.gz
  // whose first member, MANIFEST.json, names every other member's path,
  // origin, size, sha256 and state, followed by the archived run and events,
  // the pinned definition's source YAML, and per task the verbatim
  // commit.json, values.json, every output artifact, every attempt record,
  // and every attempt's stdout.log and stderr.log.
  //
  // It is a READ, assembled per request from objects that already exist and
  // kept nowhere: there is no export record, so nothing can disagree with the
  // archive. Every member digest is of the bytes as they were read; a member
  // with a recorded reference is verified as it streams and a mismatch ends
  // the stream with DataLoss and no `last`. Bytes the cleanup worker or a
  // lifecycle rule removed are listed with state "reclaimed" and their
  // recorded sha256 preserved, never omitted.
  //
  // The run is addressed inside its namespace exactly as GetRun addresses it
  // and must be finished and archived; a live run is FailedPrecondition. The
  // stream is complete only when a chunk with `last` arrives, on the same
  // terms as ReadArtifact. The bundle layout and manifest schema are
  // docs/RUN_EVIDENCE.md.
  rpc ExportRunEvidence(ExportRunEvidenceRequest) returns (stream EvidenceChunk);
}

// WebhookService manages run-event subscriptions. A subscription is
// deployment-wide unless it names a scope: a namespace, an orkflow, a task,
// each an exact match and each empty meaning "every". Delivery is
// deliberately outside this management contract; callers never receive the
// stored signing secret after registration.
//
// What a delivery DID is a record, not a queue: one immutable object per
// settled delivery (metadata/deliveries/…), written after the dispatcher
// returned and read by nothing that decides what to send. ListDeliveries and
// GetDelivery read it; RedeliverWebhook is one operator-initiated synchronous
// POST, recorded as a new delivery. Nothing here retries on its own.
//
// A subscription scoped to a namespace may carry a name; UpdateWebhook
// changes it in place.
service WebhookService {
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  // UpdateWebhook REPLACES a subscription's mutable fields — name, url,
  // events and scope — in place. Its id and signing secret never change, so
  // a receiver keeps verifying and a delivery record's webhook_id keeps
  // naming the same subscription. Last writer wins; an update never brings
  // back a subscription deleted meanwhile (NotFound). The secret is never in
  // the request or the response.
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // ListDeliveries lists delivery records newest first, bounded and
  // paginated. A scan that would examine more keys than the engine's budget
  // allows before filling a page is REFUSED (RESOURCE_EXHAUSTED) naming the
  // budget, never answered from the subset it managed to read.
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  // GetDelivery returns one record by id.
  rpc GetDelivery(GetDeliveryRequest) returns (GetDeliveryResponse);
  // RedeliverWebhook POSTs one delivery again — once, now, synchronously,
  // signed with the subscription's current secret, embedding the run as it
  // reads today — and returns the NEW record. The operator is the retry
  // policy: this RPC never queues, never retries, and never runs unattended.
  rpc RedeliverWebhook(RedeliverWebhookRequest) returns (RedeliverWebhookResponse);
}

message Webhook {
  string id = 1;
  string url = 2;
  // events selects the transitions this subscription wants. Empty means
  // every RUN transition — and only those: a task outcome event
  // (TASK_SCHEDULED, TASK_STARTED, TASK_SUCCEEDED, TASK_FAILED) is delivered
  // only to a subscription that names it. TASK_LOG is never accepted.
  repeated EventType events = 3;
  google.protobuf.Timestamp created_at = 4;
  // namespace narrows this subscription to runs of one namespace. Empty
  // means every namespace, which is what every subscription registered
  // before this field existed is. A run that names no namespace is in
  // "default", so a subscription written as "default" matches it.
  string namespace = 5;
  // orkflow_name narrows to runs of one orkflow, by the name the author
  // wrote. Empty means every orkflow. It composes with namespace by
  // conjunction and does not require it: a name alone matches that name in
  // every namespace.
  string orkflow_name = 6;
  // task_id narrows the task outcome events to one task. Empty means every
  // task. It is consulted only for TASK_* events: a RUN_* event has no task
  // and passes this filter unconditionally, so one subscription can want
  // TASK_SUCCEEDED of `extract` and RUN_FAILED of the whole run. Registration
  // refuses a task_id when events names no TASK_* event, because the filter
  // could then never be consulted.
  string task_id = 7;

  // name is the operator's handle: a slug, at most 200 bytes, unique among
  // the named subscriptions of its namespace scope. It REQUIRES namespace:
  // a name is unique within one namespace, and a deployment-wide
  // subscription belongs to none. Empty means unnamed — every subscription
  // registered before this field existed — and an unnamed subscription is
  // outside every automation document. It plays no part in delivery.
  string name = 8;
}
message RegisterWebhookRequest {
  string url = 1;
  repeated EventType events = 2;
  string secret = 3;
  // The scope, on exactly the terms Webhook states them.
  string namespace = 4;
  string orkflow_name = 5;
  string task_id = 6;
  string name = 7;                         // optional; see Webhook.name
}
message RegisterWebhookResponse {
  Webhook webhook = 1;
  string secret = 2;
}
// UpdateWebhookRequest replaces every mutable field, on the terms
// RegisterWebhookRequest states them: empty events means every run
// transition; each scope field empty means every. It carries no secret.
message UpdateWebhookRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated EventType events = 4;
  string namespace = 5;
  string orkflow_name = 6;
  string task_id = 7;
}
message UpdateWebhookResponse { Webhook webhook = 1; }
message ListWebhooksRequest {}
message ListWebhooksResponse { repeated Webhook webhooks = 1; }
message DeleteWebhookRequest { string id = 1; }
message DeleteWebhookResponse {}

// DeliveryOutcome selects delivery records by whether they landed.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0;   // every record
  DELIVERY_OUTCOME_DELIVERED = 1;     // the receiver answered 2xx
  DELIVERY_OUTCOME_FAILED = 2;        // the ladder ended without a 2xx
}

// DeliveryAttempt is one POST of one delivery, as pkg/webhooks.Attempt
// recorded it.
message DeliveryAttempt {
  int32 number = 1;                        // counts from 1
  int32 status_code = 2;                   // 0 when the request never completed
  string error = 3;                        // transport failure or "receiver answered N"; bounded
  google.protobuf.Duration backoff = 4;    // pause taken before this attempt
  google.protobuf.Duration duration = 5;   // how long the request itself took
  google.protobuf.Timestamp at = 6;        // when the request was started
}

// Delivery is one settled webhook delivery: what OrkStack sent, what the
// receiver answered, and nothing about what the receiver did with it.
message Delivery {
  // schema_version is 1. A reader skips a record whose version it does not
  // know rather than guessing at its fields.
  int32 schema_version = 1;
  // id is the value the receiver saw in X-Ork-Delivery, shaped
  // "dlv-{stamp}-{16 hex}" where stamp is the store's sortable UTC layout at
  // the instant the delivery was queued (created_at) and the hex is 8 bytes
  // from crypto/rand. The stamp is the store's coordinate for the record's
  // key; no client parses it — created_at is the time.
  string id = 2;
  string webhook_id = 3;
  EventType event = 4;
  string run_id = 5;
  // namespace is the run's resolved namespace ("default" spelled out).
  string namespace = 6;
  string orkflow_name = 7;
  // task_id and attempt are set for a task outcome delivery
  // (docs/UI_CLI_PARITY.md "Scoped subscriptions and task outcome events")
  // and empty/zero for a run transition.
  string task_id = 8;
  int32 attempt = 9;
  // status is the transition's status as the body's "status" carried it.
  Status status = 10;
  // url is the subscription's URL as it was POSTed to.
  string url = 11;
  bool delivered = 12;
  // signature is the X-Ork-Signature value sent ("sha256=…"), or empty when
  // the delivery was unsigned. It is what the record proves was sent; the
  // secret itself is never here.
  string signature = 13;
  // body_sha256 is the lowercase hex SHA-256 of the exact bytes POSTed, and
  // body_bytes their length. The body is not stored: the run is readable at
  // GetRun, and a second copy would be a second version of the truth.
  string body_sha256 = 14;
  int64 body_bytes = 15;
  repeated DeliveryAttempt attempts = 16;
  // event_at is the transition's own timestamp (X-Ork-Timestamp, the body's
  // "timestamp"); created_at is when the notifier queued the delivery;
  // settled_at is when the dispatcher returned.
  google.protobuf.Timestamp event_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp settled_at = 19;
  // redelivery_of names the delivery this one repeats, when an operator
  // asked for it through RedeliverWebhook. Empty for a delivery the engine
  // made on its own.
  string redelivery_of = 20;
}

message ListDeliveriesRequest {
  // Each filter is an exact match; empty (or UNSPECIFIED) means every.
  string webhook_id = 1;
  string run_id = 2;
  // event is only a subscribable event (webhooks.KnownEvents); TASK_LOG and
  // RUN_CREATED are INVALID_ARGUMENT, never delivered.
  EventType event = 3;
  DeliveryOutcome outcome = 4;
  // namespace filters by the run's namespace. As on ListAuditRecordsRequest,
  // empty here means EVERY namespace, not the default one: the natural scope
  // of the webhook surface is the deployment. "default" selects the default
  // namespace's runs.
  string namespace = 5;
  // since is the inclusive start of the window and until the exclusive end,
  // both against created_at. until empty means the moment the answer is
  // computed. since empty means: the run's created_at when run_id names a
  // run the engine can read, otherwise seven days before until. A window
  // whose end is not after its start is INVALID_ARGUMENT.
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
  // page_size caps the records returned; 0 means the default (50); above
  // the maximum (200) is INVALID_ARGUMENT, not clamped.
  int32 page_size = 8;
  // page_token continues a listing. It is opaque and versioned and binds
  // every filter above; a token presented with different filters is
  // INVALID_ARGUMENT, exactly as ListRunsRequest.page_token behaves.
  string page_token = 9;
}
message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;        // newest first
  string next_page_token = 2;              // empty when the window is exhausted
  // since and until are the window the answer covers, resolved, so a client
  // prints what "the last week" or "since the run started" meant.
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
}

message GetDeliveryRequest { string id = 1; }
message GetDeliveryResponse { Delivery delivery = 1; }

message RedeliverWebhookRequest { string id = 1; }   // the delivery to repeat
message RedeliverWebhookResponse {
  // delivery is the NEW record: its own id, its one attempt, its own
  // signature and body digest, and redelivery_of naming the request's id.
  Delivery delivery = 1;
}

// TriggerService manages inbound run starters. A trigger is bound to ONE
// orkflow in one namespace, and an external caller presents that trigger's
// bearer token over plain HTTP to start a run of it.
//
// It is the mirror image of WebhookService, not a variant of it. A webhook is
// OUTBOUND and deployment-wide unless it names a scope: OrkStack calls the
// subscriber when a run it covers changes state. A trigger is INBOUND and orkflow-scoped: the caller calls
// OrkStack, authenticating as the trigger. The orkflow coordinates come from
// the stored record and never from the request, so whoever holds a token can
// only start the orkflow the trigger was created for.
//
// The secret is handed back exactly once, at creation, on the same terms as
// RegisterWebhookResponse.secret: a listing never carries it again.
//
// A trigger may carry a name, which is how an automation document addresses
// it (docs/AUTOMATION.md); UpdateTrigger renames and re-pins in place.
service TriggerService {
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);
  // UpdateTrigger REPLACES a trigger's mutable fields — name, pinned version,
  // description — in place. Its id, namespace, orkflow and bearer token never
  // change: an update never re-issues a token, and the URL an external caller
  // holds keeps working. Binding a trigger to another orkflow is delete then
  // create. Last writer wins, and an update never brings back a trigger that
  // was deleted meanwhile: that is NotFound.
  rpc UpdateTrigger(UpdateTriggerRequest) returns (UpdateTriggerResponse);
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
}

message Trigger {
  string id = 1;
  string namespace = 2;
  string orkflow_name = 3;
  string orkflow_version = 4;              // empty = current pointer, resolved at invoke time
  string description = 5;                  // optional operator label
  google.protobuf.Timestamp created_at = 6;

  // name is the operator's handle for this trigger: a slug
  // (^[a-z][a-z0-9-]*$, at most 200 bytes), unique among the named triggers
  // of its namespace. Empty means unnamed, which every trigger created before
  // this field existed is; an unnamed trigger is outside every automation
  // document. The name is not part of the invoke URL and never selects what
  // a run starts: the stored namespace and orkflow do, as before.
  string name = 7;
}
message CreateTriggerRequest {
  string namespace = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  string description = 4;
  string name = 5;                         // optional; see Trigger.name
}
message CreateTriggerResponse {
  Trigger trigger = 1;
  string secret = 2;                       // shown exactly once, like RegisterWebhookResponse.secret
}
message ListTriggersRequest {
  string namespace = 1;
  string orkflow_name = 2;                 // empty = every trigger in the namespace
}
message ListTriggersResponse { repeated Trigger triggers = 1; }
message DeleteTriggerRequest { string id = 1; string namespace = 2; }
message DeleteTriggerResponse {}
// UpdateTriggerRequest replaces every mutable field with the value here: an
// empty name makes the trigger unnamed, an empty orkflow_version follows the
// current pointer, an empty description clears it. A client that changes one
// field reads the trigger and sends the rest back, which is what
// `orkctl trigger update` does. orkflow_name is deliberately absent: a
// trigger's orkflow cannot change.
message UpdateTriggerRequest {
  string id = 1;
  string namespace = 2;                    // addresses the trigger; another namespace's is NotFound
  string name = 3;
  string orkflow_version = 4;
  string description = 5;
}
message UpdateTriggerResponse { Trigger trigger = 1; }

message SubmitRunRequest {
  string orkflow_name = 1;               // orkflow name
  string orkflow_version = 2;            // orkflow version; empty = latest
  Payload input = 3;
  string idempotency_key = 4;            // optional dedupe
  // namespace selects which namespace's orkflow_name is submitted. Empty is
  // the default namespace. A name is unique WITHIN a namespace, so this is
  // half of the orkflow's address, not a filter.
  string namespace = 5;
  //
  // allow_empty_pool submits even when a task's resolved pool has no live
  // Orkers. Default false: an empty pool is an error at submit, not a run
  // that reaches RUNNING and stays there because nothing will ever pick its
  // tasks up. Setting it is logged with the pool it overrode.
  bool allow_empty_pool = 6;

  // origin_reference is caller-supplied correlation text recorded as
  // RunOrigin.reference: a CI job URL, a ticket key, an event id. Optional.
  // At most 256 bytes and no control characters (INVALID_ARGUMENT
  // otherwise, before a run id is minted). Opaque to OrkStack. On the
  // trigger door the same value arrives as the Ork-Origin-Reference header,
  // so a CI job sets one header and the body stays exactly the run's input.
  string origin_reference = 7;

  // source_run_id marks this submission as a re-run of an existing run:
  // origin.kind becomes RUN_AGAIN and origin.id this value. Set by `orkctl
  // run again` and the run page's Run again. The server confirms the run
  // exists IN THIS NAMESPACE before minting anything; an unknown id, or a
  // run of another namespace, is NOT_FOUND naming it, on the rule every run
  // read follows. It is never an idempotency key and never reuses one: a
  // re-run is a new execution with a new id (docs/UI_CLI_PARITY.md).
  string source_run_id = 8;
  // no_cache runs this submission without reading any memo: every cached
  // task runs its container and refreshes its memo. It applies to every run
  // the submission starts, child runs included. It does nothing for an
  // Orkflow that declares no cache:.
  bool no_cache = 9;
}
// AwaitCallback is one callback await's one-time credential, handed back by
// the submission that started the run and by nothing else.
message AwaitCallback {
  string task_id = 1;
  // path is the callback door's path for this await,
  // "/v1/runs/{run_id}/awaits/{task_id}"; a client prefixes the engine
  // address it used. Reject is path + "/reject".
  string path = 2;
  // token is the bearer credential, 32 random bytes hex-encoded, shown
  // exactly once, like CreateTriggerResponse.secret. Only its salted digest
  // is kept.
  string token = 3;
}

message SubmitRunResponse {
  Run run = 1;
  // await_callbacks holds one entry per await of the definition that declares
  // `callback: true`, in declaration order. It is populated ONLY by the call
  // that started the run: a keyed repeat that returned an existing run, and
  // every read, carry none — the plaintext no longer exists anywhere.
  repeated AwaitCallback await_callbacks = 2;
}

message ResolveAwaitRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;
  // values_json is the completion's values.json, as exact JSON text: it is
  // stored byte for byte, never re-encoded. Empty means {}. Must be empty
  // when reject is set.
  string values_json = 4;
  bool reject = 5;
  // reason is required with reject and refused without it; at most 1024
  // bytes, no control character other than tab and newline.
  string reason = 6;
}

message ResolveAwaitResponse {
  string run_id = 1;
  string namespace = 2;                  // resolved
  string task_id = 3;
  bool reject = 4;
  // values_sha256 is the hex sha256 of the stored values.json; empty for a
  // rejection.
  string values_sha256 = 5;
  // repeat is true when this request repeated the resolution that had
  // already been applied — same values, or same rejection reason — so
  // nothing was stored or delivered.
  bool repeat = 6;
}
// A run id addresses a run INSIDE a namespace, exactly as an orkflow name
// does. It is unguessable, but unguessable is not a tenancy boundary: an id
// travels into logs, tickets and CI transcripts, and CancelRun is a write. So
// every request that carries one carries the namespace it is addressed in, on
// the same rule as every other namespace field — empty is the default
// namespace, never "any of them". A run of another namespace is NotFound, not
// PermissionDenied: telling the two apart would confirm to a caller who may
// not name the namespace that the id exists.
message GetRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
}
message GetRunResponse { Run run = 1; }
message ListRunsRequest {
  string orkflow_name = 1;               // optional orkflow name filter
  Status status = 2;                     // optional filter
  int32 page_size = 3;
  string page_token = 4;
  string namespace = 5;                  // empty = the default namespace
  google.protobuf.Timestamp created_after = 6;  // inclusive
  google.protobuf.Timestamp created_before = 7; // exclusive

  // origin_kind keeps runs whose origin.kind equals it. UNSPECIFIED means no
  // origin filter. A run recorded before origins existed has no kind and is
  // matched by no value of this field.
  RunOriginKind origin_kind = 8;
  // origin_id keeps runs whose origin.id equals it, within origin_kind. It
  // is INVALID_ARGUMENT without origin_kind: an id is meaningful only
  // within a kind. Exact match; never a prefix.
  string origin_id = 9;
}
message ListRunsResponse {
  // A fan-out task's row carries its `each` and status but never its
  // `items`; GetRun is the read that carries them.
  repeated Run runs = 1;
  string next_page_token = 2;
}
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_OUTPUT = 1;
  ARTIFACT_KIND_VALUES = 2;
  ARTIFACT_KIND_STDOUT = 3;
  ARTIFACT_KIND_STDERR = 4;
}
message RunArtifact {
  string task_id = 1;
  ArtifactKind kind = 2;
  ArtifactRef artifact = 3;
  int32 attempt = 4;
  // item is set when the artifact was recorded by one item of a fan-out task.
  optional int32 item = 5;
}
message ListRunArtifactsRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
  // item narrows task_id to one item of a fan-out. Requires task_id and a
  // fan-out task. Unset lists every item of a fan-out task_id (and of every
  // fan-out when task_id is empty), each RunArtifact carrying its item.
  optional int32 item = 4;
}
message ListRunArtifactsResponse { repeated RunArtifact artifacts = 1; }
message ReadArtifactRequest {
  string run_id = 1;
  string namespace = 2;
  string task_id = 3;
  ArtifactKind kind = 4;
  string name = 5;
  // item names the item of a fan-out task_id whose artifact is read; required
  // for a fan-out task (two items may record the same name), refused for any
  // other task.
  optional int32 item = 6;
}
message ArtifactChunk {
  bytes data = 1;
  ArtifactRef artifact = 2;
  bool last = 3;
}
message ListTaskAttemptsRequest {
  string run_id = 1;
  string namespace = 2; // empty = the default namespace
  string task_id = 3;   // empty selects every task of the run
  // item narrows task_id to one item of a fan-out. Unset returns every item's
  // timeline for a fan-out task (items ascending, attempts ascending within
  // an item), each TaskAttempt carrying its item.
  optional int32 item = 4;
}
message ListTaskAttemptsResponse {
  // attempts is every attempt of every selected task: tasks in the order
  // Run.task_runs lists them, and within a task ascending by attempt with no
  // gaps — an attempt number the store has no record for is present as
  // ATTEMPT_OUTCOME_UNREPORTED rather than absent.
  repeated TaskAttempt attempts = 1;
}

// ReferenceState is the addressed run's OWN standing in the object index.
// It exists so an empty `references` list can be read: "released" and
// "never recorded" are different facts that would otherwise render alike.
enum ReferenceState {
  REFERENCE_STATE_UNSPECIFIED = 0;
  // HELD: the run is archived and its marker on this object is present.
  REFERENCE_STATE_HELD = 1;
  // RELEASED: no marker, and the run's cleanup record exists — the cleanup
  // worker released its object claims (docs/STORAGE.md, "Reclaiming space").
  // released_at carries the record's timestamp.
  REFERENCE_STATE_RELEASED = 2;
  // ABSENT: no marker and no cleanup record. The run has not reached its
  // terminal event, its archive write has not completed, it was archived
  // before the object index existed, or cleanup released its markers and had
  // not yet written its record. The server does not guess which; a client
  // renders "no reference recorded", never "released" and never "held".
  REFERENCE_STATE_ABSENT = 3;
}

message GetArtifactProvenanceRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;
  ArtifactKind kind = 4;
  // name is the exact recorded artifact name, as ReadArtifactRequest.name.
  string name = 5;
  // expect_sha256 is optional: the lowercase hex digest a caller obtained
  // elsewhere (a downstream system, an evidence bundle). When set and
  // different from the recorded ArtifactRef.sha256, the call fails
  // FailedPrecondition naming both, so a chain-of-custody check is one
  // command rather than a copy-and-compare.
  string expect_sha256 = 6;
  // item names the item of a fan-out task_id, as ReadArtifactRequest.item.
  optional int32 item = 7;
}

// ArtifactReference is one recording of the object by one archived run: the
// run, and the task and kind under which that run recorded it. A run that
// recorded the same object under two tasks yields two references.
message ArtifactReference {
  string run_id = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  string task_id = 4;
  ArtifactKind kind = 5;
  Status run_status = 6;
  google.protobuf.Timestamp run_created_at = 7;
  // item is set when the referencing run recorded the object under one item.
  optional int32 item = 8;
}

message GetArtifactProvenanceResponse {
  // artifact is the reference as recorded on the addressed run — never a
  // value re-read from the store.
  ArtifactRef artifact = 1;
  // bytes_present is whether the object itself is in the store (Stat, no
  // bytes transferred). false means the object is gone — a lifecycle rule,
  // an operator, or DeleteUnreferencedObjects — while its references may
  // still stand. A store that cannot answer fails the call; it never sets
  // this false.
  bool bytes_present = 2;
  ReferenceState own_reference = 3;
  // released_at is set only with REFERENCE_STATE_RELEASED.
  google.protobuf.Timestamp released_at = 4;
  // references is every marker on this object whose run is in the calling
  // namespace, newest run_created_at first. It includes the addressed run
  // when own_reference is HELD. Runs of other namespaces are omitted and
  // not counted.
  repeated ArtifactReference references = 5;
  // references_unreadable counts markers whose run body is not in the
  // archive (the crash window between the marker writes and the index
  // publish, docs/STORAGE.md). Such a marker's namespace cannot be known, so
  // it is counted here and listed nowhere. A body that fails to read for
  // any other reason fails the call.
  int64 references_unreadable = 6;
  google.protobuf.Timestamp computed_at = 7;
}
message InspectRunRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  string task_id = 3;                    // empty = every in-flight task of the run
  // item narrows task_id to one item of a fan-out; requires task_id.
  optional int32 item = 4;
}

// LiveAttemptState is where the pending attempt is in Temporal's view. It
// mirrors temporal.api.enums.v1.PendingActivityState with its own numbering,
// on the rule RetryState (run.proto) follows: a value of another package's
// enum is never carried by number, and the mapping is an explicit switch in
// internal/engine/live.go. PAUSED and PAUSE_REQUESTED have no member: nothing
// in OrkStack pauses an activity, and a reader of an older build must not be
// handed a state it cannot name — they map to UNSPECIFIED.
enum LiveAttemptState {
  LIVE_ATTEMPT_STATE_UNSPECIFIED = 0;
  // SCHEDULED: Temporal holds the activity and no Orker has it — the pool
  // has no free Orker, or a retry is waiting out its backoff (next_attempt_at
  // is then set).
  LIVE_ATTEMPT_STATE_SCHEDULED = 1;
  // STARTED: an Orker picked the attempt up. Only STARTED and
  // CANCEL_REQUESTED can carry a heartbeat.
  LIVE_ATTEMPT_STATE_STARTED = 2;
  // CANCEL_REQUESTED: the run was cancelled and the Orker has been (or is
  // about to be) told through a heartbeat response; the §3.3 SIGTERM → grace
  // → SIGKILL sequence runs on the Orker while this state holds.
  LIVE_ATTEMPT_STATE_CANCEL_REQUESTED = 3;
}

// HeartbeatUnavailableReason says why LiveAttempt.heartbeat_available is
// false. It is an enum rather than free text so a client renders a fixed
// sentence per value and a new value is a proto change, not a string drift.
enum HeartbeatUnavailableReason {
  HEARTBEAT_UNAVAILABLE_REASON_UNSPECIFIED = 0;    // heartbeat_available is true
  // NOT_STARTED: state is SCHEDULED (or UNSPECIFIED); no Orker has the
  // attempt, so there is nothing to beat.
  HEARTBEAT_UNAVAILABLE_REASON_NOT_STARTED = 1;
  // NO_HEARTBEAT_YET: an Orker has the attempt and no beat from THIS attempt
  // has arrived — including the case where the cluster still holds a
  // previous attempt's detail. On a healthy Orker this lasts one tick at
  // most, because the loop beats immediately on start.
  HEARTBEAT_UNAVAILABLE_REASON_NO_HEARTBEAT_YET = 2;
  // UNDECODABLE: a beat from this attempt arrived whose detail is not the
  // Orker's shape (no "phase"). Reported, never guessed at.
  HEARTBEAT_UNAVAILABLE_REASON_UNDECODABLE = 3;
}

// LiveAttempt is ONE pending ExecuteTask attempt as the cluster sees it now.
// It is not durable and is not a record: when the attempt ends the durable
// answer is the TaskAttempt record the Orker writes.
message LiveAttempt {
  string task_id = 1;
  // attempt is Temporal's attempt number for the pending activity
  // (PendingActivityInfo.attempt). While STARTED it is the number the
  // Orker's own record will carry; while SCHEDULED between retries it is the
  // number of the attempt that is ABOUT to run.
  int32 attempt = 2;
  LiveAttemptState state = 3;
  // attempt_scheduled_at is Temporal's scheduled_time for the pending
  // attempt: for a retry, the instant the backoff ends. attempt_started_at
  // is Temporal's last_started_time and is set only while STARTED or
  // CANCEL_REQUESTED. Neither is an Orker clock.
  google.protobuf.Timestamp attempt_scheduled_at = 4;
  google.protobuf.Timestamp attempt_started_at = 5;
  // next_attempt_at is set only while SCHEDULED between attempts: the
  // previous attempt failed and Temporal will start the next one at this
  // time (next_attempt_schedule_time). The previous attempt's error is in
  // ListTaskAttempts, not here.
  google.protobuf.Timestamp next_attempt_at = 6;
  // timeout_seconds and cancellation_grace_period_seconds are the task's own
  // bounds as dispatched (ExecuteTaskInput 15 and 16, read from the
  // scheduling event). The Orker arms timeout_seconds when the container is
  // started, AFTER staging and the image pull, so attempt_started_at +
  // timeout_seconds is the EARLIEST the container can be killed, not the
  // moment it will be. A client that prints a remaining time prints a lower
  // bound and says so.
  int32 timeout_seconds = 7;
  int32 cancellation_grace_period_seconds = 8;
  // expires_at is Temporal's backstop for this attempt (expiration_time: the
  // StartToClose deadline the engine computed at schedule, OCI contract
  // §6.3). It is deliberately generous and is not the task's timeout.
  google.protobuf.Timestamp expires_at = 9;

  // heartbeat_available is true ONLY when state is STARTED or
  // CANCEL_REQUESTED, a heartbeat has arrived since attempt_started_at, and
  // its detail decodes as the Orker's shape. Every field from
  // last_heartbeat_at down is meaningless when it is false and MUST render
  // as unavailable, never as zero or empty.
  bool heartbeat_available = 10;
  // heartbeat_unavailable_reason is set exactly when heartbeat_available is
  // false, and UNSPECIFIED when it is true.
  HeartbeatUnavailableReason heartbeat_unavailable_reason = 11;
  // last_heartbeat_at is the cluster's time of the last beat from this
  // attempt (last_heartbeat_time).
  google.protobuf.Timestamp last_heartbeat_at = 12;
  // heartbeat_stale is computed_at - last_heartbeat_at > task.HeartbeatStaleAfter
  // (two ceiling ticks, 20 s): a healthy Orker beats at least every
  // task.MaxHeartbeatInterval, so an older beat means the Orker is gone,
  // partitioned, or cannot reach the frontend. Temporal has not yet acted:
  // it times the attempt out at heartbeat_deadline_at, after which the
  // attempt is retried or the task fails, and this attempt becomes an
  // UNREPORTED row in ListTaskAttempts if the Orker never files a record.
  bool heartbeat_stale = 13;
  // heartbeat_deadline_at is last_heartbeat_at + the heartbeat timeout
  // (task.HeartbeatTimeout, 30 s): the instant Temporal times this attempt
  // out unless another beat arrives first. Computed here so no client needs
  // to know the constant.
  google.protobuf.Timestamp heartbeat_deadline_at = 14;
  // phase is the phase the attempt is in, in the Orker's own vocabulary:
  // "start", "commit-check", "workspace", "stage-inputs", "image", "render",
  // "create", "run", "exit", "validate", "commit", "timeout", "cancel";
  // "image-policy" is entered only when the task carries an image policy
  // (ExecuteTaskInput.image_policy), between "commit-check" and "workspace".
  // Not an enum, for the reason TaskAttempt.phase is a string.
  string phase = 15;
  // container_id is the runtime's id for the container, once one exists.
  string container_id = 16;
  // bytes_logged is every byte the workload has written to stdout AND
  // stderr, counted before the per-stream retention cap drops any — so it
  // keeps growing after retention stops. Zero with heartbeat_available true
  // means the workload has written nothing.
  int64 bytes_logged = 17;
  // orker_id is the Orker that sent the heartbeat, as it names itself
  // (ORK_ORKER_ID) — the same value TaskRun.orker_id and TaskAttempt.orker_id
  // carry. Empty when the beat came from an Orker built before the detail
  // carried it.
  string orker_id = 18;
  // item is set when the pending activity is one item of a fan-out (read off
  // the scheduled ExecuteTaskInput.each.index).
  optional int32 item = 19;
}

message InspectRunResponse {
  // run_status is the run's status as the read model reports it. A terminal
  // status comes with no attempts.
  Status run_status = 1;
  // attempts lists every pending ExecuteTask attempt of the run, in
  // Run.task_runs order, one per task. Empty for a run with nothing pending:
  // between two tasks, waiting on nothing, or finished.
  repeated LiveAttempt attempts = 2;
  // computed_at is the engine's clock at the time of the answer; every age a
  // client prints is measured against it, never against the browser's clock.
  google.protobuf.Timestamp computed_at = 3;
}

message DiffRunsRequest {
  string from_run_id = 1;
  string to_run_id = 2;
  string namespace = 3;                  // empty = the default namespace; BOTH runs resolve in it
  // only restricts the comparison to the named fields, in the vocabulary
  // RunFieldDiff.field uses plus the two run-level names "definition" and
  // "input". Empty means every field. An unknown name is InvalidArgument
  // naming the valid ones. Narrowing also narrows the READS: a request that
  // names neither "image" nor "platform_digest" never opens the attempt
  // store or the orkflow store.
  //
  // "presence" is ALWAYS compared, whatever only names: a task that exists in
  // one run and not the other always yields its presence row, so narrowing
  // can never make an added or removed task count as identical. Naming
  // "presence" is accepted and redundant. It costs no read beyond the two
  // runs themselves.
  repeated string only = 4;
}

// RunFieldDiff is one field of one task (or of the run, when task_id is
// empty) whose two values differ, or whose evidence is missing on at least
// one side. A field that is equal and available on both sides has no row.
message RunFieldDiff {
  string task_id = 1;                    // empty for a run-level field
  // field is one of: "definition" (run-level); "presence", "status",
  // "attempt", "pool", "pin", "orker", "exit_code", "error", "duration",
  // "image", "platform_digest" (task-level). It is a string, not an enum,
  // so a later contract can add a field a client of this build has never
  // heard of and the client still prints the row.
  string field = 2;
  // from_value / to_value are RENDERED strings. Empty with the side available
  // means "does not apply" or "no value" (an unpinned task's pin, a skipped
  // task's exit code); a client prints "-". Empty with the side unavailable
  // means the evidence is gone; a client prints "unavailable" and the reason.
  string from_value = 3;
  string to_value = 4;
  bool from_available = 5;
  bool to_available = 6;
  // from_reason / to_reason are set only when the side is unavailable: a
  // stable machine token from the list in docs/UI_CLI_PARITY.md ("Run diff"),
  // e.g. "attempt_record_missing", "definition_unavailable",
  // "no_attempt_store". A client renders the token's documented sentence.
  string from_reason = 7;
  string to_reason = 8;
  // item is set on a row that compares one item of a fan-out task in both runs.
  optional int32 item = 9;
}

message DiffRunsResponse {
  // from / to are the two runs, SHALLOW: task_runs, input and output are
  // cleared, because the differences below and input_unified_diff already
  // carry what a client needs of them, and a run's input may be large.
  // Every other Run field (id, orkflow, version, status, error, times,
  // namespace, definition digest, telemetry, and any field a later contract
  // adds) is carried as GetRun would carry it.
  Run from = 1;
  Run to = 2;
  bool same_orkflow = 3;                 // orkflow_name equal (namespace is equal by construction)
  bool same_definition_digest = 4;       // orkflow_definition_digest equal
  // input_unified_diff is dsl.Unified over the canonical, indented JSON of the
  // two inputs (keys sorted, integers without fraction), labelled
  // "<run id>/input.json" on each side. Empty when the inputs are identical
  // under that canonical form, or when "input" was excluded by `only`.
  string input_unified_diff = 5;
  // differences is ordered: run-level rows first, then the from-run's tasks
  // in its task_runs order, then tasks present only in the to-run in that
  // run's order; within a task, fields in the order the field comment on
  // RunFieldDiff lists them. The order is the contract; clients render it
  // as given.
  repeated RunFieldDiff differences = 6;
  // tasks_compared is the number of distinct task ids across both runs.
  int32 tasks_compared = 7;
  // tasks_identical is the number of tasks with NO row: every compared field
  // equal and available on both sides. A task whose evidence is missing on
  // either side is not identical, whatever its other fields say; nor is a
  // task present in only one run, which always has its presence row.
  int32 tasks_identical = 8;
  // evidence_unavailable counts rows with at least one unavailable side.
  int32 evidence_unavailable = 9;
  // fields_compared is the resolved field list — every field when `only` is
  // empty, else `only` plus "presence" — in canonical order, so a client can
  // say what was and was not compared. It is exhaustive: every
  // RunFieldDiff.field in differences is one of its entries.
  repeated string fields_compared = 10;
}

message ExportRunEvidenceRequest {
  string run_id = 1;
  string namespace = 2;                  // empty = the default namespace
  // task_id narrows the per-task members to one task. Empty = every task.
  // The run's own members (MANIFEST.json, run.jsonl, orkflow/source.yaml)
  // are always included. An unknown task is NotFound.
  string task_id = 3;
  // exclude_logs and exclude_artifacts drop the attempts' stdout.log and
  // stderr.log, and the tasks' output artifacts, from the bundle. They are
  // spelled as exclusions so that the proto3 zero value — an empty request —
  // is the COMPLETE bundle: a caller that asks for nothing in particular gets
  // everything. values.json, commit.json and attempt records are never
  // excluded; they are what makes the bundle evidence.
  bool exclude_logs = 4;
  bool exclude_artifacts = 5;
  // manifest_only streams the bytes of MANIFEST.json alone — the same
  // document the full bundle would carry as its first member, for the same
  // request — as an uncompressed JSON document, so a client can show what
  // a bundle would contain, and how large it is, before fetching it. The
  // small members (the archive body, the definition, commits, attempt
  // records) are still read and hashed; artifact and log objects are
  // stat'ed, never read.
  bool manifest_only = 6;
  // item narrows task_id to one item of a fan-out; requires task_id.
  optional int32 item = 7;
}

// EvidenceChunk is one slice of the export, at most 64 KiB, as ArtifactChunk
// is. `last` is set only on the final, empty chunk of a COMPLETE, successful
// export: a stream that ends without it — an error, a disconnect — is not a
// bundle, and a client must discard what it received.
message EvidenceChunk {
  bytes data = 1;
  bool last = 2;
}
message CancelRunRequest {
  string run_id = 1;
  string reason = 2;
  string namespace = 3;                  // empty = the default namespace
}
message CancelRunResponse { Run run = 1; }
message StreamEventsRequest {
  string run_id = 1;
  int64 from_sequence = 2;
  string namespace = 3;                  // empty = the default namespace
}
message StreamTaskLogsRequest {
  string run_id = 1;
  string task_id = 2;
  // attempt selects one try of the task. 0 means the latest attempt that has
  // written anything, so a caller that never saw a retry does not have to
  // know retries exist.
  //
  // With `follow`, 0 keeps meaning THE LATEST for as long as the stream is
  // open, not merely when it opened. A Temporal activity retry is invisible in
  // a task's status — the task stays RUNNING while try 2 starts under a new
  // key prefix — so a stream that resolved the attempt once would sit on a
  // dead attempt, delivering nothing, for the rest of the task's life, and say
  // it was live. When a later attempt appears the stream moves to it and
  // delivers that attempt from its FIRST chunk; every chunk names the attempt
  // it belongs to, and its seq restarts at 1, so a client can tell a new
  // attempt from more of the old one. A non-zero attempt is pinned and never
  // moves.
  int32 attempt = 3;
  // from_seq resumes AFTER this sequence: it is the LAST chunk sequence the
  // client already received, and the stream continues with the next one. 0
  // starts at the beginning. It is the same contract
  // StreamEvents.from_sequence has, over the log's own numbering — dense and
  // 1-based per (run, task, attempt) — so a client that hands back the seq of
  // the last chunk it saw replays nothing twice and misses nothing, even when
  // it reconnects to a DIFFERENT replica.
  int64 from_seq = 4;
  // from_attempt says which attempt from_seq counts chunks of. It is what
  // makes a resume safe across a retry: seq is dense per ATTEMPT, so a cursor
  // of 500 handed back after try 1 would silently skip try 2's first 500
  // chunks — or, since try 2 is usually shorter, would deliver nothing at all
  // while the pane read LIVE.
  //
  // 0 means "the attempt this request resolves to", which is what a first
  // connection means and what a client pinning `attempt` means. When it names
  // a DIFFERENT attempt from the one resolved, from_seq is dropped and the
  // resolved attempt is delivered from its first chunk: a new attempt is a new
  // read, not a continuation of the old one.
  int32 from_attempt = 7;
  // follow keeps the stream open for chunks that do not exist yet, ending
  // when the task reaches a terminal state. False makes it a replay: the
  // chunks the store holds when the request is served, then the end — whether
  // or not the task is still writing, so a replay never turns into a follow.
  bool follow = 5;
  string namespace = 6;                  // empty = the default namespace
  // item names the item of a fan-out task_id whose output is streamed;
  // required for a fan-out task, refused for any other. attempt, from_seq and
  // from_attempt then count that item's own attempts and chunks.
  optional int32 item = 8;
}
// TaskLogChunk is one slice of a task attempt's output, exactly as the Orker
// flushed it.
message TaskLogChunk {
  string run_id = 1;
  string task_id = 2;
  int32 attempt = 3;
  // seq orders the chunk within (run_id, task_id, attempt): dense, starting
  // at 1. It is assigned by the single Orker executing the attempt, so it is
  // total and gap-free without any coordination, and it is what a client
  // hands back as from_seq.
  int64 seq = 4;
  // data is UTF-8 log bytes ending on a line boundary, except where one line
  // exceeded the chunk limit and was split.
  bytes data = 5;
  // truncated marks the notice chunk the Orker writes when a task's output
  // passed its cap. Its data says so in words; no further output was stored.
  // Truncation is visible in the stream, never silent.
  bool truncated = 6;
  // last marks the end of the stream: everything this stream will deliver has
  // been delivered, and its seq is the last sequence sent, so a client resumes
  // from it. With follow that means the task reached a terminal state; without
  // follow it means the replay is complete. It carries no data.
  bool last = 7;
  // item echoes the request's item.
  optional int32 item = 8;
}

// NamespaceService manages namespaces and reports the pools they may dispatch
// onto.
//
// A namespace is a scope that owns orkflow names, runs and pool defaults. The
// registry is durable (the artifact store), so any replica answers for any
// namespace, including one it never created.
service NamespaceService {
  // CreateNamespace registers a namespace.
  //
  // It is idempotent for an identical spec: creating the same namespace twice
  // with the same description, labels, default pool and allowed pools returns
  // the existing document rather than an error, so a provisioning script is
  // safe to re-run. A second create that differs is AlreadyExists, naming what
  // differs — that one is a collision, not a repeat.
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  // GetNamespace reads one namespace. The default namespace always resolves,
  // whether or not anyone created it.
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  // ListNamespaces returns the registered namespaces, ordered by name, with
  // the built-in default always among them.
  //
  // page_size 0 returns every match in one response; a positive page_size
  // returns one page and a next_page_token. A page reads only the documents
  // it holds: the names come from the registry's key listing, so a page of
  // 25 out of thousands costs one listing and 25 reads, not thousands.
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  // UpdateNamespace replaces a namespace's mutable fields.
  //
  // It is a compare-and-swap on Namespace.etag: the token a read handed back.
  // A stale token is FailedPrecondition, so two operators editing at once
  // cannot silently clobber each other — the loser re-reads and re-applies.
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
  // DeleteNamespace removes a namespace that holds no orkflows.
  //
  // It refuses while any orkflow is still stored in it, and says how many:
  // deleting the registry entry would not delete the definitions, so they
  // would survive under a namespace nothing lists. The default namespace is
  // refused unconditionally — every orkflow that names none is in it.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  // ListPools reports every pool a namespace may dispatch onto, each with the
  // number of Orkers serving it right now.
  //
  // The answer is read from the cluster, never from process memory, so any
  // replica answers — including one that started nothing.
  //
  // It NARROWS rather than refusing. A source that cannot be reached costs
  // this read what that source knew and nothing else: a pool the cluster did
  // not answer for is still listed, carrying Pool.unavailable_reason instead
  // of a count; an orkflow store that cannot be read narrows the answer to
  // the pools the namespace document itself names. An admin read is opened
  // when something is already wrong, and a refusal hides the healthy pools
  // beside the broken one.
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
}
message CreateNamespaceRequest {
  Namespace namespace = 1;               // name is required; times are the registry's
}
message CreateNamespaceResponse {
  Namespace namespace = 1;
  // created is false when an identical namespace already existed, so an
  // idempotent repeat is distinguishable from the write that did it.
  bool created = 2;
}
message GetNamespaceRequest { string name = 1; }
message GetNamespaceResponse { Namespace namespace = 1; }
message ListNamespacesRequest {
  // page_size bounds one page. 0 returns EVERY matching namespace in one
  // response — the behaviour every existing caller relies on (the namespace
  // switcher, Admin → Usage, orkctl). Negative is INVALID_ARGUMENT.
  int32 page_size = 1;
  // page_token continues a listing from the response's next_page_token. It
  // is bound to the name_contains it was issued for; any other filter is
  // INVALID_ARGUMENT, and so is a token sent with page_size 0.
  string page_token = 2;
  // name_contains keeps only namespaces whose name contains this substring
  // (names are lowercase, so matching is exact). Empty keeps all. At most
  // 200 bytes.
  string name_contains = 3;
}
message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
  // next_page_token is set when more namespaces match than this page holds.
  string next_page_token = 2;
}
message UpdateNamespaceRequest {
  // namespace carries the new spec and the etag it was read at. Every update
  // is conditional: the etag names the stored version this edit replaces, and
  // an empty etag says the version it edited had no stored bytes at all —
  // which is what a read of the synthesized `default` namespace hands back.
  // Both are compare-and-swaps, and a write whose condition no longer holds
  // is FAILED_PRECONDITION: re-read and re-apply. There is no unconditional
  // mode; see Namespace.etag for why an empty token cannot be one.
  Namespace namespace = 1;
}
message UpdateNamespaceResponse { Namespace namespace = 1; }
message DeleteNamespaceRequest { string name = 1; }
message DeleteNamespaceResponse {}
message ListPoolsRequest {
  string namespace = 1;                  // empty = the default namespace
}
message ListPoolsResponse {
  repeated Pool pools = 1;               // ordered by name
  string default_pool = 2;               // where a task naming no pool runs
}

// ActivityService reports what this deployment can run: an activity is an
// image, and which images exist is engine configuration (§4.2), not something
// to ask an Orker.
service ActivityService {
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  // DescribeOrker is the pool-liveness probe (§6.5). It is dispatched as a
  // Temporal activity on a pool's own channel, so it answers only when an
  // Orker is actually polling that pool.
  rpc DescribeOrker(DescribeOrkerRequest) returns (DescribeOrkerResponse);
  // ListOrkers is the fleet: one row per live Orker of the deployment,
  // derived on read. Like Pool, nothing WRITES an Orker — the list comes
  // from the cluster's own poller records and each Orker's own answer, so
  // any replica answers and none holds state of its own (AGENTS.md §7). It
  // NARROWS rather than refusing: an Orker that did not answer keeps its
  // row and carries unavailable_reason. Two conditions are distinct: a
  // known poller whose describe failed is a row with unavailable_reason;
  // an orker_id that NO live poller answers to is an EMPTY list, never
  // NOT_FOUND — a read for an id nothing polls is an empty answer, and the
  // drain loop relies on it (CordonOrker, a write, is the one that answers
  // NOT_FOUND for that id).
  rpc ListOrkers(ListOrkersRequest) returns (ListOrkersResponse);
  // CordonOrker sets or clears ONE Orker's cordon: a process-local flag
  // delivered over that Orker's own channel, lost when the process exits.
  // A cordoned Orker takes no new task and opens no new pin; everything
  // already in flight on it is untouched. The response is the Orker's
  // state AFTER the change, as the Orker itself reported it.
  rpc CordonOrker(CordonOrkerRequest) returns (CordonOrkerResponse);
  // InspectActivity resolves ONE reference on demand — a catalog name or
  // any registry reference `uses:` would accept — and reports it as
  // ListActivities would: the pinned digest, platforms, and the interface
  // the image declares. It is uncached, reads engine configuration and the
  // registry only, never asks an Orker, and writes nothing.
  rpc InspectActivity(InspectActivityRequest) returns (InspectActivityResponse);
}

message InspectActivityRequest {
  // reference is what a task would write in `uses:`, resolved by the same
  // four rules (§4.2, Catalog.ResolveUses): a catalog name, or a registry
  // reference carrying `/`, `:` or `@`. A template is refused.
  string reference = 1;
}
message InspectActivityResponse { ActivityInfo activity = 1; }

message ListActivitiesRequest {}

// ActivityInfo is one catalog entry, resolved.
//
// resolved_at is a READ-MODEL field on a live catalog read, and is unrelated
// to the ImageRef.resolved_at that activity.proto reserves: nothing hashes it,
// and it is never stored in a version document.
message ActivityInfo {
  string name = 1;          // catalog key, e.g. "shell"; empty for InspectActivity of a raw reference
  string reference = 2;     // as configured, e.g. ghcr.io/orkstack/activity-shell:0.1
  string index_digest = 3;  // resolved, "sha256:<64 hex>"
  string media_type = 4;
  repeated string platforms = 5;
  google.protobuf.Timestamp resolved_at = 6;

  // interface is what the image declares about its `with:` block, read from
  // the org.orkstack.activity.interface label of the resolved image's config
  // (§4.3 step 7). Unset when the image carries no label, when the label
  // could not be read (interface_error says why), or when the reference did
  // not resolve (index_digest is then empty too).
  //
  // It is a READ-MODEL field exactly as resolved_at is: derived from
  // immutable, digest-addressed content on every read, hashed by nothing,
  // stored nowhere.
  ActivityInterface interface = 7;
  // interface_error is non-empty when the image carries the label but it
  // could not be turned into an ActivityInterface — malformed JSON, a
  // schema_version this engine does not read, a vocabulary word outside
  // the contract — or when the index advertised no platform manifest to
  // read a config from. It distinguishes "declares nothing" from "declares
  // something this engine cannot read". Empty whenever interface is set.
  string interface_error = 8;
}

// FieldSchema is one `with:` key's declaration. It is EXACTLY the
// vocabulary an Orkflow's `inputs:` already has (docs/DSL.md, "Inputs")
// and not one word more: no pattern, no range, no enum, no nesting.
message FieldSchema {
  // type is one of "string", "number", "boolean", "object", "array".
  string type = 1;
  // required means the image refuses to run without this key. A field
  // with a default is never required (the two contradict; the manifest
  // is rejected).
  bool required = 2;
  // default is documentary: what the image assumes when the key is
  // absent. The engine never writes it into `with:`. When set, its JSON
  // type must match `type`; null is not a default (omit the field).
  google.protobuf.Value default = 3;
}

// OpSchema is the key set one `op` reads, beside the shared `fields`.
message OpSchema {
  map<string, FieldSchema> fields = 1;
}

// ActivityInterface is what an image declares about its `with:` block. The
// label org.orkstack.activity.interface holds this message's protojson
// encoding (lowerCamel names), verbatim.
message ActivityInterface {
  // schema_version is 1. Any other value is a manifest this engine does
  // not read and is reported through ActivityInfo.interface_error.
  int32 schema_version = 1;
  // fields are the top-level `with:` keys every op reads (or, for an
  // image with no op selector, the whole `with:` block). The key is the
  // `with:` key, byte for byte.
  map<string, FieldSchema> fields = 2;
  // ops, when non-empty, says the image selects its operation with the
  // `op` key of docs/ACTIVITY_IMAGES.md: the map key is the op's name and
  // the value is the keys that op reads in addition to `fields`. `op`
  // itself is then implicitly declared {type: "string"} and must not
  // appear in `fields`. A key may not be declared both in `fields` and
  // under an op.
  map<string, OpSchema> ops = 3;
  // default_op is the op the image runs when `op` is absent, and must be
  // a key of ops. Empty with non-empty ops means `op` is required.
  string default_op = 4;
  // values is documentary: the keys the image writes to values.json.
  // Nothing checks it; `orkctl activity inspect` and the Activities page
  // render it so an author knows what `.tasks.<id>.output.<key>` may
  // reference.
  map<string, FieldSchema> values = 5;
}

message ListActivitiesResponse {
  // activities is ordered by name, matching ListPoolsResponse.pools
  // ("ordered by name", above). A stable order is part of the contract, not an
  // implementation detail: the Admin page renders it.
  repeated ActivityInfo activities = 1;
}

message DescribeOrkerRequest {}
message DescribeOrkerResponse { DescribeOrkerResult orker = 1; }

// Orker is one execution process, observed live.
message Orker {
  string orker_id = 1;
  // pool is the pool the Orker reports serving (DescribeOrkerResult.pool).
  string pool = 2;
  string build_id = 3;               // empty when versioning is off
  int32 running_tasks = 4;
  int32 open_pins = 5;
  int32 max_concurrent_pins = 6;     // ORK_ORKER_MAX_PINS; 0 means not a pin host
  bool cordoned = 7;
  string cordon_reason = 8;          // empty when not cordoned
  google.protobuf.Timestamp cordoned_at = 9;
  // last_seen is the most recent moment this Orker was observed polling.
  // It answers "how fresh is this row", never "when did this Orker die".
  google.protobuf.Timestamp last_seen = 10;
  // unavailable_reason says this Orker COULD NOT BE ASKED, and why — the
  // same three-state distinction Pool.unavailable_reason makes, for the same
  // reason: "not measured" rendered as "measured zero" sends an operator to
  // stop a host that may be mid-task. When set, fields 2–9 and 12 are
  // unset: nothing was measured, so there is no number to report.
  string unavailable_reason = 11;
  repeated OpenPin pins = 12;
}

message ListOrkersRequest {
  // pool keeps only Orkers that report serving this pool. Empty keeps every
  // Orker. It is matched against what each Orker answers, not against a
  // channel name.
  string pool = 1;
  // orker_id asks exactly one Orker, on its own channel, and returns at
  // most one row; pool is then ignored. It is what `orkctl orker get` and
  // the drain loop use, so a drain costs one activity per poll and not one
  // per Orker of the fleet.
  string orker_id = 2;
}

message ListOrkersResponse {
  // orkers is ordered by pool, then orker_id. A stable order is part of the
  // contract: the Admin page renders it.
  repeated Orker orkers = 1;
}

message CordonOrkerRequest {
  string orker_id = 1;
  bool cordoned = 2;
  // reason is required when cordoned is true (INVALID_ARGUMENT otherwise);
  // ignored when false.
  string reason = 3;
}

message CordonOrkerResponse { Orker orker = 1; }

// SystemService reports what this deployment is made of.
service SystemService {
  // GetSystemInfo describes THE REPLICA THAT ANSWERED. Every field is
  // configuration- or build-derived — read from the process's own
  // configuration, not observed from the cluster — except server_time.
  // Replicas of one release answer identically by construction; mid-rollout,
  // build_id is exactly the field that differs, which is the point of it.
  //
  // It is the one admin read that does not leave the process, and it is the
  // one question only the process can answer: everything else an operator
  // asks — which namespaces exist, which pools have Orkers, what those
  // Orkers run — comes from the store or the cluster, so any replica gives
  // the same reply. This one describes the replica in front of you, on
  // purpose, because that is what an operator behind a load balancer needs
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // GetRetentionPolicy reads the deployment's maximum run retention: the
  // ceiling on every namespace's run_retention, and what a namespace that
  // sets none inherits. Read from the store, so any replica answers it.
  //
  // It is deployment-wide on purpose. Per-namespace retention is a field of
  // orkstack.v1.Namespace (NamespaceService); this is the bound on all of
  // them.
  rpc GetRetentionPolicy(GetRetentionPolicyRequest) returns (GetRetentionPolicyResponse);

  // UpdateRetentionPolicy changes the maximum. A non-positive or malformed
  // duration is INVALID_ARGUMENT before anything is written. Lowering it
  // below a namespace's explicit run_retention is FAILED_PRECONDITION naming
  // that namespace — lower the namespace first. Namespaces that set nothing
  // follow the new maximum immediately: finished runs already older than it
  // are retired on the next cleanup pass.
  rpc UpdateRetentionPolicy(UpdateRetentionPolicyRequest) returns (UpdateRetentionPolicyResponse);

  // ListTelemetrySinks names the telemetry sinks this deployment declared
  // (ORK_TELEMETRY_SINKS), so a namespace admin can choose one by name. Names
  // only: endpoints and headers are the operator's and never leave the
  // process. CONFIGURATION-DERIVED; "default" is always present.
  rpc ListTelemetrySinks(ListTelemetrySinksRequest) returns (ListTelemetrySinksResponse);

  // GetImagePolicy reads the deployment's image supply-chain floor: whether
  // a `uses:` may be a mutable tag, which registries images may come from,
  // and which signing keys a namespace may require by name. Read from the
  // store, so any replica answers it. A deployment that never wrote one
  // answers the EMPTY policy with updated_at unset — that is a real answer
  // (everything is permitted), not a missing document.
  //
  // Deployment-wide on purpose. The per-namespace tightening is a field of
  // orkstack.v1.Namespace (require_signed_by); this is the floor under all
  // of them.
  rpc GetImagePolicy(GetImagePolicyRequest) returns (GetImagePolicyResponse);

  // UpdateImagePolicy replaces the floor. Every entry and key is validated
  // before anything is written (INVALID_ARGUMENT naming the entry). An
  // allowed_registries list that excludes an activity of this engine's
  // catalog is FAILED_PRECONDITION naming the activities — widen the list
  // or change ORK_ACTIVITY_CATALOG first, because a floor that silently
  // refuses every `uses: shell` is not a floor an operator meant. Removing
  // a signing key a namespace still names is FAILED_PRECONDITION naming the
  // namespace — clear the namespace first. Definitions already stored are
  // untouched; they are re-checked at their next submit.
  rpc UpdateImagePolicy(UpdateImagePolicyRequest) returns (UpdateImagePolicyResponse);
  // ListReleases is the deployment's releases as the cluster routes them:
  // which one takes new runs, which one is ramping and by how much, which
  // ones are still finishing runs, and — for every release that does not
  // take new runs — every reason it may not start to (Release.blockers).
  // DERIVED on read from the cluster and from the Orker inventory
  // (ActivityService.ListOrkers); nothing is stored, so any replica answers
  // identically, including a replica of another release. A deployment no
  // release of which has registered with the cluster answers versioned =
  // false and no releases: an answer, not an error.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);

  // RampRelease sends `percent` of new runs to one release that is not
  // current, and the rest to the current release. percent 0 stops the ramp
  // of the release that is ramping. A ramp above 0 is FAILED_PRECONDITION,
  // naming every blocker, whenever ListReleases reports one for that
  // release, and nothing is written. Runs already executing are never moved.
  rpc RampRelease(RampReleaseRequest) returns (RampReleaseResponse);

  // PromoteRelease makes one release take every new run. FAILED_PRECONDITION,
  // naming every blocker, whenever ListReleases reports one for it, and
  // nothing is written. Promoting the current release is a no-op success.
  // Runs already executing on the previous release finish there and are
  // never moved. `orkctl release rollback` is this RPC aimed at a release
  // that was current before.
  rpc PromoteRelease(PromoteReleaseRequest) returns (PromoteReleaseResponse);
}
message GetSystemInfoRequest {}
message GetSystemInfoResponse {
  // engine_version is the release this binary was built as: the value
  // -ldflags stamped in, falling back to the module's own build version and
  // then to the source revision the build was stamped with, and finally to
  // "dev" for a plain `go build`. BUILD-DERIVED.
  string engine_version = 1;
  // go_version is the toolchain the binary was compiled with. BUILD-DERIVED.
  string go_version = 2;
  // deployment_name is the Worker Deployment both binaries of a release join.
  // CONFIGURATION-DERIVED.
  string deployment_name = 3;
  // build_id names this release inside that deployment; empty means the
  // deployment is unversioned. CONFIGURATION-DERIVED, and the field that
  // differs between two replicas mid-rollout.
  string build_id = 4;
  // versioning_active reports whether Worker Deployment Versioning is on for
  // this process, which is exactly "both of the two fields above are set".
  // DERIVED from configuration, not asked of the cluster: it says what this
  // replica registered as, not what the cluster currently routes.
  bool versioning_active = 5;
  // artifact_backend is where artifacts, run archives and task logs live:
  // "local" or "s3". CONFIGURATION-DERIVED.
  string artifact_backend = 6;
  // artifact_location is the bucket or directory that backend addresses,
  // never a credential. CONFIGURATION-DERIVED.
  string artifact_location = 7;
  // temporal_address is the cluster endpoint this replica dials.
  // CONFIGURATION-DERIVED — that the address is configured is not a claim
  // that it answers; pool health is the read that proves the cluster is
  // reachable, and a connectivity flag here would be stale the moment it was
  // sent.
  string temporal_address = 8;
  // server_time is the answering replica's own clock, and is the ONLY
  // observed field in this message. A client comparing it with its own clock
  // is comparing two clocks, which is what makes a skewed replica visible.
  google.protobuf.Timestamp server_time = 9;
}

message GetRetentionPolicyRequest {}
message GetRetentionPolicyResponse {
  RetentionPolicy policy = 1;
  // namespace_retention_enforced reports whether this deployment runs the
  // worker that retires runs at their namespace's retention
  // (ORK_CLEANUP_ENABLED). When false, every run is kept for the maximum
  // plus the operator's enforcement margin and a tighter namespace value has
  // no effect yet. CONFIGURATION-DERIVED, like GetSystemInfo's fields.
  bool namespace_retention_enforced = 2;
}
message UpdateRetentionPolicyRequest {
  // max_run_retention is the new deployment maximum. A non-positive or
  // malformed value is rejected with INVALID_ARGUMENT before any call leaves
  // this process.
  google.protobuf.Duration max_run_retention = 1;
}
message UpdateRetentionPolicyResponse {
  RetentionPolicy policy = 1;
  bool namespace_retention_enforced = 2;
}

message ListTelemetrySinksRequest {}
message ListTelemetrySinksResponse {
  // names is every sink this deployment declared, sorted
  // (telemetry.SinkTable.Names). "default" is always present, whether or not
  // ORK_TELEMETRY_SINKS names one explicitly, because it is what an unset
  // TelemetryPolicy.sink resolves to.
  repeated string names = 1;
}

message GetImagePolicyRequest {}
message GetImagePolicyResponse {
  // policy is the stored document, or the empty policy with updated_at
  // unset when none was ever written. signing_keys carries PEM; clients
  // render the fingerprint (task.SigningKeyFingerprint) and never the block.
  ImagePolicy policy = 1;
}
message UpdateImagePolicyRequest {
  // policy is the new floor, whole: require_digest, allowed_registries and
  // signing_keys. updated_at is ignored; the store stamps it. There is no
  // etag, on the same terms as UpdateRetentionPolicy: the audit trail
  // records every write, and an operator who read a stale policy sees their
  // own write in `admin image-policy get`.
  ImagePolicy policy = 1;
}
message UpdateImagePolicyResponse { ImagePolicy policy = 1; }
// ReleaseRole is what a release does with NEW runs. It never describes runs
// already executing: those finish on the release that started them.
enum ReleaseRole {
  RELEASE_ROLE_UNSPECIFIED = 0;
  // CURRENT takes every new run that is not sent to a ramping release.
  RELEASE_ROLE_CURRENT = 1;
  // RAMPING takes ramp_percent of new runs.
  RELEASE_ROLE_RAMPING = 2;
  // PREVIOUS took new runs once and takes none now. It may still be
  // finishing some; drain_state says whether it is.
  RELEASE_ROLE_PREVIOUS = 3;
  // CANDIDATE has registered — at least one of its processes polled with
  // ORK_BUILD_ID set — and has never taken new runs.
  RELEASE_ROLE_CANDIDATE = 4;
}

// ReleaseDrainState is the cluster's own verdict on a PREVIOUS release.
enum ReleaseDrainState {
  // UNSPECIFIED: not applicable — the release is current, ramping, or a
  // candidate, and the cluster keeps no drain state for it.
  RELEASE_DRAIN_STATE_UNSPECIFIED = 0;
  // DRAINING: runs that started on this release are still executing.
  RELEASE_DRAIN_STATE_DRAINING = 1;
  // DRAINED: none are. The cluster refreshes this on a delay of minutes;
  // drain_checked_at says when it last looked.
  RELEASE_DRAIN_STATE_DRAINED = 2;
}

// ReleaseBlockerKind names why a release may not take new runs right now.
enum ReleaseBlockerKind {
  RELEASE_BLOCKER_KIND_UNSPECIFIED = 0;
  // NO_ENGINE: no engine process of the release is running, so a run sent to
  // it would never start.
  RELEASE_BLOCKER_KIND_NO_ENGINE = 1;
  // POOL_NOT_SERVED: `pool` is in use and no uncordoned Orker of the release
  // serves it.
  RELEASE_BLOCKER_KIND_POOL_NOT_SERVED = 2;
  // PINS_NOT_HOSTED: `pool` has a pin host of another release and no
  // uncordoned Orker of this release in it hosts pins.
  RELEASE_BLOCKER_KIND_PINS_NOT_HOSTED = 3;
  // UNVERSIONED_RUNS: no release is current yet and runs started before any
  // was are still executing; making this release take new runs would move
  // them onto it mid-run.
  RELEASE_BLOCKER_KIND_UNVERSIONED_RUNS = 4;
  // UNVERIFIED: part of the evidence could not be read, so the release
  // cannot be shown to pass. Never treated as passing.
  RELEASE_BLOCKER_KIND_UNVERIFIED = 5;
}

message ReleaseBlocker {
  ReleaseBlockerKind kind = 1;
  // pool is set for POOL_NOT_SERVED and PINS_NOT_HOSTED, and empty otherwise.
  string pool = 2;
  // message is one complete sentence in OrkStack's words: what is wrong and
  // what to start. It never names a channel, a session, or the cluster's own
  // objects (AGENTS.md §7.1).
  string message = 3;
}

// Release is one build of OrkStack — `ork` and `orker` released together
// (AGENTS.md §7.2) — as the cluster routes it. No field names a Temporal
// worker deployment, a version's routing internals, or a task queue, on the
// rule that keeps "queue" out of Pool and "session" out of Pin (§7.1).
message Release {
  // build_id is the release's identity: the ORK_BUILD_ID its binaries run
  // with. It is the value Orker.build_id and TaskAttempt.build_id carry.
  string build_id = 1;
  ReleaseRole role = 2;
  // ramp_percent is the share of new runs a RAMPING release takes, 0–100, as
  // the cluster holds it (a value set outside OrkStack may be fractional).
  // 0 for every other role.
  float ramp_percent = 3;
  // role_since is when the release became CURRENT or started RAMPING; unset
  // for PREVIOUS and CANDIDATE.
  google.protobuf.Timestamp role_since = 4;
  // first_seen_at is when the cluster first saw a process of this release.
  google.protobuf.Timestamp first_seen_at = 5;
  // engine_replicas is how many engine processes of this release are live
  // now: distinct processes polling for runs within the freshness window.
  // Always measured — a cluster that cannot answer fails the whole read.
  int32 engine_replicas = 6;
  // orkers are the Orker inventory's rows whose build_id is this release,
  // exactly as ActivityService.ListOrkers returns them (pool, cordon, load,
  // open pins), in that RPC's order. An Orker that did not answer has no
  // build_id and is in ListReleasesResponse.unattributed_orkers instead.
  repeated Orker orkers = 7;
  // pools_served is every pool with at least one ANSWERED, UNCORDONED Orker
  // of this release, sorted. A cordoned Orker takes no new task and serves
  // nothing.
  repeated string pools_served = 8;
  // runs_in_flight is how many runs are executing on this release now,
  // counted by the cluster's run index. Meaningful only when
  // runs_unavailable_reason is empty; otherwise it is 0 and MUST be rendered
  // as unknown, never as zero.
  int32 runs_in_flight = 9;
  // runs_unavailable_reason says the run index could not be asked, in
  // OrkStack's words. The cluster's own text is logged, never forwarded.
  string runs_unavailable_reason = 10;
  // runs are up to ten of those runs, newest first, as shallow projections —
  // the fields ListRuns fills from the index (id, namespace, orkflow_name,
  // orkflow_version, status, created_at). Deployment-wide: runs of every
  // namespace, each carrying its own.
  repeated Run runs = 11;
  ReleaseDrainState drain_state = 12;
  // drain_checked_at is when the cluster last evaluated drain_state; unset
  // when it has not, or drain_state is UNSPECIFIED.
  google.protobuf.Timestamp drain_checked_at = 13;
  // drained is the one condition under which this release's processes may be
  // stopped: PREVIOUS with drain_state DRAINED (or a CANDIDATE with no runs),
  // no run counted in flight, no open pin on any of its Orkers, and an Orker
  // inventory in which every Orker answered. `orkctl release wait` exits 0 on
  // it and on nothing else.
  bool drained = 14;
  // blockers are every reason this release may not take new runs now, in a
  // stable order. Always empty for CURRENT. Empty for any other role means
  // RampRelease and PromoteRelease would pass their check at the moment of
  // this read.
  repeated ReleaseBlocker blockers = 15;
}

message ListReleasesRequest {
  // build_id keeps only that release. Its blockers are still judged against
  // the whole deployment. An id the cluster does not know is an EMPTY list,
  // never NOT_FOUND: `orkctl release wait` relies on it to tell "forgotten
  // after draining" from an error.
  string build_id = 1;
}

message ListReleasesResponse {
  // deployment_name is ORK_DEPLOYMENT_NAME: the name every release of this
  // OrkStack deployment shares (GetSystemInfoResponse.deployment_name).
  string deployment_name = 1;
  // versioned is false when no release of this deployment has ever
  // registered with the cluster: every process runs without ORK_BUILD_ID,
  // releases is empty, and ramp/promote are FAILED_PRECONDITION.
  bool versioned = 2;
  // releases: CURRENT, then RAMPING, then CANDIDATEs newest first, then
  // PREVIOUS newest first (by first_seen_at, then build_id). A stable order
  // is part of the contract: the Admin page renders it.
  repeated Release releases = 3;
  // unversioned_engine_replicas counts live engine processes started without
  // ORK_BUILD_ID. While no release is current, they are what starts new runs.
  int32 unversioned_engine_replicas = 4;
  // unattributed_orkers are inventory rows that belong to no release: Orkers
  // started without ORK_BUILD_ID, and Orkers that did not answer (they carry
  // unavailable_reason and no build_id).
  repeated Orker unattributed_orkers = 5;
  // orkers_unavailable_reason is set when the Orker inventory itself could
  // not be read. Every release's orkers and pools_served are then empty and
  // every non-current release carries an UNVERIFIED blocker.
  string orkers_unavailable_reason = 6;
  // revision identifies the routing this answer saw (current release,
  // ramping release, ramp percent). OPAQUE: echo it as expected_revision to
  // refuse a write if the routing changed since; never parse it.
  string revision = 7;
  // observed_at is the answering replica's clock at the read.
  google.protobuf.Timestamp observed_at = 8;
}

message RampReleaseRequest {
  string build_id = 1;
  // percent is 1–100 to ramp build_id, or 0 to stop the ramp of build_id,
  // which must then be the ramping release. Outside 0–100 is
  // INVALID_ARGUMENT.
  int32 percent = 2;
  // expected_revision, when set, refuses the write with FAILED_PRECONDITION
  // unless the routing is still what ListReleasesResponse.revision said.
  string expected_revision = 3;
}

message RampReleaseResponse {
  // changed is false when build_id was already ramping at exactly percent
  // (or percent was 0 and it was not ramping — that case is refused, see
  // RampRelease); nothing was written then.
  bool changed = 1;
  // previous_build_id and previous_percent are the ramping release and its
  // percent before this call; empty and 0 when none was ramping.
  string previous_build_id = 2;
  float previous_percent = 3;
  // routing_confirmed is true when the engine's own channel reported the new
  // routing before the reply. False means the change is RECORDED and the
  // cluster had not yet applied it to dispatch within 10 s.
  bool routing_confirmed = 4;
  // revision is the routing after the change.
  string revision = 5;
}

message PromoteReleaseRequest {
  string build_id = 1;
  // expected_revision: as on RampReleaseRequest.
  string expected_revision = 2;
}

message PromoteReleaseResponse {
  // changed is false when build_id was already current; nothing was written.
  bool changed = 1;
  // previous_build_id is the release that was current before; empty when no
  // release was (the deployment's first promotion).
  string previous_build_id = 2;
  bool routing_confirmed = 3;
  string revision = 4;
}
