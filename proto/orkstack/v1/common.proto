syntax = "proto3";

package orkstack.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// Status is the lifecycle state shared by runs and task runs.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_RUNNING = 2;
  STATUS_SUCCEEDED = 3;
  STATUS_FAILED = 4;
  STATUS_CANCELED = 5;
  STATUS_SKIPPED = 6;
  // AWAITING is a TASK status only, like SKIPPED: the task is waiting to be
  // resolved from outside the run. A run with an awaiting task is RUNNING.
  STATUS_AWAITING = 7;
  // SLEEPING is a TASK status only, like AWAITING: a sleeping task is
  // waiting out its fixed time on the run's own timer, and nothing outside
  // the run can end it early. A run with a sleeping task is RUNNING.
  STATUS_SLEEPING = 8;
}

// ArtifactRef is a pointer to a stored artifact in the object store.
// It never carries bytes inline; downstream tasks resolve it via the
// artifact storage provider using uri.
message ArtifactRef {
  string name = 1;                       // logical name within the producing task
  string uri = 2;                        // provider uri, e.g. s3://bucket/key or file://...
  string content_type = 3;               // MIME type
  int64 size_bytes = 4;
  string sha256 = 5;                     // integrity checksum, hex-encoded
  map<string, string> metadata = 6;
}

// Payload is the structured JSON-compatible data passed between tasks.
message Payload {
  google.protobuf.Struct data = 1;
}

// FailureCategory is the AGENTS.md §4 category of a terminal failure. Its
// value names are also the exact Temporal ApplicationError type strings, so a
// RetryPolicy's non_retryable_error_types can name them (§7.2).
enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_ACTIVITY_FAILED = 1;
  FAILURE_CATEGORY_INFRASTRUCTURE_ERROR = 2;
  FAILURE_CATEGORY_CONTRACT_VIOLATION = 3;
  FAILURE_CATEGORY_TIMED_OUT = 4;
  FAILURE_CATEGORY_CANCELLED = 5;
}

// Error captures a structured failure for a run or task run.
message Error {
  string code = 1;      // stable machine code, e.g. "VALUES_MISSING"
  string message = 2;   // human readable
  string details = 3;   // optional stack/context
  bool retryable = 4;
  // category is the AGENTS.md §4 failure category this error belongs to. It
  // is recorded in history, so it is part of the replay-visible contract and
  // not merely display data.
  FailureCategory category = 5;

  // task_code is set from identity (O39); unset until it lands (v0.4.0 proto batch).
  string task_code = 6;
}

// AsksFor is what a schedule's or a trigger's Orkflow asks for, as a
// consent's digest (docs/ORKFLOW_SCHEDULES.md, "Who a schedule runs as").
// In this release no Orkflow asks for an identity, so it is the empty table's.
message AsksFor {
  // digest is the consent digest of what the Orkflow asks for: "c1:" and 64
  // hexadecimal digits.
  string digest = 1;
}

// ConsentView is the consent a schedule or a trigger records with its
// binder: the digest of what its Orkflow asked for when it was bound.
message ConsentView {
  // digest is the consent digest recorded: "c1:" and 64 hexadecimal digits.
  string digest = 1;
  // at is when it was recorded.
  google.protobuf.Timestamp at = 2;
}
