syntax = "proto3";

package orkstack.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// Namespace is a tenant of one OrkStack deployment: a scope that owns orkflow
// names, runs and pool defaults. Two namespaces may both hold an orkflow
// called "deploy" and never see each other's documents.
//
// It is OrkStack's own coordinate. The deployment runtime partition is an
// operator setting outside this contract and appears in no proto field, DSL
// key, CLI flag or UI control.
//
// The registry lives in the artifact store at metadata/namespaces/{name}.json.
// "default" always resolves and is never created: a deployment that registered
// nothing still has one namespace, and every orkflow that names none is in it.
message Namespace {
  // name is a slug, unique in the deployment, and is the key of the document.
  string name = 1;
  string description = 2;
  map<string, string> labels = 3;
  // default_pool is where a task that names no pool runs. Empty means the
  // built-in pool "main".
  //
  // It is read on the submit path: a run's routing resolves a task's own
  // `pool:`, then this, then "main". The registry stores only a name the
  // engine can route to — the same slug rule the DSL and the engine's pool
  // mapping use — because a stored routing target nothing can honour is a
  // defect, not a placeholder.
  string default_pool = 4;
  // allowed_pools bounds every pool this namespace may dispatch onto. Empty
  // means no restriction. A non-empty list must contain default_pool, which
  // the registry refuses to store otherwise — an allow-list that excludes the
  // namespace's own default would refuse every task that names no pool. Each
  // entry is held to the same pool-name rule as default_pool.
  //
  // It is enforced at the API boundary, in both places a pool can be chosen:
  // when an orkflow is applied, with the file in hand, and again when a run is
  // submitted, which is the gate no client can bypass.
  repeated string allowed_pools = 5;
  // created_at and updated_at are written by the registry, never by a client:
  // created_at when the document is first written and preserved on every
  // later write, updated_at on each one.
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // etag is the registry's compare-and-swap token for this document: the
  // value a read handed back, which an update sends back to say which version
  // it edited. A write whose etag no longer matches the stored one is refused,
  // so two operators editing the same namespace at once cannot silently
  // clobber each other — the loser is told to re-read.
  //
  // An EMPTY etag is a condition too, not the absence of one: it says the
  // version this update edited had no stored bytes at all, and the write is
  // refused if some other writer has since created them. That is what the
  // default namespace needs — until somebody writes its document a read hands
  // back a synthesized one carrying no token — and it is why an update never
  // has an unconditional mode: an empty token read as "overwrite whatever is
  // there" turned the promise above off for exactly the one namespace every
  // deployment has.
  //
  // It is the store's token and opaque: nothing derives meaning from its
  // shape, and a client only ever round-trips it. It is never stored inside
  // the document — it names the document's stored bytes, so a copy inside
  // them could only ever be the token of the write before.
  string etag = 8;
}

// Pool is a set of Orkers, observed live.
//
// Nothing writes a Pool: it is derived on read from what the cluster reports
// about the Orkers polling for a pool's work, so any replica answers, including
// one that started nothing and holds no state of its own.
message Pool {
  // name is the pool a task's `pool:` names. "main" is built in and is where a
  // task runs when neither it nor its namespace names one.
  string name = 1;
  // live_orker_count is how many Orkers were serving this pool when the answer
  // was computed. Zero means a task sent here would wait for an Orker that is
  // not there, which is what a submit refuses.
  int32 live_orker_count = 2;
  // 3 held `plugins`, the per-pool plugin inventory. Under the OCI Activity
  // Contract an activity is an image and which images exist is engine
  // configuration (ActivityService.ListActivities), so a pool has no
  // inventory to report. Reserved, never reused.
  reserved 3;
  reserved "plugins";
  // is_default marks the pool a task of this namespace runs on when it names
  // none.
  bool is_default = 4;
  // last_seen is the most recent moment an Orker of this pool was observed
  // STILL POLLING.
  //
  // Temporal remembers a poller for minutes after its worker died, so the
  // probe drops a record older than the freshness window before counting or
  // timestamping anything (internal/engine/pool_probe.go). One consequence is
  // load-bearing and stated here rather than discovered: a pool whose Orkers
  // have all gone quiet reports NO last_seen at all, not the moment the last
  // of them was heard. This field answers "how fresh is the number beside
  // it", never "when did this pool die".
  google.protobuf.Timestamp last_seen = 5;
  // unavailable_reason says that this pool COULD NOT BE ASKED, and why.
  //
  // Empty is the normal case: live_orker_count is a measurement. Non-empty
  // means nothing was measured — the cluster did not answer for this pool —
  // and live_orker_count is 0 because there is no number to report, NOT
  // because nobody is serving it. The two need opposite reactions: an empty
  // pool is fixed by starting an Orker, an unreachable one by asking again,
  // and a renderer that showed them alike would tell an operator to scale a
  // pool that may be perfectly healthy.
  //
  // It exists so that ListPools can NARROW instead of refusing. One pool the
  // cluster could not answer for used to fail the whole call, hiding every
  // healthy pool beside it — and an admin read is opened precisely when
  // something is already wrong. Each pool carries its own verdict now.
  string unavailable_reason = 6;
}
