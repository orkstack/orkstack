syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/run.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// The messages in this file are internal: no RPC carries them, and none of
// them, nor any of their words (generation, carry, checkpoint, segment), is
// a user-facing surface (AGENTS.md §7 vocabulary). A run that continues as new
// into a fresh Temporal execution hands its successor a RunContinuation, and
// writes the immutable objects it names under the run's snapshot prefix.

// ContinuationPart is one gzip member of a checkpoint object: the unit a
// generation verifies and decodes at a time.
message ContinuationPart {
  // offset is the byte offset of this member in the stored object.
  int64 offset = 1;
  // size_bytes is the stored (gzip) bytes of this member.
  int64 size_bytes = 2;
  // raw_bytes is the decoded bytes of this member.
  int64 raw_bytes = 3;
  // sha256 is the lowercase hex SHA-256 of the stored member bytes.
  string sha256 = 4;
}

// ContinuationObject is one immutable object a run wrote when one of its
// generations continued as new. Internal: no RPC carries it.
message ContinuationObject {
  // uri is the snapshot-store URI
  // (…/metadata/snapshots/{ns}/{run}/continuations/…).
  string uri = 1;
  // sha256 is the lowercase hex SHA-256 of the whole stored object.
  string sha256 = 2;
  // size_bytes is the size of the whole stored object.
  int64 size_bytes = 3;
  // raw_bytes is the sum of the parts' raw_bytes (checkpoint), or the decoded
  // size (segment, snapshot).
  int64 raw_bytes = 4;
  // parts is set for a checkpoint only, contiguous from offset 0.
  repeated ContinuationPart parts = 5;
}

// EventSegmentRef names one closed generation's event segment.
message EventSegmentRef {
  int64 generation = 1;
  // execution_id is the cluster's id for that generation's execution: used
  // only to retire it. Never user-facing (AGENTS.md §7).
  string execution_id = 2;
  // first_sequence is the first sequence assignable in that generation.
  int64 first_sequence = 3;
  // last_sequence is the last sequence assigned in it (burned ones
  // included); first_sequence-1 when the generation assigned none.
  int64 last_sequence = 4;
  // event_count is the number of events actually published
  // (<= last_sequence-first_sequence+1).
  int64 event_count = 5;
  ContinuationObject object = 6;
}

// RunContinuation is RunWorkflow's fifth argument: what crosses a switch.
// Unset (nil) on generation 0. Bounded below 256 KiB (AGENTS.md §2.2).
message RunContinuation {
  // version is 1; a build refuses any other explicitly.
  int32 version = 1;
  // generation is the generation this carry STARTS (>= 1).
  int64 generation = 2;
  // event_sequence is the last sequence assigned before the switch.
  int64 event_sequence = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  // checkpoint is the run's state at the switch.
  ContinuationObject checkpoint = 6;
  // segments holds one entry per closed generation, oldest first;
  // len(segments) == generation.
  repeated EventSegmentRef segments = 7;
  // version_decisions is every workflow.GetVersion answer the run has so far.
  map<string, int32> version_decisions = 8;
  // snapshot is the full snapshot of the run's exact state that the switch
  // wrote: a gzipped Run under a content-addressed continuations/ key, never
  // a {seq}.pb key.
  ContinuationObject snapshot = 9;

  // resume is set from E85; unset until it lands (v0.4.0 proto batch).
  RunResumeCarry resume = 11;

  // pause is the run's own pause at the switch; its expiry is an absolute
  // instant, re-armed for what remains of it.
  RunPause pause = 12;

  // last_pause is the run's last own pause that ended.
  RunPause last_pause = 13;

  // paused_by_parent is the parent run's pause holding the run at the
  // switch; its backstop is an absolute instant.
  InheritedPause paused_by_parent = 14;

  // last_cascade_seq is the last parent cascade counter applied, so a stale
  // request is still refused after the switch.
  int64 last_cascade_seq = 15;

  // concurrency is the run's concurrency slots carried forward: only held
  // run-level slots cross, since a waiting run never carries on.
  RunConcurrencyCarry concurrency = 16;

  // deferred_pause_requests are the pause requests the run received but
  // could not record within its history limit, in the order they arrived;
  // the next generation applies them before any other. At most the plan's
  // max_deferred_requests.
  repeated RunPauseSignal deferred_pause_requests = 17;
}

// RunCheckpointPart is one gzip member of a checkpoint. Concatenated
// serializations of this message MERGE (repeated fields append, and only part
// 0 sets header), so the whole object gunzipped as one multistream and
// unmarshalled once yields every row: what readers do. A generation decodes it
// part by part.
message RunCheckpointPart {
  // header is set on part 0 only: the Run with task_runs cleared.
  Run header = 1;
  // task_runs is in definition order, with items cleared.
  repeated TaskRun task_runs = 2;
  // items holds the item rows (task_id and item set), in (definition order,
  // index) order.
  repeated TaskRun items = 3;

  // loss_events is set from E92; unset until it lands (v0.4.0 proto batch).
  RunLossEvents loss_events = 4;

  // resume_state is set on part 0 only, for a resumed run with units still to
  // run that read no memo.
  RunResumeState resume_state = 5;
}

// RunResumeState is what a resumed run carries of its resume beside its rows.
message RunResumeState {
  // fresh are the units a resume runs again that read no memo, of those still
  // to run, in task order.
  repeated ResumeFreshUnits fresh = 1;
}

// ResumeFreshUnits are one task's: the task itself, every item of a fan-out
// included, or some of its items.
message ResumeFreshUnits {
  // task is its index in the definition.
  int32 task = 1;
  bool all = 2;
  // items are ranges of its items, ascending and apart.
  repeated ResumeItemRange items = 3;
}

// ResumeItemRange is count items from first.
message ResumeItemRange {
  int32 first = 1;
  int32 count = 2;
}

// RunEventSegment is the body of one event segment, gzip-compressed.
message RunEventSegment {
  string run_id = 1;
  int64 generation = 2;
  int64 first_sequence = 3;
  int64 last_sequence = 4;
  // events is exactly the PublishEvent events of that generation, in
  // sequence order.
  repeated Event events = 5;
}

// RunSnapshotOverlay replaces, by key, the rows of the FULL snapshot at
// base_uri. base_uri is always a {seq}.pb full snapshot of the same run,
// never another overlay. base_sha256 is the lowercase hex SHA-256 of the
// base bytes this overlay was diffed against: a {seq}.pb key can be
// rewritten by a retried emit, so a reader verifies it.
//
// It is written as {seq}.ovl beside the {seq}.pb snapshots, for a
// non-terminal event of a run whose plan enables overlays and that declares
// more rows than its policy's floor. Materialized: the base's rows in base
// order, each replaced by the overlay row with the same key — task_id for a
// task row, (task_id, item) for an item row — and the header replacing the
// base's. The writer writes one only when that materialization equals the
// run it was asked to snapshot; otherwise it writes a full snapshot.
// Internal: no RPC carries it.
message RunSnapshotOverlay {
  string base_uri = 1;
  // header is the Run with task_runs cleared.
  Run header = 2;
  // task_runs holds the task rows that differ from the base's, items
  // cleared.
  repeated TaskRun task_runs = 3;
  // items holds the item rows (task_id and item set) that differ from the
  // base's.
  repeated TaskRun items = 4;
  string base_sha256 = 5;
}

// RunConcurrencyCarry is a run's concurrency slots as it carries on.
message RunConcurrencyCarry {
  // attempted is every gate the run asked for a slot.
  repeated string attempted = 1;
  // held is every run-level slot it holds.
  repeated HeldSlot held = 2;
  // ordinals is each slot's current ordinal, for those given back and
  // asked for again (n above 0).
  repeated SlotOrdinal ordinals = 3;
}

// HeldSlot is one run-level slot a run holds: its gate and the line's seq
// it was granted at.
message HeldSlot {
  string gate_id = 1;
  int64 seq = 2;
}

// SlotOrdinal is one slot's ordinal: how many times the run gave it back
// and asked for it again.
message SlotOrdinal {
  string gate_id = 1;
  int32 task_ix = 2;
  int64 n = 3;
}

// RunLossEvents is a run's lost-Orker events so far, carried forward with
// its saved state: the run's cap on how many lost Orkers re-run its tasks.
message RunLossEvents {
  // count is the loss events the run has had.
  int32 count = 1;
  // open are the events still inside their window, by Orker.
  repeated OpenLossEvent open = 2;
}

// OpenLossEvent is one Orker's loss event, still open.
message OpenLossEvent {
  string orker_id = 1;
  google.protobuf.Timestamp first_at = 2;
}

// RunResumeCarry is a resumed run's resume, carried across a continuation.
message RunResumeCarry {
  // seq_base is the resume's RUN_RESUMED sequence.
  uint64 seq_base = 1;
  // resumed_after is the sequence of the ending the resume set aside.
  int64 resumed_after = 2;
  // resume_count is how many resumes of the run got going.
  int32 resume_count = 3;
  // resume is the run's newest resume, as each of its snapshots lists it.
  RunResume resume = 4;
}

// ResumeBlock is one resume's plan as the reset run executes it (E85 §4.1,
// engine-internal): written into the resume's record before the reset and
// loaded at R (LoadResumePlan). It is the pin: nothing of it is re-read.
message ResumeBlock {
  reserved 3, 4;
  reserved "rerun", "dispositions";
  // seq_base is the sequence RUN_RESUMED takes; the rerun commits under it.
  uint64 seq_base = 1;
  // scope is the first seq_base of the resume's scope (§28.22 E85-16).
  uint64 scope = 2;
  ResumeAction action = 5;
  string from_task_id = 6;
  ResumeReadback readback = 7;
  // resumes_before is how many resumes of the run got going before this one.
  int32 resumes_before = 8;
  uint64 previous_seq_base = 9;
  repeated string reopened_awaits = 10;
  // units is the deterministic encoding of a ResumeUnits: every unit of the
  // run's current part, once. Bytes, so the plan's record and the reset run's
  // history hold it as base64, whatever JSON makes of a number.
  bytes units = 11;
}

// ResumeUnits is a resume plan's units, packed (engine.DecodeResumeUnits is
// its one reader). A unit is a task, or an item of a fan-out. Units are in
// this order: each task in definition order, its own unit first, then its
// items from 0.
message ResumeUnits {
  // fan_outs are the fan-outs the base had expanded, in definition order.
  repeated ResumeFanOutItems fan_outs = 1;
  // One entry of each of the next three per run of consecutive units treated
  // alike; the lengths add up to every unit.
  repeated int32 run_lengths = 2;
  repeated ResumeDisposition run_dispositions = 3;
  // run_epochs is 0 for no scope, else one more than an index into epochs.
  repeated int32 run_epochs = 4;
  // epochs are the scopes kept results lie under, ascending.
  repeated uint64 epochs = 5;
  // encoded_sizes is, for each unit read back, in unit order, its entry's
  // encoded size, as ResumeRun measured it.
  repeated int64 encoded_sizes = 6;
  // recorded is, for each SETTLE or SLEEP_UNTIL unit, in unit order, its record.
  repeated ResumeRecordedUnit recorded = 7;
  // run_fresh says, for each run, that its units read no memo (a task that
  // succeeded before, so a person asked for another result) and write theirs
  // from the result they make. Only units of cached tasks that run again are
  // fresh; a fan-out's own unit being so, so is each item. Empty when no unit
  // is.
  repeated bool run_fresh = 8;
}

// ResumeFanOutItems is how many items a fan-out's base had.
message ResumeFanOutItems {
  // task is the fan-out's index in the definition.
  int32 task = 1;
  int32 item_count = 2;
}

// ResumeRecordedUnit is what a SETTLE or SLEEP_UNTIL unit is kept from.
message ResumeRecordedUnit {
  reserved 1, 2;
  reserved "values_ref", "wake_at";
  // row is the unit's row as the base ended, cut to what the resumed run
  // cannot read back or derive (engine.cutRecordedRow): its times; a SETTLE
  // unit's values_ref, artifacts, and who answered it or the child run it
  // started with the artifacts it passed; a SLEEP_UNTIL unit's wake-up.
  TaskRun row = 3;
}

// ResumeReadback is the read-back's pinned bounds (E85 §4.1).
message ResumeReadback {
  google.protobuf.Duration deadline = 1;
  int64 budget = 2;
  int32 max_entries = 3;
  int32 concurrency = 4;
  google.protobuf.Duration get_timeout = 5;
  int32 get_tries = 6;
  google.protobuf.Duration call_timeout = 7;
  google.protobuf.Duration retry_initial = 8;
  double retry_coefficient = 9;
  int32 calls_per_task = 10;
}

// ResumePlanRecord is one resume plan's immutable record (E85 §11, §30.3,
// engine-internal), written create-only before the reset at
// metadata/snapshots/{namespace}/{run-id}/resume-plans/{scope:020}.{n:03}.json.
// The reset's reason names it by the SHA-256 of its stored bytes.
message ResumePlanRecord {
  int32 format = 1;
  string namespace = 2;
  string run_id = 3;
  uint64 scope = 4;
  int32 n = 5;
  // base_execution_run_id is the execution the reset resets.
  string base_execution_run_id = 6;
  // r_scheduled_event_id and r_started_event_id are R's workflow task in that base.
  int64 r_scheduled_event_id = 7;
  int64 r_started_event_id = 8;
  int64 base_terminal_sequence = 9;
  google.protobuf.Timestamp at = 10;
  google.protobuf.Timestamp expires_at = 11;
  ResumeBlock block = 12;
  string principal = 13;
  bool principal_verified = 14;
  string reason = 15;
  string superseded_reason = 16;
  uint64 previous_scope = 17;
  string request_id = 18;
  // plan_digest is the digest a preview shows and a confirm names the plan by:
  // what the resume does with each unit, with no time and no caller in it.
  string plan_digest = 19;
}
