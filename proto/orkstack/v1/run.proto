syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/orkflow.proto";
import "orkstack/v1/telemetry.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// TaskEach is a fan-out task's own state on the run snapshot. It is SET for
// every task whose definition declares `each:` — from the run's first
// snapshot, while the task is still PENDING — and UNSET for every other task,
// so a snapshot of a run with no fan-out is byte-identical to what it was
// before this message existed.
message TaskEach {
  // expanded is true once the array was counted and the items created. It
  // stays false while PENDING, when the task was SKIPPED, and when the array
  // could not be counted (the task then FAILED with an EACH_* code).
  bool expanded = 1;
  // count is the number of items, equal to len(TaskRun.items), once expanded.
  int32 count = 2;

  // lines is set once a fan-out over an artifact's lines has expanded: the
  // source and the line index the items read their spans from.
  EachLines lines = 3;
}

// TaskChild is a composed task's own state on the run snapshot. It is SET for
// every task whose definition declares `uses: orkflow:` — from the run's first
// snapshot, while the task is still PENDING — and UNSET for every other task,
// so a snapshot of a run with no composed task is byte-identical to what it
// was before this message existed.
message TaskChild {
  // The child Orkflow as the parent pinned it (Task.orkflow).
  string orkflow_name = 1;
  string orkflow_version = 2;
  string orkflow_definition_digest = 3;
  // run_id is the child run, set once its start is CONFIRMED and never before:
  // an id whose start was refused names no run. The child run's own
  // Run.origin is {PARENT_RUN, <this run's id>}.
  string run_id = 4;
  // orkflow_namespace is the namespace that owns the child Orkflow when it is
  // not the namespace the run executes in: a child composed from another
  // namespace through shared_with. Empty for a child of the run's own
  // namespace.
  string orkflow_namespace = 5;
}

// TaskRun is the execution record of a single Task within a Run.
message TaskRun {
  string task_id = 1;

  // 2 held the in-process plugin name, mirroring Task.plugin. Reserved for
  // the same reason and at the same time.
  reserved 2;
  reserved "plugin";

  Status status = 3;
  int32 attempt = 4;
  // output carries the inline values.json when one was inlined, decoded for
  // display only. values_ref is the authoritative reference.
  Payload output = 5;
  repeated ArtifactRef artifacts = 6;
  Error error = 7;                       // carries FailureCategory (§8)

  // started_at is when the Orker began the attempt that produced this task's
  // outcome, on the Orker's own clock: ExecuteTaskResult.started_at for a
  // succeeded task (the committing attempt's start for an adopted commit,
  // exactly as `attempt` is the committing attempt), and
  // ActivityFailureDetail.started_at for a failed one. It is the start of
  // the FINAL attempt, on the same rule attempt, error, exit_code and
  // orker_id already follow: the snapshot describes the attempt that decided
  // the task, and ListTaskAttempts describes the rest.
  //
  // Unset while the task is PENDING or RUNNING, and for a terminal task no
  // Orker reported on — a host the run lost contact with before it reported,
  // a Temporal-side timeout, a cancellation that reached the Orker as a plain
  // context cancellation, a lost pin. Unset is "not known", never zero.
  //
  // Before this field's meaning was corrected it held the dispatch instant;
  // scheduled_at (18) holds that now.
  //
  // For an awaited task, both are the instant the task started awaiting, on
  // the workflow's clock: it is never queued and no Orker reports on it.
  google.protobuf.Timestamp started_at = 8;
  // finished_at is the workflow's own clock at the moment it learned this
  // task's outcome.
  google.protobuf.Timestamp finished_at = 9;
  // pool names the set of Orkers this attempt was dispatched to, in the word
  // its author typed: the task's own `pool:`, or the pool this run's default
  // route resolves to when the task named none.
  //
  // Within a run, one pool name means one set of Orkers, so naming this pool
  // on a task reaches exactly the Orkers this attempt reached. That holds
  // under the per-deployment route override operators use to keep two stacks
  // apart: a route belonging to no pool reports as the built-in
  // "main", and a task that writes "main" follows the same override instead
  // of escaping it. The override is an operator concern this contract does
  // not expose, so this name is the routing request rather than a measurement
  // of the host that answered, and another deployment resolves it against its
  // own Orkers.
  //
  // Empty means the task never reached an Orker (skipped, or terminal before
  // dispatch).
  string pool = 10;

  // values_ref addresses the committed values.json for this attempt. Set
  // whenever the task succeeded, whether or not output was inlined.
  ArtifactRef values_ref = 11;
  // commit references the durable completion record (§5).
  CommitRef commit = 12;
  // exit_code is the container's exit status as reported by the Orker.
  int32 exit_code = 13;
  // system_artifacts are stdout.log and stderr.log for this attempt.
  repeated ArtifactRef system_artifacts = 14;

  // retry_state says why Temporal stopped retrying this task, read off
  // temporal.ActivityError.RetryState() when the task ended in an error. It is
  // DERIVED data on the snapshot — the engine records what Temporal already
  // decided, it does not decide anything with it.
  //
  // Unset for SUCCEEDED and SKIPPED tasks, for a failure that never reached an
  // activity, and for snapshots written before this field existed.
  RetryState retry_state = 15;

  // pin is the Pin this task belongs to, as the author named it, or empty.
  // Two TaskRuns of one run with the same pin ran on the same Orker.
  string pin = 16;

  // orker_id is the Orker that produced this task's final outcome, read off
  // ExecuteTaskResult.orker_id or ActivityFailureDetail.orker_id. Set for
  // every task that reached an Orker, pinned or not; empty when the task
  // never reached one (skipped, canceled before dispatch) or when the Orker
  // lost contact before it reported (heartbeat timeout).
  //
  // One exception to "reported by this task's own attempt": a task recorded
  // PIN_HOST_LOST or PIN_TIMEOUT reports nothing at all — the run lost contact
  // with its host, or the pin closed at its lifetime — so the engine BACKFILLS
  // this from another member of the same pin. A pin never moves: every member
  // executes on the same Orker process for the pin's whole life, so a
  // sibling's orker_id is this task's by construction. It stays
  // empty only when no member of that pin ever reported one, in which case the
  // failure's error.details carries the pin host's raw OS host name as an
  // explicitly labelled best-effort lead, which is NOT an orker_id.
  // Empty on a fan-out task's own row, whose items each carry their own.
  string orker_id = 17;

  // scheduled_at is the instant the engine scheduled this task's activity —
  // workflow.Now at schedule(), which is also the timestamp on the
  // EVENT_TYPE_TASK_SCHEDULED event. It is a PROJECTION of that event onto
  // the snapshot, not a new measurement, and it is the workflow's own
  // deterministic clock, never an Orker's.
  //
  // Unset when the task never reached scheduling (skipped, or canceled
  // before dispatch) and on a snapshot written before this field existed.
  // The two are told apart by started_at: a pre-contract snapshot has
  // started_at set (it held the dispatch instant then) and scheduled_at
  // unset; a never-scheduled task has neither.
  //
  // For an awaited task, both are the instant the task started awaiting, on
  // the workflow's clock: it is never queued and no Orker reports on it.
  google.protobuf.Timestamp scheduled_at = 18;

  // await is this task's await state, set for a task whose definition
  // declares `await:` and unset otherwise (see TaskAwait).
  TaskAwait await = 19;

  // each is set for a fan-out task's own row (TaskEach).
  TaskEach each = 20;
  // items are a fan-out's items, one per element of the expanded array, in
  // index order; empty until expansion and for every task that is not a
  // fan-out. Each element is a TaskRun whose task_id is this task's id and
  // whose `item` is set; the fields below mean for an item what they mean for
  // a task (its own attempt, commit, values_ref, artifacts, logs, orker, error,
  // times). An item never carries `output` (its values are read through
  // values_ref), `each`, `items`, `pin` or `await`.
  //
  // This row itself is the AGGREGATE: its status is the fan-out's, its error
  // is the error of the item that failed it (message prefixed "item N of M
  // failed:"), its scheduled_at is the expansion instant, its started_at the
  // earliest item's, and its attempt, exit_code, orker_id, commit, values_ref,
  // artifacts and system_artifacts are unset — those belong to items.
  //
  // ListRuns never carries items (only GetRun does), and neither does a
  // webhook body or the workflow's own result.
  repeated TaskRun items = 21;
  // item is set on an element of `items`: its 0-based index. Unset on every
  // row of Run.task_runs.
  optional int32 item = 22;

  // child is set for a composed task (TaskChild). Such a task reaches no
  // Orker: pool, pin, orker_id, attempt, exit_code, commit, artifacts and
  // system_artifacts stay unset, and values_ref addresses the child's
  // declared outputs as stored for THIS run.
  TaskChild child = 23;

  // cache is the memo decision of the attempt that produced this task's
  // outcome (CacheResult, key_components never set here). Set only for a
  // cached task that SUCCEEDED on an Orker that implements caching; unset for
  // every other row — so a snapshot of a run with no cached task is
  // byte-identical — and for a cached task that failed, whose attempts carry
  // what each memo step decided. On a fan-out it is set on the items, never
  // on the fan-out's own row.
  CacheResult cache = 24;

  // join is the task's join policy, set from the run's first snapshot for
  // every task whose definition declares one other than all_succeeded, and
  // UNSET otherwise — so a snapshot of a run with no join is byte-identical
  // to what it was before this field existed. Its presence is how a client
  // tells a failure handler from an ordinary task without reading the
  // definition (the precedent of TaskRun.await, .each and .child).
  JoinPolicy join = 25;

  // timing is where this task's time went, derived from scheduled_at,
  // started_at and finished_at above (TaskTiming). It is DERIVED ON READ:
  // GetRun sets it on every row, a fan-out's items included, and nothing
  // stores it — the engine never writes it, and a copy read back from
  // anywhere else is not one GetRun answered.
  TaskTiming timing = 26;

  // sleep is this task's sleep state, set for a task whose definition
  // declares `sleep:` and unset otherwise (see TaskSleep).
  TaskSleep sleep = 27;

  // interruptions is set from E92; unset until it lands (v0.4.0 proto batch).
  TaskInterruptions interruptions = 28;

  // queued is set from E88; unset until it lands (v0.4.0 proto batch).
  ConcurrencyQueued queued = 29;

  // pending_reason says why a task, or a fan-out item, of a live run is not
  // running yet. GetRun derives it on read and nothing stores it. It is one
  // of: the instant the task waits for to run again after an interruption;
  // that no Orker of its pool (on a versioned fleet, of its run's release)
  // takes work, for a task the run dispatched that no Orker has started; or
  // that its pin waits for a pin host. It is empty when none applies, and when
  // the reason cannot be known: the Orker inventory or the run's release could
  // not be read, or a live Orker did not answer.
  string pending_reason = 30;

  // result_epoch is set from E85; unset until it lands (v0.4.0 proto batch).
  int64 result_epoch = 31;

  // resume_disposition is set from E85; unset until it lands (v0.4.0 proto batch).
  ResumeDisposition resume_disposition = 32;


  // wake_at is set from E85; unset until it lands (v0.4.0 proto batch).
  google.protobuf.Timestamp wake_at = 34;

  // adopted is set from E85; unset until it lands (v0.4.0 proto batch).
  bool adopted = 35;

  // reading_back is set from E85; unset until it lands (v0.4.0 proto batch).
  bool reading_back = 36;

  // record is set from identity (O39); unset until it lands (v0.4.0 proto batch).
  RecordRef record = 37;

  // dispatch_held is true while the run holds this ready task back from
  // dispatch, or a fan-out's next items: its in-flight cap is reached, or it
  // is quiescing before carrying on into a fresh history. A pause holds
  // dispatch too, and is said by the run's own pause state, not here. The
  // row stays PENDING (a fan-out RUNNING) with nothing emitted; the flag is
  // cleared when the row dispatches, and on any row that starts or ends.
  // It is in the run's saved state and snapshot only, and a run written
  // before it reads false.
  bool dispatch_held = 38;
}

// TimingReason is why one timing quantity cannot be known. Each names a cause
// an operator can act on, never a generic "unknown" (docs/UI_CLI_PARITY.md
// "Task timing"). The comment on each is the words both clients print.
enum TimingReason {
  TIMING_REASON_UNSPECIFIED = 0;
  // "no orker reported a start": the task ended and no Orker reported the
  // start of the attempt that decided it (TaskRun.started_at unset).
  TIMING_REASON_NO_ORKER_START = 1;
  // "clock skew": the later of two instants reads before the earlier, so the
  // two clocks that recorded them disagree.
  TIMING_REASON_CLOCK_SKEW = 2;
  // "recorded before scheduled time existed": a snapshot with started_at and
  // no scheduled_at, whose started_at holds the dispatch instant.
  TIMING_REASON_PRE_CONTRACT = 3;
  // "attempt records reclaimed": the snapshot proves an Orker reported on the
  // task, and no record it filed is left.
  TIMING_REASON_RECLAIMED = 4;
  // "no attempt record": this attempt has no record (UNREPORTED, or a phase
  // with an end missing).
  TIMING_REASON_NO_RECORD = 5;
  // "record predates phase spans": the record was written before
  // TaskAttempt.phases existed.
  TIMING_REASON_NO_PHASES = 6;
  // "no task attempt store": the engine has no attempt store at all. No
  // response carries it — ListTaskAttempts answers FailedPrecondition then —
  // and a client prints it for the quantities only records could give.
  TIMING_REASON_NO_ATTEMPT_STORE = 7;
}

// TimingQuantity is one derived duration in one of three states, never
// collapsed into each other:
//
//   - the message UNSET: it does not apply (the task was never scheduled, or
//     has not finished);
//   - set with no duration: it happened and cannot be known, and reason says
//     why — UNSPECIFIED only on a sum whose every term is unavailable
//     (RunTiming.wait_sum);
//   - set with duration: two instants some process recorded, the later minus
//     the earlier.
//
// A zero duration is only ever a value somebody measured.
message TimingQuantity {
  google.protobuf.Duration duration = 1;
  TimingReason reason = 2;
}

// TaskTiming is the task-timing derivation over one TaskRun
// (docs/UI_CLI_PARITY.md "Task timing"), with S = scheduled_at, B = started_at
// and F = finished_at:
//
//   wait = B − S      run = F − B      total = F − S
//
// A fan-out's own row reads S as its expansion and B as its earliest item's
// start; a composed task's reads S as its child run's request, B as its
// confirmed start and F as its end, so wait is the child's start latency and
// applies only once a child started; an awaited task's run and total are the
// time it awaited, and wait does not apply.
message TaskTiming {
  // scheduled is false for a task that never reached schedule() (an awaited
  // task: never started awaiting); every quantity is then unset.
  bool scheduled = 1;
  // pre_contract marks a snapshot written before scheduled_at existed:
  // started_at holds the dispatch instant, wait and run are unavailable, and
  // total is dispatch to finish.
  bool pre_contract = 2;
  // wait, run and total are set once the task is terminal.
  TimingQuantity wait = 3;
  TimingQuantity run = 4;
  TimingQuantity total = 5;
  // since_scheduled is set while the task is RUNNING in a run that has not
  // ended: RunTiming.computed_at − scheduled_at. A row a terminated run left
  // RUNNING has none.
  TimingQuantity since_scheduled = 6;
}

// RunTiming is the run's half of the derivation. Like TaskRun.timing it is
// derived on read by GetRun and never stored.
message RunTiming {
  // elapsed is Run.finished_at − Run.started_at, set once the run finished.
  TimingQuantity elapsed = 1;
  // wait_sum is every task's wait summed, over the wait_sum_tasks tasks whose
  // wait is known; wait_unavailable_tasks counts the tasks whose wait applies
  // and cannot be known. Unset when no task's wait applies; set with no
  // duration when every one is unavailable. A fan-out's items are not
  // counted: its own row is.
  TimingQuantity wait_sum = 2;
  int32 wait_sum_tasks = 3;
  int32 wait_unavailable_tasks = 4;
  // computed_at is the server's clock when it derived this, the instant every
  // since_scheduled is measured against. Set only while the run has not
  // ended and a task (or item) is RUNNING, so a finished run answers the same
  // bytes every time.
  google.protobuf.Timestamp computed_at = 5;
}

// AttemptTiming is the derivation over one TaskAttempt, set on every row
// ListTaskAttempts answers and never stored.
message AttemptTiming {
  // in_progress marks the newest attempt of a task that has not finished: it
  // has no record yet because a record is written when an attempt ENDS, and
  // calling it unreported would say its Orker crashed. phases_reason is then
  // unset.
  bool in_progress = 1;
  // phases_reason is set when this attempt's phases cannot be listed:
  // NO_RECORD (UNREPORTED), RECLAIMED (UNREPORTED, and the task's records
  // were reclaimed), NO_PHASES (a record with none). Each PhaseSpan
  // otherwise carries its own duration.
  TimingReason phases_reason = 2;
}

// AwaitResolvedVia names the door an await's resolution came through.
enum AwaitResolvedVia {
  AWAIT_RESOLVED_VIA_UNSPECIFIED = 0;
  // API: RunService.ResolveAwait — orkctl, the UI, or another Connect client.
  AWAIT_RESOLVED_VIA_API = 1;
  // CALLBACK: the plain-HTTP callback door, authenticated by the await's
  // callback token.
  AWAIT_RESOLVED_VIA_CALLBACK = 2;
}

// ResolutionDetail is who resolved an await, how and why, stored apart from
// its RecordedValues and named there by the SHA-256 of its bytes. Only
// engines read it. A callback names no principal.
message ResolutionDetail {
  string namespace = 1;
  string run_id = 2;
  string task_id = 3;
  uint64 resume_scope = 4;
  AwaitResolvedVia via = 5;
  string principal = 6;
  bool principal_verified = 7;
  string auth_method = 8;
  string principal_issuer = 9;
  // reason is at most 1024 bytes.
  string reason = 10;
  // schema_version is 1; one this build does not know is unsupported.
  uint32 schema_version = 11;
}

// TaskAwait is an awaited task's own state on the run snapshot. It is SET for
// every task whose definition declares `await:` — from the run's first
// snapshot, while the task is still PENDING — and UNSET for every other
// task, so a snapshot of a run with no await is byte-identical to what it was
// before this message existed. Its presence is how a client tells an awaited
// task from a container task without reading the definition.
message TaskAwait {
  // callback mirrors AwaitSpec.callback: whether a callback token was minted.
  bool callback = 1;
  // deadline is when the await times out, on the workflow's clock. Unset
  // until the task starts awaiting.
  google.protobuf.Timestamp deadline = 2;
  // resolved_via and resolved_by are set when a resolution was APPLIED —
  // completed or rejected — and never for a timeout or a cancellation.
  AwaitResolvedVia resolved_via = 3;
  // resolved_by is the Ork-Principal assertion on the resolving request,
  // bounded to 256 bytes: recorded as asserted and NEVER authenticated, the
  // word control-plane-audit-trail and run-origin use. Empty when none was
  // sent.
  string resolved_by = 4;

  // resolved_by_verified is set from identity (E61); unset until it lands (v0.4.0 proto batch).
  bool resolved_by_verified = 5;
}

// TaskSleep is a sleeping task's own state on the run snapshot. It is SET for
// every task whose definition declares `sleep:` — from the run's first
// snapshot, while the task is still PENDING — and UNSET for every other task,
// so a snapshot of a run with no sleep is byte-identical to what it was
// before this message existed. Its presence is how a client tells a sleeping
// task from a container task without reading the definition.
message TaskSleep {
  // seconds mirrors SleepSpec.seconds: how long the task sleeps.
  int32 seconds = 1;
  // wake_at is when the task wakes and succeeds, on the workflow's clock.
  // Unset until the task starts sleeping.
  google.protobuf.Timestamp wake_at = 2;
}

// AwaitSignal is ENGINE-INTERNAL: the argument of the Temporal Signal that
// resolves an awaited task. Only internal/api sends it and only RunWorkflow
// reads it; no client surface renders it. It carries references and at most
// 4 KiB of inline bytes — never a values body above that (AGENTS.md §2.2).
message AwaitSignal {
  string task_id = 1;
  // reject true is a rejection with reason; false is a completion with values.
  bool reject = 2;
  string reason = 3;
  // values is the stored values.json of a completion, written by the door
  // BEFORE the signal was sent. Unset for a rejection.
  ArtifactRef values = 4;
  // values_json is values' exact bytes when they are at most 4096 bytes, as
  // ExecuteTaskResult.values_json is (activity.proto: the same bound, the same
  // reason, and bytes rather than a Struct for the same reason). Empty above it.
  bytes values_json = 5;
  AwaitResolvedVia via = 6;
  string principal = 7;
}

// RunPauseSignal is ENGINE-INTERNAL: one pause or unpause request delivered
// to a running run, from the API (inherited false) or from the run's parent
// run (inherited true). Only internal/api and RunWorkflow use it; no client
// surface renders it.
message RunPauseSignal {
  // format is 1.
  int32 format = 1;
  // pause true pauses; false unpauses.
  bool pause = 2;
  // principal is the Ork-Principal the gateway asserted (API requests).
  string principal = 3;
  string reason = 4;
  // timeout_seconds: an own pause's length; 0 is the plan's default.
  int64 timeout_seconds = 5;
  // request_id: an API request's id, its audit record's and its event's.
  string request_id = 6;
  // inherited: sent by the parent run's cascade.
  bool inherited = 7;
  // parent_run_id must equal the run's origin parent.
  string parent_run_id = 8;
  reserved 9;
  reserved "parent_expires_at";
  // cascade_seq is the parent's monotonic cascade counter.
  int64 cascade_seq = 10;
  // origin_expires_at is the expiry of the own pause that began the
  // cascade, passed down unchanged; depth is 1 for a direct child, plus 1
  // per level. An inherited pause's backstop is derived from both.
  google.protobuf.Timestamp origin_expires_at = 11;
  int64 depth = 12;
  // principal_verified: principal is who OrkStack authenticated (auth.mode
  // observe or enforce), not a gateway's assertion.
  bool principal_verified = 13;
}

// AttemptOutcome is how one Temporal attempt of a task ended.
enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  // SUCCEEDED: the attempt returned an ExecuteTaskResult, fresh or adopted.
  ATTEMPT_OUTCOME_SUCCEEDED = 1;
  // FAILED: the attempt returned an ApplicationError, or its Orker was
  // stopped while it ran and reported nothing to Temporal (ORKER_STOPPED);
  // error is set.
  ATTEMPT_OUTCOME_FAILED = 2;
  // CANCELED: the attempt's context was cancelled (§6.3).
  ATTEMPT_OUTCOME_CANCELED = 3;
  // UNREPORTED is never written by an Orker. A reader synthesizes it for an
  // attempt number that has no record, which means the Orker running it died
  // or lost its heartbeat before it could write one.
  ATTEMPT_OUTCOME_UNREPORTED = 4;
}

// PhaseSpan is one §7.1 phase of one attempt, on the Orker's clock. Spans
// are recorded by the dispatcher's own Phase() sequence, so a list of them is
// contiguous: each span's finished_at is the next span's started_at, the
// first begins at the attempt's first Phase call, and the last ends at
// TaskAttempt.finished_at. The names are the dispatcher's own — "start",
// "commit-check", "workspace", "stage-inputs", "image", "render", "create",
// "run", "exit", "validate", "commit", and, entered from the wait path,
// "timeout" and "cancel"; "image-policy" is entered only when the task
// carries an image policy (ExecuteTaskInput.image_policy), between
// "commit-check" and "workspace"; "memo" and "stage-artifacts" are entered
// only by an attempt of a cached task, after "stage-inputs"; "identity" is
// entered only by an attempt of a task that declares an identity, between
// "image" and "render" — and are not an enum, for the reason
// TaskAttempt.phase is a string: a reader of an older build must be able to
// read a phase it has never heard of.
message PhaseSpan {
  string phase = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  // duration is finished_at − started_at, derived on read by
  // ListTaskAttempts; never written by an Orker. Unavailable with NO_RECORD
  // when an end is missing, CLOCK_SKEW when the ends are inverted.
  TimingQuantity duration = 4;
}

// ReservedResources is what an Orker granted one attempt: the cpu and memory
// limits its container was (or, for an attempt that ended before a
// container existed, would have been) created with, AFTER the Orker's
// defaults filled a missing request and its caps admitted it
// (ORK_ORKER_DEFAULT_CPU/_MEMORY, ORK_ORKER_MAX_CPU/_MEMORY). They are the
// same values the attempt's task.json reports as resources, as numbers.
//
// A reservation is a limit, not a measurement: nothing here says how much
// of it the workload used.
message ReservedResources {
  // cpu is the cpu limit in cores: "2" is 2, "500m" is 0.5.
  double cpu = 1;
  // memory_bytes is the memory limit in bytes: "4Gi" is 4294967296.
  int64 memory_bytes = 2;

  // gpu is the gpu units the Orker granted the attempt; 0 for none.
  int64 gpu = 3;
}

// TaskAttempt is the immutable record of ONE attempt of one task,
// written by the Orker that ran it at the end of the attempt (§7.1). It is the
// failure-side sibling of ActivityCommit: a commit says what the winning
// attempt produced, an attempt record says what EVERY attempt did, including
// the ones that lost.
//
// Temporal owns retries, so the workflow only ever sees a task's final
// outcome — an intermediate attempt's error reaches nothing that outlives the
// Orker process. This record is what makes it durable, and it is written
// best-effort: a record that cannot be stored is logged, never allowed to
// change what the attempt itself reported.
message TaskAttempt {
  // schema_version is 1. A reader that does not know the value ignores the
  // record rather than guessing, exactly as ActivityCommit's does.
  int32 schema_version = 1;

  string run_id = 2;
  string task_id = 3;
  // attempt is the attempt's ordinal, 1-based, which the Orker claimed before
  // it started anything (docs/STORAGE.md, "Attempt ordinals"). It may differ
  // from Temporal's attempt count: an attempt stopped before its claim has no
  // record.
  int32 attempt = 4;
  AttemptOutcome outcome = 5;
  // error is set only for FAILED, and carries the same shape TaskRun.error
  // does: the §8.2 reason as code, the category, retryability, the Orker's
  // message, and its scan notes as details.
  Error error = 6;
  // exit_code is the container's exit status, 0 when the container never ran.
  int32 exit_code = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  // orker_id is the Orker that executed this attempt. "Which Orker failed" is
  // the retry question, so the record answers it without a log search.
  string orker_id = 10;
  // pool is the routing request this attempt was dispatched with, as
  // TaskRun.pool spells it.
  string pool = 11;
  // phase is the §7.1 phase the attempt ended in — "image", "run",
  // "commit", … — the same name as the last element of phases below.
  string phase = 12;
  // image is the ImageRef as executed, with platform_digest and delivery set.
  ImageRef image = 13;
  // system_artifacts are the stdout.log/stderr.log references, when this
  // attempt got as far as uploading them.
  repeated ArtifactRef system_artifacts = 14;
  // commit_adopted is true when this attempt found an existing commit and
  // returned it without running the container (§5.4).
  bool commit_adopted = 15;
  // build_id is ORK_BUILD_ID of the Orker that ran the attempt.
  string build_id = 16;

  // phases lists every §7.1 phase this attempt passed through, in order,
  // contiguous, the last ending at finished_at, and its last element's phase
  // equal to `phase` above. Empty on a record written before this field
  // existed and on a synthesized UNREPORTED row. A reader renders an empty
  // list as unavailable, never as "no phases happened".
  //
  // schema_version stays 1: the field is additive and UnmarshalAttempt
  // discards unknown fields, so a record with phases reads on a build without
  // them and a record without phases reads on this one as an empty list.
  repeated PhaseSpan phases = 17;

  // resources is what this Orker reserved for the attempt. Set on every
  // record whose request the Orker's policy admitted — including an attempt
  // that adopted a commit or failed before its container started, because
  // the Orker's slot was committed to it either way. Unset when the request
  // was refused (RESOURCE_REQUEST_REFUSED), on a record written before this field
  // existed, and on a synthesized UNREPORTED row. A reader never treats
  // unset as zero: usage counts such an attempt's held time and reports it
  // as carrying no reservation. schema_version stays 1: the field is
  // additive and UnmarshalAttempt discards unknown fields.
  ReservedResources resources = 18;
  // item is set when this attempt ran one item of a fan-out task: that item's
  // 0-based index. The record then lives under the item's own key
  // (metadata/attempts/{run}/{task}/{item}/{attempt}.json). schema_version
  // stays 1: the field is additive and UnmarshalAttempt discards unknown
  // fields.
  optional int32 item = 19;

  // cache is this attempt's memo decision, key_components included. Set
  // only for an attempt of a cached task that reached the memo step; a HIT
  // records outcome SUCCEEDED, phase "memo", exit_code 0, no
  // system_artifacts (it uploaded none) and image equal to the input's
  // pinned ImageRef with no platform (it pulled nothing).
  CacheResult cache = 20;

  // timing is derived on read by ListTaskAttempts (AttemptTiming); an Orker
  // never writes it.
  AttemptTiming timing = 21;

  // profiles are the profiles the attempt ran under.
  repeated EffectiveProfile profiles = 22;

  // measured is what the attempt's container used, as its cgroup reported
  // it. Unset on a record an Orker older than v0.4.0 wrote.
  MeasuredUsage measured = 23;

  // identities is set from identity (E62); unset until it lands (v0.4.0 proto batch).
  repeated AttemptIdentity identities = 24;

  // credentials is set from identity (E81); unset until it lands (v0.4.0 proto batch).
  repeated AttemptCredential credentials = 25;

  // masked_occurrences is how many runs of bytes the attempt's masker
  // replaced with `***` in its two streams: a count, never which secret or
  // where. 0 when nothing was masked.
  int64 masked_occurrences = 26;
}

// RetryState is why Temporal stopped retrying a task. It mirrors
// temporal.api.enums.v1.RetryState with its own numbering, because a value of
// another proto package's enum may not be carried by number: the mapping is
// explicit, in internal/engine/workflow.go.
//
// temporal's RETRY_STATE_IN_PROGRESS has no member here on purpose. It names a
// retry that has not finished, and this field is only ever set from the error
// of a task that already reached a terminal outcome; it maps to UNSPECIFIED.
enum RetryState {
  RETRY_STATE_UNSPECIFIED = 0;
  RETRY_STATE_NON_RETRYABLE_FAILURE = 1;
  RETRY_STATE_TIMEOUT = 2;
  RETRY_STATE_MAXIMUM_ATTEMPTS_REACHED = 3;
  RETRY_STATE_RETRY_POLICY_NOT_SET = 4;
  RETRY_STATE_CANCEL_REQUESTED = 5;
  RETRY_STATE_INTERNAL_SERVER_ERROR = 6;
}

// Run is one execution of an Orkflow.
message Run {
  string id = 1;                         // ork run id, ork- and a UUIDv7 in lowercase base32 (ork-{timestamp}-{sequence} on an older run); opaque, nothing parses it
  string orkflow_name = 2;
  string orkflow_version = 3;
  Status status = 4;
  Payload input = 5;
  // output is the Orkflow's declared outputs, rendered at success, when it
  // declares `outputs:`; otherwise the inline values of the tasks no other
  // task needs, keyed by task id.
  Payload output = 6;
  // error is set when the run's outcome is decided FAILED or CANCELED. While
  // a failing run's failure handlers still run, it is already set and status
  // is RUNNING (docs/DSL.md "Joins and failure handlers"); the terminal
  // snapshot carries the same error with status FAILED.
  Error error = 7;
  repeated TaskRun task_runs = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // namespace is the namespace this run executed in, whose rules it
  // followed. It is also the namespace of the orkflow it ran unless
  // orkflow_namespace says otherwise. Empty means the built-in "default"
  // namespace. It is a coordinate of the run, not a
  // lookup: the archive indexes runs under it, so listing one namespace's runs
  // is a single prefix scan.
  string namespace = 12;

  // orkflow_definition_digest is the canonical digest of the definition this
  // run pinned (§4.4). A run that started before a pointer moved is still
  // explainable by the exact bytes it ran.
  string orkflow_definition_digest = 13;

  // telemetry is the selection this run was pinned with (see
  // ExecuteTaskInput.telemetry). Unset when none was configured.
  TelemetrySelection telemetry = 14;

  // origin is what started this run (RunOrigin). Unset only on a run
  // recorded before origins existed; every run started since carries at
  // least a kind. It is present on every snapshot the run writes, on the
  // archived run, and therefore in every webhook payload's embedded run.
  RunOrigin origin = 15;

  // canceled_by is who asked for the CancelRun request that canceled this
  // run. With auth.mode observe or enforce it is the principal OrkStack
  // authenticated, and canceled_by_verified is set. With asserted it is what
  // the deployment's gateway asserted in the Ork-Principal request header —
  // recorded verbatim, bounded to 256 bytes by truncation with invalid UTF-8
  // replaced, as RunOrigin.principal is, and never authenticated. Every
  // rendering says which (canceled_by_verified).
  //
  // It is set only on a run whose status is CANCELED with error code
  // RUN_CANCELED, when a CancelRun carrying the header was accepted before
  // the run recorded its own end. That is the request that canceled it, or —
  // if the run was already ending canceled for another cause, such as a
  // composed task's child run canceled from outside — the request that
  // arrived while it ended, which is named too. It is empty for every other
  // run: a CancelRun with no header; a run canceled with its parent run, or
  // by any other cause; a run that succeeded, failed or was terminated
  // (RUN_TERMINATED); a run canceled before this field existed. A client
  // then shows nothing rather than a blank that could be mistaken for a
  // name.
  //
  // It is on GetRun, on the archived run, on ListRuns rows answered from the
  // archive and in the embedded run of a RUN_CANCELED webhook delivery.
  string canceled_by = 16;

  // orkflow_namespace is set only on a child run of an Orkflow another
  // namespace shared through composition: the namespace that owns the
  // definition it ran. Empty means the orkflow is namespace's own. A run whose
  // orkflow belongs to another namespace is always a child run: nothing else
  // starts one.
  string orkflow_namespace = 17;

  // timing is the run's half of the task-timing derivation (RunTiming), set
  // by GetRun and never stored; each TaskRun carries its own half.
  RunTiming timing = 18;

  // input_artifacts is set from E87; unset until it lands (v0.4.0 proto batch).
  repeated NamedArtifact input_artifacts = 20;

  // output_artifacts is set from E87; unset until it lands (v0.4.0 proto batch).
  repeated NamedArtifact output_artifacts = 21;

  // trace_id is set from E87; unset until it lands (v0.4.0 proto batch).
  string trace_id = 22;

  // run_context is set from E86; unset until it lands (v0.4.0 proto batch).
  RunContextState run_context = 23;

  // canceled_by_verified says canceled_by is a principal OrkStack
  // authenticated (auth.mode observe or enforce). Unset, canceled_by is what
  // the deployment's gateway asserted in Ork-Principal, unauthenticated.
  bool canceled_by_verified = 19;

  // queued is set from E88; unset until it lands (v0.4.0 proto batch).
  ConcurrencyQueued queued = 24;

  // superseded_by is set from E88; unset until it lands (v0.4.0 proto batch).
  string superseded_by = 25;

  // resumes is set from E85; unset until it lands (v0.4.0 proto batch).
  repeated RunResume resumes = 26;

  // resume_hint is set from E85; unset until it lands (v0.4.0 proto batch).
  ResumeHint resume_hint = 27;

  // interruptions_off_reason is set from E92; unset until it lands (v0.4.0 proto batch).
  string interruptions_off_reason = 28;

  // pause is the run's own pause, present while it lasts. Never on a
  // finished run.
  RunPause pause = 29;

  // last_pause is the most recent own pause that ended, and how (end).
  RunPause last_pause = 30;

  // pausable: the run was started by a release that can pause it.
  bool pausable = 31;

  // paused_by_parent is present while the parent run's pause holds this
  // run. Never on a finished run.
  InheritedPause paused_by_parent = 32;

  // pause_warnings is set from E103; unset until it lands (v0.4.0 proto batch).
  repeated PauseWarning pause_warnings = 33;

  // pause_slot_kept is set from E103; unset until it lands (v0.4.0 proto batch).
  bool pause_slot_kept = 34;

  // timeout is the run's own time limit; unset when its Orkflow declares no
  // `timeout:`.
  RunTimeout timeout = 35;

  // dispatch_hold is why the run itself is holding back work it could start,
  // as of the last time it looked: it is at its in-flight limit, or it is
  // carrying on. Unspecified when nothing is held, and while the run is
  // paused (pause says why). A task waiting behind this hold reads PENDING.
  RunDispatchHold dispatch_hold = 36;
}

// RunCancelRequest is ENGINE-INTERNAL: the record CancelRun writes as the
// reason of the cancellation it asks the cluster for — Temporal's
// RequestCancelWorkflowExecutionRequest.reason, which the cluster keeps as
// the `cause` of the run's WORKFLOW_EXECUTION_CANCEL_REQUESTED history event.
// The run reader decodes it back into Run.canceled_by; nothing else reads it,
// and nothing decides anything with it. It is written as protojson, so an
// operator's view of the cluster shows it as it is.
message RunCancelRequest {
  // format is 1. A cause that does not decode as this message with format 1
  // records nobody: an operator's own reason text, a parent run's request, a
  // cancellation an earlier release requested with no reason at all.
  int32 format = 1;
  // principal is who asked: the verified principal's id when the engine
  // authenticated the CancelRun request, otherwise its Ork-Principal
  // assertion, bounded as Run.canceled_by is. Empty when there was none.
  string principal = 2;
  // principal_verified says principal was authenticated, not asserted
  // (Run.canceled_by_verified).
  bool principal_verified = 3;
}

// RunOriginKind is WHAT started a run. It is decided by the process that
// accepted the submission and is never accepted from a client: the public
// SubmitRun RPC produces SUBMIT, or RUN_AGAIN when the request names a
// source run the server confirms exists; the trigger door produces TRIGGER
// from its stored record; schedule and composition code produce SCHEDULE
// and PARENT_RUN. A caller who could claim "trigger" would be claiming an
// audit fact, so no request field carries a kind.
enum RunOriginKind {
  // UNSPECIFIED is what a run recorded before origins existed carries.
  // Every client renders it as "unrecorded" — never as SUBMIT, because
  // "a person submitted this" is a claim, and no evidence supports it.
  RUN_ORIGIN_KIND_UNSPECIFIED = 0;
  // SUBMIT: SubmitRun over Connect — orkctl run submit, the UI's submit
  // dialog, or a direct API call. id is empty.
  RUN_ORIGIN_KIND_SUBMIT = 1;
  // TRIGGER: POST /v1/triggers/{id}. id is the trigger id (trg-…).
  RUN_ORIGIN_KIND_TRIGGER = 2;
  // SCHEDULE: a schedule fired. id is the schedule id (sch-…). Defined
  // here so orkflow-schedules stamps it without touching Run; nothing
  // produces it until that proposal lands.
  RUN_ORIGIN_KIND_SCHEDULE = 3;
  // PARENT_RUN: a child run started by a composing parent. id is the
  // PARENT run's id. Defined here so composed-orkflows adds no Run field
  // of its own; nothing produces it until that proposal lands.
  RUN_ORIGIN_KIND_PARENT_RUN = 4;
  // RUN_AGAIN: `orkctl run again` or the run page's Run again. id is the
  // SOURCE run's id, which the server confirmed exists in this namespace.
  RUN_ORIGIN_KIND_RUN_AGAIN = 5;
}

// RunOrigin is the immutable record of what started a run. It is decided
// once, at submit, by the process that accepted the submission, and travels
// on the replay-pinned plan exactly as the definition digest and the
// telemetry selection do (internal/engine/plan.go): recorded in history,
// identical on every replay, readable by any replica. It records; nothing
// in OrkStack reads it to decide anything.
message RunOrigin {
  RunOriginKind kind = 1;
  // id names the originating object for the kinds that have one — a
  // trigger id, a schedule id, a parent run id, a source run id — and is
  // empty for SUBMIT. Opaque: nothing parses it or derives anything from
  // its shape (AGENTS.md §7).
  string id = 2;
  // reference is caller-supplied correlation text — a CI job URL, a ticket
  // key, a partner event id — carried through from
  // SubmitRunRequest.origin_reference or the Ork-Origin-Reference header on
  // the trigger door. At most 256 bytes and no control characters, VALIDATED
  // at the request boundary and never sanitized (AGENTS.md §7): an
  // over-long or malformed reference is INVALID_ARGUMENT and starts no run.
  // Opaque to OrkStack: it is never an expression, a selector or a routing
  // key. A client renders it as a link only when it parses as an http(s)
  // URL, and as text otherwise.
  string reference = 3;
  // description is the originating object's own human label at the moment
  // of submit — Trigger.description for TRIGGER, the schedule's name for
  // SCHEDULE — copied so a run stays explainable after the trigger is
  // deleted. Empty for SUBMIT, RUN_AGAIN and PARENT_RUN. Bounded to 256
  // bytes by truncation.
  string description = 4;
  // principal is what the deployment's gateway asserted in the
  // Ork-Principal request header on the submitting request — the trigger
  // invoke, the Connect SubmitRun — recorded verbatim, bounded to 256 bytes
  // by truncation, and NEVER authenticated: it is the same assertion, on the
  // same terms, as AuditRecord.principal. Empty when no header was present;
  // a client then omits the line entirely rather than showing a blank that
  // could be mistaken for a name.
  string principal = 5;
  // root_run_id is the id of the run at the top of this run's composed chain:
  // the run that started the chain, which id names only for a direct child.
  // Set on a PARENT_RUN origin and empty on every other kind, so a run-again
  // of a child, a new top-level run, has none. An empty value names no root.
  // Opaque, like id.
  string root_run_id = 6;

  // schedule is set from E86; unset until it lands (v0.4.0 proto batch).
  RunScheduleFire schedule = 9;

  // parent_task_id is set from E87; unset until it lands (v0.4.0 proto batch).
  string parent_task_id = 10;

  // parent_orkflow is set from E87; unset until it lands (v0.4.0 proto batch).
  OrkflowRef parent_orkflow = 11;

  // root_orkflow is set from E87; unset until it lands (v0.4.0 proto batch).
  OrkflowRef root_orkflow = 12;

  // root_origin is set from E87; unset until it lands (v0.4.0 proto batch).
  RunOrigin root_origin = 13;

  // principal_verified is set from identity (E61); unset until it lands (v0.4.0 proto batch).
  bool principal_verified = 7;

  // auth_method is set from identity (E61); unset until it lands (v0.4.0 proto batch).
  string auth_method = 8;
}

// EventType classifies a run event on the realtime stream.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_RUN_CREATED = 1;
  EVENT_TYPE_RUN_STARTED = 2;
  EVENT_TYPE_TASK_SCHEDULED = 3;
  EVENT_TYPE_TASK_STARTED = 4;
  EVENT_TYPE_TASK_LOG = 5;
  EVENT_TYPE_TASK_SUCCEEDED = 6;
  EVENT_TYPE_TASK_FAILED = 7;
  EVENT_TYPE_RUN_SUCCEEDED = 8;
  EVENT_TYPE_RUN_FAILED = 9;
  EVENT_TYPE_RUN_CANCELED = 10;
  // TASK_AWAITING: an awaited task started waiting. Status AWAITING; the
  // message names the deadline.
  EVENT_TYPE_TASK_AWAITING = 11;
  // TASK_RESOLVED: an awaited task was resolved from outside the run. Status
  // is the outcome it decided — SUCCEEDED for a completion, FAILED for a
  // rejection — and TASK_SUCCEEDED or TASK_FAILED follows with the same
  // status, so a reader that only knows the older task events still sees the
  // task end.
  EVENT_TYPE_TASK_RESOLVED = 12;
  // STREAM_GAP: numbers of the run's event sequence hold no event, because
  // the run used them without publishing one (an event whose record object
  // storage refused). Its sequence is the last of those numbers and its
  // message names them all; no run or task changed state. Only a live read of
  // the stream serves it, and the read goes on to the run's terminal event.
  // It is part of the read, not of the run's events: the run's archive records
  // the same numbers as a gap in its stream instead, and a read over that gap
  // ends DataLoss.
  EVENT_TYPE_STREAM_GAP = 13;
  // TASK_SLEEPING: a sleeping task started its fixed wait. Status SLEEPING;
  // the message names the wake-up time. TASK_SUCCEEDED follows when it
  // wakes; a run that ends first records the task CANCELED.
  EVENT_TYPE_TASK_SLEEPING = 14;
  // RUN_PAUSED: the run became paused, or is still paused with its causes
  // changed (pause_transition says which). Status PAUSED.
  EVENT_TYPE_RUN_PAUSED = 19;
  // RUN_UNPAUSED: no pause cause remains, or the run was not paused
  // (pause_transition NOT_PAUSED). Status RUNNING.
  EVENT_TYPE_RUN_UNPAUSED = 20;
}

// Event is a single realtime update for a run, delivered over the
// server-streaming RPC and the WebSocket bridge.
message Event {
  string run_id = 1;
  int64 sequence = 2;                    // monotonic per run
  EventType type = 3;
  // task_id is set for task events. Empty on exactly one event that is not
  // about a task: the TASK_LOG, status RUNNING, a run with failure handlers
  // emits when it starts failing (docs/DSL.md "Joins and failure handlers").
  string task_id = 4;
  Status status = 5;
  string message = 6;                    // human readable / log line
  Payload data = 7;                      // optional structured detail
  google.protobuf.Timestamp timestamp = 8;
  // item is set on an event about ONE ITEM of a fan-out task: the item's
  // 0-based index. Such an event is EVENT_TYPE_TASK_LOG carrying the item's
  // terminal status — the precedent markSkipped and markCanceled set, since
  // the Event contract has no item type — and TaskRun.items is the
  // authoritative record. Unset on every other event.
  optional int32 item = 9;

  // resumed is set from E85; unset until it lands (v0.4.0 proto batch).
  RunResumed resumed = 10;

  // interruption is set from E92; unset until it lands (v0.4.0 proto batch).
  TaskInterruption interruption = 11;

  // request_id is the pause or unpause request's id on RUN_PAUSED and
  // RUN_UNPAUSED from the API; unset on every other event.
  string request_id = 12;

  // pause_transition says what a RUN_PAUSED or RUN_UNPAUSED, or a terminal
  // event that ended a pause, did to it; unset on every other event.
  PauseTransition pause_transition = 13;
}

// AttemptCredential is identity (E81)'s; it is empty until identity (E81) lands (v0.4.0 proto
// batch).
message AttemptCredential {}

// AttemptIdentity is what one identity of an attempt was issued, as its
// Orker reported at the attempt's end: never a token. It is best-effort, as
// the record is: an Orker that is killed writes none, and the engine's own
// records of what it issued are the trail that does not depend on the Orker.
message AttemptIdentity {
  // name is the identity's name in its task.
  string name = 1;
  // audience is its tokens' audience.
  string audience = 2;
  // tokens_issued is how many tokens the attempt was given, the first and
  // each refresh.
  int32 tokens_issued = 3;
  // first_jti and last_jti are the jti of the first and the last of them.
  string first_jti = 4;
  string last_jti = 5;
  // last_kid is the key that signed the last.
  string last_kid = 6;
  // last_expires_at is when the last expires.
  google.protobuf.Timestamp last_expires_at = 7;
}

// ConcurrencyQueued is E88's; it is empty until E88 lands (v0.4.0 proto
// batch).
message ConcurrencyQueued {}

// EffectiveProfile is one profile an attempt ran under, as the Orker applied
// it.
message EffectiveProfile {
  string name = 1;
  ProfileKind kind = 2;
  // unit_indices are the positions of the `gpu` units the attempt held,
  // numbered from 0 within the profile's list.
  repeated int32 unit_indices = 3;
  // identity_pinned is whether the run pinned the profile's identity at
  // submit.
  bool identity_pinned = 4;
  // contract is the label of the contract the attempt ran under.
  string contract = 5;
  // run_contracts are the labels the run pinned for this profile.
  repeated string run_contracts = 6;
  // declared is whether the task's image chose the contract.
  bool declared = 7;
}

// InheritedPause is a run's pause caused by its parent run's pause. Only the
// parent's unpause or end lifts it; backstop_at is when the run ends itself
// should neither happen.
message InheritedPause {
  string parent_run_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp backstop_at = 3;
}

// MeasurementMethod is how an attempt's CPU and memory were measured.
enum MeasurementMethod {
  MEASUREMENT_METHOD_UNSPECIFIED = 0;
  // CGROUP_V2: read from the container's cgroup on the unified hierarchy.
  MEASUREMENT_METHOD_CGROUP_V2 = 1;
  // CGROUP_V1: read from the container's cpuacct and memory cgroups.
  MEASUREMENT_METHOD_CGROUP_V1 = 2;
  // UNMEASURED: nothing was measured; unmeasured_reason says why.
  MEASUREMENT_METHOD_UNMEASURED = 3;
}

// UnmeasuredReason is why an attempt's CPU and memory were not measured.
enum UnmeasuredReason {
  UNMEASURED_REASON_UNSPECIFIED = 0;
  // CGROUP_NOT_VISIBLE: the Orker could not see the container's cgroup (a
  // remote or virtual-machine engine, or an Orker in a container without the
  // host's /proc).
  UNMEASURED_REASON_CGROUP_NOT_VISIBLE = 1;
  // NO_CGROUP: the engine gives the container no cgroup the Orker can read
  // (a rootless engine on cgroup v1).
  UNMEASURED_REASON_NO_CGROUP = 2;
  // ENDED_BEFORE_FIRST_SAMPLE: the container ended before its first reading.
  UNMEASURED_REASON_ENDED_BEFORE_FIRST_SAMPLE = 3;
  // READ_FAILED: the cgroup could not be read before any reading succeeded.
  UNMEASURED_REASON_READ_FAILED = 4;
  // NOT_RUN: no container ran (an adopted commit, a cache hit, a failure
  // before the start).
  UNMEASURED_REASON_NOT_RUN = 5;
  // DISABLED: the Orker's orker.usage_sample_interval is 0.
  UNMEASURED_REASON_DISABLED = 6;
  // START_FAILED: the container's start failed or was cut off; it may have
  // run, unmeasured.
  UNMEASURED_REASON_START_FAILED = 7;
  // CGROUP_UNVERIFIED: the container's cgroup could not be verified as one:
  // it is not on a cgroup filesystem, so its identity is not trusted.
  UNMEASURED_REASON_CGROUP_UNVERIFIED = 8;
}

// MeasuredUsage is what an attempt's container used, as its cgroup reported
// it: best-effort, read on a schedule, and unset on a record an older Orker
// wrote. It never decides an attempt's outcome.
message MeasuredUsage {
  MeasurementMethod method = 1;
  // cpu_seconds is the container's CPU time at the last reading: a lower
  // bound on what it used.
  double cpu_seconds = 2;
  // memory_peak_bytes is the container's peak memory: the kernel's own peak
  // when memory_peak_exact, otherwise the most a reading saw (or, when it was
  // stopped at its limit with no peak of its own, the limit).
  int64 memory_peak_bytes = 3;
  bool memory_peak_exact = 4;
  // memory_limit_bytes is the container's memory limit; 0 is none.
  int64 memory_limit_bytes = 5;
  // samples is how many readings were taken.
  int32 samples = 6;
  google.protobuf.Timestamp first_sampled_at = 7;
  google.protobuf.Timestamp last_sampled_at = 8;
  google.protobuf.Timestamp container_started_at = 9;
  google.protobuf.Timestamp container_exited_at = 10;
  // unmeasured_reason is set when method is UNMEASURED.
  UnmeasuredReason unmeasured_reason = 11;
  // oom_killed: the container was stopped at its memory limit.
  bool oom_killed = 12;
}

// NamedArtifact is one artifact a run takes in or hands out, by the name
// the Orkflow gives it (E87, composed-artifacts/01-design.md §5). Declared
// whole by the v0.4.0 proto batch; nothing sets it until E87 lands.
message NamedArtifact {
  string name = 1;
  ArtifactRef artifact = 2;
  string run_id = 3;
  string task_id = 4;
}

// PauseTransition is what one event did to a run's pause.
enum PauseTransition {
  PAUSE_TRANSITION_UNSPECIFIED = 0;
  // PAUSED: RUN_PAUSED; the run became paused.
  PAUSE_TRANSITION_PAUSED = 1;
  reserved 2;
  reserved "PAUSE_TRANSITION_CHANGED";
  // UNPAUSED: RUN_UNPAUSED; no pause cause remains.
  PAUSE_TRANSITION_UNPAUSED = 3;
  // NOT_PAUSED: RUN_UNPAUSED of a run that was not paused.
  PAUSE_TRANSITION_NOT_PAUSED = 4;
  // ENDED_TIMED_OUT: the terminal event of a run whose pause expired.
  PAUSE_TRANSITION_ENDED_TIMED_OUT = 5;
  // ENDED_RUN_ENDED: the terminal event of a run that ended while paused.
  PAUSE_TRANSITION_ENDED_RUN_ENDED = 6;
  // CAUSES_CHANGED: RUN_PAUSED; still paused, with its causes changed.
  PAUSE_TRANSITION_CAUSES_CHANGED = 7;
}

// PauseEnd is how a run's own pause ended.
enum PauseEnd {
  // UNSPECIFIED: the pause has not ended.
  PAUSE_END_UNSPECIFIED = 0;
  PAUSE_END_UNPAUSED = 1;
  PAUSE_END_TIMED_OUT = 2;
  // RUN_ENDED: the run ended while paused.
  PAUSE_END_RUN_ENDED = 3;
}

// PauseWarning is one way the run's pause did not reach a child run: the
// child keeps running. A run's warnings are those of its latest pause, shown
// while it is paused.
message PauseWarning {
  // task_id is the composed task whose child run the pause did not reach.
  string task_id = 1;
  // child_run_id is that child run's id.
  string child_run_id = 2;
  // code is CHILD_NOT_PAUSABLE (the child was started without support for
  // pausing) or CHILD_PAUSE_FAILED (the pause could not be delivered to it).
  string code = 3;
  // message says what happened, in words.
  string message = 4;
}

// RecordRef is identity (O39)'s; it is empty until identity (O39) lands (v0.4.0 proto
// batch).
message RecordRef {}

// ResumeDisposition is E85's; it holds only its zero value until E85 lands
// (v0.4.0 proto batch).
enum ResumeDisposition {
  RESUME_DISPOSITION_UNSPECIFIED = 0;
}

// ResumeHint is E85's; it is empty until E85 lands (v0.4.0 proto
// batch).
message ResumeHint {}

// RunContextState is E86's; it is empty until E86 lands (v0.4.0 proto
// batch).
message RunContextState {}

// RunDispatchHold is why a run holds back work it could otherwise start.
enum RunDispatchHold {
  RUN_DISPATCH_HOLD_UNSPECIFIED = 0;
  // The run has as much work in flight as its in-flight limit allows; held
  // work starts as running work finishes.
  RUN_DISPATCH_HOLD_IN_FLIGHT_CAP = 1;
  // The run is carrying on: it starts nothing new until its running work
  // finishes, then carries its state forward and continues.
  RUN_DISPATCH_HOLD_CARRYING_ON = 2;
}

// RunPause is one pause a person asked for. Each principal is marked as
// RunOrigin.principal is: verified when OrkStack authenticated it (auth.mode
// observe or enforce), and otherwise what the gateway asserted.
message RunPause {
  google.protobuf.Timestamp paused_at = 1;
  google.protobuf.Timestamp expires_at = 2;
  string paused_by = 3;
  // A pause cannot be changed: unpause and pause again.
  reserved 4;
  reserved "changed_by";
  string reason = 5;
  string request_id = 6;
  // end is UNSPECIFIED while the pause lasts.
  PauseEnd end = 7;
  google.protobuf.Timestamp ended_at = 8;
  // ended_by is who unpaused it; empty when it timed out or the run's end
  // closed it.
  string ended_by = 9;
  // paused_by_verified says paused_by is a principal OrkStack authenticated.
  bool paused_by_verified = 10;
  // ended_by_verified says ended_by is a principal OrkStack authenticated.
  bool ended_by_verified = 11;
}

// RunResume is E85's; it is empty until E85 lands (v0.4.0 proto
// batch).
message RunResume {}

// RunResumed is E85's; it is empty until E85 lands (v0.4.0 proto
// batch).
message RunResumed {}

// RunScheduleFire is E86's; it is empty until E86 lands (v0.4.0 proto
// batch).
message RunScheduleFire {}

// RunTimeout is the run's own time limit, from the Orkflow's top-level
// `timeout:` (docs/DSL.md "Run timeout"). It is unset on a run whose Orkflow
// declares none.
message RunTimeout {
  // seconds is the declared limit.
  int64 seconds = 1;
  // deadline is when the run times out; unset until the run starts.
  google.protobuf.Timestamp deadline = 2;
  // hard_end is set once the run starts failing: the latest instant a failure
  // handler may still run (the deadline, or the moment it started failing,
  // plus the deployment's handler grace).
  google.protobuf.Timestamp hard_end = 3;
  // timed_out reports that the deadline ended the run.
  bool timed_out = 4;
  // hard_end_reached reports that failure handlers were stopped, or never
  // started, at hard_end.
  bool hard_end_reached = 5;
}

// InterruptionPhase is how far an interrupted attempt had got when it was
// interrupted.
enum InterruptionPhase {
  // UNSPECIFIED: not known, or reported by an Orker this release does not
  // name.
  INTERRUPTION_PHASE_UNSPECIFIED = 0;
  // BEFORE_START: preparing, before its container started (staging inputs,
  // pulling the image, creating the container).
  INTERRUPTION_PHASE_BEFORE_START = 1;
  // RUNNING: its container was running.
  INTERRUPTION_PHASE_RUNNING = 2;
  // AFTER_EXIT: its container had ended and the Orker was checking and
  // saving its outputs.
  INTERRUPTION_PHASE_AFTER_EXIT = 3;
  // REPORTED: the Orker had reported how the attempt ended.
  INTERRUPTION_PHASE_REPORTED = 4;
}

// TaskInterruption is one interruption of a task's attempt: its Orker lost,
// or stopping and handing the attempt back, or the attempt never started.
message TaskInterruption {
  // reason is the interruption's reason code (ORKER_STOPPED,
  // ORKER_HEARTBEAT_LOST, ATTEMPT_STORE_UNAVAILABLE, PROFILE_DRIFTED, ...).
  string reason = 1;
  // orker_id is the Orker that had the attempt, when it said.
  string orker_id = 2;
  // ordinal is the attempt's number as its Orker claimed it, when it did.
  optional int32 ordinal = 3;
  InterruptionPhase phase = 4;
  google.protobuf.Timestamp at = 5;
  // closed_by, when set, is why the task's interruptions no longer re-run it
  // without spending its own attempts: "lost", "lost_run_cap",
  // "handed_back", "never_started" (a budget spent) or "opt_out"
  // (retry.max_interruptions: 0).
  string closed_by = 6;
  // never_started: the attempt was interrupted before its container started.
  bool never_started = 7;
  // store_error is what object storage answered, for an attempt object
  // storage refused (ATTEMPT_STORE_UNAVAILABLE).
  string store_error = 8;
  // orker_stopping_since is when the Orker began to stop, for an attempt
  // lost while its Orker was stopping.
  google.protobuf.Timestamp orker_stopping_since = 9;
}

// TaskInterruptions is a task's (or a fan-out item's) interruptions so far,
// and the budgets they spent: an interrupted attempt runs again without
// spending the task's own attempts while its kind has budget left.
message TaskInterruptions {
  // lost counts attempts whose Orker stopped answering.
  int32 lost = 1;
  // handed_back counts attempts a stopping Orker handed back.
  int32 handed_back = 2;
  // own_attempts_used counts the task's own attempts interruptions spent
  // once their budgets were.
  int32 own_attempts_used = 3;
  // last is the most recent interruption.
  TaskInterruption last = 4;
  // not_before, when set, is the earliest the task runs again.
  google.protobuf.Timestamp not_before = 5;
  // never_started counts attempts a stopping Orker returned before they
  // started.
  int32 never_started = 6;
  // store_faults counts consecutive attempts that never started because of
  // a fault (object storage refusing the attempt's record, a drifted
  // profile); it returns to 0 when a later interruption ends an attempt
  // whose container started, and keeps its count when the task ends, so a
  // task that succeeded after a fault still shows it.
  int32 store_faults = 7;
  // lost_while_stopping counts lost attempts whose Orker was stopping.
  int32 lost_while_stopping = 8;
}
