syntax = "proto3";

package orkstack.v1;

import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/telemetry.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// TaskRun is the execution record of a single Task within a Run.
message TaskRun {
  string task_id = 1;

  // 2 held the in-process plugin name, mirroring Task.plugin. Reserved for
  // the same reason and at the same time.
  reserved 2;
  reserved "plugin";

  Status status = 3;
  int32 attempt = 4;
  // output carries the inline values.json when one was inlined, decoded for
  // display only. values_ref is the authoritative reference.
  Payload output = 5;
  repeated ArtifactRef artifacts = 6;
  Error error = 7;                       // carries FailureCategory (§8)

  // started_at is when the Orker began the attempt that produced this task's
  // outcome, on the Orker's own clock: ExecuteTaskResult.started_at for a
  // succeeded task (the committing attempt's start for an adopted commit,
  // exactly as `attempt` is the committing attempt), and
  // ActivityFailureDetail.started_at for a failed one. It is the start of
  // the FINAL attempt, on the same rule attempt, error, exit_code and
  // orker_id already follow: the snapshot describes the attempt that decided
  // the task, and ListTaskAttempts describes the rest.
  //
  // Unset while the task is PENDING or RUNNING, and for a terminal task no
  // Orker reported on — a host that died before reporting, a Temporal-side
  // timeout, a cancellation that reached the Orker as a plain context
  // cancellation, a lost pin. Unset is "not known", never zero.
  //
  // Before this field's meaning was corrected it held the dispatch instant;
  // scheduled_at (18) holds that now.
  google.protobuf.Timestamp started_at = 8;
  // finished_at is the workflow's own clock at the moment it learned this
  // task's outcome.
  google.protobuf.Timestamp finished_at = 9;
  // pool names the set of Orkers this attempt was dispatched to, in the word
  // its author typed: the task's own `pool:`, or the pool this run's default
  // route resolves to when the task named none.
  //
  // Within a run, one pool name means one set of Orkers, so naming this pool
  // on a task reaches exactly the Orkers this attempt reached. That holds
  // under the per-deployment route override operators use to keep two stacks
  // apart: an execution channel belonging to no pool reports as the built-in
  // "main", and a task that writes "main" follows the same override instead
  // of escaping it. The override is an operator concern this contract does
  // not expose, so this name is the routing request rather than a measurement
  // of the host that answered, and another deployment resolves it against its
  // own Orkers.
  //
  // Empty means the task never reached an Orker (skipped, or terminal before
  // dispatch).
  string pool = 10;

  // values_ref addresses the committed values.json for this attempt. Set
  // whenever the task succeeded, whether or not output was inlined.
  ArtifactRef values_ref = 11;
  // commit references the durable completion record (§5).
  CommitRef commit = 12;
  // exit_code is the container's exit status as reported by the Orker.
  int32 exit_code = 13;
  // system_artifacts are stdout.log and stderr.log for this attempt.
  repeated ArtifactRef system_artifacts = 14;

  // retry_state says why Temporal stopped retrying this task, read off
  // temporal.ActivityError.RetryState() when the task ended in an error. It is
  // DERIVED data on the snapshot — the engine records what Temporal already
  // decided, it does not decide anything with it.
  //
  // Unset for SUCCEEDED and SKIPPED tasks, for a failure that never reached an
  // activity, and for snapshots written before this field existed.
  RetryState retry_state = 15;

  // pin is the Pin this task belongs to, as the author named it, or empty.
  // Two TaskRuns of one run with the same pin ran on the same Orker.
  string pin = 16;

  // orker_id is the Orker that produced this task's final outcome, read off
  // ExecuteTaskResult.orker_id or ActivityFailureDetail.orker_id. Set for
  // every task that reached an Orker, pinned or not; empty when the task
  // never reached one (skipped, canceled before dispatch) or when the Orker
  // died before reporting (heartbeat timeout).
  //
  // One exception to "reported by this task's own attempt": a task recorded
  // PIN_HOST_LOST or PIN_TIMEOUT reports nothing at all — its host died — so
  // the engine BACKFILLS this from another member of the same pin. A pin never
  // moves: every member executes on the same Orker process for the pin's whole
  // life, so a sibling's orker_id is this task's by construction. It stays
  // empty only when no member of that pin ever reported one, in which case the
  // failure's error.details carries the Temporal session's raw OS host name as
  // an explicitly labelled best-effort lead, which is NOT an orker_id.
  string orker_id = 17;

  // scheduled_at is the instant the engine scheduled this task's activity —
  // workflow.Now at schedule(), which is also the timestamp on the
  // EVENT_TYPE_TASK_SCHEDULED event. It is a PROJECTION of that event onto
  // the snapshot, not a new measurement, and it is the workflow's own
  // deterministic clock, never an Orker's.
  //
  // Unset when the task never reached scheduling (skipped, or canceled
  // before dispatch) and on a snapshot written before this field existed.
  // The two are told apart by started_at: a pre-contract snapshot has
  // started_at set (it held the dispatch instant then) and scheduled_at
  // unset; a never-scheduled task has neither.
  google.protobuf.Timestamp scheduled_at = 18;
}

// AttemptOutcome is how one Temporal attempt of a task ended.
enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  // SUCCEEDED: the attempt returned an ExecuteTaskResult, fresh or adopted.
  ATTEMPT_OUTCOME_SUCCEEDED = 1;
  // FAILED: the attempt returned an ApplicationError; error is set.
  ATTEMPT_OUTCOME_FAILED = 2;
  // CANCELED: the attempt's context was cancelled (§6.3).
  ATTEMPT_OUTCOME_CANCELED = 3;
  // UNREPORTED is never written by an Orker. A reader synthesizes it for an
  // attempt number that has no record, which means the Orker running it died
  // or lost its heartbeat before it could write one.
  ATTEMPT_OUTCOME_UNREPORTED = 4;
}

// PhaseSpan is one §7.1 phase of one attempt, on the Orker's clock. Spans
// are recorded by the dispatcher's own Phase() sequence, so a list of them is
// contiguous: each span's finished_at is the next span's started_at, the
// first begins at the attempt's first Phase call, and the last ends at
// TaskAttempt.finished_at. The names are the dispatcher's own — "start",
// "commit-check", "workspace", "stage-inputs", "image", "render", "create",
// "run", "exit", "validate", "commit", and, entered from the wait path,
// "timeout" and "cancel"; "image-policy" is entered only when the task
// carries an image policy (ExecuteTaskInput.image_policy), between
// "commit-check" and "workspace" — and are not an enum, for the reason
// TaskAttempt.phase is a string: a reader of an older build must be able to
// read a phase it has never heard of.
message PhaseSpan {
  string phase = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
}

// TaskAttempt is the immutable record of ONE Temporal attempt of one task,
// written by the Orker that ran it at the end of the attempt (§7.1). It is the
// failure-side sibling of ActivityCommit: a commit says what the winning
// attempt produced, an attempt record says what EVERY attempt did, including
// the ones that lost.
//
// Temporal owns retries, so the workflow only ever sees a task's final
// outcome — an intermediate attempt's error reaches nothing that outlives the
// Orker process. This record is what makes it durable, and it is written
// best-effort: a record that cannot be stored is logged, never allowed to
// change what the attempt itself reported.
message TaskAttempt {
  // schema_version is 1. A reader that does not know the value ignores the
  // record rather than guessing, exactly as ActivityCommit's does.
  int32 schema_version = 1;

  string run_id = 2;
  string task_id = 3;
  // attempt is activity.GetInfo(ctx).Attempt, 1-based.
  int32 attempt = 4;
  AttemptOutcome outcome = 5;
  // error is set only for FAILED, and carries the same shape TaskRun.error
  // does: the §8.2 reason as code, the category, retryability, the Orker's
  // message, and its scan notes as details.
  Error error = 6;
  // exit_code is the container's exit status, 0 when the container never ran.
  int32 exit_code = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  // orker_id is the Orker that executed this attempt. "Which Orker failed" is
  // the retry question, so the record answers it without a log search.
  string orker_id = 10;
  // pool is the routing request this attempt was dispatched with, as
  // TaskRun.pool spells it.
  string pool = 11;
  // phase is the §7.1 phase the attempt ended in — "image", "run",
  // "commit", … — the same name as the last element of phases below.
  string phase = 12;
  // image is the ImageRef as executed, with platform_digest and delivery set.
  ImageRef image = 13;
  // system_artifacts are the stdout.log/stderr.log references, when this
  // attempt got as far as uploading them.
  repeated ArtifactRef system_artifacts = 14;
  // commit_adopted is true when this attempt found an existing commit and
  // returned it without running the container (§5.4).
  bool commit_adopted = 15;
  // build_id is ORK_BUILD_ID of the Orker that ran the attempt.
  string build_id = 16;

  // phases lists every §7.1 phase this attempt passed through, in order,
  // contiguous, the last ending at finished_at, and its last element's phase
  // equal to `phase` above. Empty on a record written before this field
  // existed and on a synthesized UNREPORTED row. A reader renders an empty
  // list as unavailable, never as "no phases happened".
  //
  // schema_version stays 1: the field is additive and UnmarshalAttempt
  // discards unknown fields, so a record with phases reads on a build without
  // them and a record without phases reads on this one as an empty list.
  repeated PhaseSpan phases = 17;
}

// RetryState is why Temporal stopped retrying a task. It mirrors
// temporal.api.enums.v1.RetryState with its own numbering, because a value of
// another proto package's enum may not be carried by number: the mapping is
// explicit, in internal/engine/workflow.go.
//
// temporal's RETRY_STATE_IN_PROGRESS has no member here on purpose. It names a
// retry that has not finished, and this field is only ever set from the error
// of a task that already reached a terminal outcome; it maps to UNSPECIFIED.
enum RetryState {
  RETRY_STATE_UNSPECIFIED = 0;
  RETRY_STATE_NON_RETRYABLE_FAILURE = 1;
  RETRY_STATE_TIMEOUT = 2;
  RETRY_STATE_MAXIMUM_ATTEMPTS_REACHED = 3;
  RETRY_STATE_RETRY_POLICY_NOT_SET = 4;
  RETRY_STATE_CANCEL_REQUESTED = 5;
  RETRY_STATE_INTERNAL_SERVER_ERROR = 6;
}

// Run is one execution of an Orkflow.
message Run {
  string id = 1;                         // ork run id, ork-{timestamp}-{sequence} (also Temporal workflow id)
  string orkflow_name = 2;
  string orkflow_version = 3;
  Status status = 4;
  Payload input = 5;
  Payload output = 6;                    // aggregated terminal outputs
  Error error = 7;
  repeated TaskRun task_runs = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // namespace is the namespace of the orkflow this run executed. Empty means
  // the built-in "default" namespace. It is a coordinate of the run, not a
  // lookup: the archive indexes runs under it, so listing one namespace's runs
  // is a single prefix scan.
  string namespace = 12;

  // orkflow_definition_digest is the canonical digest of the definition this
  // run pinned (§4.4). A run that started before a pointer moved is still
  // explainable by the exact bytes it ran.
  string orkflow_definition_digest = 13;

  // telemetry is the selection this run was pinned with (see
  // ExecuteTaskInput.telemetry). Unset when none was configured.
  TelemetrySelection telemetry = 14;
}

// EventType classifies a run event on the realtime stream.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_RUN_CREATED = 1;
  EVENT_TYPE_RUN_STARTED = 2;
  EVENT_TYPE_TASK_SCHEDULED = 3;
  EVENT_TYPE_TASK_STARTED = 4;
  EVENT_TYPE_TASK_LOG = 5;
  EVENT_TYPE_TASK_SUCCEEDED = 6;
  EVENT_TYPE_TASK_FAILED = 7;
  EVENT_TYPE_RUN_SUCCEEDED = 8;
  EVENT_TYPE_RUN_FAILED = 9;
  EVENT_TYPE_RUN_CANCELED = 10;
}

// Event is a single realtime update for a run, delivered over the
// server-streaming RPC and the WebSocket bridge.
message Event {
  string run_id = 1;
  int64 sequence = 2;                    // monotonic per run
  EventType type = 3;
  string task_id = 4;                    // set for task events
  Status status = 5;
  string message = 6;                    // human readable / log line
  Payload data = 7;                      // optional structured detail
  google.protobuf.Timestamp timestamp = 8;
}
