syntax = "proto3";

package orkstack.v1;

import "orkstack/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/identity.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// IdentityService is the task identity issuer (docs/TASK_IDENTITY.md): the
// documents it publishes and the keys it signs with. Every call answers for
// the engine that receives it. With identity.issuer unset, GetIssuer
// answers enabled false and the others fail FAILED_PRECONDITION.
service IdentityService {
  // GetIssuer answers the issuer, its documents as this engine serves and
  // exports them, and what this engine last read of the published keys and
  // of the issuer URL. Needs identity.read at the deployment.
  rpc GetIssuer(GetIssuerRequest) returns (GetIssuerResponse);
  // ListSigningKeys answers every published key and every key this engine
  // holds. Needs identity.read at the deployment.
  rpc ListSigningKeys(ListSigningKeysRequest) returns (ListSigningKeysResponse);
  // RetireSigningKey retires a key: no engine signs with it again, and it
  // is no longer served. The key stays in the published keys. Retiring a
  // retired key answers it as it is; marking it compromised from another
  // instant than it was is FAILED_PRECONDITION. Needs identity.keys.retire
  // at the deployment.
  rpc RetireSigningKey(RetireSigningKeyRequest) returns (RetireSigningKeyResponse);
  // MintAttemptTokens signs the tokens one attempt of an admitted run's
  // task holds, for the Orker that holds the attempt. Served only when
  // callers are authenticated (auth.mode enforce). Needs
  // identity.token.mint and task.result.commit at the task's pool, asked
  // once the run's admission names the pool.
  rpc MintAttemptTokens(MintAttemptTokensRequest) returns (MintAttemptTokensResponse);
  // ListIssuedTokens lists what was issued for a run's attempts, in key
  // order: who asked, and each token's claims, never a token. Needs
  // run.read on the run's Orkflow.
  rpc ListIssuedTokens(ListIssuedTokensRequest) returns (ListIssuedTokensResponse);
}

message MintAttemptTokensRequest {
  string namespace = 1;
  string run_id = 2;
  string task_id = 3;
  // item is a fan-out item's index; unset for a task that is not one.
  optional int32 item = 4;
  int32 attempt = 5;
  // task_spec_sha256 is the digest of the task as the Orker was given it.
  string task_spec_sha256 = 6;
  // tokens are what the attempt asks for: at most 16.
  repeated TokenRequest tokens = 7;
  // admission_sha256 names which admission of the run, as the task's input
  // named it.
  string admission_sha256 = 8;
  // spec_members maps each member of the task's digest to its own digest,
  // used only to say what differs.
  map<string, string> spec_members = 9;
  // resume_scope is the resume the attempt runs under; 0 for none.
  uint64 resume_scope = 10;
  // root_scope is the root run's resume scope, for a run below a root.
  uint64 root_scope = 11;
  reserved 12, 13;
}

message TokenRequest {
  // name is an identity's name, or "grant:<name>".
  string name = 1;
  string audience = 2;
}

message MintAttemptTokensResponse {
  repeated IssuedToken tokens = 1;
  // input_artifacts are the artifacts of the run's start the task names, each
  // under its input's name, as the engine read them from the records of the
  // tasks that produced them: the only ones its attempt stages. One a failure
  // handler passed, whose producer has no record, is its name alone.
  repeated ArtifactRef input_artifacts = 2;
}

message IssuedToken {
  string name = 1;
  string audience = 2;
  // token is the signed token. Never logged and never stored.
  string token = 3;
  // expires_in_seconds is the token's life, counted on the Orker's own
  // clock.
  int32 expires_in_seconds = 4;
  // issued_at is when it was signed, for the Orker's clock check only.
  google.protobuf.Timestamp issued_at = 5;
  string jti = 6;
  string kid = 7;
}

message ListIssuedTokensRequest {
  string namespace = 1;
  string run_id = 2;
  // task_id narrows the list to one task.
  string task_id = 3;
  // item narrows it to one item of task_id.
  optional int32 item = 4;
  // page_size is at most 100; 0 is 50.
  int32 page_size = 5;
  string page_token = 6;
  reserved 7, 8;
}

message ListIssuedTokensResponse {
  repeated IssuedTokenRecord records = 1;
  // next_page_token continues the list; empty at its end.
  string next_page_token = 2;
}

// IssuedTokenRecord is what one granted mint issued.
message IssuedTokenRecord {
  string task_id = 1;
  optional int32 item = 2;
  int32 attempt = 3;
  // principal is the caller's verified principal.
  string principal = 4;
  // orker_id is the Orker its credential names.
  string orker_id = 5;
  google.protobuf.Timestamp issued_at = 6;
  repeated IssuedTokenEntry tokens = 7;
}

// IssuedTokenEntry is one issued token's claims.
message IssuedTokenEntry {
  string name = 1;
  string audience = 2;
  string subject = 3;
  string jti = 4;
  string kid = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message GetIssuerRequest {}

message GetIssuerResponse {
  // enabled is false when identity.issuer is unset; every other field is
  // then empty.
  bool enabled = 1;
  // issuer is identity.issuer, the iss of every token.
  string issuer = 2;
  // subject_format is identity.subject_format: `ork` or `spiffe`.
  string subject_format = 3;
  // trust_domain is identity.spiffe.trust_domain, empty when unset.
  string trust_domain = 4;
  // serve_discovery says this engine serves the documents below.
  bool serve_discovery = 5;
  // discovery, jwks and spiffe_bundle are the documents, as JSON, exactly
  // as served and exported: .well-known/openid-configuration, jwks.json
  // and, with a trust domain, spiffe-bundle.json.
  string discovery = 6;
  string jwks = 7;
  string spiffe_bundle = 8;
  // keys_sequence is the published keys' sequence, the SPIFFE bundle's
  // sequence.
  int64 keys_sequence = 9;
  // keys_read_at is when this engine last read the published keys;
  // keys_read_error is why its last try failed, empty when it did not.
  google.protobuf.Timestamp keys_read_at = 10;
  string keys_read_error = 11;
  // live_checked_at is when this engine last read the issuer URL, before a
  // key's first signature; live_key_ids are the key ids it served then, and
  // live_error why the read failed. Unset when it has not needed to.
  google.protobuf.Timestamp live_checked_at = 12;
  repeated string live_key_ids = 13;
  string live_error = 14;
}

message ListSigningKeysRequest {}

message ListSigningKeysResponse {
  // keys are this engine's keys in its configured order, then every other
  // published key.
  repeated SigningKey keys = 1;
}

message RetireSigningKeyRequest {
  // key_id is the kid to retire.
  string key_id = 1;
  // compromised_from, set, also retires the key as compromised from that
  // instant, which may lie in the past: the earliest moment the key may
  // have leaked. What it signed for an instant before it still verifies,
  // and nothing from it on does; a run force-cancelled under it from then
  // on reads as terminated outside OrkStack and cannot be resumed. It may
  // be added to a key retired before, and once set it only moves earlier.
  google.protobuf.Timestamp compromised_from = 2;
}

message RetireSigningKeyResponse {
  // key is the key as retired.
  SigningKey key = 1;
}
