syntax = "proto3";

package orkstack.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/image_policy.proto";
import "orkstack/v1/telemetry.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// ---------------------------------------------------------------- images

// ImageRef is an OCI image resolved to an immutable reference. The engine
// produces it at apply time and it never changes afterwards: a run executes
// what `pinned` names, whatever a tag does later.
message ImageRef {
  // reference is what the author wrote, verbatim: "ghcr.io/acme/migrate:v3",
  // "shell", or an already-pinned "repo@sha256:...". Never used to pull.
  string reference = 1;
  // registry is the resolved host, e.g. "ghcr.io" or "docker.io".
  string registry = 2;
  // repository is the resolved path, e.g. "acme/migrate".
  string repository = 3;
  // index_digest is the digest of the object the tag named at resolve time:
  // an OCI image index for a multi-platform tag, an image manifest otherwise.
  // Spelled "sha256:<64 hex>".
  string index_digest = 4;
  // pinned is the only string that may be pulled or run:
  //   "{registry}/{repository}@{index_digest}"
  string pinned = 5;
  // media_type is the media type index_digest addresses.
  string media_type = 6;
  // platforms lists the platforms the index advertises, "os/arch[/variant]".
  // Empty for a single-manifest reference.
  repeated string platforms = 7;
  // 8 held resolved_at, the wall-clock time of the resolution. It is REMOVED,
  // not merely excluded from the definition digest: ImageRef travels inside
  // Task, Task travels inside the immutable Orkflow version document, and
  // `pkg/artifacts.sameStoredOrkflow` (orkflow_store.go:400-408) decides
  // "this apply is a repeat" with proto.Equal after clearing ONLY CreatedAt.
  // A per-apply timestamp there turns every re-apply of an unchanged document
  // into a version conflict (§4.4). Resolution time is audit data, not
  // identity: the version document's created_at already records when the
  // apply happened, and ActivityCommit records when the image actually ran.
  reserved 8;
  reserved "resolved_at";
  // platform_digest is the manifest digest the Orker actually ran, and the
  // platform it ran on. The engine leaves both empty; only an Orker fills
  // them, and only into ExecuteTaskResult.image and ActivityCommit.image.
  string platform_digest = 9;
  string platform = 10;
  // delivery records how the Orker obtained the image for this execution:
  // "registry" (pulled) or "embedded" (loaded from the OCI image layout,
  // §4.6). The engine leaves it empty; only an Orker fills it, beside
  // platform_digest. It exists because objective deliverable 10's embedded
  // fallback is otherwise invisible after the fact: an operator debugging a
  // stale builtin needs to know the pull did not happen.
  string delivery = 11;
}

// ---------------------------------------------------------------- execution shape

// ResourceRequest is what a task asks the Orker for. Orker policy may cap it
// (AGENTS.md §6); it may never raise it.
message ResourceRequest {
  string cpu = 1;     // Kubernetes spelling: "2", "500m"
  string memory = 2;  // Kubernetes spelling: "4Gi", "512Mi"
}

// EachSource is where a fan-out task's array lives: compiled at apply from
// EachSpec.over and stamped into the immutable version document, as
// Task.image is for `uses:`. Workflow code and the Orker read it and never
// parse `over`.
message EachSource {
  // input names a declared input (.inputs.<input>); task_id names a task in
  // the fan-out's needs closure (.tasks.<task_id>.output). Exactly one is set.
  string input = 1;
  string task_id = 2;
  // path is the object keys below that root, outermost first. It is empty
  // only for an input declared `type: array`; a task source always has at
  // least one key, because a values.json is an object. There is no array
  // index and no wildcard.
  repeated string path = 3;
}

// NetworkMode is the complete set of network configurations an Orkflow may
// select. Named Orker-defined profiles are deliberately absent (AGENTS.md §6).
enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;  // treated as NETWORK_MODE_DEFAULT
  NETWORK_MODE_DEFAULT = 1;
  NETWORK_MODE_NONE = 2;
}

// SecretRef names a secret and where the Orker gets it. The value never
// appears in a proto message, in Temporal history, or in the archive.
message SecretRef {
  // name is the file name the workload reads under /orkstack/input/secrets/.
  // Validated: ^[A-Za-z0-9._-]{1,128}$.
  string name = 1;
  // source is an Orker-resolvable locator, e.g. "env:DB_PASSWORD" or
  // "file:/etc/orkstack/secrets/db". Orker policy decides which schemes exist.
  string source = 2;
}
// WorkspaceLimits are the deployment-wide CONTRACT limits the Orker enforces
// after the container exits. They also appear verbatim in
// /orkstack/input/task.json so a workload can respect them instead of
// discovering them by failing.
//
// These are engine configuration and are uniform across a deployment, which is
// what lets them travel on RunPlan and lets the engine run its own
// INPUT_TOO_LARGE check. Orker-local RESOURCE policy — cpu, memory, pids caps
// — is deliberately NOT here: it varies per pool, the engine does not own it,
// and it reaches the workload as the effective values in task.json instead
// (§5.2, §9.3).
message WorkspaceLimits {
  int64 values_max_bytes = 1;      // default 262144 (256 KiB)
  int32 artifact_max_count = 2;    // default 256
  int64 artifact_max_bytes = 3;    // per artifact; default 5368709120 (5 GiB)
  int64 log_max_bytes = 4;         // per stream per attempt; default 16777216
  // commit_max_bytes bounds the serialized ActivityCommit. Default 4194304
  // (4 MiB). See §5.3 for why it is not 64 KiB, and §8.2 for what happens
  // when a legal workload would produce a commit above it.
  int64 commit_max_bytes = 5;
}

// ---------------------------------------------------------------- upstream

// UpstreamRef is one completed ancestor's contribution to a downstream task.
// It carries references only: fan-in is O(ancestors) small records, never a
// transitive copy of every ancestor's payload.
message UpstreamRef {
  string task_id = 1;
  // commit_uri addresses the ancestor's ActivityCommit object.
  string commit_uri = 2;
  // values is the reference to the ancestor's committed values.json.
  ArtifactRef values = 3;
  // artifacts are the ancestor's output artifacts, references only.
  repeated ArtifactRef artifacts = 4;
  // each is set when task_id is a fan-out task, and then commit_uri, values
  // and artifacts are unset: the fan-out has no commit of its own, its items
  // do. Set only on the input of a DIRECT dependent (a task naming the
  // fan-out in needs:). A task further downstream receives no ref for it.
  //
  // For a failure handler's input, a DIRECT need that FAILED and recorded
  // output artifacts contributes a ref with task_id and artifacts only —
  // commit_uri and values unset.
  EachUpstream each = 5;
}

// ---------------------------------------------------------------- pins

// PinContext tells an Orker that this attempt belongs to a pin, and which
// opening of it. It is set ONLY on a pinned task's input, so an unpinned
// task's recorded payload is byte-identical to what it was before this field
// existed (the golden history fixture has no pins and must keep matching
// without re-recording).
message PinContext {
  string name = 1;
  // instance_id identifies ONE opening of the pin within one run. The engine
  // takes it from the session it opened; the Orker keys the shared directory
  // by it and trusts nothing else to name that directory.
  string instance_id = 2;
  // timeout_seconds is the pin's lifetime bound as the engine set it
  // (Pin.timeout_seconds or the derived sum). The Orker derives the shared
  // directory's lease from it (docs/OCI_ACTIVITY_CONTRACT.md §6.4).
  int32 timeout_seconds = 3;
}

// ---------------------------------------------------------------- joins

// JoinPolicy is when a task with needs may start, decided from how its needs
// ended (docs/DSL.md "Joins and failure handlers"). Defined here rather than
// in orkflow.proto for the reason CacheScope is: activity.proto cannot import
// orkflow.proto, and JoinContext below carries it.
enum JoinPolicy {
  // UNSPECIFIED is all_succeeded: the task starts when every need SUCCEEDED,
  // and a SKIPPED need skips it. It is the ONLY encoding of the default — the
  // compiler writes it for `join: all_succeeded` and for no `join:` — so a
  // definition that names no join keeps its digest and every payload stays
  // byte-identical.
  JOIN_POLICY_UNSPECIFIED = 0;
  // NONE_FAILED: every need terminal, none FAILED or CANCELED, at least one
  // SUCCEEDED. SKIPPED needs are tolerated, which is what lets branches
  // re-join.
  JOIN_POLICY_NONE_FAILED = 1;
  // ANY_FAILED: at least one need FAILED, after its retries. A failure
  // handler: one of the two kinds of task that start in a failing run.
  JOIN_POLICY_ANY_FAILED = 2;
  // ALL_DONE: every need terminal, whatever its outcome. A failure handler.
  JOIN_POLICY_ALL_DONE = 3;
}

// NeedOutcome is how one need of a failure handler ended, as the run
// recorded it when the handler was dispatched.
message NeedOutcome {
  string task_id = 1;
  // status is SUCCEEDED, FAILED, SKIPPED or CANCELED and never another value:
  // a task is dispatched only once every need is terminal.
  Status status = 2;
  // error is the need's TaskRun.error, bounded field by field: code to 128
  // bytes, message to 1024 bytes and details to 256 bytes — three separate
  // bounds, each on the length of that field's JSON-escaped encoding, and a
  // cut field ends at a UTF-8 boundary with "…". category and retryable are
  // copied as they are. Set when the need recorded an error — always for
  // FAILED, for CANCELED when it was stopped in flight — and unset otherwise.
  Error error = 3;
}

// JoinContext tells a failure handler how each of its needs ended. It is set
// ONLY on the input of a container task whose join is ANY_FAILED or
// ALL_DONE, so every other task's recorded payload is byte-identical to what
// it was before this message existed. The Orker writes it to task.json as
// `join`. With at most 32 needs (docs/DSL.md rule 42) and NeedOutcome's
// bounds, its encoding is at most 64 KiB.
message JoinContext {
  JoinPolicy policy = 1;
  repeated NeedOutcome needs = 2;  // the task's needs, in written order
}

// ---------------------------------------------------------------- caching

// CacheScope is who may reuse a cached task's memo (docs/DSL.md "Caching").
enum CacheScope {
  // Never stored: the compiler writes ORKFLOW when `scope:` is absent.
  CACHE_SCOPE_UNSPECIFIED = 0;
  // Runs of the same Orkflow, in the same namespace.
  CACHE_SCOPE_ORKFLOW = 1;
  // Runs of any Orkflow of the same namespace whose task of the same id
  // computes the same key. The Orkflow's name is then not part of the key.
  CACHE_SCOPE_NAMESPACE = 2;
}

// CacheOutcome is what one attempt's memo step decided.
enum CacheOutcome {
  CACHE_OUTCOME_UNSPECIFIED = 0;
  // A memoized SUCCEEDED commit was reused: no image pulled, no secret read,
  // no container run. CacheResult.source names it.
  CACHE_OUTCOME_HIT = 1;
  // No usable memo: the container ran. CacheResult.miss_reason says why.
  CACHE_OUTCOME_MISS = 2;
  // The run was submitted with no_cache: no memo was read; the container ran
  // and its memo was refreshed.
  CACHE_OUTCOME_BYPASSED = 3;
}

// CacheContext tells an Orker that this attempt is of a cached task. It is
// set ONLY on such a task's input, so every other task's recorded payload is
// byte-identical to what it was before this field existed.
message CacheContext {
  // scope is never UNSPECIFIED on the wire.
  CacheScope scope = 1;
  // ttl_seconds is the EFFECTIVE bound on a reusable memo's age, measured
  // from its source's finished_at: the task's own ttl_seconds capped by the
  // deployment's ORK_CACHE_MAX_TTL, or the cap when the task set none. Always
  // positive.
  int64 ttl_seconds = 2;
  // refresh is true when the run was submitted with no_cache: the Orker reads
  // no memo, runs the container, and writes the memo from its fresh commit.
  bool refresh = 3;
}

// CacheSource names the commit a memo points at — the one a hit reused.
message CacheSource {
  string run_id = 1;
  string task_id = 2;
  string orkflow_name = 3;
  string orkflow_version = 4;
  string commit_uri = 5;
  // commit_sha256 is the hex SHA-256 of the source commit's exact stored
  // bytes (CommitRef.sha256), never a re-marshalling.
  string commit_sha256 = 6;
  // started_at / finished_at are the producing attempt's, copied from the
  // source ActivityCommit. A memo's age is measured from finished_at.
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  // item is set when the producer was one item of a fan-out (its 0-based
  // index); unset otherwise.
  optional int32 item = 9;
  // attempt is the producing attempt (ActivityCommit.attempt).
  int32 attempt = 10;
}

// CacheResult is one attempt's memo decision.
message CacheResult {
  CacheOutcome outcome = 1;
  // key is the 64-hex memo key. Empty only for a MISS whose reason is
  // INPUT_UNHASHED (no key could be computed).
  string key = 2;
  // miss_reason is set for MISS only: a stable token from the table in
  // docs/DSL.md "Caching" — MEMO_ABSENT, MEMO_EXPIRED, SOURCE_COMMIT_GONE, … —
  // a string, not an enum, so a reader of an older build still prints a
  // reason it has never heard of. It is never a failure code: it never
  // appears in TaskRun.error.
  string miss_reason = 3;
  // miss_detail is the Orker's sentence for the miss, at most 1 KiB.
  string miss_detail = 4;
  // source is set for HIT only.
  CacheSource source = 5;
  // memo_written / memo_write_error report the best-effort memo write that
  // follows a fresh commit (MISS or BYPASSED). Both are decided AFTER
  // commit.json is written, so neither is ever set on ActivityCommit.cache,
  // and an adopted result carries neither.
  bool memo_written = 6;
  string memo_write_error = 7;
  // key_components are the named digests the key was computed from — what
  // lets an operator see WHICH input changed between a miss and the run that
  // wrote the old memo. Set ONLY on TaskAttempt.cache and in CacheMemo; never
  // on ExecuteTaskResult, TaskRun or ActivityCommit, so run history stays
  // small.
  map<string, string> key_components = 8;
}

// CacheMemo is the stored memo: metadata/memo/{ns}/orkflow/{orkflow}/{task}/{key}.json
// or metadata/memo/{ns}/namespace/{task}/{key}.json, protojson + json.Indent
// exactly as a commit is (artifacts.MarshalMemo). A POINTER, written with a
// plain put, last writer wins: it holds no result and decides no execution
// state, and deleting it changes nothing but whether a container runs.
message CacheMemo {
  // schema_version is 1. A reader that does not know the value treats the
  // memo as a miss (MEMO_UNREADABLE), never as an error.
  int32 schema_version = 1;
  string key = 2;
  string namespace = 3;
  CacheScope scope = 4;
  // orkflow_name is the writer's Orkflow. The key covers it only under
  // CACHE_SCOPE_ORKFLOW.
  string orkflow_name = 5;
  string task_id = 6;
  // source is the FRESH commit this memo points at. A memo is written only
  // after a container ran and its commit was created, never after a hit.
  CacheSource source = 7;
  map<string, string> key_components = 8;
  // created_at is the writing Orker's clock; orker_id / build_id name it.
  google.protobuf.Timestamp created_at = 9;
  string orker_id = 10;
  string build_id = 11;
}

// ---------------------------------------------------------------- fan-out

// EachContext tells an Orker that this attempt is ONE ITEM of a fan-out task.
// It is set ONLY on an item's input, so every other task's recorded payload is
// byte-identical to what it was before this field existed.
message EachContext {
  // index is the item's 0-based position in the expanded array; count is the
  // array's length. Both are the engine's, recorded at expansion.
  int32 index = 1;
  int32 count = 2;
  // as is the name the item is bound to in `with:` (.each.<as>), as compiled.
  string as = 3;
  // source is where the Orker reads the item from: the run input, or the
  // staged values.json of source.task_id, walked by source.path, element
  // [index]. The array is the one the engine counted; the Orker verifies its
  // length equals count and fails the attempt EACH_ITEM_UNAVAILABLE if not.
  EachSource source = 4;
}

// EachUpstream is a fan-out ancestor's contribution to a DIRECT dependent: not
// N references, which would grow the dependent's input with the item count,
// but the two facts that address every one of them. The Orker composes item
// i's commit URI as commit_root + "/" +
// artifacts.ItemCommitKey(namespace, run_id, task_id, i) — the single shared
// renderer the engine used to dispatch that item — and stages from the commit.
message EachUpstream {
  // count is the number of items, every one SUCCEEDED (a dependent runs only
  // after its fan-out succeeded). 0 is legal: the fan-out expanded to nothing.
  int32 count = 1;
  // commit_root is RunPlan.commit_root, the root every commit URI of this run
  // is composed against.
  string commit_root = 2;
}

// ---------------------------------------------------------------- the seam

// ExecuteTaskInput is the argument of the ExecuteTask Temporal activity. It
// replaces the Go struct at internal/task/contract.go:49-84 outright.
//
// Serialized size MUST NOT exceed 262144 bytes (AGENTS.md §2.2). The engine
// checks this deterministically before scheduling and fails the task with
// ContractViolation/INPUT_TOO_LARGE when it would be exceeded.
message ExecuteTaskInput {
  // --- coordinates
  string run_id = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  // orkflow_definition_digest is the sha256 of the canonical compiled
  // definition this run pinned (AGENTS.md §2.2, §7.2).
  string orkflow_definition_digest = 4;
  string namespace = 5;   // empty means the built-in "default"
  string pool = 6;        // empty means the deployment's default pool
  string task_id = 7;

  // --- identity
  // idempotency_key is the stable key of one logical activity, unchanged
  // across every retry (AGENTS.md §3, §4). Its value is exactly
  //   "{namespace-or-default}/{run_id}/{task_id}"
  //
  // The name is plain, not "task_idempotency_key", for two reasons: its wire
  // JSON (`idempotencyKey`) is then byte-identical to the key the workspace
  // already writes into /orkstack/input/task.json, and there is nothing to
  // collide with — proto scopes field names per message, and the run
  // submission key lives on a different message entirely
  // (SubmitRunRequest.idempotency_key = 4, run_service.proto). The Go
  // identifiers stay distinct.
  string idempotency_key = 8;
  // commit_uri is the deterministic object URI of this activity's commit
  // record. The engine composes it from the commit-store root carried in
  // RunPlan (decided at submit, outside workflow code) plus the run and task
  // coordinates, so composing it stays a pure function of workflow arguments
  // (§5.2, §7.2).
  string commit_uri = 9;

  // --- what to run
  ImageRef image = 10;
  // command overrides the image ENTRYPOINT/CMD. Empty means the image decides.
  repeated string command = 11;
  // with is the RAW, un-rendered `with:` block. Rendering stays in the Orker
  // because `artifact "<task>/<name>"` resolves to a path only the Orker knows
  // after staging (internal/task/contract.go:7-13). The rendered result is
  // materialized to /orkstack/input/config.json.
  google.protobuf.Struct with = 12;
  // env is workload-supplied environment. The platform puts NOTHING here:
  // required platform state travels as files (AGENTS.md §3).
  map<string, string> env = 13;
  repeated SecretRef secrets = 14;

  // --- how to run it
  int32 timeout_seconds = 15;                    // container wall clock
  int32 cancellation_grace_period_seconds = 16;  // default 30 (AGENTS.md §3.3)
  ResourceRequest resources = 17;
  NetworkMode network = 18;
  WorkspaceLimits limits = 19;

  // --- context
  Payload run_input = 20;               // exposed to templates as .inputs
  repeated UpstreamRef upstream = 21;   // exposed as .tasks.<id>

  // run_as_orker_user makes the Orker add --user <orker-uid>:<orker-gid>, so
  // it owns every file the workload writes and can read them whatever umask
  // the image uses (§3.1). Opt-in, because it overrides the image's own USER.
  bool run_as_orker_user = 22;

  // telemetry is the run's pinned telemetry selection, decided at submit from
  // the namespace's policy and the orkflow's labels, and carried on the plan
  // (engine.RunPlan). UNSET when the deployment configured none, which keeps
  // recorded activity payloads byte-identical for such runs — the golden
  // history fixture (internal/engine/testdata/history) has no telemetry and
  // must keep matching without re-recording.
  TelemetrySelection telemetry = 23;

  // pin tells the Orker this attempt belongs to a pin, and which opening of
  // it. UNSET for an unpinned task, which keeps such a task's recorded
  // payload byte-identical to what it was before this field existed.
  PinContext pin = 24;

  // image_policy is the policy in force for this run, decided at submit and
  // carried on the plan (engine.RunPlan.ImagePolicy). UNSET when the
  // deployment configured none and the namespace names no signer, which
  // keeps such a task's recorded payload byte-identical to what it was
  // before this field existed — the golden history fixture
  // (internal/engine/testdata/history) has no policy and must keep matching
  // without re-recording. The Orker checks image against it, and verifies
  // require_signed_by, AFTER its retry-start commit check and BEFORE it
  // builds a workspace or pulls: an attempt whose commit.json exists is
  // adopted without being judged again.
  ImagePolicySelection image_policy = 25;

  // each tells the Orker this attempt is one item of a fan-out, which one, and
  // where the item's value is. UNSET for every task that is not an item, which
  // keeps such a task's recorded payload byte-identical (the golden history
  // fixture has no fan-out and must keep matching without re-recording).
  EachContext each = 26;

  // cache tells the Orker this is an attempt of a cached task (CacheContext).
  // UNSET for every task that declares no cache:, and for every task of a run
  // whose plan carries no cache plan, which keeps such a task's recorded
  // payload byte-identical (the golden history fixture has no cached task and
  // must keep matching without re-recording).
  CacheContext cache = 27;

  // join tells a failure handler how its needs ended. UNSET for every task
  // whose join is not ANY_FAILED or ALL_DONE, which keeps such a task's
  // recorded payload byte-identical to what it was before this field existed
  // (the golden history fixtures have no failure handler and must keep
  // matching without re-recording).
  JoinContext join = 28;
}

// ReleasePinInput asks the pin host to remove the pin's shared directory.
// Scheduled by the engine on the pin's own session, so it lands on the host
// that owns the directory; a host that has no such directory returns success
// (idempotent).
message ReleasePinInput {
  string run_id = 1;
  string namespace = 2;
  PinContext pin = 3;
}

// CommitRef points at a written ActivityCommit object.
message CommitRef {
  string uri = 1;
  // sha256 is the hex sha256 of the exact bytes written to, or read from, the
  // store. It MUST NEVER be recomputed by re-marshalling a decoded
  // ActivityCommit: protojson deliberately varies its output across builds
  // (§14.10), so a rebuilt Orker would compute a different digest for an
  // unchanged commit.
  string sha256 = 2;
  string etag = 3;       // store etag observed at write or read
  google.protobuf.Timestamp created_at = 4;
}

// ExecuteTaskResult is what an Orker returns for a SUCCEEDED activity. A
// failure is an ApplicationError, not a result (§8).
message ExecuteTaskResult {
  string task_id = 1;
  // exit_code is the container's exit status. It is always 0 in a result: a
  // non-zero exit is a failure. It travels so the engine, the archive and the
  // UI record the fact rather than inferring it.
  int32 exit_code = 2;
  // commit references the durable completion record. Always set.
  CommitRef commit = 3;
  // artifacts are the workload's output artifacts, references only.
  repeated ArtifactRef artifacts = 4;
  // system_artifacts are platform-owned objects — stdout.log, stderr.log —
  // kept in a separate field so a workload artifact can never collide with a
  // platform name.
  repeated ArtifactRef system_artifacts = 5;
  // values_ref addresses the committed values.json. Always set.
  ArtifactRef values_ref = 6;
  // values_json is the inline copy of values.json — the workload's EXACT
  // bytes — present ONLY when values.json is at most 4096 bytes. It exists
  // for the engine's read model (TaskRun.output, the UI). Nothing renders a
  // downstream template from it; downstream tasks read the committed object.
  //
  // It is `bytes`, not Payload, because Payload wraps google.protobuf.Struct
  // and a Struct round trip is lossy in four measured ways: key order is not
  // preserved, number formatting is normalized, unicode escapes are decoded,
  // and an integer outside float64's exact range is SILENTLY CORRUPTED
  // (12345678901234567890 -> 12345678901234567000). See §14.9. A field that
  // promises byte identity cannot be a Struct.
  bytes values_json = 7;
  bool values_inlined = 8;
  // image is the ImageRef as executed, with platform_digest and platform set.
  ImageRef image = 9;
  // commit_adopted is true when this attempt found an existing commit and
  // returned it without running the container (§5.4).
  bool commit_adopted = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  string orker_id = 13;
  // attempt is the Temporal attempt that produced this result: from
  // activity.GetInfo(ctx).Attempt on a fresh run, and from commit.attempt on
  // an adopted one (§5.4). Workflow code cannot call GetInfo, and an adopted
  // result carries a CommitRef rather than the commit body, so without this
  // field the engine cannot populate TaskRun.attempt identically for fresh and
  // adopted results.
  int32 attempt = 14;

  // cache is this attempt's memo decision, key_components cleared. Set if and
  // only if ExecuteTaskInput.cache was set; on an adopted result it is
  // ActivityCommit.cache of the adopted commit.
  //
  // On a HIT: artifacts, system_artifacts, values_ref and image are the
  // SOURCE commit's (the content-addressed objects and the image that
  // produced them); commit is THIS run's own commit.json; exit_code is 0;
  // started_at, finished_at, orker_id and attempt are this attempt's; and
  // commit_adopted is false (this attempt wrote the commit).
  CacheResult cache = 15;
}

// ---------------------------------------------------------------- the commit record

// ActivityCommit is the immutable completion manifest (AGENTS.md §4.1). It is
// serialized with protojson and stored as commit.json. Serialized size MUST
// NOT exceed WorkspaceLimits.commit_max_bytes (default 4 MiB, §5.3).
message ActivityCommit {
  // schema_version is 1. A reader that does not know the value refuses the
  // commit with ContractViolation/COMMIT_SCHEMA_UNSUPPORTED rather than
  // guessing (§5.4).
  int32 schema_version = 1;

  string namespace = 2;
  string run_id = 3;
  string task_id = 4;
  string orkflow_name = 5;
  string orkflow_version = 6;
  string orkflow_definition_digest = 7;
  string idempotency_key = 8;

  ImageRef image = 9;                        // with platform_digest and delivery set
  int32 exit_code = 10;                      // always 0 in schema_version 1
  ArtifactRef values = 11;
  repeated ArtifactRef artifacts = 12;
  repeated ArtifactRef system_artifacts = 13;

  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  int32 attempt = 16;                        // the attempt that committed
  string orker_id = 17;
  string build_id = 18;                      // ORK_BUILD_ID of the committer

  // cache is the memo decision of the attempt that committed, for a cached
  // task only; unset otherwise, so every existing commit is unchanged. A HIT
  // commit names its source: its values, artifacts, system_artifacts and
  // image are the source's references, and its identity fields
  // (namespace … idempotency_key, image.index_digest) are THIS activity's, so
  // §5.4 adoption of it on a retry is the ordinary one. memo_written,
  // memo_write_error and key_components are never set here.
  CacheResult cache = 19;
}

// ---------------------------------------------------------------- failure transport

// ActivityFailureDetail is what a FAILED activity returns. A failure produces
// no ExecuteTaskResult, and orkstack.v1.Error.details is a bare string, so
// without this message everything a failing task produced is unreachable: an
// exit-1 task can upload its test report and its stderr and leave the engine
// with nowhere to put the references.
//
// It travels as the single `details` argument of
// temporal.NewApplicationError(message, category, detail); the Go SDK carries
// details through the configured data converter, and the workflow retrieves
// them with errors.As to *ApplicationError followed by .Details(&out).
//
// The engine then populates TaskRun.artifacts, .system_artifacts, .exit_code
// and .attempt on the failure path exactly as it does on the success path, so
// a failed attempt is as inspectable as a successful one.
message ActivityFailureDetail {
  string reason_code = 1;              // the §8.2 code, e.g. "VALUES_MISSING"
  FailureCategory category = 2;
  int32 exit_code = 3;                 // 0 when the container never ran
  repeated ArtifactRef artifacts = 4;  // what the failure path managed to upload
  repeated ArtifactRef system_artifacts = 5;
  // scan_notes carries §3.5 violations found on the failure path. They are
  // notes ON the workload's error, never a replacement for it (§7.1 step 14).
  repeated string scan_notes = 6;
  ImageRef image = 7;
  int32 attempt = 8;
  string orker_id = 9;

  // started_at is when this Orker began the attempt that failed, the same
  // instant ExecuteTaskResult.started_at carries on the success path, so the
  // engine can project TaskRun.started_at identically for both outcomes.
  // Stamped by the Orker on every ApplicationError it returns, whether or
  // not a container ran.
  google.protobuf.Timestamp started_at = 10;
}

// ---------------------------------------------------------------- orker identity

// DescribeOrkerResult is the pool-liveness probe's payload: a pool proves it
// is alive by answering DescribeOrker (§6.5).
message DescribeOrkerResult {
  string orker_id = 1;
  string build_id = 2;
  string pool = 3;
  string runtime_name = 4;      // "docker"
  string runtime_version = 5;
  string security_profile = 6;  // the profile id the Orker enforces (§9.2)
  // max_concurrent is ORK_ORKER_MAX_CONCURRENT: how many tasks this Orker runs
  // at once, the size of its task worker's activity slots.
  int32 max_concurrent = 7;
  bool rootless = 8;
  // max_concurrent_pins is ORK_ORKER_MAX_PINS: how many pins this Orker hosts
  // at once. 0 means it hosts none, and a submit that pins a task to this
  // Orker's pool is refused at submit rather than left waiting.
  int32 max_concurrent_pins = 9;

  // cordoned is this Orker's process-local cordon flag. It is NEVER stored
  // anywhere but the process: a restarted Orker answers false.
  bool cordoned = 10;
  // cordon_reason is the reason given to CordonOrker; empty when not
  // cordoned.
  string cordon_reason = 11;
  // cordoned_at is when the flag was last set; unset when not cordoned.
  google.protobuf.Timestamp cordoned_at = 12;
  // running_tasks is how many ExecuteTask activities this Orker has in
  // flight right now, pinned members included. Counted in the process; it
  // is a measurement, not a projection.
  int32 running_tasks = 13;
  // open_pins is how many pins this Orker currently hosts: pins it accepted
  // and has not closed. Counted from the pin openings in flight, so it is
  // exact from the instant a pin is accepted, before its first member
  // arrives. It never exceeds max_concurrent_pins.
  int32 open_pins = 14;
  // pins details each open pin, ordered by run_id. len(pins) == open_pins.
  repeated OpenPin pins = 15;
  // each_supported is true on an Orker that implements fan-out items: it
  // honours ExecuteTaskInput.each (task.json `each`, .each in with:) and
  // stages EachUpstream. An Orker built before it answers false (unset), and
  // submit refuses an Orkflow with a fan-out on such a pool rather than let it
  // run items without their item or a dependent without its items.
  bool each_supported = 16;
  // cache_supported is true on an Orker that implements the memo step. An
  // Orker built before it answers false (unset), and submit refuses an
  // Orkflow with a cached task on its pool: the SDK's default payload
  // converter refuses unknown fields, so such an Orker would FAIL every
  // cached task's attempt on decoding ExecuteTaskInput.cache.
  bool cache_supported = 17;
  // join_supported is true on an Orker that reads ExecuteTaskInput.join
  // (task.json `join`). An Orker built before it answers false (unset), and
  // submit refuses an Orkflow with a container failure handler on its pool:
  // the SDK's default payload converter refuses unknown fields, so such an
  // Orker would FAIL every attempt of a failure handler on decoding
  // ExecuteTaskInput.join — the compensation step of a run that is already
  // failing.
  bool join_supported = 18;
}

// OpenPin is one pin this Orker currently hosts: a pin it has accepted and
// not yet closed. It names the run and the pin, never the mechanism behind
// it (AGENTS.md §7), and says when the shared directory's
// lease ends, which is the longest the pin can live even if nothing else
// closes it (docs/OCI_ACTIVITY_CONTRACT.md §6.4).
message OpenPin {
  string run_id = 1;
  // pin is the name the author wrote in `pin:`. EMPTY until the pin's first
  // member attempt arrives: the Orker learns the name from
  // ExecuteTaskInput.pin, and a pin is open from the moment it is accepted,
  // before any member has been dispatched to it.
  string pin = 2;
  // since is when this Orker accepted the pin.
  google.protobuf.Timestamp since = 3;
  // expires_at is the shared directory's lease (lease.json). UNSET until the
  // first member arrives and writes it; a client renders "-", never a time.
  google.protobuf.Timestamp expires_at = 4;
}

// CordonOrkerInput is the argument of the CordonOrker activity, dispatched
// on ONE Orker's control channel. `cordoned = false` clears the flag; then
// reason is ignored.
message CordonOrkerInput {
  bool cordoned = 1;
  // reason is required when cordoned is true; at most 256 bytes, no control
  // characters. It is what ListOrkers shows beside the state and what the
  // drain loop prints, so an operator reading the fleet knows why.
  string reason = 2;
}

// Orker is one execution process, observed live.
message Orker {
  string orker_id = 1;
  // pool is the pool the Orker reports serving (DescribeOrkerResult.pool).
  string pool = 2;
  string build_id = 3;               // empty when versioning is off
  int32 running_tasks = 4;
  int32 open_pins = 5;
  int32 max_concurrent_pins = 6;     // ORK_ORKER_MAX_PINS; 0 means not a pin host
  bool cordoned = 7;
  string cordon_reason = 8;          // empty when not cordoned
  google.protobuf.Timestamp cordoned_at = 9;
  // last_seen is the most recent moment this Orker was observed polling.
  // It answers "how fresh is this row", never "when did this Orker die".
  google.protobuf.Timestamp last_seen = 10;
  // unavailable_reason says this Orker COULD NOT BE ASKED, and why — the
  // same three-state distinction Pool.unavailable_reason makes, for the same
  // reason: "not measured" rendered as "measured zero" sends an operator to
  // stop a host that may be mid-task. When set, fields 2–9 and 12 are
  // unset: nothing was measured, so there is no number to report.
  string unavailable_reason = 11;
  repeated OpenPin pins = 12;
}
