syntax = "proto3";

package orkstack.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/common.proto";
import "orkstack/v1/image_policy.proto";
import "orkstack/v1/telemetry.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// ---------------------------------------------------------------- images

// ImageRef is an OCI image resolved to an immutable reference. The engine
// produces it at apply time and it never changes afterwards: a run executes
// what `pinned` names, whatever a tag does later.
message ImageRef {
  // reference is what the author wrote, verbatim: "ghcr.io/acme/migrate:v3",
  // "shell", or an already-pinned "repo@sha256:...". Never used to pull.
  string reference = 1;
  // registry is the resolved host, e.g. "ghcr.io" or "docker.io".
  string registry = 2;
  // repository is the resolved path, e.g. "acme/migrate".
  string repository = 3;
  // index_digest is the digest of the object the tag named at resolve time:
  // an OCI image index for a multi-platform tag, an image manifest otherwise.
  // Spelled "sha256:<64 hex>".
  string index_digest = 4;
  // pinned is the only string that may be pulled or run:
  //   "{registry}/{repository}@{index_digest}"
  string pinned = 5;
  // media_type is the media type index_digest addresses.
  string media_type = 6;
  // platforms lists the platforms the index advertises, "os/arch[/variant]".
  // Empty for a single-manifest reference.
  repeated string platforms = 7;
  // 8 held resolved_at, the wall-clock time of the resolution. It is REMOVED,
  // not merely excluded from the definition digest: ImageRef travels inside
  // Task, Task travels inside the immutable Orkflow version document, and
  // `pkg/artifacts.sameStoredOrkflow` (orkflow_store.go:400-408) decides
  // "this apply is a repeat" with proto.Equal after clearing ONLY CreatedAt.
  // A per-apply timestamp there turns every re-apply of an unchanged document
  // into a version conflict (§4.4). Resolution time is audit data, not
  // identity: the version document's created_at already records when the
  // apply happened, and ActivityCommit records when the image actually ran.
  reserved 8;
  reserved "resolved_at";
  // platform_digest is the manifest digest the Orker actually ran, and the
  // platform it ran on. The engine leaves both empty; only an Orker fills
  // them, and only into ExecuteTaskResult.image and ActivityCommit.image.
  string platform_digest = 9;
  string platform = 10;
  // delivery records how the Orker obtained the image for this execution:
  // "registry" (pulled) or "embedded" (loaded from the OCI image layout,
  // §4.6). The engine leaves it empty; only an Orker fills it, beside
  // platform_digest. It exists because objective deliverable 10's embedded
  // fallback is otherwise invisible after the fact: an operator debugging a
  // stale builtin needs to know the pull did not happen.
  string delivery = 11;
}

// ---------------------------------------------------------------- execution shape

// ResourceRequest is what a task asks the Orker for. Orker policy may cap it
// (AGENTS.md §6); it may never raise it.
message ResourceRequest {
  string cpu = 1;     // Kubernetes spelling: "2", "500m"
  string memory = 2;  // Kubernetes spelling: "4Gi", "512Mi"

  // gpu is how many units of the task's gpu profile it holds
  // (resources.gpu): 0 for none, otherwise 1 to 64.
  int32 gpu = 3;
}

// EachSource is where a fan-out task's array lives: compiled at apply from
// EachSpec.over and stamped into the immutable version document, as
// Task.image is for `uses:`. Workflow code and the Orker read it and never
// parse `over`.
message EachSource {
  // input names a declared input (.inputs.<input>); task_id names a task in
  // the fan-out's needs closure (.tasks.<task_id>.output). Exactly one is set.
  string input = 1;
  string task_id = 2;
  // path is the object keys below that root, outermost first. It is empty
  // only for an input declared `type: array`; a task source always has at
  // least one key, because a values.json is an object. There is no array
  // index and no wildcard.
  repeated string path = 3;

  // artifact names an artifact of a task in the fan-out's needs, compiled
  // from EachSpec.over_artifact: the fan-out runs over its lines. When it is
  // set, input, task_id and path are empty.
  EachArtifactSource artifact = 4;
}

// NetworkMode is the complete set of network configurations an Orkflow may
// select (AGENTS.md §6).
enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;  // treated as NETWORK_MODE_DEFAULT
  NETWORK_MODE_DEFAULT = 1;
  NETWORK_MODE_NONE = 2;
}

// SecretRef names a secret and where the Orker gets it. The value never
// appears in a proto message, in Temporal history, or in the archive.
message SecretRef {
  // name is the file name the workload reads under /orkstack/input/secrets/.
  // Validated: ^[A-Za-z0-9._-]{1,128}$.
  string name = 1;
  // source is an Orker-resolvable locator, e.g. "env:DB_PASSWORD" or
  // "file:/etc/orkstack/secrets/db". Orker policy decides which schemes exist.
  string source = 2;

  // grant is set from identity (E83); unset until it lands (v0.4.0 proto batch).
  string grant = 3;

  // ciphertext is set from identity (E84); unset until it lands (v0.4.0 proto batch).
  string ciphertext = 4;

  // unmasked is the DSL's `mask: false`: the value is neither masked in the
  // task's logs nor looked for in its values.json. Absent means masked. A
  // value is unmasked only when every secret holding it says so.
  bool unmasked = 5;
}
// WorkspaceLimits are the deployment-wide CONTRACT limits the Orker enforces
// after the container exits. They also appear verbatim in
// /orkstack/input/task.json so a workload can respect them instead of
// discovering them by failing.
//
// These are engine configuration and are uniform across a deployment, which is
// what lets them travel on RunPlan and lets the engine run its own
// INPUT_TOO_LARGE check. Orker-local RESOURCE policy — cpu, memory, pids caps
// — is deliberately NOT here: it varies per pool, the engine does not own it,
// and it reaches the workload as the effective values in task.json instead
// (§5.2, §9.3).
message WorkspaceLimits {
  int64 values_max_bytes = 1;      // default 262144 (256 KiB)
  int32 artifact_max_count = 2;    // default 256
  int64 artifact_max_bytes = 3;    // per artifact; default 5368709120 (5 GiB)
  int64 log_max_bytes = 4;         // per stream per attempt; default 16777216
  // commit_max_bytes bounds the serialized ActivityCommit. Default 4194304
  // (4 MiB). See §5.3 for why it is not 64 KiB, and §8.2 for what happens
  // when a legal workload would produce a commit above it.
  int64 commit_max_bytes = 5;
}

// ---------------------------------------------------------------- upstream

// UpstreamRef is one completed ancestor's contribution to a downstream task.
// It carries references only: fan-in is O(ancestors) small records, never a
// transitive copy of every ancestor's payload.
message UpstreamRef {
  string task_id = 1;
  // commit_uri addresses the ancestor's ActivityCommit object.
  string commit_uri = 2;
  // values is the reference to the ancestor's committed values.json.
  ArtifactRef values = 3;
  // artifacts are the ancestor's output artifacts, references only.
  repeated ArtifactRef artifacts = 4;
  // each is set when task_id is a fan-out task, and then commit_uri, values
  // and artifacts are unset: the fan-out has no commit of its own, its items
  // do. Set only on the input of a DIRECT dependent (a task naming the
  // fan-out in needs:). A task further downstream receives no ref for it.
  //
  // For a failure handler's input, a DIRECT need that FAILED and recorded
  // output artifacts contributes a ref with task_id and artifacts only —
  // commit_uri and values unset.
  EachUpstream each = 5;

  // record_uri is the engine's record of an awaited or a composed task, of a
  // run whose results the engine records: the Orker stages what it names.
  // Unset for every other upstream and run.
  string record_uri = 6;
}

// ---------------------------------------------------------------- pins

// PinContext tells an Orker that this attempt belongs to a pin, and which
// opening of it. It is set ONLY on a pinned task's input, so an unpinned
// task's recorded payload is byte-identical to what it was before this field
// existed (the golden history fixture has no pins and must keep matching
// without re-recording).
message PinContext {
  string name = 1;
  // instance_id identifies ONE opening of the pin within one run. The engine
  // takes it from the session it opened; the Orker keys the shared directory
  // by it and trusts nothing else to name that directory.
  string instance_id = 2;
  // timeout_seconds is the pin's lifetime bound as the engine set it
  // (Pin.timeout_seconds or the derived sum). The Orker derives the shared
  // directory's lease from it (docs/OCI_ACTIVITY_CONTRACT.md §6.4).
  int32 timeout_seconds = 3;
}

// ---------------------------------------------------------------- joins

// JoinPolicy is when a task with needs may start, decided from how its needs
// ended (docs/DSL.md "Joins and failure handlers"). Defined here rather than
// in orkflow.proto for the reason CacheScope is: activity.proto cannot import
// orkflow.proto, and JoinContext below carries it.
enum JoinPolicy {
  // UNSPECIFIED is all_succeeded: the task starts when every need SUCCEEDED,
  // and a SKIPPED need skips it. It is the ONLY encoding of the default — the
  // compiler writes it for `join: all_succeeded` and for no `join:` — so a
  // definition that names no join keeps its digest and every payload stays
  // byte-identical.
  JOIN_POLICY_UNSPECIFIED = 0;
  // NONE_FAILED: every need terminal, none FAILED or CANCELED, at least one
  // SUCCEEDED. SKIPPED needs are tolerated, which is what lets branches
  // re-join.
  JOIN_POLICY_NONE_FAILED = 1;
  // ANY_FAILED: at least one need FAILED, after its retries. A failure
  // handler: one of the two kinds of task that start in a failing run.
  JOIN_POLICY_ANY_FAILED = 2;
  // ALL_DONE: every need terminal, whatever its outcome. A failure handler.
  JOIN_POLICY_ALL_DONE = 3;
}

// NeedOutcome is how one need of a failure handler ended, as the run
// recorded it when the handler was dispatched.
message NeedOutcome {
  string task_id = 1;
  // status is SUCCEEDED, FAILED, SKIPPED or CANCELED and never another value:
  // a task is dispatched only once every need is terminal.
  Status status = 2;
  // error is the need's TaskRun.error, bounded field by field: code to 128
  // bytes, message to 1024 bytes and details to 256 bytes — three separate
  // bounds, each on the length of that field's JSON-escaped encoding, and a
  // cut field ends at a UTF-8 boundary with "…". category and retryable are
  // copied as they are. Set when the need recorded an error — always for
  // FAILED, for CANCELED when it was stopped in flight — and unset otherwise.
  Error error = 3;
}

// JoinContext tells a failure handler how each of its needs ended. It is set
// ONLY on the input of a container task whose join is ANY_FAILED or
// ALL_DONE, so every other task's recorded payload is byte-identical to what
// it was before this message existed. The Orker writes it to task.json as
// `join`. With at most 32 needs (docs/DSL.md rule 42) and NeedOutcome's
// bounds, its encoding is at most 64 KiB.
message JoinContext {
  JoinPolicy policy = 1;
  repeated NeedOutcome needs = 2;  // the task's needs, in written order
}

// ---------------------------------------------------------------- caching

// CacheScope is who may reuse a cached task's memo (docs/DSL.md "Caching").
enum CacheScope {
  // Never stored: the compiler writes ORKFLOW when `scope:` is absent.
  CACHE_SCOPE_UNSPECIFIED = 0;
  // Runs of the same Orkflow, in the same namespace.
  CACHE_SCOPE_ORKFLOW = 1;
  // Runs of any Orkflow of the same namespace whose task of the same id
  // computes the same key. The Orkflow's name is then not part of the key.
  CACHE_SCOPE_NAMESPACE = 2;
}

// CacheOutcome is what one attempt's memo step decided.
enum CacheOutcome {
  CACHE_OUTCOME_UNSPECIFIED = 0;
  // A memoized SUCCEEDED commit was reused: no image pulled, no secret read,
  // no container run. CacheResult.source names it.
  CACHE_OUTCOME_HIT = 1;
  // No usable memo: the container ran. CacheResult.miss_reason says why.
  CACHE_OUTCOME_MISS = 2;
  // The run was submitted with no_cache, or resumed for another result of
  // this task: no memo was read; the container ran and its memo was refreshed.
  CACHE_OUTCOME_BYPASSED = 3;
}

// CacheContext tells an Orker that this attempt is of a cached task. It is
// set ONLY on such a task's input, so every other task's recorded payload is
// byte-identical to what it was before this field existed.
message CacheContext {
  // scope is never UNSPECIFIED on the wire.
  CacheScope scope = 1;
  // ttl_seconds is the EFFECTIVE bound on a reusable memo's age, measured
  // from its source's finished_at: the task's own ttl_seconds capped by the
  // deployment's ORK_CACHE_MAX_TTL, or the cap when the task set none. Always
  // positive.
  int64 ttl_seconds = 2;
  // refresh is true when the run was submitted with no_cache, and for a task
  // or item a resume runs again for another result: the Orker reads no memo,
  // runs the container, and writes the memo from its fresh commit.
  bool refresh = 3;
  // orkflow_namespace is set only when the task belongs to an Orkflow another
  // namespace shared through composition: the namespace that owns the
  // definition. It is part of the memo key, so the same task of two
  // namespaces' Orkflows of one name never shares a memo.
  string orkflow_namespace = 4;
}

// CacheSource names the commit a memo points at — the one a hit reused.
message CacheSource {
  string run_id = 1;
  string task_id = 2;
  string orkflow_name = 3;
  string orkflow_version = 4;
  string commit_uri = 5;
  // commit_sha256 is the hex SHA-256 of the source commit's exact stored
  // bytes (CommitRef.sha256), never a re-marshalling.
  string commit_sha256 = 6;
  // started_at / finished_at are the producing attempt's, copied from the
  // source ActivityCommit. A memo's age is measured from finished_at.
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  // item is set when the producer was one item of a fan-out (its 0-based
  // index); unset otherwise.
  optional int32 item = 9;
  // attempt is the producing attempt (ActivityCommit.attempt).
  int32 attempt = 10;
}

// CacheResult is one attempt's memo decision.
message CacheResult {
  CacheOutcome outcome = 1;
  // key is the 64-hex memo key. Empty only for a MISS whose reason is
  // INPUT_UNHASHED (no key could be computed).
  string key = 2;
  // miss_reason is set for MISS only: a stable token from the table in
  // docs/DSL.md "Caching" — MEMO_ABSENT, MEMO_EXPIRED, SOURCE_COMMIT_GONE, … —
  // a string, not an enum, so a reader of an older build still prints a
  // reason it has never heard of. It is never a failure code: it never
  // appears in TaskRun.error.
  string miss_reason = 3;
  // miss_detail is the Orker's sentence for the miss, at most 1 KiB.
  string miss_detail = 4;
  // source is set for HIT only.
  CacheSource source = 5;
  // memo_written / memo_write_error report the best-effort memo write that
  // follows a fresh commit (MISS or BYPASSED). Both are decided AFTER
  // commit.json is written, so neither is ever set on ActivityCommit.cache,
  // and an adopted result carries neither.
  bool memo_written = 6;
  string memo_write_error = 7;
  // key_components are the named digests the key was computed from — what
  // lets an operator see WHICH input changed between a miss and the run that
  // wrote the old memo. Set ONLY on TaskAttempt.cache and in CacheMemo; never
  // on ExecuteTaskResult, TaskRun or ActivityCommit, so run history stays
  // small.
  map<string, string> key_components = 8;
}

// CacheMemo is the stored memo: metadata/memo/{ns}/orkflow/{orkflow}/{task}/{key}.json
// or metadata/memo/{ns}/namespace/{task}/{key}.json, protojson + json.Indent
// exactly as a commit is (artifacts.MarshalMemo). A POINTER, written with a
// plain put, last writer wins: it holds no result and decides no execution
// state, and deleting it changes nothing but whether a container runs.
message CacheMemo {
  // schema_version is 1. A reader that does not know the value treats the
  // memo as a miss (MEMO_UNREADABLE), never as an error.
  int32 schema_version = 1;
  string key = 2;
  string namespace = 3;
  CacheScope scope = 4;
  // orkflow_name is the writer's Orkflow. The key covers it only under
  // CACHE_SCOPE_ORKFLOW.
  string orkflow_name = 5;
  string task_id = 6;
  // source is the FRESH commit this memo points at. A memo is written only
  // after a container ran and its commit was created, never after a hit.
  CacheSource source = 7;
  map<string, string> key_components = 8;
  // created_at is the writing Orker's clock; orker_id / build_id name it.
  google.protobuf.Timestamp created_at = 9;
  string orker_id = 10;
  string build_id = 11;
}

// ---------------------------------------------------------------- fan-out

// EachContext tells an Orker that this attempt is ONE ITEM of a fan-out task.
// It is set ONLY on an item's input, so every other task's recorded payload is
// byte-identical to what it was before this field existed.
message EachContext {
  // index is the item's 0-based position in the expanded array; count is the
  // array's length. Both are the engine's, recorded at expansion.
  int32 index = 1;
  int32 count = 2;
  // as is the name the item is bound to in `with:` (.each.<as>), as compiled.
  string as = 3;
  // source is where the Orker reads the item from: the run input, or the
  // staged values.json of source.task_id, walked by source.path, element
  // [index]. The array is the one the engine counted; the Orker verifies its
  // length equals count and fails the attempt EACH_ITEM_UNAVAILABLE if not.
  EachSource source = 4;

  // lines is set for an item of a fan-out over an artifact's lines: the
  // source and its line index, which the Orker reads the item's span from.
  // The source is never staged.
  EachLines lines = 5;
}

// EachUpstream is a fan-out ancestor's contribution to a DIRECT dependent: not
// N references, which would grow the dependent's input with the item count,
// but the two facts that address every one of them. The Orker composes item
// i's commit URI as commit_root + "/" +
// artifacts.ItemCommitKey(namespace, run_id, task_id, i) — the single shared
// renderer the engine used to dispatch that item — and stages from the commit.
message EachUpstream {
  // count is the number of items. Every one SUCCEEDED for an ordinary
  // dependent, which runs only after its fan-out succeeded; for a failure
  // handler of an on_item_failure: continue fan-out, failed names those that
  // did not. 0 is legal: the fan-out expanded to nothing.
  int32 count = 1;
  // commit_root is RunPlan.commit_root, the root every commit URI of this run
  // is composed against.
  string commit_root = 2;
  // epochs names the resume scope of the items a resume ran again: item i's
  // commit is then artifacts.ScopedItemCommitKey(namespace, run_id, task_id,
  // i, epoch). An item no range covers is at scope 0, ItemCommitKey's key,
  // so a run never resumed sends none.
  repeated ItemEpochRun epochs = 3;

  // failed is, for a failure handler of an on_item_failure: continue fan-out
  // that failed, the indices of every item that did not succeed, ascending:
  // they have no commit to stage.
  repeated int32 failed = 4;
}

// ---------------------------------------------------------------- the seam

// ExecuteTaskInput is the argument of the ExecuteTask Temporal activity. It
// replaces the Go struct at internal/task/contract.go:49-84 outright.
//
// Serialized size MUST NOT exceed 262144 bytes (AGENTS.md §2.2). The engine
// checks this deterministically before scheduling and fails the task with
// ContractViolation/INPUT_TOO_LARGE when it would be exceeded.
message ExecuteTaskInput {
  // --- coordinates
  string run_id = 1;
  string orkflow_name = 2;
  string orkflow_version = 3;
  // orkflow_definition_digest is the sha256 of the canonical compiled
  // definition this run pinned (AGENTS.md §2.2, §7.2).
  string orkflow_definition_digest = 4;
  string namespace = 5;   // empty means the built-in "default"
  string pool = 6;        // empty means the deployment's default pool
  string task_id = 7;

  // --- identity
  // idempotency_key is the stable key of one logical activity, unchanged
  // across every retry (AGENTS.md §3, §4). Its value is exactly
  //   "{namespace-or-default}/{run_id}/{task_id}"
  //
  // The name is plain, not "task_idempotency_key", for two reasons: its wire
  // JSON (`idempotencyKey`) is then byte-identical to the key the workspace
  // already writes into /orkstack/input/task.json, and there is nothing to
  // collide with — proto scopes field names per message, and the run
  // submission key lives on a different message entirely
  // (SubmitRunRequest.idempotency_key = 4, run_service.proto). The Go
  // identifiers stay distinct.
  string idempotency_key = 8;
  // commit_uri is the deterministic object URI of this activity's commit
  // record. The engine composes it from the commit-store root carried in
  // RunPlan (decided at submit, outside workflow code) plus the run and task
  // coordinates, so composing it stays a pure function of workflow arguments
  // (§5.2, §7.2).
  string commit_uri = 9;

  // --- what to run
  ImageRef image = 10;
  // command overrides the image ENTRYPOINT/CMD. Empty means the image decides.
  repeated string command = 11;
  // with is the RAW, un-rendered `with:` block. Rendering stays in the Orker
  // because `artifact "<task>/<name>"` resolves to a path only the Orker knows
  // after staging (internal/task/contract.go:7-13). The rendered result is
  // materialized to /orkstack/input/config.json.
  google.protobuf.Struct with = 12;
  // env is workload-supplied environment. The platform puts NOTHING here:
  // required platform state travels as files (AGENTS.md §3).
  map<string, string> env = 13;
  repeated SecretRef secrets = 14;

  // --- how to run it
  int32 timeout_seconds = 15;                    // container wall clock
  int32 cancellation_grace_period_seconds = 16;  // default 30 (AGENTS.md §3.3)
  ResourceRequest resources = 17;
  NetworkMode network = 18;
  WorkspaceLimits limits = 19;

  // --- context
  Payload run_input = 20;               // exposed to templates as .inputs
  repeated UpstreamRef upstream = 21;   // exposed as .tasks.<id>

  // run_as_orker_user makes the Orker add --user <orker-uid>:<orker-gid>, so
  // it owns every file the workload writes and can read them whatever umask
  // the image uses (§3.1). Opt-in, because it overrides the image's own USER.
  bool run_as_orker_user = 22;

  // telemetry is the run's pinned telemetry selection, decided at submit from
  // the namespace's policy and the orkflow's labels, and carried on the plan
  // (engine.RunPlan). UNSET when the deployment configured none, which keeps
  // recorded activity payloads byte-identical for such runs — the golden
  // history fixture (internal/engine/testdata/history) has no telemetry and
  // must keep matching without re-recording.
  TelemetrySelection telemetry = 23;

  // pin tells the Orker this attempt belongs to a pin, and which opening of
  // it. UNSET for an unpinned task, which keeps such a task's recorded
  // payload byte-identical to what it was before this field existed.
  PinContext pin = 24;

  // image_policy is the policy in force for this run, decided at submit and
  // carried on the plan (engine.RunPlan.ImagePolicy). UNSET when the
  // deployment configured none and the namespace names no signer, which
  // keeps such a task's recorded payload byte-identical to what it was
  // before this field existed — the golden history fixture
  // (internal/engine/testdata/history) has no policy and must keep matching
  // without re-recording. The Orker checks image against it, and verifies
  // require_signed_by, AFTER its retry-start commit check and BEFORE it
  // builds a workspace or pulls: an attempt whose commit.json exists is
  // adopted without being judged again.
  ImagePolicySelection image_policy = 25;

  // each tells the Orker this attempt is one item of a fan-out, which one, and
  // where the item's value is. UNSET for every task that is not an item, which
  // keeps such a task's recorded payload byte-identical (the golden history
  // fixture has no fan-out and must keep matching without re-recording).
  EachContext each = 26;

  // cache tells the Orker this is an attempt of a cached task (CacheContext).
  // UNSET for every task that declares no cache:, and for every task of a run
  // whose plan carries no cache plan, which keeps such a task's recorded
  // payload byte-identical (the golden history fixture has no cached task and
  // must keep matching without re-recording).
  CacheContext cache = 27;

  // join tells a failure handler how its needs ended. UNSET for every task
  // whose join is not ANY_FAILED or ALL_DONE, which keeps such a task's
  // recorded payload byte-identical to what it was before this field existed
  // (the golden history fixtures have no failure handler and must keep
  // matching without re-recording).
  JoinContext join = 28;

  // devices are the device and `gpu` profiles the task holds, with the
  // identities its run pinned. An Orker that offers none of them refuses the
  // attempt (PROFILE_NOT_OFFERED).
  repeated ProfileRef devices = 30;

  // identity is set from identity (E62); unset until it lands (v0.4.0 proto batch).
  IdentityContext identity = 34;

  // run_context is what the task may know about its run beyond its id: the
  // run-context object's digest, the run's lineage ids, its start times, the
  // task's scheduled time and its declared attempts. It is decided by the
  // engine when it dispatches the task, identical across the attempts of one
  // logical task, and never part of the memo or idempotency key. It is the
  // one part of the input that may exceed the 256 KiB bound, by at most the
  // run's pinned run_context bound (512 B).
  RunContext run_context = 33;

  // index_lines names the fan-outs over this task's artifacts' lines whose
  // line indexes the Orker builds as it commits them, when it can; a task
  // that writes no such artifact, a memo hit and an adopted commit build none.
  repeated LineIndexRequest index_lines = 36;
}

// LineIndexRequest is one line index a producer's Orker builds as it commits
// its artifact name: the fan-out task_id's, under that fan-out's own index
// key and limits, exactly as IndexEachLines would build it.
message LineIndexRequest {
  string task_id = 1;
  string name = 2;
  EachLineFormat format = 3;
  int32 batch = 4;
  int32 max_items = 5;
  int64 values_max_bytes = 6;
  int64 slice_max_bytes = 7;
  int64 read_cap = 8;
}

// LineIndexBuilt is one line index a producer's Orker built: the fan-out
// expands from it without indexing the artifact again.
message LineIndexBuilt {
  string task_id = 1;
  string name = 2;
  ArtifactRef index = 3;
  int32 count = 4;
  int64 total_lines = 5;
}

// ItemEpochRun is count items from first, all committed under epoch.
message ItemEpochRun {
  int32 first = 1;
  int32 count = 2;
  uint64 epoch = 3;
}

// AdoptRecordedInput is one call of a resume's read-back (engine-internal,
// a local activity on the engine's workflow worker): the kept results to
// read back, and the call's pinned bounds.
message AdoptRecordedInput {
  repeated AdoptEntry entries = 1;
  // concurrency is the most reads in flight.
  int32 concurrency = 2;
  // get_timeout bounds one read's tries, at most get_tries of them.
  google.protobuf.Duration get_timeout = 3;
  int32 get_tries = 4;
  // budget bounds the call's encoded result.
  int64 budget = 5;
}

// AdoptEntry is one kept result to read back.
message AdoptEntry {
  string task_id = 1;
  // item is the item's index, or -1 for the task itself.
  int32 item = 2;
  AdoptEntryKind kind = 3;
  // commit_uri is where a COMMIT entry's commit lives.
  string commit_uri = 4;
  // expected is what that commit must name.
  ExpectedCommit expected = 5;
  // record_scope is the resume scope a RESOLUTION or COMPOSED record lives under.
  uint64 record_scope = 6;
  // values is the values.json a VALUES entry reads, and inline_limit the most
  // bytes of one it reads: a larger one is kept by reference alone.
  ArtifactRef values = 7;
  int64 inline_limit = 8;
  // admission_sha256 is the admission a RESOLUTION or COMPOSED record must be
  // made under: the run's own, for a run whose results the engine records.
  string admission_sha256 = 9;
}

// AdoptEntryKind is what a read-back entry reads.
enum AdoptEntryKind {
  ADOPT_ENTRY_KIND_UNSPECIFIED = 0;
  // COMMIT is an activity's commit.json.
  ADOPT_ENTRY_KIND_COMMIT = 1;
  // RESOLUTION is an awaited task's resolution record.
  ADOPT_ENTRY_KIND_RESOLUTION = 2;
  // COMPOSED is a composed task's record of its child's values.
  ADOPT_ENTRY_KIND_COMPOSED = 3;
  // VALUES is the values.json of an awaited or composed task of a run whose
  // results are not recorded; RESOLUTION and COMPOSED are the records of one
  // whose results are, which name its values.
  ADOPT_ENTRY_KIND_VALUES = 4;
}

// ExpectedCommit is the identity a commit must name to be an activity's
// result: the fields the Orker's retry-start check compares.
message ExpectedCommit {
  string namespace = 1;
  string run_id = 2;
  string task_id = 3;
  string definition_digest = 4;
  string idempotency_key = 5;
  string image_index_digest = 6;
}

// AdoptRecordedResult is one call's results, in its entries' order.
message AdoptRecordedResult {
  repeated AdoptedEntry entries = 1;
}

// AdoptedEntry is one kept result read back: what the task's row takes, as
// an adopted attempt's result.
message AdoptedEntry {
  string task_id = 1;
  int32 item = 2;
  ExecuteTaskResult result = 3;
}

// ReleasePinInput asks the pin host to remove the pin's shared directory.
// Scheduled by the engine on the pin's own session, so it lands on the host
// that owns the directory; a host that has no such directory returns success
// (idempotent).
message ReleasePinInput {
  string run_id = 1;
  string namespace = 2;
  PinContext pin = 3;
}

// CommitRef points at a written ActivityCommit object.
message CommitRef {
  string uri = 1;
  // sha256 is the hex sha256 of the exact bytes written to, or read from, the
  // store. It MUST NEVER be recomputed by re-marshalling a decoded
  // ActivityCommit: protojson deliberately varies its output across builds
  // (§14.10), so a rebuilt Orker would compute a different digest for an
  // unchanged commit.
  string sha256 = 2;
  string etag = 3;       // store etag observed at write or read
  google.protobuf.Timestamp created_at = 4;
}

// ExecuteTaskResult is what an Orker returns for a SUCCEEDED activity. A
// failure is an ApplicationError, not a result (§8).
message ExecuteTaskResult {
  string task_id = 1;
  // exit_code is the container's exit status. It is always 0 in a result: a
  // non-zero exit is a failure. It travels so the engine, the archive and the
  // UI record the fact rather than inferring it.
  int32 exit_code = 2;
  // commit references the durable completion record. Always set.
  CommitRef commit = 3;
  // artifacts are the workload's output artifacts, references only.
  repeated ArtifactRef artifacts = 4;
  // system_artifacts are platform-owned objects — stdout.log, stderr.log —
  // kept in a separate field so a workload artifact can never collide with a
  // platform name.
  repeated ArtifactRef system_artifacts = 5;
  // values_ref addresses the committed values.json. Always set.
  ArtifactRef values_ref = 6;
  // values_json is the inline copy of values.json — the workload's EXACT
  // bytes — present ONLY when values.json is at most 4096 bytes. It exists
  // for the engine's read model (TaskRun.output, the UI). Nothing renders a
  // downstream template from it; downstream tasks read the committed object.
  //
  // It is `bytes`, not Payload, because Payload wraps google.protobuf.Struct
  // and a Struct round trip is lossy in four measured ways: key order is not
  // preserved, number formatting is normalized, unicode escapes are decoded,
  // and an integer outside float64's exact range is SILENTLY CORRUPTED
  // (12345678901234567890 -> 12345678901234567000). See §14.9. A field that
  // promises byte identity cannot be a Struct.
  bytes values_json = 7;
  bool values_inlined = 8;
  // image is the ImageRef as executed, with platform_digest and platform set.
  ImageRef image = 9;
  // commit_adopted is true when this attempt found an existing commit and
  // returned it without running the container (§5.4).
  bool commit_adopted = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  string orker_id = 13;
  // attempt is the ordinal of the attempt that produced this result
  // (docs/STORAGE.md, "Attempt ordinals"): the ordinal this attempt claimed
  // on a fresh run, and commit.attempt on an adopted one (§5.4). It is the
  // number the attempt's record, log and container label carry, and it may
  // differ from Temporal's attempt count. The engine cannot read the Orker's
  // claim, and an adopted result carries a CommitRef rather than the commit
  // body, so without this field it could not populate TaskRun.attempt
  // identically for fresh and adopted results.
  int32 attempt = 14;

  // cache is this attempt's memo decision, key_components cleared. Set if and
  // only if ExecuteTaskInput.cache was set; on an adopted result it is
  // ActivityCommit.cache of the adopted commit.
  //
  // On a HIT: artifacts, system_artifacts, values_ref and image are the
  // SOURCE commit's (the content-addressed objects and the image that
  // produced them); commit is THIS run's own commit.json; exit_code is 0;
  // started_at, finished_at, orker_id and attempt are this attempt's; and
  // commit_adopted is false (this attempt wrote the commit).
  CacheResult cache = 15;

  // line_indexes are the line indexes this attempt built while it committed
  // (ExecuteTaskInput.index_lines); one it could not build is absent.
  repeated LineIndexBuilt line_indexes = 16;
}

// ---------------------------------------------------------------- the commit record

// ActivityCommit is the immutable completion manifest (AGENTS.md §4.1). It is
// serialized with protojson and stored as commit.json. Serialized size MUST
// NOT exceed WorkspaceLimits.commit_max_bytes (default 4 MiB, §5.3).
message ActivityCommit {
  // schema_version is 1. A reader that does not know the value refuses the
  // commit with ContractViolation/COMMIT_SCHEMA_UNSUPPORTED rather than
  // guessing (§5.4).
  int32 schema_version = 1;

  string namespace = 2;
  string run_id = 3;
  string task_id = 4;
  string orkflow_name = 5;
  string orkflow_version = 6;
  string orkflow_definition_digest = 7;
  string idempotency_key = 8;

  ImageRef image = 9;                        // with platform_digest and delivery set
  int32 exit_code = 10;                      // always 0 in schema_version 1
  ArtifactRef values = 11;
  repeated ArtifactRef artifacts = 12;
  repeated ArtifactRef system_artifacts = 13;

  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  int32 attempt = 16;                        // the attempt that committed
  string orker_id = 17;
  string build_id = 18;                      // ORK_BUILD_ID of the committer

  // cache is the memo decision of the attempt that committed, for a cached
  // task only; unset otherwise, so every existing commit is unchanged. A HIT
  // commit names its source: its values, artifacts, system_artifacts and
  // image are the source's references, and its identity fields
  // (namespace … idempotency_key, image.index_digest) are THIS activity's, so
  // §5.4 adoption of it on a retry is the ordinary one. memo_written,
  // memo_write_error and key_components are never set here.
  CacheResult cache = 19;

  // recorded is set by the engine on a result it records for a run whose
  // results the engine records (docs/TASK_IDENTITY.md, "Results the engine
  // records"): the pool, the Orker id the caller's credential names, the
  // admission's digest, the engine's build and the time. Never set by an
  // Orker; unset on every other commit.
  CommitRecording recorded = 20;
}

// ---------------------------------------------------------------- the identity records

// CommitRecording is who recorded a result and when: the build of the engine
// or Orker that wrote it and the time it was written. A record the engine
// writes names no pool and no Orker.
message CommitRecording {
  string pool = 1;
  string orker_id = 2;
  string admission_sha256 = 3;
  string engine_build = 4;
  google.protobuf.Timestamp time = 5;
}

// RecordedValuesKind is which result a RecordedValues records.
enum RecordedValuesKind {
  RECORDED_VALUES_KIND_UNSPECIFIED = 0;
  // RESOLUTION: an awaited task's resolution, completed or rejected.
  RECORDED_VALUES_KIND_RESOLUTION = 1;
  // COMPOSED: a composed task's values, from its child run's outputs.
  RECORDED_VALUES_KIND_COMPOSED = 2;
  // OUTPUTS: a run's own outputs, and the records they were taken from.
  RECORDED_VALUES_KIND_OUTPUTS = 3;
}

// RecordedSource names one task's record a record follows or was taken from.
message RecordedSource {
  string task_id = 1;
  // record_sha256 is the SHA-256 of that record's stored bytes.
  string record_sha256 = 2;
  // absent says the task had nothing on record (sources only).
  bool absent = 3;
  // result_sha256 is the digest of that task's result, the one digest two
  // records of one result are compared by.
  string result_sha256 = 4;
}

// RecordedValues is what the engine records as a task's or a run's result
// when no Orker commits it: an awaited task's resolution, a composed task's
// values, a run's outputs (docs/TASK_IDENTITY.md). It is stored once,
// create-only, as protojson, at most 64 KiB, under the run's attested
// prefix. It holds no value inline: values is a reference.
message RecordedValues {
  // schema_version is 1. A reader that does not know the value answers
  // unsupported rather than guessing; 0 is no format.
  int32 schema_version = 1;
  RecordedValuesKind kind = 2;
  string namespace = 3;
  string run_id = 4;
  // task_id is unset for OUTPUTS, a run's own.
  string task_id = 5;
  // resume_scope is the root's resume scope the record was written in.
  uint64 resume_scope = 6;
  string admission_sha256 = 7;
  string definition_digest = 8;
  // values is unset for a rejection.
  ArtifactRef values = 9;
  // rejected and detail_sha256: RESOLUTION only. detail_sha256 names the
  // resolution's detail, a ResolutionDetail stored by its own digest.
  bool rejected = 10;
  string detail_sha256 = 11;
  // child_run_id, child_admission_sha256, child_outputs_sha256: COMPOSED
  // only, the child run whose outputs the values are.
  string child_run_id = 12;
  string child_admission_sha256 = 13;
  string child_outputs_sha256 = 14;
  // sources: OUTPUTS only, the records the run's outputs were taken from.
  repeated RecordedSource sources = 15;
  CommitRecording recorded = 16;
  // follows: RESOLUTION and COMPOSED, the records of the tasks the task
  // needed, as they were when it was recorded.
  repeated RecordedSource follows = 17;
  // input_binding binds the record to its run's start input
  // (identity.InputBinding); a record without one settles nothing.
  bytes input_binding = 18;
  // artifacts: COMPOSED and OUTPUTS, the artifacts the run returns, each
  // under its output's name, as the records of the tasks that produced them
  // name them.
  repeated ArtifactRef artifacts = 19;
}

// ---------------------------------------------------------------- failure transport

// ActivityFailureDetail is what a FAILED activity returns. A failure produces
// no ExecuteTaskResult, and orkstack.v1.Error.details is a bare string, so
// without this message everything a failing task produced is unreachable: an
// exit-1 task can upload its test report and its stderr and leave the engine
// with nowhere to put the references.
//
// It travels as the single `details` argument of
// temporal.NewApplicationError(message, category, detail); the Go SDK carries
// details through the configured data converter, and the workflow retrieves
// them with errors.As to *ApplicationError followed by .Details(&out).
//
// The engine then populates TaskRun.artifacts, .system_artifacts, .exit_code
// and .attempt on the failure path exactly as it does on the success path, so
// a failed attempt is as inspectable as a successful one.
message ActivityFailureDetail {
  string reason_code = 1;              // the §8.2 code, e.g. "VALUES_MISSING"
  FailureCategory category = 2;
  int32 exit_code = 3;                 // 0 when the container never ran
  repeated ArtifactRef artifacts = 4;  // what the failure path managed to upload
  repeated ArtifactRef system_artifacts = 5;
  // scan_notes carries §3.5 violations found on the failure path. They are
  // notes ON the workload's error, never a replacement for it (§7.1 step 14).
  repeated string scan_notes = 6;
  ImageRef image = 7;
  // attempt is the ordinal the failed attempt claimed, as on
  // ExecuteTaskResult.attempt; 0 for an attempt that failed before it claimed
  // one.
  int32 attempt = 8;
  string orker_id = 9;

  // started_at is when this Orker began the attempt that failed, the same
  // instant ExecuteTaskResult.started_at carries on the success path, so the
  // engine can project TaskRun.started_at identically for both outcomes.
  // Stamped by the Orker on every ApplicationError it returns, whether or
  // not a container ran.
  google.protobuf.Timestamp started_at = 10;
  // never_started says the attempt is a never-started interruption: it
  // started no container and its reason is one an attempt reports before
  // doing work (a hand-back before it began, a claim the store refused). It
  // is never set together with started. Unset, with started also unset, says
  // neither: a failure before any container that is no interruption, or an
  // Orker that predates both fields.
  bool never_started = 11;
  // started says the attempt's container was observed started, so it did
  // work. Unset means not known to have started, never started: an engine or
  // Orker that predates the field reads it so.
  bool started = 12;
  // ordinal is the attempt ordinal the attempt claimed (docs/STORAGE.md,
  // "Attempt ordinals"); absent when it failed before its claim.
  optional int32 ordinal = 13;
  // store_error is the object store's own error, for an attempt whose claim
  // the store refused (ATTEMPT_STORE_UNAVAILABLE, never started); empty
  // otherwise. Masked like every message the Orker reports.
  string store_error = 14;
}

// ---------------------------------------------------------------- orker identity

// DescribeOrkerResult is the pool-liveness probe's payload: a pool proves it
// is alive by answering DescribeOrker (§6.5).
message DescribeOrkerResult {
  string orker_id = 1;
  string build_id = 2;
  string pool = 3;
  string runtime_name = 4;      // the engine the Orker drives: "docker" or "podman"
  string runtime_version = 5;
  string security_profile = 6;  // the profile id the Orker enforces (§9.2)
  // max_concurrent is ORK_ORKER_MAX_CONCURRENT: how many tasks this Orker runs
  // at once, the size of its task worker's activity slots.
  int32 max_concurrent = 7;
  bool rootless = 8;
  // max_concurrent_pins is ORK_ORKER_MAX_PINS: how many pins this Orker hosts
  // at once. 0 means it hosts none, and a submit that pins a task to this
  // Orker's pool is refused at submit rather than left waiting.
  int32 max_concurrent_pins = 9;

  // cordoned is this Orker's process-local cordon: true while an operator's
  // cordon or a store outage holds it (store_outage). It is NEVER stored
  // anywhere but the process: a restarted Orker answers false.
  bool cordoned = 10;
  // cordon_reason is the reason given to CordonOrker: the operator's cordon.
  // Empty when no operator's cordon holds, even while store_outage does.
  string cordon_reason = 11;
  // cordoned_at is when the operator's cordon was last set; unset when none
  // holds.
  google.protobuf.Timestamp cordoned_at = 12;
  // running_tasks is how many ExecuteTask activities this Orker has in
  // flight right now, pinned members included. Counted in the process; it
  // is a measurement, not a projection.
  int32 running_tasks = 13;
  // open_pins is how many pins this Orker currently hosts: pins it accepted
  // and has not closed. Counted from the pin openings in flight, so it is
  // exact from the instant a pin is accepted, before its first member
  // arrives. It never exceeds max_concurrent_pins.
  int32 open_pins = 14;
  // pins details each open pin, ordered by run_id. len(pins) == open_pins.
  repeated OpenPin pins = 15;
  // each_supported is true on an Orker that implements fan-out items: it
  // honours ExecuteTaskInput.each (task.json `each`, .each in with:) and
  // stages EachUpstream. An Orker built before it answers false (unset), and
  // submit refuses an Orkflow with a fan-out on such a pool rather than let it
  // run items without their item or a dependent without its items.
  bool each_supported = 16;
  // cache_supported is true on an Orker that implements the memo step. An
  // Orker built before it answers false (unset), and submit refuses an
  // Orkflow with a cached task on its pool: the SDK's default payload
  // converter refuses unknown fields, so such an Orker would FAIL every
  // cached task's attempt on decoding ExecuteTaskInput.cache.
  bool cache_supported = 17;
  // join_supported is true on an Orker that reads ExecuteTaskInput.join
  // (task.json `join`). An Orker built before it answers false (unset), and
  // submit refuses an Orkflow with a container failure handler on its pool:
  // the SDK's default payload converter refuses unknown fields, so such an
  // Orker would FAIL every attempt of a failure handler on decoding
  // ExecuteTaskInput.join — the compensation step of a run that is already
  // failing.
  bool join_supported = 18;
  // capacity is what this Orker admits tasks within (orker.capacity.cpu and
  // orker.capacity.memory). Unset when it declares none: it then admits by
  // max_concurrent alone, as every Orker did before capacity existed. A
  // dimension at 0 is not bounded.
  ResourceQuantity capacity = 19;
  // reserved is what stands reserved against capacity now: the per-task cap
  // of every outstanding poll for a task, the request of every task it holds,
  // pinned members included, and every container it has not yet removed.
  // Unset when capacity is. A pinned member is counted but never made to
  // wait, so reserved can exceed capacity by what open pins run.
  ResourceQuantity reserved = 20;
  // max_request is the per-task cap (orker.resources.max_cpu and
  // max_memory): the largest request this Orker runs. Submit refuses a task
  // whose request no answering Orker of its pool could hold
  // (RESOURCES_UNSATISFIABLE). Unset on an Orker built before it existed.
  ResourceQuantity max_request = 21;
  // default_request is what a task that requests nothing is given
  // (orker.resources.default_cpu and default_memory).
  ResourceQuantity default_request = 22;
  // store_outage is set while this Orker has cordoned itself because it cannot
  // reach object storage (Orker.store_outage). cordoned is true beside it.
  StoreOutage store_outage = 23;
  // attempt_ordinals_supported is true on an Orker that numbers attempts
  // with claimed ordinals (docs/STORAGE.md, "Attempt ordinals"). An Orker
  // built before it numbers them as Temporal does and would write records
  // over a newer Orker's, so submit refuses a pool that has one.
  bool attempt_ordinals_supported = 43;
  // secret_masking_supported is true on an Orker that reads a secret's
  // `unmasked` (SecretRef.unmasked), whatever orker.log.mask_secrets says. An
  // Orker built before it refuses a task that sets it, so submit refuses a
  // task carrying a `mask: false` secret on a pool that has one.
  bool secret_masking_supported = 44;

  // stopping is set while this Orker is stopping (OrkerStopping). cordoned is
  // true beside it.
  OrkerStopping stopping = 24;

  // profile_kinds_supported are the profile kinds this Orker's build
  // implements. Submit sends a profiled task only to a pool whose answering
  // Orkers all list its kinds.
  repeated ProfileKind profile_kinds_supported = 26;

  // profiles are the profiles this Orker offers.
  repeated OrkerProfile profiles = 27;

  // profile_cordons are the profile causes that hold this Orker's cordon;
  // cordoned is true while any is set.
  repeated ProfileCordon profile_cordons = 28;

  // identity_supported is whether this Orker serves task identity now: its
  // engine confirmed, within the last ten minutes, that its credential names
  // it and holds identity.token.mint and task.result.commit at its pool,
  // and its storage credential is confirmed scoped. It alone decides.
  bool identity_supported = 33;
  // identity_unsupported_reason says why this Orker does not serve task
  // identity, for display and for naming the cause in a refusal; empty while
  // identity_supported. It decides nothing.
  string identity_unsupported_reason = 45;
  // identity_storage is where this Orker keeps identity token and
  // credential files: memory-backed storage, or the work root's disk.
  IdentityStorage identity_storage = 46;

  // providers are the providers this Orker declares (ORK_PROVIDERS), which
  // submit asks every Orker of a pool a task that names one would run on.
  repeated ProviderInfo providers = 34;

  // masks_secrets is whether this Orker masks a task's secrets in its logs
  // (orker.log.mask_secrets). It reads secrets[].unmasked either way.
  bool masks_secrets = 35;

  // metadata_reachable is every address in metadata_probes that answered.
  // Empty when none did, or when no probe ran (orker.metadata_probe off).
  repeated string metadata_reachable = 36;

  // run_context_supported is set from E86; unset until it lands (v0.4.0 proto batch).
  bool run_context_supported = 31;

  // running lists the attempts this Orker has claimed and not ended, and those
  // whose container it has not removed yet, for the engine's own checks: it is
  // never part of an API answer, so run ids stay in their namespaces.
  repeated RunningAttempt running = 47;
  // running_truncated says running may be short of some: an attempt missing
  // from it then says nothing.
  bool running_truncated = 48;

  // each_lines_supported is true when this Orker indexes the lines of an
  // artifact a fan-out reads, resolves such an item's span
  // and stages a batch's slice file. Submit refuses a fan-out over lines on a
  // pool where an uncordoned Orker answers false.
  bool each_lines_supported = 32;

  // metadata_probes is what the boot's metadata probe found, one entry per
  // address it asked (docs/DEPLOY.md, "Keeping tasks away from the host's
  // identity"). Empty when orker.metadata_probe is off, and from an Orker
  // built before the probe existed.
  repeated MetadataProbe metadata_probes = 37;

  // store_scope is this Orker's verdict on its own storage credential, from
  // its scope check (docs/DEPLOY.md, "An Orker's own storage credential").
  // Unspecified for an Orker that never ran the check (an older build).
  StoreScope store_scope = 38;

  // store_scope_detail is the last round's result: the first prefix the
  // credential reached, or the store's code for an unclear answer. It never
  // holds a credential.
  string store_scope_detail = 39;

  // store_scope_confirmed_at is when a round of the scope check last ended
  // scoped; unset when none has.
  google.protobuf.Timestamp store_scope_confirmed_at = 40;

  // results_scope is what the check's results request found: whether this
  // credential may write every namespace's results or only named ones. It
  // decides nothing.
  ResultsScope results_scope = 41;

  // service_host is set from E90; unset until it lands (v0.4.0 proto batch).
  ServiceHost service_host = 42;
}

// ResourceQuantity is an amount of each resource an Orker reserves for a
// task: cpu in cores ("500m" is 0.5) and memory in bytes ("4Gi" is
// 4294967296).
message ResourceQuantity {
  double cpu = 1;
  int64 memory_bytes = 2;

  // gpu is a count of gpu units; unset on an Orker that offers no gpu
  // profile.
  optional int64 gpu = 3;
}

// RunningAttempt names one attempt of a task, or of one item of a fan-out.
message RunningAttempt {
  string run_id = 1;
  string task_id = 2;
  optional int32 item = 3;
  int32 ordinal = 4;
}

// OpenPin is one pin this Orker currently hosts: a pin it has accepted and
// not yet closed. It names the run and the pin, never the mechanism behind
// it (AGENTS.md §7), and says when the shared directory's
// lease ends, which is the longest the pin can live even if nothing else
// closes it (docs/OCI_ACTIVITY_CONTRACT.md §6.4).
message OpenPin {
  string run_id = 1;
  // pin is the name the author wrote in `pin:`. EMPTY until the pin's first
  // member attempt arrives: the Orker learns the name from
  // ExecuteTaskInput.pin, and a pin is open from the moment it is accepted,
  // before any member has been dispatched to it.
  string pin = 2;
  // since is when this Orker accepted the pin.
  google.protobuf.Timestamp since = 3;
  // expires_at is the shared directory's lease (lease.json). UNSET until the
  // first member arrives and writes it; a client renders "-", never a time.
  google.protobuf.Timestamp expires_at = 4;
}

// StoreOutage says an Orker has cordoned itself because its object storage
// checks keep failing. It clears by itself once they pass again, and no
// operator can clear it. Unset means no outage holds, and is all an Orker of a
// release without these checks ever reports.
message StoreOutage {
  // reason says in plain words what the Orker saw, starting
  // "object storage unreachable".
  string reason = 1;
  // since is when this Orker cordoned itself.
  google.protobuf.Timestamp since = 2;
}

// CordonOrkerInput is the argument of the CordonOrker activity, dispatched
// on ONE Orker's control channel. `cordoned = false` clears the operator's
// cordon, and then reason is ignored; it never clears a store outage.
message CordonOrkerInput {
  bool cordoned = 1;
  // reason is required when cordoned is true; at most 256 bytes, no control
  // characters. It is what ListOrkers shows beside the state and what the
  // drain loop prints, so an operator reading the fleet knows why.
  string reason = 2;
}

// Orker is one execution process, observed live.
message Orker {
  string orker_id = 1;
  // pool is the pool the Orker reports serving (DescribeOrkerResult.pool).
  string pool = 2;
  string build_id = 3;               // empty when versioning is off
  int32 running_tasks = 4;
  int32 open_pins = 5;
  int32 max_concurrent_pins = 6;     // ORK_ORKER_MAX_PINS; 0 means not a pin host
  // cordoned is true while this Orker takes no new task and opens no new pin,
  // whichever cause holds it: an operator's cordon (cordon_reason), a store
  // outage (store_outage), or both.
  bool cordoned = 7;
  // cordon_reason is the operator's reason; empty when no operator's cordon
  // holds, even while store_outage does.
  string cordon_reason = 8;
  // cordoned_at is when the operator's cordon was set; unset when none holds.
  google.protobuf.Timestamp cordoned_at = 9;
  // last_seen is the most recent moment this Orker was observed polling.
  // It answers "how fresh is this row", never "when did this Orker die".
  google.protobuf.Timestamp last_seen = 10;
  // unavailable_reason says this Orker COULD NOT BE ASKED, and why — the
  // same three-state distinction Pool.unavailable_reason makes, for the same
  // reason: "not measured" rendered as "measured zero" sends an operator to
  // stop a host that may be mid-task. When set, fields 2–9 and 12 are
  // unset: nothing was measured, so there is no number to report.
  string unavailable_reason = 11;
  repeated OpenPin pins = 12;
  // capacity and reserved are DescribeOrkerResult's: what this Orker admits
  // tasks within, and what stands reserved against it, each outstanding poll
  // counted at the per-task cap. Both unset when it declares no capacity.
  ResourceQuantity capacity = 13;
  ResourceQuantity reserved = 14;
  // max_request is DescribeOrkerResult's: the per-task cap, the largest
  // request this Orker runs, which submit holds a task's declared request to.
  ResourceQuantity max_request = 15;
  // store_outage is set while this Orker has cordoned itself because it cannot
  // reach object storage. It clears by itself once the store answers again;
  // CordonOrker neither sets nor clears it. Unset from an Orker of a release
  // without these checks.
  StoreOutage store_outage = 16;

  // stopping is set while this Orker is stopping: it takes no new task and
  // opens no new pin, and keeps its pool live until it exits. Unset from an
  // Orker of a release without a stop grace.
  OrkerStopping stopping = 17;

  // profiles are the profiles the Orker offers: name, kind, unit counts and
  // whether its latest check passed.
  repeated OrkerProfile profiles = 18;

  // profile_cordons are the profile causes that hold the Orker's cordon:
  // cause, profile, reason and since.
  repeated ProfileCordon profile_cordons = 19;

  // service_host is set from E90; unset until it lands (v0.4.0 proto batch).
  ServiceHost service_host = 20;

  // metadata_probes is DescribeOrkerResult's: what this Orker's metadata
  // probe found at boot, empty when none ran.
  repeated MetadataProbe metadata_probes = 21;
}

// EachLineFormat is how a fan-out over an artifact's lines reads each line.
enum EachLineFormat {
  EACH_LINE_FORMAT_UNSPECIFIED = 0;
  // JSONL: each non-empty line is one JSON value, decoded strictly.
  EACH_LINE_FORMAT_JSONL = 1;
  // LINES: each non-empty line is a string, its bytes as written.
  EACH_LINE_FORMAT_LINES = 2;
}

// EachArtifactSource is the artifact a fan-out runs over the lines of:
// "<producer>/<name>" of EachSpec.over_artifact, split on the first "/".
message EachArtifactSource {
  // producer is a task in the fan-out's own needs:, or "_inputs" for an
  // artifact input of the run.
  string producer = 1;
  // name is the artifact's name as its producer recorded it, or the input's.
  string name = 2;
}

// EachLines is a fan-out over an artifact's lines, once expanded: the
// committed source, the immutable line index its expansion wrote, and how
// the lines were cut into items.
message EachLines {
  // source is the producer's committed artifact; its sha256 and size_bytes
  // are what every read of it is held to.
  ArtifactRef source = 1;
  // index is the line index (docs/STORAGE.md, "Line indexes"); its sha256
  // is what every read of it is held to.
  ArtifactRef index = 2;
  EachLineFormat format = 3;
  // batch is the lines per item; 0 or 1 is one line per item.
  int32 batch = 4;
}

// IndexEachLinesInput is the engine's request to an Orker of a fan-out's pool
// to index the lines of the fan-out's source (the internal IndexEachLines
// activity). Engine-internal: no user-facing surface names it.
message IndexEachLinesInput {
  string run_id = 1;
  string namespace = 2;
  // task_id is the fan-out task; the index is written under its commit key.
  string task_id = 3;
  string definition_digest = 4;
  ArtifactRef source = 5;
  // producer and name are the source's, for messages.
  string producer = 6;
  string name = 7;
  EachLineFormat format = 8;
  int32 batch = 9;
  int32 max_items = 10;
  int64 values_max_bytes = 11;
  // slice_max_bytes is the largest span of one item, the plan's bound.
  int64 slice_max_bytes = 12;
  // read_cap is the most bytes the index reads; a larger source is refused.
  int64 read_cap = 13;
}

// IndexEachLinesResult is what an index found: the items and lines it holds,
// and where it was written.
message IndexEachLinesResult {
  int32 count = 1;
  int64 total_lines = 2;
  ArtifactRef index = 3;
}

// IdentityRef is one identity a task holds: a token for one audience,
// minted for each attempt and refreshed while it runs
// (docs/TASK_IDENTITY.md).
message IdentityRef {
  // name names the identity within its task: the file it is written to.
  string name = 1;
  // audience is the token's aud: one the namespace's identity policy allows.
  string audience = 2;
  // ttl_seconds is the token's life, held between the deployment's
  // identity.token.min_ttl and max_ttl; 0 is identity.token.ttl.
  int32 ttl_seconds = 3;
  // refresh says what a refresh that keeps failing does to the attempt.
  RefreshPolicy refresh = 4;
}

// RefreshPolicy is what a refresh that keeps failing does to the attempt.
enum RefreshPolicy {
  // REFRESH_POLICY_UNSPECIFIED is REFRESH_POLICY_REQUIRED.
  REFRESH_POLICY_UNSPECIFIED = 0;
  // REFRESH_POLICY_REQUIRED ends the attempt when its token expires
  // unrefreshed.
  REFRESH_POLICY_REQUIRED = 1;
  // REFRESH_POLICY_BEST_EFFORT lets the attempt run on with an expired
  // token.
  REFRESH_POLICY_BEST_EFFORT = 2;
}

// CredentialRef is one credential a task holds: a bundle of files a
// provider issues for each attempt, as the namespace's grant, and the Orker
// keeps fresh while the container runs (docs/PROVIDERS.md). It never holds a
// value.
message CredentialRef {
  // name names the credential within its task: the directory it is written
  // to, /orkstack/credentials/<name>/. ^[a-z][a-z0-9-]{0,62}$, unique in the
  // task.
  string name = 1;
  // grant is a grant of the namespace's identity policy that admits this
  // Orkflow: which provider, and as whom.
  string grant = 2;
  // path is where the provider issues from, for a provider type that issues
  // from a path; empty for a credential that is the login itself. A locator,
  // validated and never normalized.
  string path = 3;
  // refresh says what a refresh that keeps failing does to the attempt.
  RefreshPolicy refresh = 4;
  // params are the literal parameters of a path the provider writes rather
  // than reads: never templated, at most 16 keys and 4 KiB.
  map<string, string> params = 5;
}

// IdentityContext is what an attempt of a task that holds an identity needs
// to ask for its tokens (docs/TASK_IDENTITY.md), set at submit and pinned
// in the run's plan. It is set only on a task of a run that holds one.
message IdentityContext {
  // issuer is the issuer the run's tokens come from.
  string issuer = 1;
  // identities are the task's identities, as admitted.
  repeated IdentityRef identities = 2;
  // credentials are the task's credentials, as admitted.
  repeated CredentialRef credentials = 3;
  // grants are the grants the task's credentials and secrets use, as
  // resolved at submit, in name order.
  repeated IdentityGrant grants = 4;
  // admission_sha256 is the digest of the run's admission record, which a
  // mint names.
  string admission_sha256 = 5;
  // digest_version is the version of the task digest the engine computed
  // at admission, which the Orker computes again.
  uint32 digest_version = 6;
  // root_scope is, for a run below a root, the root's resume scope when the
  // run was started; 0 otherwise.
  uint64 root_scope = 7;
  // resume_scope is the attempt's own resume scope, as
  // MintAttemptTokensRequest.resume_scope reads it.
  uint64 resume_scope = 8;
  // commit_wait_seconds is how long the Orker waits for an engine at a
  // commit, pinned when the run was submitted
  // (identity.results.commit_wait).
  int32 commit_wait_seconds = 20;
}

// IdentityGrant is one of a namespace's grants as a run was admitted with
// it: which provider a task logs in to through it, and as whom
// (docs/PROVIDERS.md).
message IdentityGrant {
  // name is the grant's name in its namespace's identity policy.
  string name = 1;
  // provider is the name of the declared provider.
  string provider = 2;
  // principal is whom a login through the grant is, in the provider's terms.
  string principal = 3;
  // audience is the audience its identity token is for.
  string audience = 4;
}

// IdentityStorage is where an Orker keeps identity token and credential
// files.
enum IdentityStorage {
  IDENTITY_STORAGE_UNSPECIFIED = 0;
  // IDENTITY_STORAGE_MEMORY is tmpfs or ramfs: the files do not outlive
  // the host's boot.
  IDENTITY_STORAGE_MEMORY = 1;
  // IDENTITY_STORAGE_DISK is the work root.
  IDENTITY_STORAGE_DISK = 2;
}

// MetadataProbe is what an Orker's boot found for one instance metadata
// address, asked from a container on the default network as a task would ask
// it.
message MetadataProbe {
  // address is the endpoint asked, such as 169.254.169.254 or
  // metadata.google.internal.
  string address = 1;
  MetadataProbeOutcome outcome = 2;
  // detail is the request answered and its HTTP status ("HTTP 200 to PUT
  // /latest/api/token"), or why the probe could not tell. It never holds
  // what the endpoint sent beyond its status.
  string detail = 3;
}

// MetadataProbeOutcome is one address's outcome: three, never two. A probe
// that failed is never read as safe.
enum MetadataProbeOutcome {
  METADATA_PROBE_OUTCOME_UNSPECIFIED = 0;
  // An HTTP status line came back, whatever the status.
  METADATA_PROBE_OUTCOME_ANSWERED = 1;
  // Every request ran and none was answered.
  METADATA_PROBE_OUTCOME_NO_ANSWER = 2;
  // The probe could not tell: its container did not run, the runtime
  // refused it, or it ended before it reported every request.
  METADATA_PROBE_OUTCOME_PROBE_FAILED = 3;
}

// OrkerProfile is one profile an Orker offers (docs/DEPLOY.md, "Profiles").
// The inventory (ListOrkers) carries name, kind and the unit counts;
// revision and identity_digest travel only on the Orker's own answer to the
// engine and are never listed or exported.
message OrkerProfile {
  // name is the operator's name for the profile, the one a task selects.
  string name = 1;
  ProfileKind kind = 2;
  // units is how many units a `gpu` profile declares; 0 for other kinds.
  int32 units = 3;
  // usable_units is how many of them are healthy and may be bound.
  int32 usable_units = 4;
  // bound_units is how many are held by a task now.
  int32 bound_units = 5;
  // revision is the operator's revision label; it changes memo keys only.
  string revision = 6;
  // identity_digest is the SHA-256 (hex) of the profile's structural
  // identity, which a run pins at submit and every Orker of a pool must share.
  string identity_digest = 7;
  // contracts are the profile's contracts: each a label, the definition this
  // Orker gives it and the labels it also accepts (docs/DEPLOY.md, "Changing
  // a profile"). A profile written in the short form has one contract, "1".
  repeated OrkerProfileContract contracts = 8;
  // default_contract is the label a task whose image declares no contract
  // for this profile runs under.
  string default_contract = 9;
}

// OrkerProfileContract is one contract of an Orker's profile: a label for one
// definition. The inventory (ListOrkers) carries label and accepts;
// identity_digest travels only on the Orker's own answer to the engine.
message OrkerProfileContract {
  // label names the contract, the one an image declares or a run pins.
  string label = 1;
  // identity_digest is the SHA-256 (hex) of this contract's structural
  // identity.
  string identity_digest = 2;
  // accepts are the other labels this contract also serves: the operator's
  // assertion that a run pinned to one of them may run under this one.
  repeated string accepts = 3;
}

// OrkerStopping is set while an Orker is stopping: from its first stop signal
// it takes no new task and opens no new pin, and what it runs carries on until
// the grace ends (docs/DEPLOY.md, "Removing an Orker safely"). cordoned is true beside
// it. It ends only with the process.
message OrkerStopping {
  // since is when the Orker received its first stop signal.
  google.protobuf.Timestamp since = 1;
  // grace_ends_at is when the Orker stops what it still runs: since plus
  // orker.stop.grace. A second signal ends the grace sooner.
  google.protobuf.Timestamp grace_ends_at = 2;
}

// ProfileCordon is one profile cause that holds an Orker's cordon. A drift
// latches until the Orker restarts and takes its pool out of service on that
// Orker; an unavailable profile clears itself after consecutive good checks
// and keeps the pool live. The inventory carries cause, profile, reason and
// since; detail travels only on the Orker's own answer.
message ProfileCordon {
  enum Cause {
    CAUSE_UNSPECIFIED = 0;
    // The profile no longer matches what the Orker audited at boot.
    CAUSE_DRIFT = 1;
    // The profile's units or specs are absent, or its probe failed.
    CAUSE_UNAVAILABLE = 2;
  }
  Cause cause = 1;
  // profile is the name of the profile the cause is about.
  string profile = 2;
  ProfileCordonReason reason = 3;
  // since is when the Orker first observed the cause.
  google.protobuf.Timestamp since = 4;
  // detail says what was observed, for the operator.
  string detail = 5;
}

// ProfileCordonReason is the machine-readable reason of a ProfileCordon.
enum ProfileCordonReason {
  PROFILE_CORDON_REASON_UNSPECIFIED = 0;
  PROFILE_CORDON_REASON_SPEC_CHANGED = 1;
  PROFILE_CORDON_REASON_DEVICE_CHANGED = 2;
  PROFILE_CORDON_REASON_HOOK_BINARY_CHANGED = 3;
  PROFILE_CORDON_REASON_SPEC_ABSENT = 4;
  PROFILE_CORDON_REASON_GPU_HOST_LOCK_HELD = 5;
  PROFILE_CORDON_REASON_HOST_LOCK_MISMATCH = 6;
  PROFILE_CORDON_REASON_PROBE_IMAGE_UNAVAILABLE = 7;
  PROFILE_CORDON_REASON_HOST_VIEW_CHANGED = 8;
  PROFILE_CORDON_REASON_ALL_UNITS_UNHEALTHY = 9;
  PROFILE_CORDON_REASON_PROBE_IMAGE_MISMATCH = 10;
  PROFILE_CORDON_REASON_HOOK_BUILD_UNKNOWN = 11;
  PROFILE_CORDON_REASON_FOREIGN_UNITS_HELD = 12;
  // DEVICE_ABSENT: a device of the profile is not there after the boot
  // audit. The profile is unavailable until it is back unchanged.
  PROFILE_CORDON_REASON_DEVICE_ABSENT = 13;
  // UNITS_BELOW_CEILING: fewer of a gpu profile's units are usable than the
  // per-task cap every poll reserves (max_request.gpu), so the Orker polls
  // for no task. The profile is unavailable, and its pool stays live, until
  // enough units are usable again.
  PROFILE_CORDON_REASON_UNITS_BELOW_CEILING = 14;
  // PROBE_NOT_STARTED: the container engine started none of a gpu profile's
  // unit probes in three passes in a row, which says nothing of the units.
  // The profile is unavailable, and its pool stays live, until one starts.
  PROFILE_CORDON_REASON_PROBE_NOT_STARTED = 15;
}

// ProfileKind is the closed set of profile kinds compiled into the Orker
// (AGENTS.md §6). A profile is operator data, never code.
enum ProfileKind {
  PROFILE_KIND_UNSPECIFIED = 0;
  // Uncounted, shared character devices of an allow-listed class.
  PROFILE_KIND_DEVICES = 1;
  // Counted, exclusive GPU units, each one CDI device.
  PROFILE_KIND_GPU = 2;
}

// ProfileRef names one profile a task holds, with the structural identity the
// run pinned at submit.
message ProfileRef {
  string name = 1;
  string identity_digest = 2;
  // contracts are the contracts the run pinned for this profile: for a task
  // whose image declared one, that contract alone; otherwise every contract
  // the pool's Orkers served at submit.
  repeated ProfileContractPin contracts = 3;
  // declared is whether the task's image declared the contract it needs.
  bool declared = 4;
}

// ProfileContractPin is one contract label a run pinned, with the definitions
// its Orkers gave it at submit. An empty identity_digests pins the label
// alone, which only an Orker that accepts it serves.
message ProfileContractPin {
  string label = 1;
  repeated string identity_digests = 2;
}

// ProviderInfo is one provider an Orker declares (ORK_PROVIDERS): what
// submit compares across a pool's Orkers. It never holds a secret: the
// providers document holds none.
message ProviderInfo {
  // name is the declared name: the scheme of the provider's sources.
  string name = 1;
  // type is the provider's compiled-in type ("aws", "vault", "image").
  string type = 2;
  // image_digest is a provider image's digest; empty for any other type.
  string image_digest = 3;
  // contracts are the provider profile versions this Orker runs a provider
  // image under; empty for any other type.
  repeated int32 contracts = 4;
}

// ResultsScope is how far an Orker's storage credential reaches among
// results: every namespace's, or only named namespaces'.
enum ResultsScope {
  RESULTS_SCOPE_UNSPECIFIED = 0;
  RESULTS_SCOPE_EVERY_NAMESPACE = 1;
  RESULTS_SCOPE_BY_NAMESPACE = 2;
}

// RunContext is a task's reference to its run's context: the facts a task
// may read about the run it belongs to. The run's data (origin, schedule
// fire, composed lineage) is in the run-context object, an immutable object
// written once per run tree when it is submitted and addressed by its
// SHA-256; the facts here are per run and per task.
message RunContext {
  // object_sha256 is the SHA-256 (hex) of the run tree's run-context object.
  string object_sha256 = 1;
  // root_run_id is the id of the run at the top of the composed chain; empty
  // for a top-level run, whose root is itself.
  string root_run_id = 2;
  // parent_run_id is the id of the run that started this one; set only on a
  // child run.
  string parent_run_id = 3;
  // tree_index is this run's entry in the object's entries: 0 for the root.
  int32 tree_index = 4;
  // created_at is when the run was created.
  google.protobuf.Timestamp created_at = 5;
  // started_at is when the run started executing.
  google.protobuf.Timestamp started_at = 6;
  // task_scheduled_at is when the task, or fan-out item, became ready and was
  // first dispatched (TaskRun.scheduled_at).
  google.protobuf.Timestamp task_scheduled_at = 7;
  // declared_max_attempts is the attempts the definition's retry: declares
  // (retry.maximum_attempts), or 1 without retry: or with a maximum of 0 or 1.
  int32 declared_max_attempts = 8;
  // own_attempts_before is how many of the task's own attempts earlier
  // executions of it spent, interruptions excluded.
  int32 own_attempts_before = 9;
  // run_deadline is the run's deadline when its definition declares
  // timeout: and its clock has started; unset otherwise.
  google.protobuf.Timestamp run_deadline = 10;
}

// ServiceHost is what an Orker says about hosting services
// (docs/ORKER_SERVICE_CONTRACT.md): the contract and profile versions it
// hosts, and whether it is fit to host them now, with every reason it is
// not.
message ServiceHost {
  // contract_versions are the Orker Service Contract versions it hosts.
  repeated int32 contract_versions = 1;
  // profiles are the profiles it hosts, each with its versions.
  repeated ServiceProfileVersions profiles = 2;
  // fit is true only when every condition holds: it can make the bounded
  // answer filesystem, its reach probe is clean, it is in no stuck-service
  // cordon, and it can reach an engine.
  bool fit = 3;
  // unfit names each condition that does not hold, one fixed sentence each.
  repeated string unfit = 4;
  // max_instances is the most event-source instances it runs at once; 0
  // means it hosts none.
  int32 max_instances = 5;
  // instances is how many it runs now.
  int32 instances = 6;
  // max_request is the largest request one instance may make.
  ResourceRequest max_request = 7;
  // probed_at is when its last reach probe ended.
  google.protobuf.Timestamp probed_at = 8;
}

// ServiceProfileVersions is one profile an Orker hosts and its versions.
message ServiceProfileVersions {
  // name is the profile's name: "event-source".
  string name = 1;
  // versions are the profile's versions it hosts.
  repeated int32 versions = 2;
}

// HostEventSourceInput is the input of the activity that runs one attempt
// of one event-source instance on a pool's source channel. It is small on
// purpose: what the container is and holds comes from the engine when the
// instance confirms.
message HostEventSourceInput {
  // namespace, name and event_source_id name the source.
  string namespace = 1;
  string name = 2;
  string event_source_id = 3;
  // index is the instance's index, of instances.
  int32 index = 4;
  int32 instances = 5;
  // epoch is the instance's epoch the source's workflow scheduled it under.
  int64 epoch = 6;
  // service_digest names the service spec the instance runs.
  string service_digest = 7;
  // resources is the instance's request, reserved before it starts.
  ResourceRequest resources = 8;
  // trial is the breaker that paused the source, when a resume scheduled
  // this activity: honoured on its first attempt only.
  string trial = 9;
  // ready_within, for a replacement a roll is trying, is how long one
  // attempt may run with a status and without becoming ready; 0 is no
  // bound.
  int32 ready_within_seconds = 10;
  // complete_after_healthy: a failure after a healthy run completes the
  // activity instead of failing it.
  bool complete_after_healthy = 11;
  // confirm_unavailable_max_seconds and provider_refused_max are the two
  // bounds the Orker applies from the source's carry.
  int32 confirm_unavailable_max_seconds = 12;
  int32 provider_refused_max = 13;
}

// InstanceEnd is how an event-source instance's activity ended, where it
// completed. A failure that may pass is an error the cluster retries, and
// never one of these.
enum InstanceEnd {
  INSTANCE_END_UNSPECIFIED = 0;
  // FAILED_AFTER_HEALTHY: a failure that may pass, after the instance had
  // been ready long enough to start its back-off afresh.
  INSTANCE_END_FAILED_AFTER_HEALTHY = 1;
  // ROTATED: it reached the bound of its age without having been replaced.
  INSTANCE_END_ROTATED = 2;
  // STOPPED: the engine answered that it is to stop.
  INSTANCE_END_STOPPED = 3;
  // STUCK: its container could not be stopped.
  INSTANCE_END_STUCK = 4;
  // JUDGMENT_UNAVAILABLE: what the source's identity rests on could not be
  // read for longer than its bound.
  INSTANCE_END_JUDGMENT_UNAVAILABLE = 5;
  // UNCHANGEABLE: trying again cannot change it.
  INSTANCE_END_UNCHANGEABLE = 6;
}

// InstanceEndClass is whose the end is, as the Orker says it.
enum InstanceEndClass {
  INSTANCE_END_CLASS_UNSPECIFIED = 0;
  // HOST: the Orker's, and nothing of the source's.
  INSTANCE_END_CLASS_HOST = 1;
  // SOURCE: the source's own.
  INSTANCE_END_CLASS_SOURCE = 2;
}

// HostEventSourceResult is what one attempt of an event-source instance
// completed with. It is an Orker's word: the source's workflow classifies it
// from its own table by the reason and the fields that are its condition, and
// an end, a class or a reason it does not know is never a pause.
message HostEventSourceResult {
  InstanceEnd end = 1;
  // reason is the end's reason; empty for ROTATED.
  string reason = 2;
  InstanceEndClass class = 3;
  // past_bound and refused_since are a refused credential's condition: the
  // refusals have gone on past their bound, and since when.
  bool past_bound = 4;
  google.protobuf.Timestamp refused_since = 5;
  // unread is, for JUDGMENT_UNAVAILABLE, what could not be read: spec or
  // record.
  string unread = 6;
  // fresh_read is an identity reason's condition: the refusal was confirmed
  // by a read made after the request arrived.
  bool fresh_read = 7;
  // cause is the code behind a reason, from a closed set (the identity
  // reason, the check's reason, the image policy's rule), or empty. Never a
  // word of a container's.
  string cause = 8;
  // attempt is which attempt of the activity ended: used only to look up the
  // record the engine wrote when it confirmed that attempt.
  int32 attempt = 9;
}

// StoreScope is an Orker's verdict on its own storage credential: scoped
// when a round of its scope check found every control-plane prefix refused,
// unscoped when one reached, unknown while no round has ended either way or
