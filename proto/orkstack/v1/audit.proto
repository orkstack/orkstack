syntax = "proto3";

package orkstack.v1;

import "google/protobuf/timestamp.proto";
import "orkstack/v1/filter.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// AuditService reads back the control-plane audit trail: one immutable record
// per call of a write RPC, written by the engine at the moment the handler
// returned, into the shared store (metadata/audit/…), so any replica answers
// for a write another replica performed (AGENTS.md §7).
//
// It is a record, never a read path: nothing in OrkStack consults an audit
// record to make a decision, so the trail cannot become a second source of
// truth about anything (AGENTS.md §2.2). Reads are never recorded; this RPC
// is itself a read.
service AuditService {
  // ListAuditRecords returns records newest first, bounded and paginated.
  //
  // A scan that would examine more objects than the engine's budget allows
  // before filling a page is REFUSED (RESOURCE_EXHAUSTED) naming the budget,
  // never answered from the subset it managed to read: a partial audit
  // listing that looks complete is worse than none.
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
}

// AuditRecord is one control-plane WRITE, recorded immutably at the moment
// the handler returned — succeeded or refused.
message AuditRecord {
  // schema_version is 1. A reader refuses a record whose version it does not
  // know rather than guessing at its fields.
  int32 schema_version = 1;
  // id is opaque, shaped "aud-{stamp}-{16 hex}", where stamp is the store's
  // sortable UTC layout and the hex is 8 bytes from crypto/rand. It is the
  // key's leaf. Nothing derives meaning from it: the record's own `at` is the
  // time, and the key's day segments are the store's, not a client's.
  string id = 2;
  // at is the engine's clock when the handler returned.
  google.protobuf.Timestamp at = 3;
  // principal is what the deployment's gateway asserted in the Ork-Principal
  // request header, recorded verbatim (bounded, control characters replaced)
  // and NEVER trusted as authentication: OrkStack has no identity system and
  // this field does not invent one. Empty when no header was present, which
  // every client renders as "unattributed" rather than as a name, because a
  // blank that looks like a user is worse than an honest gap.
  string principal = 4;
  // source_address is the TCP peer the engine accepted the request from, as
  // connect.Request.Peer().Addr reports it. Behind a gateway it is the
  // gateway's address; no forwarded-for header is consulted.
  string source_address = 5;
  // action is the user-facing name of the write: "namespace.update",
  // "orkflow.apply", "trigger.create", "retention.update", … The complete
  // set is the engine's audited-procedure table (internal/api/audit.go); a
  // client filters by prefix (action^namespace.) and never needs to know the
  // set.
  string action = 6;
  // procedure is the exact RPC, e.g. "/orkstack.v1.NamespaceService/UpdateNamespace",
  // or the HTTP route for the legacy webhook adapter ("POST /v1/webhooks").
  // It is the machine-readable twin of action.
  string procedure = 7;
  // namespace is the OrkStack namespace the write addressed, resolved
  // ("default" spelled out), and EMPTY only for a deployment-wide target
  // (retention policy, webhooks). Empty here never means "default".
  string namespace = 8;
  // target is the object the action addressed: an orkflow "name@version", a
  // namespace name, a run id, a webhook or trigger id, or "deployment".
  string target = 9;
  // detail is a short human-readable summary of what was asked — never a
  // secret, never a token, never a request body. Bounded.
  string detail = 10;
  // succeeded is whether the handler returned success. A refused write is a
  // record too: who tried is evidence.
  bool succeeded = 11;
  // error_code is the Connect code name ("failed_precondition",
  // "not_found", …) when succeeded is false; empty otherwise.
  string error_code = 12;
}

// ListAuditRecordsRequest lists the deployment's audit trail. It is a
// deployment-wide listing: a `namespace` filter narrows it like any other
// property of a record, and `namespace=` (the empty value) selects the
// deployment-wide writes, which carry no namespace
// (docs/UI_CLI_PARITY.md "Filtering lists", "Control-plane audit trail").
//
// The window is the `at` interval the filters bound: at < T ends it
// (default: the moment the answer is computed, on the engine's clock) and
// at >= T starts it (default: seven days before the end). A window whose
// end is not after its start is INVALID_ARGUMENT.
message ListAuditRecordsRequest {
  option (orkstack.v1.filterable) = {
    resource: "orkstack.v1.AuditRecord"
    fields: [
      {
        path: "at"
        label: "When"
        operators: [FILTER_OPERATOR_AT_OR_AFTER, FILTER_OPERATOR_BEFORE]
      },
      {
        path: "namespace"
        label: "Namespace"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
        value_rule: FILTER_VALUE_RULE_NAME
      },
      {
        path: "action"
        label: "Action"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
      },
      {
        path: "principal"
        label: "Principal"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
      },
      {
        path: "target"
        label: "Target"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
      },
      {
        path: "succeeded"
        label: "Succeeded"
        operators: [FILTER_OPERATOR_EQUALS]
      },
      {
        path: "error_code"
        label: "Error code"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN]
      }
    ]
  };
  reserved 1 to 5;
  reserved "namespace", "action_prefix", "principal", "since", "until";
  // page_size caps the records returned; 0 means the default (50), and a
  // value above the maximum (200) is INVALID_ARGUMENT, not clamped.
  int32 page_size = 6;
  // page_token continues a listing. It is opaque and versioned, and binds
  // the canonical filter set and the resolved window: a token presented with
  // other filters is INVALID_ARGUMENT.
  string page_token = 7;
  repeated FieldFilter filters = 8;
}

message ListAuditRecordsResponse {
  repeated AuditRecord records = 1;       // newest first
  string next_page_token = 2;             // empty when the window is exhausted
  // since and until are the window the answer covers, resolved — what a
  // client prints so a reader knows what "the last week" meant on the
  // engine's clock.
  google.protobuf.Timestamp since = 3;
  google.protobuf.Timestamp until = 4;
}
