syntax = "proto3";

package orkstack.v1;

import "orkstack/v1/schedule.proto";
import "orkstack/v1/namespace_service.proto";
import "orkstack/v1/orkflow_service.proto";
import "orkstack/v1/trigger_service.proto";
import "orkstack/v1/webhook_service.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// AutomationService plans and exports a namespace's automation document:
// its settings, schedules, triggers and webhooks, declared by name
// (docs/AUTOMATION.md).
//
// It WRITES NOTHING, ever. PlanAutomation is to an automation document what
// ValidateOrkflow is to an orkflow document: the whole preparation an apply
// needs, and no write. An apply is performed by the CLIENT, which sends each
// actionable step's carried request to the existing RPC it names, in order,
// so every write is the same validated, audited call a person could make by
// hand. Nothing in the engine applies a document, stores one, or watches for
// drift.
service AutomationService {
  // PlanAutomation parses the document, reads what its namespace holds, and
  // answers with every step an apply would take and every object it would
  // leave alone. Problems with the document are ISSUES, never RPC errors;
  // an unreachable store or cluster is an RPC error, never an empty plan.
  rpc PlanAutomation(PlanAutomationRequest) returns (PlanAutomationResponse);
  // ExportAutomation renders the document a namespace's current automation
  // would be applied from. Deterministic: the same state exports the same
  // bytes. It refuses rather than omit: an object it cannot read, or two
  // objects sharing a name, fail the export, because an export missing an
  // object would delete it when applied with --prune.
  rpc ExportAutomation(ExportAutomationRequest) returns (ExportAutomationResponse);
}

// AutomationObjectKind names the four kinds of object a document declares.
// Clients spell them namespace, schedule, trigger, webhook: the value's name
// after AUTOMATION_OBJECT_KIND_, lowercased — the same derivation run origin
// kinds use, with the same descriptor-walk test in each client.
enum AutomationObjectKind {
  AUTOMATION_OBJECT_KIND_UNSPECIFIED = 0;
  AUTOMATION_OBJECT_KIND_NAMESPACE = 1;    // the `settings` section
  AUTOMATION_OBJECT_KIND_SCHEDULE = 2;
  AUTOMATION_OBJECT_KIND_TRIGGER = 3;
  AUTOMATION_OBJECT_KIND_WEBHOOK = 4;
}

// AutomationAction is what applying the document would do to one object.
// CREATE, UPDATE and DELETE are ACTIONABLE: the step carries the request that
// performs it. The rest are shown and never executed.
enum AutomationAction {
  AUTOMATION_ACTION_UNSPECIFIED = 0;
  AUTOMATION_ACTION_CREATE = 1;            // declared, absent: "+"
  AUTOMATION_ACTION_UPDATE = 2;            // declared, present, differs: "~"
  AUTOMATION_ACTION_DELETE = 3;            // undeclared named object, --prune: "-"
  AUTOMATION_ACTION_UNCHANGED = 4;         // declared, present, identical: " "
  AUTOMATION_ACTION_UNDECLARED = 5;        // named, in a managed section, not declared, no --prune: kept, "?"
  AUTOMATION_ACTION_UNMANAGED = 6;         // unnamed: outside every document, "!"
}

// AutomationFieldChange is one field of a CREATE (before is empty) or an
// UPDATE, rendered for display in the document's own spelling
// (docs/AUTOMATION.md "Renderings"). Never parsed by a client.
message AutomationFieldChange {
  string field = 1;                        // the document key, e.g. "cron", "settings.run_retention"
  string before = 2;
  string after = 3;
}

// AutomationStep is one object the document declares or the namespace holds,
// and what an apply would do to it.
message AutomationStep {
  AutomationAction action = 1;
  AutomationObjectKind kind = 2;
  // name is the document's name for the object, and for NAMESPACE the
  // namespace. Empty only for UNMANAGED: the object has no name.
  string name = 3;
  // id is the live object's id — sch-…, trg-…, wh-… — whenever one exists;
  // empty for CREATE and for NAMESPACE. Opaque.
  string id = 4;
  // summary is one display line saying what the object is: "deploy@current",
  // "reconcile@current  0 2 * * * (Europe/Lisbon)",
  // "https://hooks.acme.dev/etl  payments/nightly-etl/*".
  string summary = 5;
  // changes: for CREATE, every field the document sets; for UPDATE, every
  // field that differs; empty otherwise.
  repeated AutomationFieldChange changes = 6;
  // notes are informational lines under the step: state this document does
  // not manage (a paused schedule, a namespace hold), a key that had no
  // effect (secret_env on an existing webhook), or why an object is
  // unmanaged.
  repeated string notes = 7;
  // secret_env is set on a webhook CREATE whose entry names an environment
  // variable for the signing secret. The engine never sees that secret: the
  // client executing the step reads the variable and sets
  // register_webhook.secret, and refuses the whole apply, before any write,
  // when it cannot.
  string secret_env = 8;
  // request is the ONE write that performs an actionable step, complete and
  // ready to send. Unset for every other action.
  oneof request {
    CreateNamespaceRequest create_namespace = 20;
    UpdateNamespaceRequest update_namespace = 21;
    CreateScheduleRequest create_schedule = 22;
    UpdateScheduleRequest update_schedule = 23;
    DeleteScheduleRequest delete_schedule = 24;
    CreateTriggerRequest create_trigger = 25;
    UpdateTriggerRequest update_trigger = 26;
    DeleteTriggerRequest delete_trigger = 27;
    RegisterWebhookRequest register_webhook = 28;
    UpdateWebhookRequest update_webhook = 29;
    DeleteWebhookRequest delete_webhook = 30;
  }
}

// PendingOrkflow is an orkflow version the same client invocation applies
// BEFORE it executes this plan (an orkflow document beside the automation
// document). The planner treats a reference to it as satisfied.
message PendingOrkflow {
  string namespace = 1;                    // empty = default; resolved by the engine
  string name = 2;
  string version = 3;
}

message PlanAutomationRequest {
  string yaml = 1;                         // the automation document, as read
  // namespace, when non-empty, must EQUAL the document's `namespace:`; a
  // mismatch is an issue on `namespace`, never a silent choice. A client sends
  // it only when its user named a namespace explicitly (docs/AUTOMATION.md).
  string namespace = 2;
  // prune turns every undeclared named object of a managed section into a
  // DELETE step.
  bool prune = 3;
  repeated PendingOrkflow pending_orkflows = 4;
}

message PlanAutomationResponse {
  // namespace is the document's namespace, resolved ("default" spelled out).
  string namespace = 1;
  // managed lists the sections the document declares, in the order
  // NAMESPACE (settings), SCHEDULE, TRIGGER, WEBHOOK.
  repeated AutomationObjectKind managed = 2;
  // steps, in execution order (docs/AUTOMATION.md "Step order"): actionable
  // steps first — namespace, creates, updates, deletes — then the rest.
  repeated AutomationStep steps = 3;
  // issues: any ERROR means no step may be executed, and every client
  // refuses to execute any. A document that failed to parse has issues and
  // no steps.
  repeated ValidationIssue issues = 4;
  // plan_digest is "sha256:<64 lowercase hex>" over the namespace and the
  // actionable steps (action, kind, name, id, changes) — what a reviewer pins
  // with `orkctl apply --expect-plan`. It excludes the carried requests, so a
  // no-op rewrite of the namespace (a new etag) does not move it; it excludes
  // UNCHANGED, UNDECLARED and UNMANAGED steps, which write nothing. Defined
  // even when nothing is actionable ("no changes" is pinnable); empty exactly
  // when nothing was planned (the document did not parse, or names another
  // namespace than the request).
  string plan_digest = 5;
}

message ExportAutomationRequest {
  string namespace = 1;                    // empty = the default namespace
}
message ExportAutomationResponse {
  // yaml is the document, ending in a comment block that names every
  // unnamed object and the command that names it.
  string yaml = 1;
  // unmanaged is that same list as data, one UNMANAGED step per object, for
  // a client that renders it apart from the text.
  repeated AutomationStep unmanaged = 2;
}

// ---------------------------------------------------------------------------
// Client report types. NO RPC returns these. They are proto so that
// `orkctl apply --json` — a machine interface CI scripts consume — has one
// generated, typed shape, and so the Admin page records a step's outcome in
// the same shape the CLI prints (AGENTS.md §12: proto is the source of truth
// for cross-process types).
// ---------------------------------------------------------------------------

enum AutomationStepOutcome {
  AUTOMATION_STEP_OUTCOME_UNSPECIFIED = 0;
  AUTOMATION_STEP_OUTCOME_APPLIED = 1;     // the RPC succeeded
  AUTOMATION_STEP_OUTCOME_ALREADY_GONE = 2;// a DELETE whose object was already absent (NotFound)
  AUTOMATION_STEP_OUTCOME_FAILED = 3;      // the RPC failed; later steps were not run
  AUTOMATION_STEP_OUTCOME_NOT_RUN = 4;     // an earlier step failed
}

message AutomationStepResult {
  int32 step = 1;                          // index into the plan's steps
  AutomationStepOutcome outcome = 2;
  string error = 3;                        // "<connect code>: <message>" when FAILED
  string id = 4;                           // the object's id after the step (a CREATE's new id)
  // secret is the one-time secret a CREATE disclosed — a trigger's bearer
  // token, or a webhook secret the engine generated. Empty when --secrets-out
  // took it, and for every other step.
  string secret = 5;
}

// OrkflowStoredState is what the store already holds for an orkflow
// document's compiled name and version, read before any write.
enum OrkflowStoredState {
  ORKFLOW_STORED_STATE_UNSPECIFIED = 0;
  ORKFLOW_STORED_STATE_NEW = 1;            // not stored: applying stores a version
  ORKFLOW_STORED_STATE_IDENTICAL = 2;      // stored with byte-identical source: applying writes nothing
  ORKFLOW_STORED_STATE_CONFLICTING = 3;    // stored with DIFFERENT source: ApplyOrkflow would refuse (AlreadyExists)
}

message OrkflowDocumentReport {
  string file = 1;
  ValidateOrkflowResponse validated = 2;   // every invocation validates first
  OrkflowStoredState stored = 3;
  ApplyOrkflowResponse applied = 4;        // unset on --dry-run and when not reached
}

message AutomationDocumentReport {
  string file = 1;
  PlanAutomationResponse plan = 2;
  repeated AutomationStepResult results = 3;  // empty on --dry-run
}

// ApplyReport is what `orkctl apply --json` prints for any invocation except
// the one that existed before this contract — a single orkflow file with no
// new flag — which keeps printing ApplyOrkflowResponse byte for byte.
message ApplyReport {
  bool dry_run = 1;
  repeated OrkflowDocumentReport orkflows = 2;
  repeated AutomationDocumentReport automation = 3;
}

// DisclosedSecret is one entry of the file `orkctl apply --secrets-out PATH`
// writes (DisclosedSecrets).
message DisclosedSecret {
  string namespace = 1;
  AutomationObjectKind kind = 2;           // TRIGGER or WEBHOOK
  string name = 3;
  string id = 4;
  string secret = 5;
  string invoke_url = 6;                   // TRIGGER only: {server}/v1/triggers/{id}
}
// DisclosedSecrets is the file `orkctl apply --secrets-out PATH` writes.
message DisclosedSecrets { repeated DisclosedSecret secrets = 1; }
