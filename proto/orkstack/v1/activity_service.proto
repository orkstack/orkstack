syntax = "proto3";

package orkstack.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";
import "orkstack/v1/filter.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// ActivityService reports what this deployment can run: an activity is an
// image, and which images exist is engine configuration (§4.2), not something
// to ask an Orker.
service ActivityService {
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
  // DescribeOrker is the pool-liveness probe (§6.5). It is dispatched as a
  // Temporal activity on a pool's own channel, so it answers only when an
  // Orker is actually polling that pool.
  rpc DescribeOrker(DescribeOrkerRequest) returns (DescribeOrkerResponse);
  // ListOrkers is the fleet: one row per live Orker of the deployment,
  // derived on read. Like Pool, nothing WRITES an Orker — the list comes
  // from the cluster's own poller records and each Orker's own answer, so
  // any replica answers and none holds state of its own (AGENTS.md §7). It
  // NARROWS rather than refusing: an Orker that did not answer keeps its
  // row and carries unavailable_reason. Two conditions are distinct: a
  // known poller whose describe failed is a row with unavailable_reason;
  // an orker_id that NO live poller answers to is an EMPTY list, never
  // NOT_FOUND — a read for an id nothing polls is an empty answer, and the
  // drain loop relies on it (CordonOrker, a write, is the one that answers
  // NOT_FOUND for that id).
  //
  // An orker_id EQUALS filter asks exactly that one Orker, on its own
  // channel, and returns at most one row: it is what `orkctl orker get` and
  // the drain loop send, so a drain costs one activity per poll and not one
  // per Orker of the fleet. Every other filter is applied to the inventory;
  // an unreachable row is kept under a pool, build_id or cordoned filter,
  // since none of those was measured on it. A malformed orker_id in an
  // equals, not-equals or in filter is INVALID_ARGUMENT before any read.
  rpc ListOrkers(ListOrkersRequest) returns (ListOrkersResponse);
  // CordonOrker sets or clears ONE Orker's cordon: a process-local flag
  // delivered over that Orker's own channel, lost when the process exits.
  // A cordoned Orker takes no new task and opens no new pin; everything
  // already in flight on it is untouched. The response is the Orker's
  // state AFTER the change, as the Orker itself reported it.
  rpc CordonOrker(CordonOrkerRequest) returns (CordonOrkerResponse);
  // InspectActivity resolves ONE reference on demand — a catalog name or
  // any registry reference `uses:` would accept — and reports it as
  // ListActivities would: the pinned digest, platforms, and the interface
  // the image declares. It is uncached, reads engine configuration and the
  // registry only, never asks an Orker, and writes nothing.
  rpc InspectActivity(InspectActivityRequest) returns (InspectActivityResponse);
}

message InspectActivityRequest {
  // reference is what a task would write in `uses:`, resolved by the same
  // four rules (§4.2, Catalog.ResolveUses): a catalog name, or a registry
  // reference carrying `/`, `:` or `@`. A template is refused.
  string reference = 1;
}

message InspectActivityResponse { ActivityInfo activity = 1; }

message ListActivitiesRequest {
  option (orkstack.v1.filterable) = {
    resource: "orkstack.v1.ActivityInfo"
    fields: [
      {
        path: "name"
        label: "Name"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
      },
      {
        path: "reference"
        label: "Reference"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
      },
      {
        path: "index_digest"
        label: "Digest"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN]
      }
    ]
  };
  repeated FieldFilter filters = 1;
}

// ActivityInfo is one catalog entry, resolved.
//
// resolved_at is a READ-MODEL field on a live catalog read, and is unrelated
// to the ImageRef.resolved_at that activity.proto reserves: nothing hashes it,
// and it is never stored in a version document.
message ActivityInfo {
  string name = 1;          // catalog key, e.g. "shell"; empty for InspectActivity of a raw reference
  string reference = 2;     // as configured, e.g. ghcr.io/orkstack/activity-shell:0.1
  string index_digest = 3;  // resolved, "sha256:<64 hex>"
  string media_type = 4;
  repeated string platforms = 5;
  google.protobuf.Timestamp resolved_at = 6;

  // interface is what the image declares about its `with:` block, read from
  // the org.orkstack.activity.interface label of the resolved image's config
  // (§4.3 step 7). Unset when the image carries no label, when the label
  // could not be read (interface_error says why), or when the reference did
  // not resolve (index_digest is then empty too).
  //
  // It is a READ-MODEL field exactly as resolved_at is: derived from
  // immutable, digest-addressed content on every read, hashed by nothing,
  // stored nowhere.
  ActivityInterface interface = 7;
  // interface_error is non-empty when the image carries the label but it
  // could not be turned into an ActivityInterface — malformed JSON, a
  // schema_version this engine does not read, a vocabulary word outside
  // the contract — or when the index advertised no platform manifest to
  // read a config from. It distinguishes "declares nothing" from "declares
  // something this engine cannot read". Empty whenever interface is set.
  string interface_error = 8;
}

// FieldSchema is one `with:` key's declaration. It is EXACTLY the
// vocabulary an Orkflow's `inputs:` already has (docs/DSL.md, "Inputs")
// and not one word more: no pattern, no range, no enum, no nesting.
message FieldSchema {
  // type is one of "string", "number", "boolean", "object", "array", or
  // several joined by "|" (string|object|array) for a key that accepts any
  // of them.
  string type = 1;
  // required means the image refuses to run without this key. A field
  // with a default is never required (the two contradict; the manifest
  // is rejected).
  bool required = 2;
  // default is documentary: what the image assumes when the key is
  // absent. The engine never writes it into `with:`. When set, its JSON
  // type must be one of `type`'s; null is not a default (omit the field).
  google.protobuf.Value default = 3;
}

// OpSchema is the key set one `op` reads, beside the shared `fields`.
message OpSchema {
  map<string, FieldSchema> fields = 1;
}

// ActivityInterface is what an image declares about its `with:` block. The
// label org.orkstack.activity.interface holds this message's protojson
// encoding (lowerCamel names), verbatim.
message ActivityInterface {
  // schema_version is 1. Any other value is a manifest this engine does
  // not read and is reported through ActivityInfo.interface_error.
  int32 schema_version = 1;
  // fields are the top-level `with:` keys every op reads (or, for an
  // image with no op selector, the whole `with:` block). The key is the
  // `with:` key, byte for byte.
  map<string, FieldSchema> fields = 2;
  // ops, when non-empty, says the image selects its operation with the
  // `op` key of docs/ACTIVITY_IMAGES.md: the map key is the op's name and
  // the value is the keys that op reads in addition to `fields`. `op`
  // itself is then implicitly declared {type: "string"} and must not
  // appear in `fields`. A key may not be declared both in `fields` and
  // under an op.
  map<string, OpSchema> ops = 3;
  // default_op is the op the image runs when `op` is absent, and must be
  // a key of ops. Empty with non-empty ops means `op` is required.
  string default_op = 4;
  // values is documentary: the keys the image writes to values.json.
  // Nothing checks it; `orkctl activity inspect` and the Activities page
  // render it so an author knows what `.tasks.<id>.output.<key>` may
  // reference.
  map<string, FieldSchema> values = 5;
}

message ListActivitiesResponse {
  // activities is ordered by name, matching ListPoolsResponse.pools
  // ("ordered by name", above). A stable order is part of the contract, not an
  // implementation detail: the Admin page renders it.
  repeated ActivityInfo activities = 1;
}

message DescribeOrkerRequest {}

message DescribeOrkerResponse { DescribeOrkerResult orker = 1; }

message ListOrkersRequest {
  option (orkstack.v1.filterable) = {
    resource: "orkstack.v1.Orker"
    unavailable_field: "unavailable_reason"
    fields: [
      {
        path: "orker_id"
        label: "Orker"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
        value_rule: FILTER_VALUE_RULE_ORKER_ID
      },
      {
        path: "pool"
        label: "Pool"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
        value_rule: FILTER_VALUE_RULE_NAME
        kept_when_unavailable: true
      },
      {
        path: "build_id"
        label: "Release"
        operators: [FILTER_OPERATOR_EQUALS, FILTER_OPERATOR_NOT_EQUALS, FILTER_OPERATOR_IN, FILTER_OPERATOR_CONTAINS, FILTER_OPERATOR_PREFIX]
        kept_when_unavailable: true
      },
      {
        path: "cordoned"
        label: "Cordoned"
        operators: [FILTER_OPERATOR_EQUALS]
        kept_when_unavailable: true
      }
    ]
  };
  reserved 1, 2;
  reserved "pool", "orker_id";
  repeated FieldFilter filters = 3;
}

message ListOrkersResponse {
  // orkers is ordered by pool, then orker_id. A stable order is part of the
  // contract: the Admin page renders it.
  repeated Orker orkers = 1;
}

message CordonOrkerRequest {
  string orker_id = 1;
  bool cordoned = 2;
  // reason is required when cordoned is true (INVALID_ARGUMENT otherwise);
  // ignored when false.
  string reason = 3;
}

message CordonOrkerResponse { Orker orker = 1; }
