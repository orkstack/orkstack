syntax = "proto3";

package orkstack.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "orkstack/v1/activity.proto";

option go_package = "github.com/orkstack/orkstack/gen/go/orkstack/v1;orkstackv1";

// RetryPolicy mirrors Temporal retry semantics for a task.
message RetryPolicy {
  int32 maximum_attempts = 1;            // 0 or 1 = no retries
  int32 initial_interval_seconds = 2;    // default 1
  double backoff_coefficient = 3;        // default 2.0
  int32 maximum_interval_seconds = 4;    // default 60, or initial_interval_seconds when longer

  // max_interruptions is set from E92; unset until it lands (v0.4.0 proto batch).
  optional int32 max_interruptions = 5;
}

// Pin is a named group of tasks that execute on ONE Orker process and share
// /orkstack/shared for the group's lifetime (docs/DSL.md "Pins"). What
// implements it is internal, as a pool's routing is (AGENTS.md §7).
message Pin {
  string name = 1;                       // slug, unique within the orkflow

  // timeout_seconds bounds the whole pin, from the moment its first task is
  // dispatched until its last task ends. 0 means derived: the sum of every
  // member task's wall-clock budget, which is the sequential worst case.
  int32 timeout_seconds = 2;
}

// OrkflowRef names one immutable Orkflow version: in the referencing
// definition's own namespace, or in the namespace `namespace` names when the
// author wrote `uses: orkflow:<namespace>/<name>@<version>`. Composition is the
// one path that crosses a namespace, and only to a version whose shared_with
// admits the composing Orkflow (docs/DSL.md "Sharing across namespaces").
message OrkflowRef {
  string name = 1;
  string version = 2;
  // definition_digest is the referenced version's Orkflow.definition_digest,
  // stamped at apply. Empty only in a message the compiler produced before
  // internal/api resolved it; a stored definition never carries an empty one.
  string definition_digest = 3;
  // namespace is the namespace that owns the referenced Orkflow, as the author
  // wrote it. Empty means the referencing definition's own namespace. Part of
  // canonicalOrkflow(Task) only when set, so every existing digest is
  // unchanged.
  string namespace = 4;
}

// OrkflowShare is one entry of Orkflow.shared_with: who in ANOTHER namespace
// may compose this Orkflow version through `uses:`. Exactly one field is set.
// Calls within one namespace never need an entry.
message OrkflowShare {
  // namespace admits every Orkflow of that namespace. "*" admits every
  // Orkflow of every namespace.
  string namespace = 1;
  // orkflow admits one Orkflow, written "<namespace>/<name>": that Orkflow, in
  // any of its versions, and nothing else of its namespace.
  string orkflow = 2;
}

// Task is a single node in the orkflow DAG. It maps to exactly one activity
// execution on an Orker, and an activity is an OCI image.
message Task {
  string id = 1;                         // unique within the orkflow

  // 2 held the in-process plugin name. Under the OCI Activity Contract a task
  // names an activity, and an activity is an image. Reserved rather than
  // reused so a stored version document can never be re-read as an image.
  reserved 2;
  reserved "plugin";

  // with holds the activity-specific configuration (templated).
  google.protobuf.Struct with = 3;
  // needs lists task ids that must complete before this task runs (DAG edges).
  repeated string needs = 4;
  // condition is a Go template rendered by the engine; the task is skipped
  // when it renders one of the documented falsy spellings (docs/DSL.md
  // "Templating").
  string condition = 5;
  int32 timeout_seconds = 6;             // default 300
  RetryPolicy retry = 7;

  // 8 held a removed execution-routing field. It is reserved rather than
  // reused, so a stale document cannot silently become a pool selection.
  // The name stays reserved for the clean cut; the old key is rejected by
  // the DSL and discarded by store decoding.
  reserved 8;
  reserved "queue";

  // pool names the set of Orkers this task runs on. Empty means the
  // deployment's default pool, which answers to the name "main";
  // Namespace.default_pool joins that resolution.
  //
  // Writing "main" and writing nothing are ONE route, always: "main" is a name
  // for the deployment's default pool and not for one fixed set of Orkers, so
  // wherever an operator has pointed the default, both spellings go there and
  // both are reported on the pool that answers for it. Within a run, one pool
  // name means one set of Orkers, in both directions. The engine maps a pool
  // to its internal route and nowhere else.
  string pool = 9;

  // uses is what the author wrote: a catalog activity name ("shell") or a
  // registry reference ("ghcr.io/acme/migrate:v3", "repo@sha256:..."). It is
  // the only image-selecting field in the DSL.
  string uses = 10;
  // image is the engine's apply-time resolution of uses. It is stamped into
  // the immutable version document, so re-applying the same YAML after a tag
  // moves produces a different definition (§4.4).
  ImageRef image = 11;
  repeated string command = 12;
  map<string, string> env = 13;
  repeated SecretRef secrets = 14;
  ResourceRequest resources = 15;
  NetworkMode network = 16;
  int32 cancellation_grace_period_seconds = 17;
  // run_as_orker_user is the §3.1 escape hatch, per task. It changes what
  // runs, so it is part of canonicalOrkflow(Task) (§4.4).
  bool run_as_orker_user = 18;

  // pin names the Pin this task belongs to, or is empty. Every task of one
  // pin runs on one Orker process and sees the same /orkstack/shared. It
  // changes what runs and where, so it is part of canonicalOrkflow(Task) —
  // emitted ONLY when set, so a definition with no pin keeps its digest.
  string pin = 19;

  // await makes this an awaited task. Mutually exclusive with uses and with
  // every field that shapes a container (docs/DSL.md rules 6 and 15): an
  // awaited task has no image, no pool, and no timeout_seconds of its own.
  AwaitSpec await = 20;

  // each makes this task a fan-out. A fan-out has uses:, like any container
  // task; it may not name a pin (docs/DSL.md rule 23) and an awaited task may
  // not carry it (rule 15).
  EachSpec each = 21;

  // orkflow is the apply-time resolution of `uses: orkflow:<name>@<version>`,
  // the analogue of image for a container task. A composed task starts a
  // CHILD RUN of exactly that definition, in the namespace this run executes
  // in (even when the definition is another namespace's), and
  // reaches no Orker: it carries no image, pool, pin, retry, timeout or other
  // execution field (docs/DSL.md rules 26–27). Part of canonicalOrkflow(Task)
  // only when set (see pin), so this Orkflow's digest pins the child's.
  OrkflowRef orkflow = 22;

  // cache opts this container task into memoization across runs. It may not
  // name a pin (docs/DSL.md rule 36), and an awaited or composed task may not
  // carry it (rules 15, 27).
  CacheSpec cache = 23;

  // join is when this task may start, decided from how its needs ended
  // (docs/DSL.md "Joins and failure handlers"). UNSPECIFIED is
  // all_succeeded. Part of canonicalOrkflow(Task) ONLY when set (see pin), so
  // a definition with no join keeps its digest. A task whose join is
  // ANY_FAILED or ALL_DONE is a failure handler: it may not name a pin, carry
  // each or carry cache (docs/DSL.md rule 39).
  JoinPolicy join = 24;

  // sleep makes this a sleeping task: it starts no container, reaches no
  // Orker, and succeeds once its fixed time has passed. Mutually exclusive
  // with uses, await and every field that shapes a container (docs/DSL.md
  // rules 49 and 50). Part of canonicalOrkflow(Task) ONLY when set (see pin),
  // so a definition with no sleep keeps its digest.
  SleepSpec sleep = 25;

  // devices names the operator-defined profiles the task's container gets
  // (devices:), never a device path.
  repeated string devices = 26;

  // child_artifacts are a composed task's artifacts: bindings, one per
  // artifact input of the child Orkflow, sorted by input. The engine resolves
  // each from a recorded result at child start and hands the child a
  // reference, never the bytes. Part of canonicalOrkflow(Task) ONLY when set.
  repeated ChildArtifact child_artifacts = 30;

  // input_artifacts names, sorted, the artifact inputs of this task's Orkflow
  // that its fields name literally ({{ artifact "_inputs/<name>" }}); only
  // those are staged for it, under the reserved producer _inputs. Part of
  // canonicalOrkflow(Task) ONLY when set.
  repeated string input_artifacts = 31;

  // identities is set from identity (E62); unset until it lands (v0.4.0 proto batch).
  repeated IdentityRef identities = 28;

  // credentials are the credentials the task holds, issued for each attempt
  // by the namespace's grants (docs/PROVIDERS.md). In the canonical
  // definition only when set.
  repeated CredentialRef credentials = 29;

  // concurrency is set from E88's task-level limits; unset until they land.
  ConcurrencySpec concurrency = 32;

  // 27 was a field of a draft that recorded histories hold: never reuse it.
  reserved 27;

  // device_contracts maps a profile the task names in devices to the
  // contract label the task needs of it: the image's declaration, or the
  // author's `name@label`. Written at create, only when non-empty.
  map<string, string> device_contracts = 33;
}

// CacheSpec opts ONE task into memoization across runs (docs/DSL.md
// "Caching"). Declaring it is the author's assertion that the task is a pure
// function of what it is given — its image, command, env, secrets' names and
// sources, network mode, rendered config.json, run.json, staged input files
// and, for a fan-out item, its item — which OrkStack cannot verify. Part of
// canonicalOrkflow(Task) only when set (see Task.pin); never part of a memo
// key.
message CacheSpec {
  // ttl_seconds bounds how old a memoized result this task may reuse,
  // measured from when the result was committed. 0 means no bound of the
  // task's own; the deployment's ORK_CACHE_MAX_TTL caps it either way.
  int32 ttl_seconds = 1;
  // scope: ORKFLOW (what the compiler writes when absent) or NAMESPACE.
  CacheScope scope = 2;
}

// EachSpec makes a Task a fan-out: ONE node of the DAG that runs as one item
// per element of an array read at run time — every item the same image, with
// the same needs, pool, resources, timeout and retry policy (docs/DSL.md
// "Fan-out"). Part of canonicalOrkflow(Task), emitted ONLY when set (see
// Task.pin).
message EachSpec {
  // over is the reference exactly as the author wrote it: one template action
  // naming an input or an upstream task's output, never an expression.
  string over = 1;
  // as is the name .each.<as> binds an item to. The compiler writes "item"
  // when the document names none, so a stored value is never empty.
  string as = 2;
  // max_items is the author's bound, 1..10000; the sum over every fan-out of
  // one Orkflow is at most 10000, and at most the deployment's
  // ORK_EACH_MAX_ITEMS (1000 unless the deployment raises it). An array
  // longer than this fails the task EACH_TOO_MANY_ITEMS before any item
  // runs.
  int32 max_items = 3;
  // max_parallel bounds how many items are in flight at once; 0 means no
  // bound of the task's own.
  int32 max_parallel = 4;
  // source is over, compiled at apply (EachSource).
  EachSource source = 5;

  // over_artifact names an artifact of a task in this task's own needs:,
  // "<task>/<name>", and makes the fan-out run one item per non-empty line
  // of it (or per batch of lines). Exactly one of over and over_artifact is
  // set. Part of canonicalOrkflow only when set, so a definition without it
  // keeps its digest.
  string over_artifact = 6;

  // format is how the lines of over_artifact are read: JSONL (each line one
  // JSON value) or LINES (each line a string). Required with over_artifact,
  // refused with over.
  EachLineFormat format = 7;

  // batch makes one item of every batch consecutive non-empty lines of
  // over_artifact, 2..10000; the last item may hold fewer. Unset (or 1, which
  // the compiler normalises to unset) is one line per item. Refused with over.
  // max_items counts items, so the line ceiling is max_items x batch.
  int32 batch = 8;
  // on_item_failure is what an item that fails for good does to the rest of
  // the fan-out: FAIL_FAST (the default, which the compiler normalises to
  // unset) stops it at the first such item; CONTINUE runs every other item,
  // and the fan-out then fails with its lowest-index failed item's reason.
  EachItemFailure on_item_failure = 9;
  // max_failed_items, with CONTINUE only, bounds how many items may fail: at
  // the next failure past it the fan-out fails fast. 1 .. max_items-1; 0 is
  // unbounded.
  int32 max_failed_items = 10;
}

// EachItemFailure is a fan-out's on_item_failure.
enum EachItemFailure {
  EACH_ITEM_FAILURE_UNSPECIFIED = 0;
  EACH_ITEM_FAILURE_FAIL_FAST = 1;
  EACH_ITEM_FAILURE_CONTINUE = 2;
}

// AwaitSpec makes a Task an awaited task: it starts no container and reaches
// no Orker, and the run waits until the task is resolved from outside the run
// — completed with values, or rejected with a reason — or its deadline passes.
// Part of canonicalOrkflow(Task), emitted ONLY when set (see Task.pin).
message AwaitSpec {
  // timeout_seconds is the deadline, from the moment the task starts
  // awaiting. Required: 1 to 2592000 (30 days).
  int32 timeout_seconds = 1;
  // callback asks SubmitRun to mint a one-time bearer token for this await
  // and disclose it once, in SubmitRunResponse.await_callbacks, so a caller
  // outside the deployment's API can resolve it over plain HTTP. False means
  // the await is resolved through RunService.ResolveAwait only.
  bool callback = 2;
  // schema declares the values a completion must carry, in the vocabulary
  // Orkflow.inputs uses — a map from key to {type, required}; no default.
  // Unset means any JSON object is accepted.
  google.protobuf.Struct schema = 3;
}

// SleepSpec makes a Task a sleeping task: the run waits a fixed time on its
// own timer and the task then succeeds, with no values and no artifacts
// (docs/DSL.md "Sleeping tasks"). Part of canonicalOrkflow(Task), emitted
// ONLY when set (see Task.pin).
message SleepSpec {
  // seconds is how long the task sleeps, from the moment it starts
  // sleeping. Required: 1 to 2592000 (30 days), the bound
  // AwaitSpec.timeout_seconds has, for the same reason.
  int32 seconds = 1;
}

// Orkflow is the compiled, validated form of a DSL document.
message Orkflow {
  string name = 1;                       // unique identifier (slug)
  string version = 2;                    // the author's own, or assigned at first apply (a UUIDv7 in lowercase base32, or a content hash on an older version)
  string description = 3;
  map<string, string> labels = 4;
  // inputs declares the accepted input parameters (JSON schema fragment as struct).
  google.protobuf.Struct inputs = 5;
  repeated Task tasks = 6;
  string source_yaml = 7;                // original DSL for round-trip/audit
  google.protobuf.Timestamp created_at = 8;
  // namespace scopes this orkflow. Empty means the built-in "default"
  // namespace. A name is unique WITHIN a namespace, never globally: two
  // namespaces may both hold an orkflow called "deploy", and they are two
  // different orkflows stored under two different keys.
  string namespace = 9;

  // definition_digest is the canonical digest of THIS document's definition
  // (§4.4): "sha256:" + hex(sha256(canonicalOrkflow(wf))).
  //
  // It is computed at APPLY, after image resolution, and stamped here —
  // "the version document is the pin", which is what AGENTS.md §7.2 requires
  // of a run. Workflow code READS it and never computes it, so a run records
  // the digest of the definition it actually pinned rather than one derived
  // from whatever a later reader happened to reconstruct.
  //
  // It is NOT part of canonicalOrkflow. The canonical form enumerates its
  // fields and this one is not among them, so stamping the digest into the
  // document it describes does not change that digest: the value is stable
  // under re-canonicalization, and pkg/artifacts.sameStoredOrkflow still
  // sees a re-apply of an unchanged document as equal.
  //
  // Added after the original wire freeze, deliberately and ADDITIVELY: fields
  // 1-9 are untouched, so `buf breaking` WIRE and WIRE_JSON stay clean and an
  // older reader simply does not see it. The alternative was to populate
  // orkflow_definition_digest from workflow code, which changes recorded
  // activity-payload bytes and would force re-recording the base replay
  // fixture, which is never re-recorded.
  string definition_digest = 10;

  // pins declares every Pin a task may name, sorted by name at compile so
  // one document always compiles to one message. Part of canonicalOrkflow,
  // emitted ONLY when non-empty (see Task.pin).
  repeated Pin pins = 11;

  // outputs is this Orkflow's declared return contract: output name to a
  // template over .inputs and .tasks.<id>.output, rendered ONCE, by the
  // engine, when a run succeeds; every value renders to a string. When
  // non-empty the rendered map IS Run.output, and is what a composing
  // parent's task receives as its values. When empty, Run.output is the
  // values of the tasks no other task needs, and a composing parent's task
  // receives {}. Part of canonicalOrkflow only when non-empty (see pins).
  map<string, string> outputs = 12;

  // shared_with is who in other namespaces may compose this version through
  // `uses: orkflow:<namespace>/<name>@<version>` (docs/DSL.md "Sharing across
  // namespaces"). Empty means nobody: an Orkflow is closed to every other
  // namespace unless its definition says otherwise. Composition is the only
  // door — a submit, a schedule or a trigger runs only its own namespace's
  // Orkflows. It is part of the definition, so a new version changes who may
  // call it, and part of canonicalOrkflow only when non-empty (see pins).
  repeated OrkflowShare shared_with = 13;

  // definition_namespace is set ONLY on a run's planned copy of an Orkflow
  // that another namespace's Orkflow composed: the namespace that owns the
  // stored definition, while namespace names the namespace the child run
  // executes in and whose rules it follows. Never stored, never applied and
  // not part of canonicalOrkflow: definition_digest is the owner's.
  string definition_namespace = 14;

  // output_artifacts are the artifacts this Orkflow returns to a composing
  // run, by output name (outputs: <name>: {artifact: <task>/<name>}). Part of
  // canonicalOrkflow ONLY when set.
  map<string, OutputArtifact> output_artifacts = 15;

  // concurrency is the Orkflow's run-level concurrency limit (docs/DSL.md
  // "Concurrency limits"): its runs share at most limit slots of one key,
  // and a run past them waits in order. Unset, its runs are not limited. Part
  // of canonicalOrkflow only when set, so an Orkflow that declares none keeps
  // its digest.
  ConcurrencySpec concurrency = 16;

  // timeout_seconds is the run's own time limit from its start, from the
  // DSL's `timeout:` (docs/DSL.md "Run timeout"); 0 means none. It is part of
  // canonicalOrkflow, in its short form, only when non-zero, so an Orkflow
  // that declares none keeps its digest.
  int64 timeout_seconds = 17;
}

// ChildArtifact binds one artifact input of a composed task's child
// Orkflow to an artifact of this run: the artifact name of the task task_id
// (a producer in the composed task's needs closure), or of _inputs for an
// artifact input of this Orkflow.
message ChildArtifact {
  string input = 1;
  string task_id = 2;
  string name = 3;
}

// ConcurrencySpec is one declared concurrency limit (docs/DSL.md
// "Concurrency limits"). Its identity is its namespace and its rendered key:
// every declaration in a namespace that renders the same key shares its
// slots and its line.
message ConcurrencySpec {
  // limit is how many runs may hold a slot of the key at once, from 1.
  int32 limit = 1;
  // key is the template a run renders its key from, once, at submit. Empty
  // is the Orkflow's own key, shared by every version of it in the
  // namespace that runs it.
  string key = 2;
  // on_limit is what a run does when every slot of its key is held.
  ConcurrencyStrategy on_limit = 3;
  // queue_timeout_seconds is how long a run waits in line for a slot before
  // it ends; 0 is the deployment's default.
  int64 queue_timeout_seconds = 4;
  // max_queued is how many runs may wait in line for the key, checked at
  // submit, best-effort; 0 sets no bound of its own.
  int32 max_queued = 5;
}

// ConcurrencyStrategy is what a run does when every slot of its key is held.
enum ConcurrencyStrategy {
  CONCURRENCY_STRATEGY_UNSPECIFIED = 0;
  // QUEUE: wait in line, in order of arrival. The default.
  CONCURRENCY_STRATEGY_QUEUE = 1;
  // REFUSE: the run fails at once.
  CONCURRENCY_STRATEGY_REFUSE = 2;
  // SKIP: the run is not started.
  CONCURRENCY_STRATEGY_SKIP = 3;
  // CANCEL_OLDEST: the oldest holder is canceled to make room.
  CONCURRENCY_STRATEGY_CANCEL_OLDEST = 4;
  // REPLACE: the runs waiting in line are replaced by this one.
  CONCURRENCY_STRATEGY_REPLACE = 5;
}

// OutputArtifact names the artifact an Orkflow returns under an output's
// name: the artifact name of the task task_id.
message OutputArtifact {
  string task_id = 1;
  string name = 2;
}
